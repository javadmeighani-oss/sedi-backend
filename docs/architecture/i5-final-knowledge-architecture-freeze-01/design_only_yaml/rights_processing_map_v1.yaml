# DESIGN_ONLY — NOT_RUNTIME_LOADED — NOT_ACTIVATION_AUTHORITY
DESIGN_ONLY: true
NOT_RUNTIME_LOADED: true
NOT_ACTIVATION_AUTHORITY: true
model_version: rights-processing-map-v1

processing_modes:
  - FULL_PROCESS_AND_RETAIN
  - TRANSIENT_PROCESS_ONLY
  - DERIVED_KNOWLEDGE_ONLY
  - METADATA_ABSTRACT_ONLY
  - FULLTEXT_AUTOMATION_BLOCKED
  - LICENSED_CONNECTOR_ONLY

raw_retention_map:
  FULL_PROCESS_AND_RETAIN: RAW_FULL_GOVERNED_RETENTION
  TRANSIENT_PROCESS_ONLY: RAW_TRANSIENT_PROCESSING
  DERIVED_KNOWLEDGE_ONLY: RAW_MINIMAL_EVIDENCE_ONLY
  METADATA_ABSTRACT_ONLY: RAW_LINK_AND_CITATION_ONLY
  FULLTEXT_AUTOMATION_BLOCKED: RAW_EXCLUDED_PROTECTED_ELEMENTS
  LICENSED_CONNECTOR_ONLY: RAW_EXCLUDED_PROTECTED_ELEMENTS

hard_rules:
  - NO_STORAGE_RIGHT_NE_AUTOMATION_ALLOWED
  - UNKNOWN_RIGHTS_FAIL_CLOSED
  - FREE_TO_READ_NE_TDM_PERMISSION
