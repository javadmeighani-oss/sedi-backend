[Service]
# Reset original ExecStart from base unit
ExecStart=

# Reset inherited EnvironmentFile entries from base unit
EnvironmentFile=

# Load environment variables from secure server-side file
EnvironmentFile=/etc/sedi/sedi-backend.env

ExecStart=/var/www/sedi/backend/.venv/bin/uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
