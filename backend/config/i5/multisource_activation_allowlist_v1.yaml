# CANONICAL TRUSTED SOURCE CONTROL MANIFEST (Javad-editable)
# Runtime crawler activation derives ONLY from activation:YES entries below.
# PostgreSQL GSP/registry tables are runtime audit state.
# seed_registry.py is bootstrap-only — NOT runtime activation authority.
