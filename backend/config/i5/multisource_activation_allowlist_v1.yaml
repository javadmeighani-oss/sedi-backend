    allowed_url_patterns:
      - "^https://www\\.nhs\\.uk/live-well/.*"
    rights_terms_state: OGL
    robots_access_state: ALLOWED
    retention: RAW_MINIMAL_EVIDENCE_ONLY
    rate_limit: "weekly_controlled_max_8_urls"
    entity_coverage: [D12, D15]
    knowledge_domains: [lifestyle_prevention_routines, physical_activity_exercise, mental_health_psychology, nutrition]
