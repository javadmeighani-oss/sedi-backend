    knowledge_domains: [disease_clinical, neurology_als_ms, cardiovascular, diabetes_metabolic, nutrition, lifestyle_prevention_routines]  # specialty_domain is varchar(128): D23 comes from specialized_serving_eligibility
    activation: YES
    governed_low_risk_eligibility: NO
    # R-044 step 2 (MedlinePlus psychology feed): robots.txt disallows /xml/, /feeds/topics/ and /groupfeeds/, and the
    # Web Service host has no robots.txt (the Gate3 robots check fails closed on it), so the governed feed is the
    # "Mental Health and Behavior" group page itself, read by controlled link discovery (flag-gated). A topic is kept
    # only when it is one of the reviewed D23 MedlinePlus pages; crisis / medication / psychosis topics never.
    link_discovery:
      hub_urls:
        - https://medlineplus.gov/mentalhealthandbehavior.html
      max_new_urls_per_cycle: 12
      max_discovered_urls: 30
    # Controlled specialized serving only (NOT global low-risk). D12 omitted (no canonical MP spec).
    # D23 = reviewed MedlinePlus mental-health education pages only (URL lane in governed_specialized_entity_eligibility).
    specialized_serving_eligibility:
