manifest_authority: CANONICAL_TRUSTED_SOURCE_CONTROL
manifest_version: "i5-trusted-source-control-v2"
allowlist_version: "i5-multisource-v1-niosh-d17-q01"
gate_id: "PD-I5-V1-GOVERNED-SOURCE-QUALIFICATION-D17-NIOSH-AND-CANDIDATE-REGISTRY-WAVE01-01"
