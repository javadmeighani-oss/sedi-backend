# R-074 step 8a - deterministic Persian/Arabic -> English search bridge for EVERY health topic of the governed library.
#
# The governed knowledge is English official text (NHS, MedlinePlus, CDC, NIH ...). A Persian/Arabic question reaches it
# through English keyword alternatives. One entry per topic family of the library (names follow the official page titles):
#   en: English alternatives, MOST SPECIFIC FIRST (at most 4 are used per question)
#   fa / ar: marker words or phrases (any one fires the entry). Written naturally; letters are normalised at load time
#            (ي->ی, ك->ک, ة->ه, hamza forms->ا, diacritics and ZWNJ removed). Markers of <=3 letters must be a whole word.
# Not user-facing text (R-043: keyword lists are not copy). Psychology / wellbeing topics stay in psychology_query_bridge.py.
# A question that matches this lexicon AND a psychology topic goes to the model path (combined questions keep working).
version: i5-health-query-lexicon-v1
