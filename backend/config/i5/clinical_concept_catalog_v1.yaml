# Governed clinical concept catalog (EN / FA / AR) — Javad-editable.
#
# Purpose: link crawled knowledge units to clinical concepts (I5KnowledgeUnitConcept) and
# give verified multilingual labels to the existing 81-B concept-authority mechanism.
#
# Verification law (ledger D-010):
#   OFFICIAL_SOURCE_TITLE  -> verified (term is the governed source page's own title/name)
#   FOUNDER_APPROVED       -> verified (reviewed and approved by Javad / clinician)
#   MODEL_ASSISTED_DRAFT   -> NOT verified (model-generated draft; no retrieval authority)
# 2026-10-18 (D-021): Javad authorised approval; disease:* FA/AR labels were reviewed and marked FOUNDER_APPROVED.
#   Broad topic:* labels (stress, mental wellbeing, mindfulness, physical activity, healthy eating) stay drafts on purpose:
#   a verified generic label would narrow retrieval to that concept's linked units and hide broader evidence.
# To approve a FA/AR draft, change its status to FOUNDER_APPROVED and set `approved_on`.
#
# Ambiguity is fail-closed by design (a query matching two concepts gets no authority),
# so overlapping generic labels are avoided (one diabetes concept, not three).
catalog_version: "i5-concept-catalog-v1"
