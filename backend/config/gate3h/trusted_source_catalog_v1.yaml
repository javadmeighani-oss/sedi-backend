# Gate 3H — Trusted Knowledge Source Catalog (V1 proposal)
# Status: PROPOSAL ONLY — do not import to production without Javad approval.
# Schema version: 1
# Maps to POST /knowledge-base/sources (KnowledgeSourceCreateIn) + metadata.topic_tags

catalog_version: "3h-v1.1"
approval_owner_default: Javad
scheduled_fetch_default: false
batch1_precheck_date: "2026-07-01"
batch1_precheck_doc: backend/docs/gate3h/ROBOTS_TERMS_PRECHECK_BATCH1.md
notes:
  - "source_fetch_enabled defaults to false until robots/terms review per source."
  - "ingestion_status should remain draft until first successful approve cycle."
  - "No blind crawling — only allowed_domain + allowed_url_patterns."
  - "Subcategories not in KB_CATEGORIES use metadata.topic_tags for planning."
  - "Batch 1 robots/terms pre-check completed 2026-07-01 — see ROBOTS_TERMS_PRECHECK_BATCH1.md."

risk_tiers:
  low_v1_batch_eligible:
    - lifestyle
    - daily_planning
    - habit_change
    - exercise
    - sleep
    - nutrition
  sensitive_always_javad:
    - mental_wellbeing
    - psychological_support
    - emotional_support
    - stress_management
    - health_care
    - prevention
    - provider_directory
    - lab_directory
    - local_services
  never_auto_approve_v1:
    - medical_condition
    - medication_education
    - clinical_guideline
    - emergency_education
    - chronic_care
    - elderly_care
    - caregiving
    - diet_program
    - exercise_program
    - mental_wellbeing
    - psychological_support
    - emotional_support
    - provider_directory
    - lab_directory
    - local_services

sources:
  # --- A. Global health / lifestyle (Group A) ---

  - source_key: who_global_health_topics
    display_name: WHO — Health Topics (curated pages)
    base_url: https://www.who.int/health-topics
    allowed_domain: who.int
    allowed_url_patterns:
      - "^https://www\\.who\\.int/health-topics/.*"
      - "^https://www\\.who\\.int/news-room/.*"
    category: lifestyle
    locale: en
    country_scope: global
    trust_level: official
    fetch_method: html_page
    source_fetch_enabled: false
    review_required: true
    auto_approve_low_risk: false
    fetch_interval_hours: 168
    risk_level: medium
    robots_terms_status: deferred_terms_unclear
    approval_owner: Javad
    metadata:
      topic_tags: [health_care, prevention, longevity]
      gate3h_group: A
      batch1_precheck_robots: allowed
      batch1_precheck_terms: unclear_needs_review
      terms_notes: "Most WHO materials CC BY-NC-SA 3.0 IGO — non-commercial use; commercial Sedi use needs legal review."
    notes: "Official source. Batch 1 physical-activity fact sheet deferred — terms unclear for commercial use."

  - source_key: medlineplus_consumer_health
    display_name: MedlinePlus — Consumer Health Information
    base_url: https://medlineplus.gov
    allowed_domain: medlineplus.gov
    allowed_url_patterns:
      - "^https://medlineplus\\.gov/.*"
    category: lifestyle
    locale: en
    country_scope: global
    trust_level: official
    fetch_method: html_page
    source_fetch_enabled: false
    review_required: true
    auto_approve_low_risk: false
    fetch_interval_hours: 168
    risk_level: medium
    robots_terms_status: approved_for_controlled_fetch
    approval_owner: Javad
    license_notes: "Public-domain topic summaries require MedlinePlus/NLM attribution; exclude copyrighted A.D.A.M. and drug monograph sections."
    metadata:
      topic_tags: [health_care, prevention, nutrition, exercise, sleep]
      gate3h_group: A
      batch1_precheck_robots: allowed
      batch1_precheck_terms: allowed_with_attribution
      mixed_copyright_caution: true
    notes: "NIH/NLM consumer education. Batch 1 pages deferred pending mixed-copyright review — prefer Summary sections only."

  - source_key: nhs_uk_live_well
    display_name: NHS — Live Well
    base_url: https://www.nhs.uk/live-well
    allowed_domain: nhs.uk
    allowed_url_patterns:
      - "^https://www\\.nhs\\.uk/live-well/.*"
      - "^https://www\\.nhs\\.uk/mental-health/.*"
    category: lifestyle
    locale: en
    country_scope: GB
    trust_level: official
    fetch_method: html_page
    source_fetch_enabled: false
    review_required: true
    auto_approve_low_risk: false
    fetch_interval_hours: 168
    freshness_policy_days: 7
    risk_level: medium
    robots_terms_status: approved_for_controlled_fetch
    approval_owner: Javad
    license_notes: "OGL v3.0 — attribution required (Information from the NHS website). Refresh cached copy at least every 7 days per NHS terms."
    metadata:
      topic_tags: [prevention, exercise, sleep, stress_management]
      gate3h_group: A
      batch1_precheck_robots: allowed
      batch1_precheck_terms: allowed_with_attribution
      freshness_recommendation_days: 7
    notes: "Live Well only for batch 1 cycle 1. source_fetch_enabled stays false until Javad approves first fetch. Mental-health paths use nhs_mental_health entry."

  - source_key: cdc_health_lifestyle
    display_name: CDC — Healthy Living
    base_url: https://www.cdc.gov/healthyliving
    allowed_domain: cdc.gov
    allowed_url_patterns:
      - "^https://www\\.cdc\\.gov/healthyliving/.*"
      - "^https://www\\.cdc\\.gov/physicalactivity/.*"
    category: prevention
    locale: en
    country_scope: US
    trust_level: official
    fetch_method: html_page
    source_fetch_enabled: false
    review_required: true
    auto_approve_low_risk: false
    fetch_interval_hours: 168
    risk_level: medium
    robots_terms_status: approved_for_controlled_fetch
    approval_owner: Javad
    license_notes: "CDC public domain — attribute CDC/HHS; include non-endorsement disclaimer in product context."
    metadata:
      topic_tags: [lifestyle, exercise, nutrition]
      gate3h_group: A
      batch1_precheck_robots: allowed
      batch1_precheck_terms: allowed_with_attribution
      first_cycle: not_recommended
    notes: "Robots/terms OK for controlled fetch later. Not first cycle — prevention category is sensitive in Gate 3G."

  - source_key: nice_org_uk_public
    display_name: NICE — Public / Patient Information
    base_url: https://www.nice.org.uk
    allowed_domain: nice.org.uk
    allowed_url_patterns:
      - "^https://www\\.nice\\.org\\.uk/guidance/.*"
    category: clinical_guideline
    locale: en
    country_scope: GB
    trust_level: clinical_guideline
    fetch_method: html_page
    source_fetch_enabled: false
    review_required: true
    auto_approve_low_risk: false
    fetch_interval_hours: null
    risk_level: high
    robots_terms_status: pending_review
    approval_owner: Javad
    metadata:
      topic_tags: [health_care]
      gate3h_group: A
      v1_population: deferred
    notes: "DEFER for V1 batch 1 — clinical guidelines excluded from initial crawl."

