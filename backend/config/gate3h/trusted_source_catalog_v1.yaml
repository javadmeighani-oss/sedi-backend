  - source_key: medlineplus_mental_health
    display_name: MedlinePlus — Mental Health & Behavior
    base_url: https://medlineplus.gov/mentalhealthandbehavior.html
    allowed_domain: medlineplus.gov
    allowed_url_patterns:
