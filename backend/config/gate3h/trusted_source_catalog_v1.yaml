    approval_owner: Javad
    license_notes: "OGL v3.0 — attribution required (Information from the NHS website). Refresh at least every 7 days."
    metadata:
      topic_tags:
        - stress_management
        - sleep_psychology
        - grief_support
        - loneliness_support
      gate3h_group: B
      batch1_precheck_robots: allowed
      batch1_precheck_terms: allowed_with_attribution
      first_cycle: not_recommended
    notes: "High priority for Sedi mental wellbeing pillar. Deferred until lifestyle cycle succeeds — not first controlled fetch."

  - source_key: medlineplus_mental_health
