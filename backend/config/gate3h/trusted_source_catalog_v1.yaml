# Gate 3H — Trusted Knowledge Source Catalog (V1 proposal)
# Status: PROPOSAL ONLY — do not import to production without Javad approval.
# Schema version: 1
# Maps to POST /knowledge-base/sources (KnowledgeSourceCreateIn) + metadata.topic_tags

catalog_version: "3h-v1"
approval_owner_default: Javad
scheduled_fetch_default: false
notes:
  - "source_fetch_enabled defaults to false until robots/terms review per source."
  - "ingestion_status should remain draft until first successful approve cycle."
  - "No blind crawling — only allowed_domain + allowed_url_patterns."
  - "Subcategories not in KB_CATEGORIES use metadata.topic_tags for planning."

risk_tiers:
  low_v1_batch_eligible:
    - lifestyle
    - daily_planning
    - habit_change
    - exercise
    - sleep
    - nutrition
  sensitive_always_javad:
    - mental_wellbeing
    - psychological_support
    - emotional_support
    - stress_management
    - health_care
    - prevention
    - provider_directory
    - lab_directory
    - local_services
  never_auto_approve_v1:
    - medical_condition
    - medication_education
    - clinical_guideline
    - emergency_education
    - chronic_care
    - elderly_care
    - caregiving
    - diet_program
    - exercise_program
    - mental_wellbeing
    - psychological_support
    - emotional_support
    - provider_directory
    - lab_directory
    - local_services

sources:
  # --- A. Global health / lifestyle (Group A) ---

  - source_key: who_global_health_topics
    display_name: WHO — Health Topics (curated pages)
    base_url: https://www.who.int/health-topics
    allowed_domain: who.int
    allowed_url_patterns:
      - "^https://www\\.who\\.int/health-topics/.*"
      - "^https://www\\.who\\.int/news-room/.*"
    category: lifestyle
    locale: en
    country_scope: global
    trust_level: official
    fetch_method: html_page
    source_fetch_enabled: false
    review_required: true
    auto_approve_low_risk: false
    fetch_interval_hours: 168
    risk_level: medium
    robots_terms_status: pending_review
    approval_owner: Javad
    metadata:
      topic_tags: [health_care, prevention, longevity]
      gate3h_group: A
    notes: "Official source. Start with low-risk lifestyle/activity pages only; avoid clinical treatment pages in batch 1."

  - source_key: medlineplus_consumer_health
    display_name: MedlinePlus — Consumer Health Information
    base_url: https://medlineplus.gov
    allowed_domain: medlineplus.gov
    allowed_url_patterns:
      - "^https://medlineplus\\.gov/.*"
    category: lifestyle
    locale: en
    country_scope: global
    trust_level: official
    fetch_method: html_page
    source_fetch_enabled: false
    review_required: true
    auto_approve_low_risk: false
    fetch_interval_hours: 168
    risk_level: medium
    robots_terms_status: pending_review
    approval_owner: Javad
    metadata:
      topic_tags: [health_care, prevention, nutrition, exercise, sleep]
      gate3h_group: A
    notes: "NIH/NLM consumer education. Avoid medication dosing pages in first batch."

  - source_key: nhs_uk_live_well
    display_name: NHS — Live Well
    base_url: https://www.nhs.uk/live-well
    allowed_domain: nhs.uk
    allowed_url_patterns:
      - "^https://www\\.nhs\\.uk/live-well/.*"
      - "^https://www\\.nhs\\.uk/mental-health/.*"
    category: lifestyle
    locale: en
    country_scope: GB
    trust_level: official
    fetch_method: html_page
    source_fetch_enabled: false
    review_required: true
    auto_approve_low_risk: false
    fetch_interval_hours: 168
    risk_level: medium
    robots_terms_status: pending_review
    approval_owner: Javad
    metadata:
      topic_tags: [prevention, exercise, sleep, stress_management]
      gate3h_group: A
    notes: "Mental-health paths are sensitive; route to Group B review policy when used."

  - source_key: cdc_health_lifestyle
    display_name: CDC — Healthy Living
    base_url: https://www.cdc.gov/healthyliving
    allowed_domain: cdc.gov
    allowed_url_patterns:
      - "^https://www\\.cdc\\.gov/healthyliving/.*"
      - "^https://www\\.cdc\\.gov/physicalactivity/.*"
    category: prevention
    locale: en
    country_scope: US
    trust_level: official
    fetch_method: html_page
    source_fetch_enabled: false
    review_required: true
    auto_approve_low_risk: false
    fetch_interval_hours: 168
    risk_level: medium
    robots_terms_status: pending_review
    approval_owner: Javad
    metadata:
      topic_tags: [lifestyle, exercise, nutrition]
      gate3h_group: A
    notes: "prevention category is sensitive in Gate 3G — always Javad approval."

  - source_key: nice_org_uk_public
    display_name: NICE — Public / Patient Information
    base_url: https://www.nice.org.uk
    allowed_domain: nice.org.uk
    allowed_url_patterns:
      - "^https://www\\.nice\\.org\\.uk/guidance/.*"
    category: clinical_guideline
    locale: en
    country_scope: GB
    trust_level: clinical_guideline
    fetch_method: html_page
    source_fetch_enabled: false
    review_required: true
    auto_approve_low_risk: false
    fetch_interval_hours: null
    risk_level: high
    robots_terms_status: pending_review
    approval_owner: Javad
    metadata:
      topic_tags: [health_care]
      gate3h_group: A
      v1_population: deferred
    notes: "DEFER for V1 batch 1 — clinical guidelines excluded from initial crawl."

  # --- B. Mental wellbeing / psychology (Group B) — high priority ---

