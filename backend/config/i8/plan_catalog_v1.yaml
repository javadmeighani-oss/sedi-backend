  x_shoulder_blades: {fa: ["جمع‌کردن کتف‌ها", "نشسته با پشت صاف، کتف‌ها را آرام به هم نزدیک کن و رها کن."], en: ["Shoulder blade squeeze", "Seated tall, gently draw your shoulder blades together and release."], ar: ["ضم لوحي الكتف", "وأنت جالس بظهر مستقيم قرّب لوحي الكتف ببطء ثم أرخِ."]}
