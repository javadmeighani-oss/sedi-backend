safety_line:
  fa: "اگه درد قفسه‌ی سینه، تنگی نفس شدید، سرگیجه یا ضعف ناگهانی داشتی، همون لحظه متوقف شو و با تیم درمان یا اورژانس تماس بگیر."
  en: "If you get chest pain, severe breathlessness, dizziness or sudden weakness, stop right away and contact your care team or emergency services."
  ar: "إذا شعرت بألم في الصدر أو ضيق شديد في التنفس أو دوار أو ضعف مفاجئ فتوقف فوراً واتصل بفريقك العلاجي أو الطوارئ."
