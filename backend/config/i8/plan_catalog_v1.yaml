  rest: {fa: ["استراحت فعال", "امروز استراحت کن؛ اگه دوست داشتی یک راه رفتن کوتاه یا کشش خیلی ملایم."], en: ["Active rest", "Rest today; if you like, a short walk or very light stretching."], ar: ["راحة نشطة", "ارتح اليوم؛ ويمكنك مشياً قصيراً أو تمدداً خفيفاً جداً."]}

