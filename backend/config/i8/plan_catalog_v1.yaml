  x_ankle_circles: {fa: ["چرخش مچ پا", "نشسته مچ پا را آرام در هر دو جهت بچرخان."], en: ["Ankle circles", "While seated, rotate each ankle slowly in both directions."], ar: ["تدوير الكاحل", "وأنت جالس أدر الكاحل ببطء في الاتجاهين."]}
