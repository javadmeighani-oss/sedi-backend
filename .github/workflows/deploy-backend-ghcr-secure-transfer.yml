# GitHub-only secure image transfer deploy when production host cannot TLS to GHCR.
# Runner pulls from GHCR; archive transfers via existing GHA SSH; server loads with --pull never.
# Gate: PD-I5-V1-SOURCE-FORMAT-RESILIENCE-GITHUB-ONLY-DELIVERY-CLOSURE-01
name: Deploy Backend GHCR Secure Transfer

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "40-char lowercase commit SHA image tag"
        required: true
      expected_alembic_revision:
        description: "Expected exact production alembic_version"
        required: true
      expected_image_digest:
        description: "Source registry digest sha256:<64 hex>"
        required: true
      confirmation:
        description: "Type DEPLOY_BACKEND_SECURE_TRANSFER to authorize"
        required: true

concurrency:
  group: sedi-production-backend-operation
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: ghcr.io/javadmeighani-oss/sedi-backend

jobs:
  secure-transfer-deploy:
    name: Pull on runner → transfer → load/deploy on prod
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Validate inputs
        id: validate_inputs
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          INPUT_EXPECTED_ALEMBIC_REVISION: ${{ github.event.inputs.expected_alembic_revision }}
          INPUT_EXPECTED_IMAGE_DIGEST: ${{ github.event.inputs.expected_image_digest }}
          INPUT_CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          TAG="${INPUT_IMAGE_TAG}"
          REV="${INPUT_EXPECTED_ALEMBIC_REVISION}"
          DIGEST="${INPUT_EXPECTED_IMAGE_DIGEST}"
          CONF="${INPUT_CONFIRMATION}"
          if [ "${CONF}" != "DEPLOY_BACKEND_SECURE_TRANSFER" ]; then
            echo "confirmation must be exactly DEPLOY_BACKEND_SECURE_TRANSFER"
            exit 1
          fi
          echo "${TAG}" | grep -Eq '^[0-9a-f]{40}$'
          echo "${REV}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$'
          echo "${DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "inputs_ok=yes" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR (runner only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact digest on runner and save archive
        id: pull_save
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          EXPECTED_DIGEST: ${{ github.event.inputs.expected_image_digest }}
        run: |
          set -Eeuo pipefail
          DIGEST_REF="${IMAGE_NAME}@${EXPECTED_DIGEST}"
          TAG_REF="${IMAGE_NAME}:${IMAGE_TAG}"
          echo "=== PULL BY REGISTRY DIGEST ==="
          docker pull "${DIGEST_REF}"
          PULLED_DIGESTS="$(docker image inspect "${DIGEST_REF}" --format '{{range .RepoDigests}}{{println .}}{{end}}')"
          echo "${PULLED_DIGESTS}"
          if ! echo "${PULLED_DIGESTS}" | grep -Fq "${EXPECTED_DIGEST}"; then
            echo "REGISTRY_DIGEST_MISMATCH"
            exit 13
          fi
          RUNNER_IMAGE_ID="$(docker image inspect "${DIGEST_REF}" --format '{{.Id}}')"
          echo "RUNNER_IMAGE_ID=${RUNNER_IMAGE_ID}"
          # Preserve exact TARGET_TAG for compose.
          docker tag "${DIGEST_REF}" "${TAG_REF}"
          ARCHIVE="/tmp/sedi-backend-${IMAGE_TAG}.tar"
          echo "=== DOCKER SAVE ==="
          docker save -o "${ARCHIVE}" "${TAG_REF}"
          ARCHIVE_SHA256="$(sha256sum "${ARCHIVE}" | awk '{print $1}')"
          ARCHIVE_BYTES="$(stat -c%s "${ARCHIVE}")"
          echo "ARCHIVE_SHA256=${ARCHIVE_SHA256}"
          echo "ARCHIVE_BYTES=${ARCHIVE_BYTES}"
          echo "runner_image_id=${RUNNER_IMAGE_ID}" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=${ARCHIVE_SHA256}" >> "$GITHUB_OUTPUT"
          echo "archive_path=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_REGISTRY_DIGEST=${EXPECTED_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "RUNNER_IMAGE_ID=${RUNNER_IMAGE_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "ARCHIVE_SHA256=${ARCHIVE_SHA256}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keygen -y -f ~/.ssh/sedi_deploy_key > /tmp/sedi_deploy_key.pub
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts

      - name: Production preflight (read-only)
        env:
          INPUT_EXPECTED_ALEMBIC_REVISION: ${{ github.event.inputs.expected_alembic_revision }}
        run: |
          set -Eeuo pipefail
          EXPECTED_REV_Q="$(printf '%q' "${INPUT_EXPECTED_ALEMBIC_REVISION}")"
          DEPLOY_PATH_Q="$(printf '%q' "${{ secrets.SEDI_DEPLOY_PATH }}")"
          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "EXPECTED_REV=${EXPECTED_REV_Q} DEPLOY_PATH=${DEPLOY_PATH_Q} bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          log() { echo "[$(date -Is)] $*"; }
          ENV_FILE="/etc/sedi/sedi-backend.env"
          cd "${DEPLOY_PATH}"
          PU=$(docker exec sedi-postgres printenv POSTGRES_USER)
          PD=$(docker exec sedi-postgres printenv POSTGRES_DB)
          docker exec sedi-postgres pg_isready -U "${PU}" -d "${PD}"
          if [ ! -f "${ENV_FILE}" ]; then log "missing env"; exit 1; fi
          if ! grep -E "^DATABASE_URL=.+$" "${ENV_FILE}" >/dev/null; then log "DATABASE_URL missing"; exit 2; fi
          if grep -E "^TEST_DATABASE_URL=.+$" "${ENV_FILE}" >/dev/null; then log "TEST_DATABASE_URL forbidden"; exit 3; fi
          ALEMBIC_COUNT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM alembic_version;")"
          ALEMBIC_CURRENT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT version_num FROM alembic_version;")"
          log "alembic_count=${ALEMBIC_COUNT}"
          log "alembic_current=${ALEMBIC_CURRENT}"
          if [ "${ALEMBIC_COUNT}" != "1" ] || [ "${ALEMBIC_CURRENT}" != "${EXPECTED_REV}" ]; then
            log "alembic mismatch"
            exit 5
          fi
          curl -fsS http://127.0.0.1:8000/healthz >/dev/null
          docker inspect sedi-backend --format '{{.Config.Image}}' || true
          log "PREFLIGHT_OK"
          REMOTE_SCRIPT

      - name: Upload compose + transfer image archive via GHA SSH
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          ARCHIVE_PATH: ${{ steps.pull_save.outputs.archive_path }}
          ARCHIVE_SHA256: ${{ steps.pull_save.outputs.archive_sha256 }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/tmp_secure_transfer"
          REMOTE_ARCHIVE="${REMOTE_DIR}/sedi-backend-${IMAGE_TAG}.tar"
          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key \
            -P "${{ secrets.SEDI_PORT }}" \
            compose.production.yml \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${DEPLOY_PATH}/compose.production.yml.tmp"
          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "mv $(printf '%q' "${DEPLOY_PATH}/compose.production.yml.tmp") $(printf '%q' "${DEPLOY_PATH}/compose.production.yml")"
          echo "=== SCP IMAGE ARCHIVE ==="
          scp -i ~/.ssh/sedi_deploy_key \
            -P "${{ secrets.SEDI_PORT }}" \
            "${ARCHIVE_PATH}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_ARCHIVE}"
          echo "transfer_complete archive_sha256=${ARCHIVE_SHA256}"

      - name: Load archive on server and deploy with --pull never
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          EXPECTED_REV: ${{ github.event.inputs.expected_alembic_revision }}
          EXPECTED_DIGEST: ${{ github.event.inputs.expected_image_digest }}
          RUNNER_IMAGE_ID: ${{ steps.pull_save.outputs.runner_image_id }}
          ARCHIVE_SHA256: ${{ steps.pull_save.outputs.archive_sha256 }}
        run: |
          set -Eeuo pipefail
          IMAGE_TAG_Q="$(printf '%q' "${IMAGE_TAG}")"
          EXPECTED_REV_Q="$(printf '%q' "${EXPECTED_REV}")"
          EXPECTED_DIGEST_Q="$(printf '%q' "${EXPECTED_DIGEST}")"
          RUNNER_ID_Q="$(printf '%q' "${RUNNER_IMAGE_ID}")"
          ARCHIVE_SHA_Q="$(printf '%q' "${ARCHIVE_SHA256}")"
          DEPLOY_PATH_Q="$(printf '%q' "${{ secrets.SEDI_DEPLOY_PATH }}")"
          IMAGE_NAME_Q="$(printf '%q' "${IMAGE_NAME}")"
          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "IMAGE_TAG=${IMAGE_TAG_Q} EXPECTED_REV=${EXPECTED_REV_Q} EXPECTED_DIGEST=${EXPECTED_DIGEST_Q} RUNNER_IMAGE_ID=${RUNNER_ID_Q} ARCHIVE_SHA256=${ARCHIVE_SHA_Q} DEPLOY_PATH=${DEPLOY_PATH_Q} IMAGE_NAME=${IMAGE_NAME_Q} bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          log() { echo "[$(date -Is)] $*"; }
          ENV_FILE="/etc/sedi/sedi-backend.env"
          REMOTE_DIR="${DEPLOY_PATH}/tmp_secure_transfer"
          ARCHIVE="${REMOTE_DIR}/sedi-backend-${IMAGE_TAG}.tar"
          TAG_REF="${IMAGE_NAME}:${IMAGE_TAG}"
          cd "${DEPLOY_PATH}"
          PU=$(docker exec sedi-postgres printenv POSTGRES_USER)
          PD=$(docker exec sedi-postgres printenv POSTGRES_DB)
          CURRENT_IMAGE="$(docker inspect sedi-backend --format '{{.Config.Image}}' 2>/dev/null || true)"
          log "current_image=${CURRENT_IMAGE:-none}"

          log "=== VERIFY ARCHIVE SHA256 ==="
          GOT_SHA="$(sha256sum "${ARCHIVE}" | awk '{print $1}')"
          if [ "${GOT_SHA}" != "${ARCHIVE_SHA256}" ]; then
            log "ARCHIVE_SHA_MISMATCH got=${GOT_SHA}"
            rm -f "${ARCHIVE}"
            exit 15
          fi
          log "ARCHIVE_SHA256_VERIFIED=${GOT_SHA}"

          log "=== PRE-DEPLOY DB BACKUP ==="
          mkdir -p "${DEPLOY_PATH}/backups/postgres"
          TS="$(date +%Y%m%d_%H%M%S)"
          BACKUP_FILE="${DEPLOY_PATH}/backups/postgres/sedi_db_predeploy_secure_${TS}.sql.gz"
          docker exec sedi-postgres pg_dump -U "${PU}" -d "${PD}" | gzip > "${BACKUP_FILE}"
          gzip -t "${BACKUP_FILE}"
          log "backup_sha256=$(sha256sum "${BACKUP_FILE}" | awk '{print $1}')"

          log "=== DOCKER LOAD ==="
          LOAD_OUT="$(docker load -i "${ARCHIVE}")"
          log "${LOAD_OUT}"
          SERVER_LOADED_IMAGE_ID="$(docker image inspect "${TAG_REF}" --format '{{.Id}}')"
          log "SERVER_LOADED_IMAGE_ID=${SERVER_LOADED_IMAGE_ID}"
          if [ "${SERVER_LOADED_IMAGE_ID}" != "${RUNNER_IMAGE_ID}" ]; then
            log "IMAGE_ID_MISMATCH runner=${RUNNER_IMAGE_ID} server=${SERVER_LOADED_IMAGE_ID}"
            rm -f "${ARCHIVE}"
            exit 16
          fi
          log "IMAGE_ID_MATCH=PASS"
          log "SOURCE_REGISTRY_DIGEST=${EXPECTED_DIGEST}"

          ALEMBIC_COUNT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM alembic_version;")"
          ALEMBIC_CURRENT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT version_num FROM alembic_version;")"
          if [ "${ALEMBIC_COUNT}" != "1" ] || [ "${ALEMBIC_CURRENT}" != "${EXPECTED_REV}" ]; then
            log "alembic changed before recreate"
            exit 14
          fi

          log "=== COMPOSE VALIDATE + RECREATE (--pull never) ==="
          SEDI_IMAGE_TAG="${IMAGE_TAG}" docker compose -f compose.production.yml config >/tmp/sedi_compose_config_checked.yml
          SEDI_IMAGE_TAG="${IMAGE_TAG}" docker compose -f compose.production.yml up -d --no-deps --force-recreate --pull never sedi-backend
          docker inspect sedi-backend --format 'container_image={{.Config.Image}} image_id={{.Image}}' || true
          RUNNING_ID="$(docker inspect sedi-backend --format '{{.Image}}')"
          if [ "${RUNNING_ID}" != "${RUNNER_IMAGE_ID}" ]; then
            log "RUNNING_IMAGE_ID_MISMATCH got=${RUNNING_ID}"
            exit 17
          fi
          RUNNING_TAG_IMG="$(docker inspect sedi-backend --format '{{.Config.Image}}')"
          if [ "${RUNNING_TAG_IMG}" != "${TAG_REF}" ]; then
            log "RUNNING_TAG_MISMATCH got=${RUNNING_TAG_IMG}"
            exit 18
          fi

          HEALTH_OK=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz >/tmp/sedi_healthz.json; then
              HEALTH_OK=1
              break
            fi
            sleep 2
          done
          if [ "${HEALTH_OK}" != "1" ]; then
            log "HEALTH_FAILED"
            docker logs --tail 120 sedi-backend || true
            if [ -n "${CURRENT_IMAGE}" ]; then
              printf '%s\n' "services:" "  sedi-backend:" "    image: ${CURRENT_IMAGE}" > /tmp/sedi-rollback.yml
              docker compose -f compose.production.yml -f /tmp/sedi-rollback.yml up -d --no-deps --force-recreate --pull never sedi-backend || true
            fi
            rm -f "${ARCHIVE}"
            exit 1
          fi
          curl -fsS http://127.0.0.1:8000/health || true
          echo ""
          curl -fsS https://api.sedi-ai.com/health || true
          echo ""
          log "RUNNING_TAG=${IMAGE_TAG}"
          log "RUNNING_IMAGE_ID=${RUNNING_ID}"
          log "SOURCE_REGISTRY_DIGEST=${EXPECTED_DIGEST}"
          log "ARCHIVE_SHA256=${ARCHIVE_SHA256}"
          log "=== REMOVE TEMP ARCHIVE ==="
          rm -f "${ARCHIVE}"
          rmdir "${REMOTE_DIR}" 2>/dev/null || true
          log "SECURE_TRANSFER_DEPLOY_DONE"
          REMOTE_SCRIPT

      - name: Cleanup runner archive
        if: always()
        env:
          ARCHIVE_PATH: ${{ steps.pull_save.outputs.archive_path }}
        run: |
          set -Eeuo pipefail
          rm -f "${ARCHIVE_PATH:-/tmp/sedi-backend-*.tar}" || true

      - name: Summary
        if: always()
        env:
          TAG: ${{ github.event.inputs.image_tag }}
          DIGEST: ${{ github.event.inputs.expected_image_digest }}
          RUNNER_ID: ${{ steps.pull_save.outputs.runner_image_id }}
          ARCH_SHA: ${{ steps.pull_save.outputs.archive_sha256 }}
        run: |
          {
            echo "## Secure Transfer Deploy"
            echo "Status: ${{ job.status }}"
            echo "TARGET_TAG: ${TAG}"
            echo "TARGET_REGISTRY_DIGEST: ${DIGEST}"
            echo "RUNNER_IMAGE_ID: ${RUNNER_ID}"
            echo "ARCHIVE_SHA256: ${ARCH_SHA}"
            echo "DEPLOY_PATH=GITHUB_ACTIONS_SECURE_TRANSFER"
            echo "SEDI_PRODUCTION_DEPLOYMENT=GITHUB_PUSH_AND_GITHUB_ACTIONS_ONLY"
          } >> "$GITHUB_STEP_SUMMARY"
