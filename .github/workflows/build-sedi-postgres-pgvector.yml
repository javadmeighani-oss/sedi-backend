# Build + push SEDI PostgreSQL 16 Alpine + pinned pgvector (Path A).
name: Build Sedi Postgres PGVector Alpine Image

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/ops/db03/Dockerfile.postgres16-pgvector-alpine"
      - ".github/workflows/build-sedi-postgres-pgvector.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-sedi-postgres-pgvector-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/javadmeighani-oss/sedi-postgres
  PGVECTOR_VERSION: v0.8.6

jobs:
  build-and-push:
    name: Build pinned PG16 Alpine + pgvector
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.tag }}
      base_digest: ${{ steps.base.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable postgres:16-alpine base digest
        id: base
        run: |
          set -euo pipefail
          docker pull postgres:16-alpine
          DIGEST="$(docker inspect postgres:16-alpine --format '{{index .RepoDigests 0}}' | awk -F@ '{print $2}')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "BASE_DIGEST=${DIGEST}"
          echo "postgres:16-alpine@${DIGEST}" > /tmp/base_ref.txt

      - name: Image tag meta
        id: meta
        run: |
          TAG="16-alpine-pgvector-0.8.6-${GITHUB_SHA:0:12}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/ops/db03/Dockerfile.postgres16-pgvector-alpine
          push: true
          build-args: |
            POSTGRES_BASE=postgres:16-alpine@${{ steps.base.outputs.digest }}
            PGVECTOR_VERSION=${{ env.PGVECTOR_VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:16-alpine-pgvector-0.8.6
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            sedi.pgvector.version=${{ env.PGVECTOR_VERSION }}
            sedi.postgres.base.digest=${{ steps.base.outputs.digest }}

      - name: Packaging + ldd proof on built image
        run: |
          set -euo pipefail
          REF="${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
          docker pull "${REF}"
          docker run --rm --entrypoint sh "${REF}" -lc '
            set -eu
            PKGLIB="$(pg_config --pkglibdir)"
            SHARE="$(pg_config --sharedir)"
            test -f "${PKGLIB}/vector.so"
            test -f "${SHARE}/extension/vector.control"
            ls "${SHARE}/extension"/vector--*.sql >/dev/null
            grep -E "^default_version" "${SHARE}/extension/vector.control"
            # Capture ldd without failing on musl reloc diagnostics (exit 127).
            set +e
            ldd "${PKGLIB}/vector.so" > /tmp/vector_ldd.txt 2>&1
            set -e
            cat /tmp/vector_ldd.txt
            if grep -E "=>[[:space:]]+not found" /tmp/vector_ldd.txt; then
              echo "MISSING_SHARED_LIB"; exit 1
            fi
            id -u postgres
            cat /etc/alpine-release
            pg_config --version
            echo "PGVECTOR_CANONICAL_PGXS_INSTALL=PASS"
            echo "PGVECTOR_LLVM_BITCODE_DISABLED=YES"
            echo "VECTOR_SO_NO_MISSING_SHARED_LIBRARIES=PASS"
          '
          echo "PGVECTOR_PACKAGING_PATH=A_alpine_same_lineage_canonical_pgxs_no_llvm"
          echo "CANDIDATE_IMAGE=${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
          echo "CANDIDATE_IMAGE_DIGEST=${{ steps.push.outputs.digest }}"
          echo "POSTGRES_BASE_DIGEST=${{ steps.base.outputs.digest }}"
          echo "PGVECTOR_VERSION=${{ env.PGVECTOR_VERSION }}"

      - name: Isolated CREATE EXTENSION + functional smoke + restart
        run: |
          set -euo pipefail
          REF="${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
          NAME="sedi-pgvector-smoke-$$"
          docker rm -f "${NAME}" >/dev/null 2>&1 || true
          docker run -d --name "${NAME}" \
            -e POSTGRES_PASSWORD=smoke_only \
            -e POSTGRES_USER=smoke \
            -e POSTGRES_DB=smoke_db \
            "${REF}"
          for i in $(seq 1 60); do
            docker exec "${NAME}" pg_isready -U smoke -d smoke_db && break
            sleep 1
          done
          docker exec "${NAME}" pg_isready -U smoke -d smoke_db
          docker exec -i "${NAME}" psql -U smoke -d smoke_db -v ON_ERROR_STOP=1 <<'SQL'
          SELECT name, default_version, installed_version
          FROM pg_available_extensions WHERE name='vector';
          CREATE EXTENSION vector;
          SELECT extname, extversion FROM pg_extension WHERE extname='vector';
          SELECT CASE WHEN extversion = '0.8.6' THEN 'VECTOR_EXTENSION_VERSION_OK' ELSE 'VECTOR_EXTENSION_VERSION_BAD' END
          FROM pg_extension WHERE extname='vector';
          CREATE TABLE pgvector_smoke (
            id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            embedding vector(3) NOT NULL
          );
          INSERT INTO pgvector_smoke (embedding) VALUES ('[1,0,0]'), ('[0,1,0]'), ('[0.9,0.1,0]');
          SELECT id FROM pgvector_smoke ORDER BY embedding <=> '[1,0,0]'::vector LIMIT 1;
          SQL
          docker exec "${NAME}" psql -U smoke -d smoke_db -tA -c "SELECT extversion FROM pg_extension WHERE extname='vector';" | grep -Fx '0.8.6'
          echo "VECTOR_EXTENSION_VERSION=0.8.6"
          echo "VECTOR_EXTENSION_AVAILABLE=YES"
          echo "VECTOR_EXTENSION_CREATE=PASS"
          echo "PGVECTOR_INSERT_SMOKE=PASS"
          echo "PGVECTOR_DISTANCE_OPERATOR_SMOKE=PASS"
          echo "PGVECTOR_QUERY_SMOKE=PASS"
          echo "PGVECTOR_FUNCTIONAL_SMOKE=PASS"
          docker restart "${NAME}"
          sleep 5
          for i in $(seq 1 60); do
            docker exec "${NAME}" pg_isready -U smoke -d smoke_db && break
            sleep 1
          done
          docker exec -i "${NAME}" psql -U smoke -d smoke_db -v ON_ERROR_STOP=1 <<'SQL'
          SELECT extname, extversion FROM pg_extension WHERE extname='vector';
          SELECT COUNT(*) AS smoke_rows FROM pgvector_smoke;
          SELECT id FROM pgvector_smoke ORDER BY embedding <=> '[1,0,0]'::vector LIMIT 1;
          SQL
          echo "POSTGRES_RESTART=PASS"
          echo "PGVECTOR_EXTENSION_SURVIVES_RESTART=PASS"
          echo "PGVECTOR_SMOKE_DATA_SURVIVES_RESTART=PASS"
          echo "DIGEST_RUNTIME_SMOKE=PASS"
          docker rm -f "${NAME}" >/dev/null
          echo "IMMUTABLE_IMAGE_DIGEST=PASS"
          echo "DIGEST_PULL=PASS"

      - name: Write digest artifact (non-sensitive)
        run: |
          {
            echo "CANDIDATE_IMAGE=${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
            echo "CANDIDATE_IMAGE_DIGEST=${{ steps.push.outputs.digest }}"
            echo "CANDIDATE_IMAGE_REF=${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
            echo "POSTGRES_BASE_DIGEST=${{ steps.base.outputs.digest }}"
            echo "PGVECTOR_VERSION=${{ env.PGVECTOR_VERSION }}"
            echo "PGVECTOR_PACKAGING_PATH=A_alpine_same_lineage_canonical_pgxs_no_llvm"
            echo "PGVECTOR_BUILD_METHOD=canonical_pgxs_with_llvm_0"
            echo "PGVECTOR_LLVM_BITCODE=DISABLED"
            echo "GIT_SHA=${{ github.sha }}"
          } > /tmp/sedi_postgres_pgvector_pin.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sedi-postgres-pgvector-pin
          path: /tmp/sedi_postgres_pgvector_pin.txt
          retention-days: 30
