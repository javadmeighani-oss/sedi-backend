# W3-P01 Focused Adapter Framework Runtime — GitHub workflow.
# Frozen contract: helper W3P01_RUNTIME_SELECTORS (11 -> 23). Deterministic fixtures only.
# Controlled real-source validation: NOT OWNED (W6-P01). No live network. No source activation.
name: W3-P01 Focused Adapter Framework Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w3p01-adapter-framework-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  w3p01-adapter-framework-runtime:
    name: W3-P01 adapter framework runtime (23 nodes)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      PYTHONPATH: ${{ github.workspace }}
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: w3p01-test-placeholder-not-used

    steps:
      - name: Configure runner temporary environment
        shell: bash
        run: |
          {
            echo "TMPDIR=$RUNNER_TEMP"
            echo "TEMP=$RUNNER_TEMP"
            echo "TMP=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Capture redacted dependency versions
        run: |
          python - <<'PY'
          import sys
          print("python", sys.version.split()[0])
          import pytest as _pytest
          print("pytest", getattr(_pytest, "__version__", "unknown"))
          PY

      - name: Prepare runner-temp evidence directory
        run: |
          mkdir -p "${{ runner.temp }}/sedi_w3p01_adapter_framework_evidence"

      - name: Process 1 — collect-only manifest (23 nodes)
        run: |
          python -B -m pytest \
            --collect-only \
            --noconftest \
            -p backend.tests.helpers.w3p01_adapter_runtime_plugin \
            -p no:cacheprovider \
            -q \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T1_package_identity \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T2_registry_register_and_resolve \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T3_public_web_wraps_fetcher_symbol \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T4_governance_fail_closed \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T5_network_safety_url_policy \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T6_fetch_envelope_statuses \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T7_official_api_and_rss_content_types \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T8_normalize_and_dedupe_idempotency \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T9_extraction_html_json_rss_and_failures \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T10_no_activation_no_production_write_markers \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T11_conditional_fetch_etag_passthrough

      - name: Process 2 — focused deterministic adapter framework runtime
        run: |
          python -B -m pytest \
            --noconftest \
            -p backend.tests.helpers.w3p01_adapter_runtime_plugin \
            -p no:cacheprovider \
            -q \
            --maxfail=1 \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T1_package_identity \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T2_registry_register_and_resolve \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T3_public_web_wraps_fetcher_symbol \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T4_governance_fail_closed \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T5_network_safety_url_policy \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T6_fetch_envelope_statuses \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T7_official_api_and_rss_content_types \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T8_normalize_and_dedupe_idempotency \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T9_extraction_html_json_rss_and_failures \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T10_no_activation_no_production_write_markers \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py::test_W3P01_T11_conditional_fetch_etag_passthrough

      - name: Upload redacted runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3p01-adapter-framework-evidence
          path: ${{ runner.temp }}/sedi_w3p01_adapter_framework_evidence
          retention-days: 14
          if-no-files-found: error
