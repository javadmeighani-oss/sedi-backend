# NF16 NCBI identity probe + canary-first activation (NO scaled RAG / NO ANN / NO full weekly catalog)
name: I5 NF16 NCBI Identity + Canary Activation

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "PROBE | NF16_VALIDATE | CANARY | ALL"
        required: true
        default: "PROBE"
      confirmation:
        description: "NF16_CANARY_ACTIVATION_ONLY"
        required: true

permissions:
  contents: read

concurrency:
  group: sedi-production-backend-operation
  cancel-in-progress: false

jobs:
  probe:
    name: Production NF16/identity/activation probe (read-only)
    if: >-
      github.event.inputs.confirmation == 'NF16_CANARY_ACTIVATION_ONLY' &&
      (github.event.inputs.phase == 'PROBE' || github.event.inputs.phase == 'ALL' || github.event.inputs.phase == 'NF16_VALIDATE')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: SSH read-only probe
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/i5"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/i5/nf16_ncbi_identity_probe_remote.sh \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/nf16_ncbi_identity_probe_remote.sh"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/nf16_ncbi_identity_probe_remote.sh") && \
             DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
             bash $(printf '%q' "${REMOTE_DIR}/nf16_ncbi_identity_probe_remote.sh")" \
            2>&1 | tee /tmp/nf16_probe.log
          # Never allow an email-shaped token into the artifact beyond domain markers.
          if grep -Eiq '@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' /tmp/nf16_probe.log | grep -viE 'domain=|ncbi_email_domain|api.sedi-ai.com|healthz|sedi-backend'; then
            echo "possible_email_leak_check_ran"
          fi
          grep -Fq 'NF16_PROBE|production_write|NO' /tmp/nf16_probe.log
          grep -Fq 'NF16_PROBE|ncbi_email_redacted_in_evidence|YES' /tmp/nf16_probe.log
          # Leak guard: fail if a full email appears (domain-only markers are allowed).
          if grep -Eiq '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' /tmp/nf16_probe.log; then
            if grep -Eiv 'ncbi_email_domain|domain=|api\.sedi-ai\.com' /tmp/nf16_probe.log | grep -Eiq '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'; then
              echo "SECRET_LEAK_GUARD=FAIL"
              exit 20
            fi
          fi
          echo "SECRET_LEAK_GUARD=PASS"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf16-probe
          path: /tmp/nf16_probe.log
          retention-days: 14

  github-secret-presence:
    name: GitHub NCBI secret presence (no value printed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Presence only
        env:
          NCBI_EMAIL: ${{ secrets.SEDI_NCBI_EMAIL }}
          NCBI_TOOL: ${{ vars.SEDI_NCBI_TOOL }}
          NCBI_KEY: ${{ secrets.SEDI_NCBI_API_KEY }}
        run: |
          set -Eeuo pipefail
          {
            echo "GH_NCBI|tool_present|$([ -n "${NCBI_TOOL}" ] && echo YES || echo NO)"
            echo "GH_NCBI|email_present|$([ -n "${NCBI_EMAIL}" ] && echo YES || echo NO)"
            echo "GH_NCBI|api_key_present|$([ -n "${NCBI_KEY}" ] && echo YES || echo NO)"
            echo "GH_NCBI|email_len|$([ -n "${NCBI_EMAIL}" ] && echo "${#NCBI_EMAIL}" || echo 0)"
          } | tee /tmp/gh_ncbi_presence.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf16-github-secret-presence
          path: /tmp/gh_ncbi_presence.log
          retention-days: 14
