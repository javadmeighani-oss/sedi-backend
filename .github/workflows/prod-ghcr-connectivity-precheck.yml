# Read-only production-host GHCR connectivity precheck (workflow_dispatch only).
# Gate: PD-I5-V1-SOURCE-FORMAT-RESILIENCE-DEPLOY-RETRY-01
# No pull/recreate/deploy. No TLS bypass.
name: Prod GHCR Connectivity Precheck

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "40-char lowercase commit SHA image tag to probe"
        required: true
      target_digest:
        description: "Expected digest sha256:<64 hex> for manifest probe"
        required: true
      chatlog_minutes:
        description: "0 (default, off) | 1-1440: print a SANITIZED backend chat-error extract (class names, counts, file:line only; read-only)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: sedi-production-backend-operation
  cancel-in-progress: false

jobs:
  ghcr-precheck:
    name: GHCR DNS/TCP/TLS/manifest + prod health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate inputs
        env:
          TAG: ${{ github.event.inputs.image_tag }}
          DIGEST: ${{ github.event.inputs.target_digest }}
        run: |
          set -Eeuo pipefail
          echo "${TAG}" | grep -Eq '^[0-9a-f]{40}$'
          echo "${DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts

      - name: Run read-only GHCR + health precheck on production host
        env:
          TAG: ${{ github.event.inputs.image_tag }}
          DIGEST: ${{ github.event.inputs.target_digest }}
        run: |
          set -Eeuo pipefail
          TAG_Q="$(printf '%q' "${TAG}")"
          DIGEST_Q="$(printf '%q' "${DIGEST}")"
          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "TAG=${TAG_Q} DIGEST=${DIGEST_Q} bash -s" <<'REMOTE'
          set -Eeuo pipefail
          log() { echo "[$(date -Is)] $*"; }
          FAIL=0
          log "=== CURRENT BACKEND IMAGE (baseline) ==="
          docker inspect sedi-backend --format '{{.Config.Image}}' || true
          log "=== LOCAL HEALTH ==="
          curl -fsS http://127.0.0.1:8000/health >/tmp/ghcr_precheck_health.json
          curl -fsS http://127.0.0.1:8000/healthz >/tmp/ghcr_precheck_healthz.json
          log "health=PASS"
          log "=== GHCR DNS ==="
          if getent hosts ghcr.io >/tmp/ghcr_dns.txt || host ghcr.io >/tmp/ghcr_dns.txt 2>/dev/null || nslookup ghcr.io >/tmp/ghcr_dns.txt 2>/dev/null; then
            cat /tmp/ghcr_dns.txt || true
            log "GHCR_DNS=PASS"
          else
            log "GHCR_DNS=FAIL"
            FAIL=1
          fi
          log "=== GHCR TCP/443 ==="
          if (command -v nc >/dev/null && nc -z -w 8 ghcr.io 443) || (timeout 8 bash -c 'echo >/dev/tcp/ghcr.io/443'); then
            log "GHCR_TCP443=PASS"
          else
            log "GHCR_TCP443=FAIL"
            FAIL=1
          fi
          log "=== GHCR TLS ==="
          if echo | timeout 20 openssl s_client -connect ghcr.io:443 -servername ghcr.io >/tmp/ghcr_tls.txt 2>&1; then
            grep -E 'Verify return code|Protocol|Cipher' /tmp/ghcr_tls.txt | head -20 || true
            if grep -q 'Verify return code: 0' /tmp/ghcr_tls.txt; then
              log "GHCR_TLS=PASS"
            else
              # Some hosts still establish TLS without full verify chain in s_client; require handshake completed
              if grep -qiE 'SSL-Session:|Cipher is' /tmp/ghcr_tls.txt; then
                log "GHCR_TLS=PASS_HANDSHAKE"
              else
                log "GHCR_TLS=FAIL"
                FAIL=1
              fi
            fi
          else
            log "GHCR_TLS=FAIL"
            FAIL=1
          fi
          log "=== GHCR MANIFEST REACHABILITY (HEAD, no docker pull) ==="
          MANIFEST_URL="https://ghcr.io/v2/javadmeighani-oss/sedi-backend/manifests/${TAG}"
          # Anonymous HEAD may 401/403; connectivity success = TCP+TLS response from registry (not timeout)
          set +e
          CURL_OUT="$(curl -sS -I -o /tmp/ghcr_manifest_headers.txt -w '%{http_code}|%{ssl_verify_result}|%{time_total}' --connect-timeout 15 --max-time 30 "${MANIFEST_URL}" 2>/tmp/ghcr_manifest_err.txt)"
          CURL_RC=$?
          set -e
          log "manifest_curl_rc=${CURL_RC} result=${CURL_OUT}"
          head -n 20 /tmp/ghcr_manifest_headers.txt || true
          if [ "${CURL_RC}" -ne 0 ]; then
            cat /tmp/ghcr_manifest_err.txt || true
            log "GHCR_MANIFEST=FAIL"
            FAIL=1
          else
            CODE="$(echo "${CURL_OUT}" | cut -d'|' -f1)"
            # 200/401/403/404 all prove registry reachable over TLS; timeout/000 do not
            if echo "${CODE}" | grep -Eq '^(200|401|403|404)$'; then
              log "GHCR_MANIFEST=PASS http=${CODE}"
            else
              log "GHCR_MANIFEST=FAIL http=${CODE}"
              FAIL=1
            fi
          fi
          log "=== DIGEST PROBE NOTE ==="
          log "target_tag=${TAG}"
          log "target_digest=${DIGEST}"
          log "NOTE=docker pull not executed in precheck"
          if [ "${FAIL}" -ne 0 ]; then
            log "GHCR_CONNECTIVITY=FAIL"
            exit 20
          fi
          log "GHCR_CONNECTIVITY=PASS"
          REMOTE

      - name: Sanitized chat-error extract (read-only, CHATLOG mode)
        if: ${{ github.event.inputs.chatlog_minutes != '0' && github.event.inputs.chatlog_minutes != '' }}
        env:
          SINCE: ${{ github.event.inputs.chatlog_minutes }}
        run: |
          set -Eeuo pipefail
          echo "${SINCE}" | grep -Eq '^[0-9]{1,4}$'
          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "SINCE_MIN=$(printf '%q' "${SINCE}") DEPLOY_PATH=$(printf '%q' "${{ secrets.SEDI_DEPLOY_PATH }}") bash -s" <<'REMOTE'
          set -uo pipefail
          log() { echo "[$(date -Is | cut -c1-19)] $*"; }
          LOG="$(docker logs sedi-backend --since "${SINCE_MIN}m" 2>&1 || true)"
          log "window_minutes=${SINCE_MIN} log_lines=$(printf '%s\n' "$LOG" | wc -l)"
          log "=== COUNTS ==="
          echo "brain_error_blocks=$(printf '%s\n' "$LOG" | grep -c '\[BRAIN ERROR\] Exception in process_message' || true)"
          echo "brain_gpt_failure=$(printf '%s\n' "$LOG" | grep -c 'BRAIN GPT_FAILURE' || true)"
          echo "http_5xx=$(printf '%s\n' "$LOG" | grep -cE '" 5[0-9][0-9] ' || true)"
          echo "tracebacks=$(printf '%s\n' "$LOG" | grep -c 'Traceback (most recent call last)' || true)"
          log "=== BRAIN ERROR exception types (class only) ==="
          printf '%s\n' "$LOG" | grep -oE '\[BRAIN ERROR\] Exception type: [A-Za-z0-9_.]+' | sed -E 's/.*type: //' | sort | uniq -c | sort -rn | head -10
          log "=== GPT failure classes (class only) ==="
          printf '%s\n' "$LOG" | grep -oE 'BRAIN GPT_FAILURE\] where=[A-Za-z0-9_.]+ error_type=[A-Za-z0-9_]+' | sed -E 's/BRAIN GPT_FAILURE\] //' | sort | uniq -c | sort -rn | head -10
          log "=== GPT failure provider message (OpenAI error text only; ids/keys masked; max 220 chars) ==="
          printf '%s\n' "$LOG" | grep -E 'BRAIN GPT_FAILURE' | sed -E 's/^.*error_type=([A-Za-z0-9_]+) message=/\1: /' | sed -E 's/(proj|org|req|key|sk)[-_][A-Za-z0-9_*-]+/\1_***/g' | cut -c1-220 | sort | uniq -c | sort -rn | head -5
          log "=== capacity gpt_call: successes vs errors in window (counts only) ==="
          echo "gpt_call_ok=$(printf '%s\n' "$LOG" | grep -E 'capacity event=gpt_call' | grep -c 'status=ok' || true)"
          echo "gpt_call_error=$(printf '%s\n' "$LOG" | grep -E 'capacity event=gpt_call' | grep -c 'status=error' || true)"
          log "=== capacity gpt_call outcomes (where/status/error_class only) ==="
          printf '%s\n' "$LOG" | grep -E 'capacity event=gpt_call' | sed -E 's/.*(where=[A-Za-z0-9_.]+).*(status=[a-z]+)(.*)/\1 \2\3/' | sed -E 's/duration_ms=[0-9]+//; s/model=[^ ]+//; s/  +/ /g' | cut -c1-120 | sort | uniq -c | sort -rn | head -12
          log "=== traceback project frames (file:line function; newest 30) ==="
          printf '%s\n' "$LOG" | grep -E '^[[:space:]]+File "[^"]*backend/app' | sed -E 's#^[[:space:]]+File "[^"]*(backend/app/[^"]*)", line ([0-9]+), in (.*)#\1:\2 \3#' | tail -n 30
          log "=== exception class names at traceback ends (class only) ==="
          printf '%s\n' "$LOG" | grep -E '^[A-Za-z_][A-Za-z0-9_.]*(Error|Exception|Warning)(:|$)' | sed -E 's/:.*//' | sort | uniq -c | sort -rn | head -10
          log "=== EGRESS DIAGNOSIS (read-only; no key sent; no IP printed) ==="
          echo "host_egress_country=$(curl -sS -m 10 https://ipinfo.io/country 2>/dev/null | tr -d '[:space:]' | cut -c1-4)"
          echo "host_egress_org=$(curl -sS -m 10 https://ipinfo.io/org 2>/dev/null | sed -E 's/^AS[0-9]+ //' | cut -c1-60)"
          EDGE="$(curl -sS -m 15 -w '\nHTTP=%{http_code}' https://api.openai.com/v1/models 2>&1 | tr -d '\n' | cut -c1-400 || true)"
          echo "host_openai_edge_http=$(printf '%s' "$EDGE" | grep -oE 'HTTP=[0-9]+' | tail -1)"
          echo "host_openai_edge_code=$(printf '%s' "$EDGE" | grep -oE "'?\"?code\"?'?: *\"?[a-z_]+" | head -1 | sed -E 's/.*: *"?//')"
          CEDGE="$(docker exec sedi-backend python -c 'exec("import urllib.request as u\ntry:\n u.urlopen(\"https://api.openai.com/v1/models\",timeout=15)\n print(\"container_openai_edge_http=200\")\nexcept Exception as e:\n print(\"container_openai_edge_http=%s\" % getattr(e,\"code\",type(e).__name__))\n print(\"container_openai_edge_body=%s\" % (getattr(e,\"read\",lambda:b\"\")() or b\"\")[:160].decode(\"utf8\",\"replace\").replace(chr(10),\" \"))")' 2>&1 | cut -c1-260 || true)"
          printf '%s\n' "$CEDGE"
          echo "container_proxy_env_names=$(docker exec sedi-backend sh -c 'env | grep -iE "^(http|https|all|no)_proxy=" | sed "s/=.*/=<set>/"' 2>/dev/null | tr '\n' ' ')"
          echo "container_openai_env_names=$(docker exec sedi-backend sh -c 'env | grep -E "^OPENAI_" | sed "s/=.*/=<set>/"' 2>/dev/null | tr '\n' ' ')"
          echo "host_network_links=$(ip -br link 2>/dev/null | awk '{print $1":"$2}' | tr '\n' ' ')"
          echo "container_started_at=$(docker inspect sedi-backend --format '{{.State.StartedAt}}' 2>/dev/null | cut -c1-19)"
          log "=== server compose keys of interest (names only, values masked) ==="
          grep -nEi "proxy|dns:|extra_hosts|network_mode|OPENAI|HTTPS?_" "${DEPLOY_PATH}/compose.production.yml" 2>/dev/null | sed -E 's/(:|=) *.*/\1 <masked>/' | head -12
          log "EXTRACT=DONE (read-only; class names, counts and file:line only)"
          REMOTE
