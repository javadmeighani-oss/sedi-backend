# Read-only production-host GHCR connectivity precheck (workflow_dispatch only).
# Gate: PD-I5-V1-SOURCE-FORMAT-RESILIENCE-DEPLOY-RETRY-01
# No pull/recreate/deploy. No TLS bypass.
name: Prod GHCR Connectivity Precheck

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "40-char lowercase commit SHA image tag to probe"
        required: true
      target_digest:
        description: "Expected digest sha256:<64 hex> for manifest probe"
        required: true
      cleanup_mode:
        description: "NONE (default) | DRY (list only) | APPLY (remove old sedi-backend images + stale transfer archive)"
        required: false
        default: "NONE"
      keep_tags:
        description: "Comma-separated 40-hex image tags to keep (running + rollback). Required for DRY/APPLY."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sedi-production-backend-operation
  cancel-in-progress: false

jobs:
  ghcr-precheck:
    name: GHCR DNS/TCP/TLS/manifest + prod health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate inputs
        env:
          TAG: ${{ github.event.inputs.image_tag }}
          DIGEST: ${{ github.event.inputs.target_digest }}
        run: |
          set -Eeuo pipefail
          echo "${TAG}" | grep -Eq '^[0-9a-f]{40}$'
          echo "${DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts

      - name: Run read-only GHCR + health precheck on production host
        env:
          TAG: ${{ github.event.inputs.image_tag }}
          DIGEST: ${{ github.event.inputs.target_digest }}
        run: |
          set -Eeuo pipefail
          TAG_Q="$(printf '%q' "${TAG}")"
          DIGEST_Q="$(printf '%q' "${DIGEST}")"
          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "TAG=${TAG_Q} DIGEST=${DIGEST_Q} bash -s" <<'REMOTE'
          set -Eeuo pipefail
          log() { echo "[$(date -Is)] $*"; }
          FAIL=0
          log "=== CURRENT BACKEND IMAGE (baseline) ==="
          docker inspect sedi-backend --format '{{.Config.Image}}' || true
          log "=== LOCAL HEALTH ==="
          curl -fsS http://127.0.0.1:8000/health >/tmp/ghcr_precheck_health.json
          curl -fsS http://127.0.0.1:8000/healthz >/tmp/ghcr_precheck_healthz.json
          log "health=PASS"
          log "=== GHCR DNS ==="
          if getent hosts ghcr.io >/tmp/ghcr_dns.txt || host ghcr.io >/tmp/ghcr_dns.txt 2>/dev/null || nslookup ghcr.io >/tmp/ghcr_dns.txt 2>/dev/null; then
            cat /tmp/ghcr_dns.txt || true
            log "GHCR_DNS=PASS"
          else
            log "GHCR_DNS=FAIL"
            FAIL=1
          fi
          log "=== GHCR TCP/443 ==="
          if (command -v nc >/dev/null && nc -z -w 8 ghcr.io 443) || (timeout 8 bash -c 'echo >/dev/tcp/ghcr.io/443'); then
            log "GHCR_TCP443=PASS"
          else
            log "GHCR_TCP443=FAIL"
            FAIL=1
          fi
          log "=== GHCR TLS ==="
          if echo | timeout 20 openssl s_client -connect ghcr.io:443 -servername ghcr.io >/tmp/ghcr_tls.txt 2>&1; then
            grep -E 'Verify return code|Protocol|Cipher' /tmp/ghcr_tls.txt | head -20 || true
            if grep -q 'Verify return code: 0' /tmp/ghcr_tls.txt; then
              log "GHCR_TLS=PASS"
            else
              # Some hosts still establish TLS without full verify chain in s_client; require handshake completed
              if grep -qiE 'SSL-Session:|Cipher is' /tmp/ghcr_tls.txt; then
                log "GHCR_TLS=PASS_HANDSHAKE"
              else
                log "GHCR_TLS=FAIL"
                FAIL=1
              fi
            fi
          else
            log "GHCR_TLS=FAIL"
            FAIL=1
          fi
          log "=== GHCR MANIFEST REACHABILITY (HEAD, no docker pull) ==="
          MANIFEST_URL="https://ghcr.io/v2/javadmeighani-oss/sedi-backend/manifests/${TAG}"
          # Anonymous HEAD may 401/403; connectivity success = TCP+TLS response from registry (not timeout)
          set +e
          CURL_OUT="$(curl -sS -I -o /tmp/ghcr_manifest_headers.txt -w '%{http_code}|%{ssl_verify_result}|%{time_total}' --connect-timeout 15 --max-time 30 "${MANIFEST_URL}" 2>/tmp/ghcr_manifest_err.txt)"
          CURL_RC=$?
          set -e
          log "manifest_curl_rc=${CURL_RC} result=${CURL_OUT}"
          head -n 20 /tmp/ghcr_manifest_headers.txt || true
          if [ "${CURL_RC}" -ne 0 ]; then
            cat /tmp/ghcr_manifest_err.txt || true
            log "GHCR_MANIFEST=FAIL"
            FAIL=1
          else
            CODE="$(echo "${CURL_OUT}" | cut -d'|' -f1)"
            # 200/401/403/404 all prove registry reachable over TLS; timeout/000 do not
            if echo "${CODE}" | grep -Eq '^(200|401|403|404)$'; then
              log "GHCR_MANIFEST=PASS http=${CODE}"
            else
              log "GHCR_MANIFEST=FAIL http=${CODE}"
              FAIL=1
            fi
          fi
          log "=== DIGEST PROBE NOTE ==="
          log "target_tag=${TAG}"
          log "target_digest=${DIGEST}"
          log "NOTE=docker pull not executed in precheck"
          if [ "${FAIL}" -ne 0 ]; then
            log "GHCR_CONNECTIVITY=FAIL"
            exit 20
          fi
          log "GHCR_CONNECTIVITY=PASS"
          REMOTE

      # Stage 05 / DEBT-020 diagnosis: READ-ONLY disk inventory (no delete, no docker prune/pull/rm).
      - name: Read-only disk inventory on production host
        run: |
          set -Eeuo pipefail
          DP="$(printf '%q' "${{ secrets.SEDI_DEPLOY_PATH }}")"
          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "DEPLOY_PATH=${DP} bash -s" <<'REMOTE'
          set -uo pipefail
          log() { echo "[$(date -Is)] $*"; }
          log "=== DF (blocks / inodes) ==="
          df -h / "${DEPLOY_PATH}" 2>/dev/null || df -h /
          df -i / 2>/dev/null | tail -n 2
          log "=== DOCKER SYSTEM DF ==="
          docker system df 2>&1 | head -n 12
          log "=== DOCKER IMAGES (repo:tag size created) ==="
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}} {{.CreatedSince}}' 2>&1 | head -n 40
          log "=== DOCKER CONTAINERS (name image status) ==="
          docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}' 2>&1 | head -n 30
          log "=== DANGLING IMAGES / STOPPED CONTAINERS (count) ==="
          echo "dangling_images=$(docker images -f dangling=true -q 2>/dev/null | wc -l)"
          echo "stopped_containers=$(docker ps -a -f status=exited -q 2>/dev/null | wc -l)"
          log "=== DEPLOY PATH SUBDIR SIZES ==="
          (cd "${DEPLOY_PATH}" && du -sh ./* 2>/dev/null | sort -h | tail -n 15) || true
          log "=== TRANSFER ARCHIVES (tmp_secure_transfer) ==="
          ls -laS "${DEPLOY_PATH}/tmp_secure_transfer" 2>/dev/null | head -n 15 || echo "none"
          log "=== POSTGRES BACKUPS (newest 15 by size) ==="
          ls -laS "${DEPLOY_PATH}/backups/postgres" 2>/dev/null | head -n 15 || echo "none"
          echo "backup_count=$(ls "${DEPLOY_PATH}/backups/postgres" 2>/dev/null | wc -l)"
          log "=== TOP-LEVEL SIZES (bounded) ==="
          timeout 90 du -xhd1 /var /opt /home /tmp /root 2>/dev/null | sort -h | tail -n 12 || true
          log "=== DOCKER LOG / JOURNAL USAGE ==="
          journalctl --disk-usage 2>/dev/null || true
          timeout 30 du -sh /var/lib/docker/containers 2>/dev/null || true
          log "DISK_INVENTORY=DONE (read-only; nothing deleted)"
          REMOTE

      # Stage 05 / DEBT-020: guarded cleanup of old backend images. DRY lists only; APPLY removes.
      # Never uses -f / system prune; never touches containers, volumes, DB, backups, compose or secrets.
      - name: Guarded cleanup of old sedi-backend images (DRY/APPLY only)
        if: ${{ github.event.inputs.cleanup_mode == 'DRY' || github.event.inputs.cleanup_mode == 'APPLY' }}
        env:
          MODE: ${{ github.event.inputs.cleanup_mode }}
          KEEP: ${{ github.event.inputs.keep_tags }}
        run: |
          set -Eeuo pipefail
          echo "${KEEP}" | grep -Eq '^[0-9a-f]{40}(,[0-9a-f]{40})+$'
          DP="$(printf '%q' "${{ secrets.SEDI_DEPLOY_PATH }}")"
          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "DEPLOY_PATH=${DP} MODE=$(printf '%q' "${MODE}") KEEP=$(printf '%q' "${KEEP}") bash -s" <<'REMOTE'
          set -Eeuo pipefail
          log() { echo "[$(date -Is)] $*"; }
          REPO="ghcr.io/javadmeighani-oss/sedi-backend"
          in_keep() { case ",${KEEP}," in *",$1,"*) return 0 ;; *) return 1 ;; esac; }
          healthy() {
            curl -fsS http://127.0.0.1:8000/healthz >/dev/null \
              && [ "$(docker inspect -f '{{.State.Health.Status}}' sedi-postgres)" = "healthy" ] \
              && [ "$(docker inspect -f '{{.State.Health.Status}}' sedi-redis)" = "healthy" ] \
              && [ "$(docker inspect -f '{{.State.Running}}' sedi-backend)" = "true" ]
          }
          log "=== PRE: health + disk ==="
          healthy || { log "ABORT: platform not healthy before cleanup"; exit 30; }
          df -h / | tail -n 1
          # Images referenced by ANY container (running or stopped) are never candidates.
          IN_USE="$(for c in $(docker ps -aq); do docker inspect -f '{{.Config.Image}}' "$c"; done | sort -u)"
          RUNNING_TAG="$(docker inspect -f '{{.Config.Image}}' sedi-backend | sed 's/.*://')"
          in_keep "${RUNNING_TAG}" || { log "ABORT: running tag ${RUNNING_TAG} is not in keep_tags"; exit 31; }
          CANDIDATES=()
          while read -r tag; do
            [ -z "${tag}" ] && continue
            echo "${tag}" | grep -Eq '^[0-9a-f]{40}$' || continue
            in_keep "${tag}" && continue
            echo "${IN_USE}" | grep -Fxq "${REPO}:${tag}" && continue
            CANDIDATES+=("${tag}")
          done < <(docker images "${REPO}" --format '{{.Tag}}')
          log "keep_tags=${KEEP}"
          log "candidates=${#CANDIDATES[@]}"
          [ "${#CANDIDATES[@]}" -le 120 ] || { log "ABORT: unexpectedly many candidates"; exit 32; }
          for t in "${CANDIDATES[@]}"; do log "CANDIDATE ${REPO}:${t}"; done
          STALE_ARCHIVES="$(ls "${DEPLOY_PATH}/tmp_secure_transfer" 2>/dev/null | grep -E '^sedi-backend-[0-9a-f]{40}[.]tar$' || true)"
          log "stale_archives=$(echo "${STALE_ARCHIVES}" | grep -c . || true)"
          if [ "${MODE}" = "DRY" ]; then log "DRY_RUN_DONE (nothing removed)"; exit 0; fi
          log "=== APPLY ==="
          if pgrep -f "docker load|scp " >/dev/null 2>&1; then log "ABORT: a transfer/load is running"; exit 33; fi
          for t in "${CANDIDATES[@]}"; do
            if docker image rm "${REPO}:${t}" >/dev/null 2>&1; then log "REMOVED ${REPO}:${t}"; else log "SKIP (in use or error) ${REPO}:${t}"; fi
            healthy || { log "ABORT: health check failed during cleanup"; exit 34; }
          done
          docker image prune -f >/dev/null 2>&1 && log "PRUNED dangling images (in-use images are never removed)"
          for f in ${STALE_ARCHIVES}; do rm -- "${DEPLOY_PATH}/tmp_secure_transfer/${f}" && log "REMOVED archive ${f}"; done
          log "=== POST: health + disk ==="
          if healthy; then log "PLATFORM_HEALTHY=YES"; else log "PLATFORM_HEALTHY=NO"; exit 35; fi
          df -h / | tail -n 1
          docker system df | head -n 3
          log "CLEANUP=DONE"
          REMOTE

      # Stage 05 / DEBT-020: READ-ONLY /var/log inventory (sizes and names only; never prints file contents).
      - name: Read-only /var/log inventory (LOGS mode)
        if: ${{ github.event.inputs.cleanup_mode == 'LOGS' }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "bash -s" <<'REMOTE'
          set -uo pipefail
          log() { echo "[$(date -Is)] $*"; }
          log "=== /var/log TOP-LEVEL SIZES ==="
          timeout 60 du -xh --max-depth=1 /var/log 2>/dev/null | sort -h | tail -n 15
          log "=== LARGEST FILES under /var/log (name, size, mtime) ==="
          timeout 60 find /var/log -xdev -type f -size +50M -printf '%s\t%TY-%Tm-%Td\t%p\n' 2>/dev/null | sort -rn | head -n 15 | awk -F'\t' '{printf "%.0fMB\t%s\t%s\n", $1/1048576, $2, $3}'
          log "=== LOGROTATE / JOURNAL ==="
          ls /etc/logrotate.d 2>/dev/null | head -n 30 | tr '\n' ' '; echo
          journalctl --disk-usage 2>/dev/null || true
          log "=== DF ==="
          df -h / | tail -n 1
          log "LOGS_INVENTORY=DONE (read-only; nothing deleted; no file contents printed)"
          REMOTE
