name: Build Flutter Frontend

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'frontend/**'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    # Android builds on push use android_release.yml; this job runs only when manually triggered
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Get dependencies
        working-directory: ./frontend
        run: flutter pub get
        # Uses pubspec.lock when present; deterministic

      - name: Verify Flutter installation
        working-directory: ./frontend
        run: flutter doctor -v

      - name: Analyze code
        working-directory: ./frontend
        run: flutter analyze || true

      - name: Clean build
        working-directory: ./frontend
        run: flutter clean

      - name: Provide google-services.json for CI (stub if missing)
        run: |
          GS=frontend/android/app/google-services.json
          if [ ! -f "$GS" ]; then
            echo "Creating minimal google-services.json stub for CI (FCM disabled at runtime)"
            mkdir -p "$(dirname "$GS")"
            cat > "$GS" << 'EOF'
          {
            "project_info": {"project_number": "000000000000", "project_id": "sedi-ci-dummy", "storage_bucket": "sedi-ci-dummy.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000000000", "android_client_info": {"package_name": "com.sedi.app"}},
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyDummyKeyForCIBuildOnly0000000000"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }]
          }
          EOF
          fi

      - name: Build APK with retry
        working-directory: ./frontend
        run: |
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Build attempt $attempt of $max_attempts"
            if flutter build apk --release; then
              echo "Build succeeded"
              exit 0
            else
              if [ $attempt -lt $max_attempts ]; then
                echo "Build failed, retrying in 10 seconds..."
                sleep 10
              fi
              attempt=$((attempt + 1))
            fi
          done
          echo "Build failed after $max_attempts attempts"
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sedi-android-apk-${{ github.sha }}
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
  
  build-ios:
    name: Build iOS (if needed)
    runs-on: macos-latest
    if: false  # Disable by default, enable when iOS build is needed
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Get dependencies
        working-directory: ./frontend
        run: flutter pub get
      
      - name: Build iOS
        working-directory: ./frontend
        run: flutter build ios --release --no-codesign
      
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: sedi-ios-build
          path: frontend/build/ios
          retention-days: 30

