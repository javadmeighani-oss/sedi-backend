name: Build Flutter Frontend

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'frontend/**'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Get dependencies
        working-directory: ./frontend
        run: flutter pub get
      
      - name: Verify Flutter installation
        working-directory: ./frontend
        run: flutter doctor -v
      
      - name: Analyze code
        working-directory: ./frontend
        run: flutter analyze || true  # Continue even if there are warnings
      
      - name: Clean build
        working-directory: ./frontend
        run: flutter clean
      
      - name: Build APK with retry
        working-directory: ./frontend
        run: |
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Build attempt $attempt of $max_attempts"
            if flutter build apk --release; then
              echo "Build succeeded"
              exit 0
            else
              if [ $attempt -lt $max_attempts ]; then
                echo "Build failed, retrying in 10 seconds..."
                sleep 10
              fi
              attempt=$((attempt + 1))
            fi
          done
          echo "Build failed after $max_attempts attempts"
          exit 1
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sedi-android-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
  
  build-ios:
    name: Build iOS (if needed)
    runs-on: macos-latest
    if: false  # Disable by default, enable when iOS build is needed
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Get dependencies
        working-directory: ./frontend
        run: flutter pub get
      
      - name: Build iOS
        working-directory: ./frontend
        run: flutter build ios --release --no-codesign
      
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: sedi-ios-build
          path: frontend/build/ios
          retention-days: 30

