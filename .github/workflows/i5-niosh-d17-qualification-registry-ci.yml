# NIOSH D17 qualification + candidate registry CI
name: I5 NIOSH D17 Qualification Registry CI

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/config/i5/multisource_activation_allowlist_v1.yaml"
      - "backend/config/i5/candidate_qualification_registry_v1.yaml"
      - "backend/config/i5/autonomous_discovery_seed_catalog_v1.yaml"
      - "backend/config/i5/wave02_candidate_source_gaps_v1.yaml"
      - "backend/app/services/i5/candidate_qualification_registry.py"
      - "backend/app/services/i5/autonomous_source_governance.py"
      - "backend/app/services/i5/governed_specialized_entity_eligibility.py"
      - "backend/app/services/i5/conceptual_extraction.py"
      - "backend/app/services/i5/wave02_coverage_identity.py"
      - "backend/tests/test_i5_niosh_d17_qualification_registry.py"
      - "backend/tests/test_i5_autonomous_source_governance_foundation.py"
      - "backend/tests/test_i5_coverage_closure_autonomous_governance.py"
      - "backend/tests/test_i5_d08_nidcd_extraction_content_quality.py"
      - "backend/tests/test_i5_qualified_source_activation_wave01.py"
      - "backend/tests/test_i5_specialized_d18_d19_serving_eligibility.py"
      - "backend/tests/test_i5_wave02_governed_knowledge_expansion.py"
      - "backend/tests/test_i5_source_format_resilience.py"
      - "backend/app/services/i5/weekly_orchestrator.py"
      - ".github/workflows/i5-niosh-d17-qualification-registry-ci.yml"

permissions:
  contents: read

concurrency:
  # Rotate group to escape ghost-queued push run 32983821683 on prior group key.
  group: i5-niosh-d17-ci-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  niosh-d17-ci:
    name: NIOSH D17 + candidate registry offline suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: niosh-d17-placeholder-not-used

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Run focused suite
        run: |
          python -B -m pytest \
            --noconftest \
            -p no:cacheprovider \
            -q --tb=short \
            backend/tests/test_i5_autonomous_source_governance_foundation.py \
            backend/tests/test_i5_coverage_closure_autonomous_governance.py \
            backend/tests/test_i5_d08_nidcd_extraction_content_quality.py \
            backend/tests/test_i5_qualified_source_activation_wave01.py \
            backend/tests/test_i5_niosh_d17_qualification_registry.py \
            backend/tests/test_i5_specialized_d18_d19_serving_eligibility.py \
            backend/tests/test_i5_wave02_governed_knowledge_expansion.py \
            backend/tests/test_i5_wave01_governed_knowledge_expansion.py \
            backend/tests/test_section30_i5_multisource_weekly_activation.py::test_multisource_allowlist_publisher_diversity_and_exact_urls \
            backend/tests/test_i5_source_format_resilience.py
