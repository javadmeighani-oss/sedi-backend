# GATE=SEDI-V1-PROD-MIGRATE-087-TO-089-I5-DIRECTORY
# Digest-pinned one-off alembic upgrade 087→089 (additive nullable/defaulted columns on iran_* tables)
# via sedi_migration_admin DDL. Image = main merge commit of PR #61.
# NO backend deploy/restart. NO stamp/downgrade. NO ownership/GRANT mutation.
# Secure-transfer mirrors 070→081; DDL auth mirrors ops/db03/db_prod_migrate_070_to_081_remote.sh.
name: DB-PROD Migrate 087 to 089

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "PREFLIGHT_087_089 | MIGRATE_087_TO_089 | CERTIFY_IMAGE_087_089"
        required: true
      migration_image_sha:
        description: "Must be 0ef5fff0201f209fa799fab8098eff1844ed772f"
        required: true
      migration_image_digest:
        description: "Must be sha256:e43b18ff92554875d62d359c99ae609cfa4cc25f9444bafecd4696ea18d8dbff"
        required: true
      expected_before_revision:
        description: "Must be 087_a4_notification_inbox_visibility"
        required: true
        default: 087_a4_notification_inbox_visibility

concurrency:
  group: sedi-production-backend-operation
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: ghcr.io/javadmeighani-oss/sedi-backend
  AUTHORIZED_SHA: 0ef5fff0201f209fa799fab8098eff1844ed772f
  AUTHORIZED_DIGEST: sha256:e43b18ff92554875d62d359c99ae609cfa4cc25f9444bafecd4696ea18d8dbff
  TARGET_REV: 089_i5_directory_doctor_feedback
  EXPECTED_BEFORE: 087_a4_notification_inbox_visibility

jobs:
  certify-image:
    name: Revalidate certified migration image
    if: github.event.inputs.confirmation == 'CERTIFY_IMAGE_087_089'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate inputs
        env:
          CONF: ${{ github.event.inputs.confirmation }}
          SHA: ${{ github.event.inputs.migration_image_sha }}
          DIGEST: ${{ github.event.inputs.migration_image_digest }}
          BEFORE: ${{ github.event.inputs.expected_before_revision }}
        run: |
          set -Eeuo pipefail
          [ "${CONF}" = "CERTIFY_IMAGE_087_089" ]
          [ "${SHA}" = "${AUTHORIZED_SHA}" ]
          [ "${DIGEST}" = "${AUTHORIZED_DIGEST}" ]
          [ "${BEFORE}" = "${EXPECTED_BEFORE}" ]

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull digest and prove alembic/migrations
        env:
          SHA: ${{ github.event.inputs.migration_image_sha }}
          DIGEST: ${{ github.event.inputs.migration_image_digest }}
        run: |
          set -Eeuo pipefail
          DIGEST_REF="${IMAGE_NAME}@${DIGEST}"
          TAG_REF="${IMAGE_NAME}:${SHA}"
          docker pull "${DIGEST_REF}"
          docker tag "${DIGEST_REF}" "${TAG_REF}"
          PULLED="$(docker image inspect "${TAG_REF}" --format '{{range .RepoDigests}}{{println .}}{{end}}')"
          echo "${PULLED}" | grep -Fq "${DIGEST}"
          REV="$(docker image inspect "${TAG_REF}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          echo "OCI_REVISION=${REV}"
          [ "${REV}" = "${SHA}" ]
          HEADS_OUT="$(docker run --rm --entrypoint python "${TAG_REF}" -m alembic -c backend/alembic.ini heads)"
          echo "ALEMBIC_HEADS_OUT=${HEADS_OUT}"
          echo "${HEADS_OUT}" | grep -Fq "089_i5_directory_doctor_feedback"
          CHAIN_OUT="$(docker run --rm --entrypoint python "${TAG_REF}" -c "from alembic.config import Config; from alembic.script import ScriptDirectory; s=ScriptDirectory.from_config(Config('backend/alembic.ini')); assert list(s.get_heads())==['089_i5_directory_doctor_feedback']; assert s.get_revision('088_i5_directory_country').down_revision=='087_a4_notification_inbox_visibility'; assert s.get_revision('089_i5_directory_doctor_feedback').down_revision=='088_i5_directory_country'; print('CHAIN_OK')")"
          echo "${CHAIN_OUT}"
          echo "${CHAIN_OUT}" | grep -Fq "CHAIN_OK"
          for f in \
            088_i5_directory_country.py \
            089_i5_directory_doctor_feedback.py
          do
            docker run --rm --entrypoint test "${TAG_REF}" -f "/app/backend/alembic/versions/${f}"
            echo "FILE_OK=${f}"
          done
          echo "CERTIFIED_IMAGE_REVALIDATED=YES"
          echo "IMAGE_MANIFEST_DIGEST_MATCH=YES"
          echo "IMAGE_OCI_REVISION_MATCH=YES"
          echo "IMAGE_ALEMBIC_HEAD=089_i5_directory_doctor_feedback"
          echo "IMAGE_MIGRATION_CHAIN_PRESENT=YES"

  preflight:
    name: Read-only 087→089 preflight
    if: github.event.inputs.confirmation == 'PREFLIGHT_087_089'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate inputs
        env:
          CONF: ${{ github.event.inputs.confirmation }}
          SHA: ${{ github.event.inputs.migration_image_sha }}
          DIGEST: ${{ github.event.inputs.migration_image_digest }}
          BEFORE: ${{ github.event.inputs.expected_before_revision }}
        run: |
          set -Eeuo pipefail
          [ "${CONF}" = "PREFLIGHT_087_089" ]
          [ "${SHA}" = "${AUTHORIZED_SHA}" ]
          [ "${DIGEST}" = "${AUTHORIZED_DIGEST}" ]
          [ "${BEFORE}" = "${EXPECTED_BEFORE}" ]

      - name: SSH preflight
        env:
          BEFORE: ${{ github.event.inputs.expected_before_revision }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
          DEPLOY_PATH_Q="$(printf '%q' "${{ secrets.SEDI_DEPLOY_PATH }}")"
          BEFORE_Q="$(printf '%q' "${BEFORE}")"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "DEPLOY_PATH=${DEPLOY_PATH_Q} EXPECTED_BEFORE=${BEFORE_Q} bash -s" \
            <<'REMOTE' | tee /tmp/mig087089_preflight.log
          set -Eeuo pipefail
          log() { echo "[$(date -Is)] $*"; }
          summary() { echo "MIG087089_SUMMARY|$1|$2"; }
          cd "${DEPLOY_PATH}"
          PU=$(docker exec sedi-postgres printenv POSTGRES_USER)
          PD=$(docker exec sedi-postgres printenv POSTGRES_DB)
          docker exec sedi-postgres pg_isready -U "${PU}" -d "${PD}"
          psql_ro() { docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "$1" | tr -d '\r'; }
          ALEMBIC_COUNT="$(psql_ro "SELECT COUNT(*) FROM alembic_version;")"
          ALEMBIC_REV="$(psql_ro "SELECT version_num FROM alembic_version;")"
          summary "alembic_count" "${ALEMBIC_COUNT}"
          summary "alembic_revision" "${ALEMBIC_REV}"
          [ "${ALEMBIC_COUNT}" = "1" ] || exit 4
          [ "${ALEMBIC_REV}" = "${EXPECTED_BEFORE}" ] || exit 5
          summary "postgres_version" "$(psql_ro "SHOW server_version;")"
          summary "pgvector_version" "$(psql_ro "SELECT extversion FROM pg_extension WHERE extname='vector';")"
          summary "db_name" "${PD}"
          ROLES_ENV="${DEPLOY_PATH}/secrets/sedi-db-roles.env"
          summary "roles_env_present" "$([ -f "${ROLES_ENV}" ] && echo YES || echo NO)"
          summary "migration_admin_key_present" "$(grep -Eq '^SEDI_MIGRATION_ADMIN_PASSWORD=.+' "${ROLES_ENV}" 2>/dev/null && echo YES || echo NO)"
          summary "owner_users" "$(psql_ro "SELECT tableowner FROM pg_tables WHERE schemaname='public' AND tablename='users';")"
          summary "owner_otp_codes" "$(psql_ro "SELECT tableowner FROM pg_tables WHERE schemaname='public' AND tablename='otp_codes';")"
          summary "owner_devices" "$(psql_ro "SELECT tableowner FROM pg_tables WHERE schemaname='public' AND tablename='devices';")"
          summary "role_migration_admin" "$(psql_ro "SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_roles WHERE rolname='sedi_migration_admin' AND rolcanlogin) THEN 'YES' ELSE 'NO' END")"
          RUNNING="$(docker inspect sedi-backend --format '{{.Config.Image}}')"
          REV="$(docker image inspect "$(docker inspect sedi-backend --format '{{.Image}}')" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          summary "running_image" "${RUNNING}"
          summary "running_revision" "${REV}"
          curl -fsS http://127.0.0.1:8000/healthz
          echo
          curl -fsS https://api.sedi-ai.com/healthz
          echo
          for q in \
            "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='iran_doctors' AND column_name='country') THEN 'YES' ELSE 'NO' END" \
            "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='iran_laboratories' AND column_name='country') THEN 'YES' ELSE 'NO' END" \
            "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='iran_hospitals' AND column_name='country') THEN 'YES' ELSE 'NO' END" \
            "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='iran_doctors' AND column_name='rating_avg') THEN 'YES' ELSE 'NO' END"
          do
            echo "SCHEMA_PROBE=$(psql_ro "${q}")"
          done
          log "PREFLIGHT_087_089_PASS"
          REMOTE
          grep -Fq 'PREFLIGHT_087_089_PASS' /tmp/mig087089_preflight.log
          grep -Fq 'MIG087089_SUMMARY|alembic_revision|087_a4_notification_inbox_visibility' /tmp/mig087089_preflight.log

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mig087089-preflight
          path: /tmp/mig087089_preflight.log
          retention-days: 30

  migrate:
    name: Digest-pinned alembic upgrade to 089
    if: github.event.inputs.confirmation == 'MIGRATE_087_TO_089'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate inputs
        env:
          CONF: ${{ github.event.inputs.confirmation }}
          SHA: ${{ github.event.inputs.migration_image_sha }}
          DIGEST: ${{ github.event.inputs.migration_image_digest }}
          BEFORE: ${{ github.event.inputs.expected_before_revision }}
        run: |
          set -Eeuo pipefail
          [ "${CONF}" = "MIGRATE_087_TO_089" ]
          [ "${SHA}" = "${AUTHORIZED_SHA}" ]
          [ "${DIGEST}" = "${AUTHORIZED_DIGEST}" ]
          [ "${BEFORE}" = "${EXPECTED_BEFORE}" ]

      - name: Log in to GHCR (runner only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull certified digest and save archive
        id: pull_save
        env:
          SHA: ${{ github.event.inputs.migration_image_sha }}
          DIGEST: ${{ github.event.inputs.migration_image_digest }}
        run: |
          set -Eeuo pipefail
          DIGEST_REF="${IMAGE_NAME}@${DIGEST}"
          TAG_REF="${IMAGE_NAME}:${SHA}"
          docker pull "${DIGEST_REF}"
          docker tag "${DIGEST_REF}" "${TAG_REF}"
          PULLED="$(docker image inspect "${TAG_REF}" --format '{{range .RepoDigests}}{{println .}}{{end}}')"
          echo "${PULLED}" | grep -Fq "${DIGEST}"
          REV="$(docker image inspect "${TAG_REF}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          echo "OCI_REVISION=${REV}"
          [ "${REV}" = "${SHA}" ]
          HEADS="$(docker run --rm --entrypoint python "${TAG_REF}" -m alembic -c backend/alembic.ini heads)"
          echo "ALEMBIC_HEADS_OUT=${HEADS}"
          echo "${HEADS}" | grep -Fq "089_i5_directory_doctor_feedback"
          ROOTFS_JSON="$(docker image inspect "${TAG_REF}" --format '{{json .RootFS.Layers}}')"
          ROOTFS_SHA="$(printf '%s' "${ROOTFS_JSON}" | sha256sum | awk '{print $1}')"
          ARCHIVE="/tmp/sedi-backend-mig-${SHA}.tar"
          docker save -o "${ARCHIVE}" "${TAG_REF}"
          ARCHIVE_SHA="$(sha256sum "${ARCHIVE}" | awk '{print $1}')"
          echo "archive_path=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=${ARCHIVE_SHA}" >> "$GITHUB_OUTPUT"
          echo "rootfs_sha256=${ROOTFS_SHA}" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts

      - name: Transfer image archive
        env:
          SHA: ${{ github.event.inputs.migration_image_sha }}
          ARCHIVE_PATH: ${{ steps.pull_save.outputs.archive_path }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/tmp_secure_transfer_mig087089"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            "${ARCHIVE_PATH}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/sedi-backend-${SHA}.tar"

      - name: Backup + load archive + alembic upgrade 089
        env:
          SHA: ${{ github.event.inputs.migration_image_sha }}
          DIGEST: ${{ github.event.inputs.migration_image_digest }}
          BEFORE: ${{ github.event.inputs.expected_before_revision }}
          ARCHIVE_SHA: ${{ steps.pull_save.outputs.archive_sha256 }}
          ROOTFS_SHA: ${{ steps.pull_save.outputs.rootfs_sha256 }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH_Q="$(printf '%q' "${{ secrets.SEDI_DEPLOY_PATH }}")"
          BEFORE_Q="$(printf '%q' "${BEFORE}")"
          DIGEST_Q="$(printf '%q' "${DIGEST}")"
          SHA_Q="$(printf '%q' "${SHA}")"
          TARGET_Q="$(printf '%q' "${TARGET_REV}")"
          IMAGE_NAME_Q="$(printf '%q' "${IMAGE_NAME}")"
          ARCHIVE_SHA_Q="$(printf '%q' "${ARCHIVE_SHA}")"
          ROOTFS_SHA_Q="$(printf '%q' "${ROOTFS_SHA}")"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "DEPLOY_PATH=${DEPLOY_PATH_Q} EXPECTED_BEFORE=${BEFORE_Q} MIGRATION_DIGEST=${DIGEST_Q} MIGRATION_SHA=${SHA_Q} TARGET_REV=${TARGET_Q} IMAGE_NAME=${IMAGE_NAME_Q} ARCHIVE_SHA256=${ARCHIVE_SHA_Q} RUNNER_ROOTFS_SHA256=${ROOTFS_SHA_Q} bash -s" \
            <<'REMOTE' | tee /tmp/mig087089_apply.log
          set -Eeuo pipefail
          log() { echo "[$(date -Is)] $*"; }
          summary() { echo "MIG087089_SUMMARY|$1|$2"; }
          ENV_FILE="/etc/sedi/sedi-backend.env"
          REMOTE_DIR="${DEPLOY_PATH}/tmp_secure_transfer_mig087089"
          ARCHIVE="${REMOTE_DIR}/sedi-backend-${MIGRATION_SHA}.tar"
          TAG_REF="${IMAGE_NAME}:${MIGRATION_SHA}"
          cd "${DEPLOY_PATH}"
          PU=$(docker exec sedi-postgres printenv POSTGRES_USER)
          PD=$(docker exec sedi-postgres printenv POSTGRES_DB)
          docker exec sedi-postgres pg_isready -U "${PU}" -d "${PD}"
          [ -f "${ENV_FILE}" ] || { log "missing env"; exit 1; }
          if grep -E "^TEST_DATABASE_URL=.+$" "${ENV_FILE}" >/dev/null; then
            log "TEST_DATABASE_URL forbidden"; exit 3
          fi
          PRE_RESTARTS="$(docker inspect sedi-backend --format '{{.RestartCount}}')"
          PRE_ID="$(docker inspect sedi-backend --format '{{.Id}}')"
          PRE_IMAGE="$(docker inspect sedi-backend --format '{{.Config.Image}}')"
          summary "pre_running_image" "${PRE_IMAGE}"
          summary "pre_container_id" "${PRE_ID}"
          summary "pre_restart_count" "${PRE_RESTARTS}"

          ALEMBIC_COUNT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM alembic_version;")"
          ALEMBIC_BEFORE="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT version_num FROM alembic_version;")"
          summary "pre_migration_revision" "${ALEMBIC_BEFORE}"
          [ "${ALEMBIC_COUNT}" = "1" ] && [ "${ALEMBIC_BEFORE}" = "${EXPECTED_BEFORE}" ] || {
            log "alembic precheck fail count=${ALEMBIC_COUNT} rev=${ALEMBIC_BEFORE}"; exit 5; }

          for q in \
            "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='iran_doctors' AND column_name='country') THEN 'YES' ELSE 'NO' END" \
            "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='iran_laboratories' AND column_name='country') THEN 'YES' ELSE 'NO' END" \
            "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='iran_hospitals' AND column_name='country') THEN 'YES' ELSE 'NO' END" \
            "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='iran_doctors' AND column_name='rating_avg') THEN 'YES' ELSE 'NO' END"
          do
            VAL="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "${q}" | tr -d '\r')"
            [ "${VAL}" = "NO" ] || { log "SCHEMA_DRIFT probe=${VAL}"; exit 6; }
          done
          summary "pre_schema_drift" "NO"

          GOT_SHA="$(sha256sum "${ARCHIVE}" | awk '{print $1}')"
          [ "${GOT_SHA}" = "${ARCHIVE_SHA256}" ] || { log "ARCHIVE_SHA_MISMATCH"; rm -f "${ARCHIVE}"; exit 15; }
          summary "archive_sha256_verified" "${GOT_SHA}"

          log "=== PRE-MIGRATE BACKUP ==="
          mkdir -p "${DEPLOY_PATH}/backups/postgres"
          TS="$(date +%Y%m%d_%H%M%S)"
          BACKUP_FILE="${DEPLOY_PATH}/backups/postgres/sedi_db_pre_migrate_087_089_${TS}.sql.gz"
          docker exec sedi-postgres pg_dump -U "${PU}" -d "${PD}" | gzip > "${BACKUP_FILE}"
          gzip -t "${BACKUP_FILE}"
          BACKUP_SHA="$(sha256sum "${BACKUP_FILE}" | awk '{print $1}')"
          BACKUP_SIZE="$(stat -c%s "${BACKUP_FILE}" 2>/dev/null || wc -c < "${BACKUP_FILE}")"
          summary "recovery_point_id" "sedi_db_pre_migrate_087_089_${TS}.sql.gz"
          summary "backup_sha256" "${BACKUP_SHA}"
          summary "backup_size_bytes" "${BACKUP_SIZE}"
          summary "backup_path" "${BACKUP_FILE}"
          summary "restore_path_known" "YES"
          summary "pre_migration_recovery_point" "VERIFIED"
          log "recovery_command: gunzip -c ${BACKUP_FILE} | docker exec -i sedi-postgres psql -U ${PU} -d ${PD}"

          USERS_BEFORE="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM users;")"
          OTP_BEFORE="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM otp_codes;")"
          DEVICES_BEFORE="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM devices;")"
          summary "users_before" "${USERS_BEFORE}"
          summary "otp_codes_before" "${OTP_BEFORE}"
          summary "devices_before" "${DEVICES_BEFORE}"
          DOC_BEFORE="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM iran_doctors;")"
          HOS_BEFORE="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM iran_hospitals;")"
          summary "iran_doctors_before" "${DOC_BEFORE}"
          summary "iran_hospitals_before" "${HOS_BEFORE}"

          log "=== DOCKER LOAD CERTIFIED IMAGE ==="
          docker load -i "${ARCHIVE}"
          SERVER_ROOTFS_JSON="$(docker image inspect "${TAG_REF}" --format '{{json .RootFS.Layers}}')"
          SERVER_ROOTFS_SHA="$(printf '%s' "${SERVER_ROOTFS_JSON}" | sha256sum | awk '{print $1}')"
          [ "${SERVER_ROOTFS_SHA}" = "${RUNNER_ROOTFS_SHA256}" ] || { log "ROOTFS_MISMATCH"; rm -f "${ARCHIVE}"; exit 16; }
          LOADED_REV="$(docker image inspect "${TAG_REF}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [ "${LOADED_REV}" = "${MIGRATION_SHA}" ] || { log "LOADED_REV_MISMATCH"; exit 17; }
          summary "migration_digest_verified" "${MIGRATION_DIGEST}"
          summary "rootfs_match" "PASS"
          summary "loaded_oci_revision" "${LOADED_REV}"

          ROLES_ENV="${DEPLOY_PATH}/secrets/sedi-db-roles.env"
          [ -f "${ROLES_ENV}" ] || { log "missing roles env"; exit 19; }
          grep -Eq '^SEDI_MIGRATION_ADMIN_PASSWORD=.+' "${ROLES_ENV}" || {
            log "SEDI_MIGRATION_ADMIN_PASSWORD missing"; exit 19; }
          summary "migration_admin_credential_present" "YES"
          summary "migration_role" "sedi_migration_admin"

          # Final lock: re-read alembic immediately before mutation
          ALEMBIC_LOCK="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT version_num FROM alembic_version;")"
          [ "${ALEMBIC_LOCK}" = "${EXPECTED_BEFORE}" ] || { log "LOCK_FAIL rev=${ALEMBIC_LOCK}"; exit 18; }
          summary "mutation_lock" "OPEN"

          MIG_PY="${DEPLOY_PATH}/ops/db03/_migrate_087_089_once.py"
          mkdir -p "${DEPLOY_PATH}/ops/db03"
          umask 077
          # Ephemeral helper (same semantics as db_prod_migrate_070_to_081_remote.sh).
          # Base64 avoids nested-heredoc terminator issues inside workflow YAML.
          printf '%s' '' \
            | base64 -d > "${MIG_PY}"
          chmod 600 "${MIG_PY}"
          grep -Fq 'sedi_migration_admin' "${MIG_PY}"
          grep -Fq 'alembic' "${MIG_PY}"

          MIGRATION_START="$(date -Is)"
          summary "migration_start" "${MIGRATION_START}"
          log "=== ALEMBIC UPGRADE ${TARGET_REV} AS sedi_migration_admin ==="
          set +e
          docker run --rm \
            --network sedi-net \
            --env-file "${ENV_FILE}" \
            --env-file "${ROLES_ENV}" \
            --env TEST_DATABASE_URL= \
            --env "MIG_TARGET_REV=${TARGET_REV}" \
            -v "${MIG_PY}:/tmp/_migrate_087_089_once.py:ro" \
            --entrypoint python \
            "${TAG_REF}" \
            /tmp/_migrate_087_089_once.py
          MIG_RC=$?
          set -e
          rm -f "${MIG_PY}"
          MIGRATION_END="$(date -Is)"
          summary "migration_end" "${MIGRATION_END}"
          summary "migration_exit_status" "${MIG_RC}"
          [ "${MIG_RC}" = "0" ] || { log "ALEMBIC_UPGRADE_FAIL rc=${MIG_RC}"; exit 20; }

          ALEMBIC_AFTER_COUNT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM alembic_version;")"
          ALEMBIC_AFTER="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT version_num FROM alembic_version;")"
          summary "post_migration_revision" "${ALEMBIC_AFTER}"
          summary "alembic_after_count" "${ALEMBIC_AFTER_COUNT}"
          [ "${ALEMBIC_AFTER_COUNT}" = "1" ] && [ "${ALEMBIC_AFTER}" = "${TARGET_REV}" ] || {
            log "POSTCHECK alembic fail"; exit 20; }

          C_DOC="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='iran_doctors' AND column_name='country') THEN 'YES' ELSE 'NO' END")"
          C_LAB="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='iran_laboratories' AND column_name='country') THEN 'YES' ELSE 'NO' END")"
          C_HOS="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='iran_hospitals' AND column_name='country') THEN 'YES' ELSE 'NO' END")"
          R_AVG="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='iran_doctors' AND column_name='rating_avg') THEN 'YES' ELSE 'NO' END")"
          R_CNT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='iran_doctors' AND column_name='rating_count') THEN 'YES' ELSE 'NO' END")"
          R_SAT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='iran_doctors' AND column_name='satisfaction_percent') THEN 'YES' ELSE 'NO' END")"
          summary "rev_088" "${C_DOC}${C_LAB}${C_HOS}"
          summary "rev_089" "${R_AVG}${R_CNT}${R_SAT}"
          [ "${C_DOC}${C_LAB}${C_HOS}${R_AVG}${R_CNT}${R_SAT}" = "YESYESYESYESYESYES" ] || { log "SCHEMA_POSTCHECK_FAIL"; exit 30; }
          DOC_AFTER="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM iran_doctors;")"
          HOS_AFTER="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM iran_hospitals;")"
          summary "iran_doctors_after" "${DOC_AFTER}"
          summary "iran_hospitals_after" "${HOS_AFTER}"
          [ "${DOC_AFTER}" = "${DOC_BEFORE}" ] && [ "${HOS_AFTER}" = "${HOS_BEFORE}" ] || { log "DIRECTORY_COUNT_CHANGED"; exit 43; }
          DEF_COUNTRY="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM iran_doctors WHERE country<>'IR';")"
          [ "${DEF_COUNTRY}" = "0" ] || { log "COUNTRY_DEFAULT_VIOLATED"; exit 44; }

          USERS_AFTER="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM users;")"
          OTP_AFTER="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM otp_codes;")"
          DEVICES_AFTER="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM devices;")"
          summary "users_after" "${USERS_AFTER}"
          summary "otp_codes_after" "${OTP_AFTER}"
          summary "devices_after" "${DEVICES_AFTER}"
          [ "${USERS_AFTER}" = "${USERS_BEFORE}" ] || { log "USERS_COUNT_CHANGED"; exit 40; }
          [ "${OTP_AFTER}" = "${OTP_BEFORE}" ] || { log "OTP_COUNT_CHANGED"; exit 41; }
          [ "${DEVICES_AFTER}" = "${DEVICES_BEFORE}" ] || { log "DEVICES_COUNT_CHANGED"; exit 42; }

          POST_ID="$(docker inspect sedi-backend --format '{{.Id}}')"
          POST_IMAGE="$(docker inspect sedi-backend --format '{{.Config.Image}}')"
          POST_RESTARTS="$(docker inspect sedi-backend --format '{{.RestartCount}}')"
          summary "post_running_image" "${POST_IMAGE}"
          summary "post_container_id" "${POST_ID}"
          summary "post_restart_count" "${POST_RESTARTS}"
          [ "${POST_ID}" = "${PRE_ID}" ] || { log "CONTAINER_ID_CHANGED"; exit 50; }
          [ "${POST_IMAGE}" = "${PRE_IMAGE}" ] || { log "RUNNING_IMAGE_CHANGED"; exit 51; }
          [ "${POST_RESTARTS}" = "${PRE_RESTARTS}" ] || { log "RESTART_COUNT_CHANGED"; exit 52; }

          curl -fsS http://127.0.0.1:8000/healthz
          echo
          curl -fsS https://api.sedi-ai.com/healthz
          echo
          summary "deployment_performed" "NO"
          summary "backend_restarted" "NO"
          summary "migration_087_to_089" "PASS"
          rm -f "${ARCHIVE}"
          rmdir "${REMOTE_DIR}" 2>/dev/null || true
          log "MIGRATE_087_TO_089_PASS"
          REMOTE
          grep -Fq 'MIG087089_SUMMARY|migration_087_to_089|PASS' /tmp/mig087089_apply.log
          grep -Fq 'MIGRATE_087_TO_089_PASS' /tmp/mig087089_apply.log

      - name: Cleanup runner archive
        if: always()
        env:
          ARCHIVE_PATH: ${{ steps.pull_save.outputs.archive_path }}
        run: rm -f "${ARCHIVE_PATH:-/tmp/sedi-backend-mig-*.tar}" || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mig087089-apply
          path: /tmp/mig087089_apply.log
          retention-days: 30
