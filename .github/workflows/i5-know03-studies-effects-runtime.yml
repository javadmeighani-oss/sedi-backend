# I5-KNOW-03 Studies / Effects / Recommendations + W0 integrity
# PostgreSQL 16 + pgvector. NO Production mutation. Hardened pipefail (§279).
name: I5-KNOW-03 Studies Effects Recs Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/app/services/i5/know03/**"
      - "backend/app/services/i5/know02/**"
      - "backend/alembic/versions/065_i5_know04_connectors_change_intelligence.py"
      - "backend/tests/test_i5_know03_studies_effects.py"
      - "backend/tests/test_i5_know02_artifacts_taxonomy.py"
      - "backend/tests/test_i5_know01_source_registry.py"
      - "backend/tests/test_db03_contracts.py"
      - "backend/app/models.py"
      - "backend/app/services/i5/enums.py"
      - ".github/workflows/i5-know03-studies-effects-runtime.yml"

permissions:
  contents: read

concurrency:
  group: i5-know03-studies-effects-${{ github.ref }}
  cancel-in-progress: false

jobs:
  i5-know03-studies-effects:
    name: KNOW-03 studies + W0 integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sedi_know03_test
          POSTGRES_PASSWORD: sedi_know03_test_password
          POSTGRES_DB: sedi_know03_studies
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_know03_test -d sedi_know03_studies"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg2://sedi_know03_test:sedi_know03_test_password@127.0.0.1:5432/sedi_know03_studies
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_know03_test:sedi_know03_test_password@127.0.0.1:5432/sedi_know03_studies
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAI_API_KEY: know03-test-placeholder-not-used

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Prepare evidence directory
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/know03_evidence"
          echo "GATE=I5-KNOW-03" > "${{ runner.temp }}/know03_evidence/gate_id.txt"
          echo "COMMIT_SHA=${{ github.sha }}" > "${{ runner.temp }}/know03_evidence/commit.txt"

      - name: Alembic single head is 065
        run: |
          set -euo pipefail
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          cfg = Config("backend/alembic.ini")
          script = ScriptDirectory.from_config(cfg)
          heads = script.get_heads()
          assert heads == ["065_i5_know04_connectors_change_intelligence"], heads
          rev = script.get_revision("065_i5_know04_connectors_change_intelligence")
          assert rev.down_revision == "064_i5_know03_studies_effects_recs"
          print("ALEMBIC_SINGLE_HEAD=PASS")
          PY

      - name: Fresh upgrade to 065
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from alembic.config import Config
          from alembic import command
          url = os.environ["TEST_DATABASE_URL"]
          eng = create_engine(url)
          with eng.connect() as c:
              c.execute(text("DROP SCHEMA public CASCADE"))
              c.execute(text("CREATE SCHEMA public"))
              c.commit()
          cfg = Config("backend/alembic.ini")
          cfg.set_main_option("sqlalchemy.url", url.replace("%", "%%"))
          command.upgrade(cfg, "head")
          with eng.connect() as c:
              head = c.execute(text("SELECT version_num FROM alembic_version")).scalar()
              assert head == "065_i5_know04_connectors_change_intelligence", head
              for t in (
                  "i5_scientific_artifacts",
                  "i5_clinical_concepts",
                  "i5_clinical_studies",
                  "i5_study_populations",
                  "i5_study_effect_estimates",
                  "i5_clinical_recommendations",
                  "i5_artifact_version_content_drift_events",
                  "i5_terminology_import_contracts",
              ):
                  assert c.execute(text(
                      "SELECT 1 FROM information_schema.tables WHERE table_name=:t"
                  ), {"t": t}).scalar(), t
              assert c.execute(text(
                  "SELECT 1 FROM information_schema.tables WHERE table_name='user_clinical_feature_index'"
              )).scalar() is None
          print("FRESH_065=PASS")
          PY
          echo "FRESH_065=PASS" > "${{ runner.temp }}/know03_evidence/fresh_064.txt"

      - name: Upgrade path 063 → 064 → 065
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from alembic.config import Config
          from alembic import command
          url = os.environ["TEST_DATABASE_URL"]
          eng = create_engine(url)
          with eng.connect() as c:
              c.execute(text("DROP SCHEMA public CASCADE"))
              c.execute(text("CREATE SCHEMA public"))
              c.commit()
          cfg = Config("backend/alembic.ini")
          cfg.set_main_option("sqlalchemy.url", url.replace("%", "%%"))
          command.upgrade(cfg, "063_i5_know02_artifacts_claims_taxonomy")
          with eng.connect() as c:
              assert c.execute(text("SELECT version_num FROM alembic_version")).scalar() == "063_i5_know02_artifacts_claims_taxonomy"
              assert c.execute(text(
                  "SELECT 1 FROM information_schema.tables WHERE table_name='i5_clinical_studies'"
              )).scalar() is None
          command.upgrade(cfg, "064_i5_know03_studies_effects_recs")
          with eng.connect() as c:
              assert c.execute(text("SELECT version_num FROM alembic_version")).scalar() == "064_i5_know03_studies_effects_recs"
              assert c.execute(text(
                  "SELECT 1 FROM information_schema.tables WHERE table_name='i5_clinical_studies'"
              )).scalar() == 1
          command.upgrade(cfg, "065_i5_know04_connectors_change_intelligence")
          with eng.connect() as c:
              assert c.execute(text("SELECT version_num FROM alembic_version")).scalar() == "065_i5_know04_connectors_change_intelligence"
          print("UPGRADE_063_064_065=PASS")
          PY
          echo "UPGRADE_063_064_065=PASS" > "${{ runner.temp }}/know03_evidence/upgrade_063_064.txt"

      - name: KNOW-03 + KNOW-02 + KNOW-01 regression pytest
        run: |
          set -euo pipefail
          set -o pipefail
          python -B -m pytest \
            backend/tests/test_i5_know03_studies_effects.py \
            backend/tests/test_i5_know02_artifacts_taxonomy.py \
            backend/tests/test_i5_know01_source_registry.py \
            backend/tests/test_i5_know01_activation_guard.py \
            backend/tests/test_db03_contracts.py::test_alembic_single_head_chain \
            backend/tests/test_db03_contracts.py::test_alembic_versions_deny_pgvector_and_rag_embeddings \
            -q --tb=short --noconftest \
            | tee "${{ runner.temp }}/know03_evidence/pytest_know03.txt"
          echo "KNOW03_PYTEST_EXIT=0" > "${{ runner.temp }}/know03_evidence/pytest_exit.txt"

      - name: Raw log audit
        if: always()
        run: |
          set -euo pipefail
          EVID="${{ runner.temp }}/know03_evidence"
          {
            echo "GATE=I5-KNOW-03"
            echo "COMMIT_SHA=${{ github.sha }}"
            echo "ALEMBIC_HEAD=065_i5_know04_connectors_change_intelligence"
            echo "PRODUCTION_MIGRATION_RUN=NO"
            echo "PRODUCTION_CRAWLER_ACTIVATED=NO"
            echo "PRODUCTION_RAG_ACTIVATED=NO"
            echo "ICD11_FULL_IMPORT=NEXT_TERMINOLOGY_WAVE"
            echo "P0_SPECIFIC_BRANCHING_IN_CORE_STUDY_MODEL=0"
            echo "SILENT_CONTENT_DRIFT=0"
          } > "${EVID}/summary.txt"
          python - <<'PY'
          import os, re
          from pathlib import Path
          evid = Path(os.environ["RUNNER_TEMP"]) / "know03_evidence"
          blob = ""
          p = evid / "pytest_know03.txt"
          if p.exists():
              blob = p.read_text(encoding="utf-8", errors="replace")
          bad = []
          if re.search(r"(?m)^E\s+fixture 'db' not found", blob):
              bad.append("fixture_db_not_found")
          if "rg: command not found" in blob:
              bad.append("rg_command_not_found")
          if re.search(r"(?m)^\d+ failed(,|$)", blob):
              bad.append("pytest_failed")
          if re.search(r"(?m)^\d+ errors?(,|$)", blob):
              bad.append("pytest_errors")
          (evid / "raw_log_audit.txt").write_text(
              "RAW_LOG_AUDIT=" + ("PASS" if not bad else "FAIL") + "\n"
              + ("FINDINGS=" + ",".join(bad) if bad else "FINDINGS=NONE") + "\n",
              encoding="utf-8",
          )
          if bad:
              raise SystemExit("RAW_LOG_AUDIT_FAIL:" + ",".join(bad))
          print("RAW_LOG_AUDIT=PASS")
          PY

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i5-know03-studies-effects-evidence
          path: ${{ runner.temp }}/know03_evidence/
          retention-days: 14
