name: I9 HR Stability to I10 Minimal Closure PG16

on:
  workflow_dispatch:
  push:
    branches:
      - feature/a3-authority-chat-stream-profile-foundation
    paths:
      - "backend/app/services/i9/hr_stability.py"
      - "backend/app/services/i9/device_packet_service.py"
      - "backend/app/services/i9/nonclinical_vital_stability.py"
      - "backend/app/services/i10/hr_stability_producer.py"
      - "backend/app/services/i10/device_reported_vital_status_producer.py"
      - "backend/app/services/i10/care_subject_status_facts.py"
      - "backend/app/services/i10/policy_types.py"
      - "backend/app/services/i10/recipient_eligibility.py"
      - "backend/tests/test_i9_hr_stability_to_i10_minimal_closure.py"
      - ".github/workflows/i9-hr-stability-to-i10-minimal-closure-pg16.yml"

permissions:
  contents: read

concurrency:
  group: i9-hr-stability-i10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hr-stability-i10:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sedi_hr
          POSTGRES_PASSWORD: sedi_hr_pass
          POSTGRES_DB: sedi_hr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_hr -d sedi_hr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg2://sedi_hr:sedi_hr_pass@127.0.0.1:5432/sedi_hr
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_hr:sedi_hr_pass@127.0.0.1:5432/sedi_hr
      SMS_DISABLED: "true"
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      OPENAI_API_KEY: ci-placeholder-not-used
      SEDI_I10_CARE_NETWORK_DELIVERY_ENABLED: "true"
      SEDI_I10_SOFT_VECTOR_STUB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest alembic
      - name: Alembic + vector
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          eng = create_engine(os.environ["TEST_DATABASE_URL"])
          with eng.connect() as c:
              c.execute(text("CREATE EXTENSION IF NOT EXISTS vector"))
          PY
          python -m alembic -c backend/alembic.ini upgrade head
      - name: Targeted HR stability → I10 tests
        run: python -m pytest -q backend/tests/test_i9_hr_stability_to_i10_minimal_closure.py --tb=short
