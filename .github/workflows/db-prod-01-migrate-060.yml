# DB-PROD-01 — Guarded Production Alembic 056→060 + role hardening + runtime cutover
# NOTE: GitHub only dispatches workflows present on the default branch.
# Operational dispatch path: W6-P01 Production Migration 056 with confirmation=MIGRATE_TO_060
# which executes backend/ops/db03/db_prod_01_remote.sh
name: DB-PROD-01 Production Migration 060

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Must be exactly MIGRATE_TO_060"
        required: true
      expected_before_revision:
        description: "Exact alembic_version expected before migration"
        required: true
        default: 056_i5_w2_p02_conflict_safety
      migration_image_sha:
        description: "40-char lowercase Git commit SHA image tag"
        required: true
      migration_image_digest:
        description: "Expected image digest sha256:<64 hex>"
        required: true

concurrency:
  group: sedi-production-backend-operation
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  migrate-060:
    name: Production migrate 060 + role cutover
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event.inputs.confirmation == 'MIGRATE_TO_060'

    steps:
      - name: Validate inputs
        env:
          INPUT_CONFIRMATION: ${{ github.event.inputs.confirmation }}
          INPUT_EXPECTED_BEFORE: ${{ github.event.inputs.expected_before_revision }}
          INPUT_MIGRATION_SHA: ${{ github.event.inputs.migration_image_sha }}
          INPUT_MIGRATION_DIGEST: ${{ github.event.inputs.migration_image_digest }}
        run: |
          set -Eeuo pipefail
          [ "${INPUT_CONFIRMATION}" = "MIGRATE_TO_060" ] || { echo "bad confirmation"; exit 1; }
          [ "${INPUT_EXPECTED_BEFORE}" = "056_i5_w2_p02_conflict_safety" ] || {
            echo "expected_before must be 056_i5_w2_p02_conflict_safety"
            exit 1
          }
          echo "${INPUT_MIGRATION_SHA}" | grep -Eq '^[0-9a-f]{40}$' || { echo "bad sha"; exit 1; }
          echo "${INPUT_MIGRATION_DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "bad digest"; exit 1; }
          echo "inputs_ok"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload and execute DB-PROD-01 remote procedure
        env:
          INPUT_EXPECTED_BEFORE: ${{ github.event.inputs.expected_before_revision }}
          INPUT_MIGRATION_SHA: ${{ github.event.inputs.migration_image_sha }}
          INPUT_MIGRATION_DIGEST: ${{ github.event.inputs.migration_image_digest }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/db03"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/db03/db_prod_01_remote.sh \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/db_prod_01_remote.sh"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/db_prod_01_remote.sh") && \
             DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
             EXPECTED_BEFORE=$(printf '%q' "${INPUT_EXPECTED_BEFORE}") \
             MIGRATION_SHA=$(printf '%q' "${INPUT_MIGRATION_SHA}") \
             MIGRATION_DIGEST=$(printf '%q' "${INPUT_MIGRATION_DIGEST}") \
             bash $(printf '%q' "${REMOTE_DIR}/db_prod_01_remote.sh")" \
            2>&1 | tee /tmp/db_prod_01_run.log

      - name: Upload run log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-prod-01-migration-evidence
          path: /tmp/db_prod_01_run.log
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "## DB-PROD-01 Production Migration 060"
            echo "Status: ${{ job.status }}"
            echo "Target: 060_db03_w4_w6_scale_inspect_roles"
            if [ -f /tmp/db_prod_01_run.log ]; then
              grep '^MIGRATION_SUMMARY|' /tmp/db_prod_01_run.log | while IFS='|' read -r _ k v; do
                echo "- **${k}:** ${v}"
              done || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
