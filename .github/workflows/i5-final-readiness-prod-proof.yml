# I5 Final Readiness — production proof from IMMUTABLE image (NO docker cp code patch)
name: I5 Final Readiness Production Proof

on:
  workflow_dispatch:
    inputs:
      deployed_image_sha:
        description: "40-char commit SHA of running/deployed backend image"
        required: true
      expected_alembic_revision:
        description: "Expected alembic_version"
        required: true
        default: 070_i8_proactive_evaluation_ledger
      confirmation:
        description: "Must be I5_FINAL_READINESS_PROOF"
        required: true

permissions:
  contents: read

concurrency:
  group: sedi-w6p01-production-activate
  cancel-in-progress: false

jobs:
  final-readiness-proof:
    name: Immutable image readiness proof
    if: github.event.inputs.confirmation == 'I5_FINAL_READINESS_PROOF'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate inputs
        env:
          SHA: ${{ github.event.inputs.deployed_image_sha }}
          REV: ${{ github.event.inputs.expected_alembic_revision }}
          CONF: ${{ github.event.inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          [ "${CONF}" = "I5_FINAL_READINESS_PROOF" ]
          echo "${SHA}" | grep -Eq '^[0-9a-f]{40}$'
          echo "${REV}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$'
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
      - name: Parity + baked proof (NO docker cp of code)
        env:
          INPUT_SHA: ${{ github.event.inputs.deployed_image_sha }}
          INPUT_REV: ${{ github.event.inputs.expected_alembic_revision }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH_Q="$(printf '%q' "${{ secrets.SEDI_DEPLOY_PATH }}")"
          IMAGE_SHA_Q="$(printf '%q' "${INPUT_SHA}")"
          EXPECTED_REV_Q="$(printf '%q' "${INPUT_REV}")"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "DEPLOY_PATH=${DEPLOY_PATH_Q} IMAGE_SHA=${IMAGE_SHA_Q} EXPECTED_REV=${EXPECTED_REV_Q} bash -s" \
            2>&1 <<'REMOTE_SCRIPT' | tee /tmp/i5_final_readiness_prod.log
          set -Eeuo pipefail
          log() { echo "[$(date -Is)] $*"; }
          summary() { echo "READY_SUMMARY|$1|$2"; }
          IMAGE_TAG="ghcr.io/javadmeighani-oss/sedi-backend:${IMAGE_SHA}"
          wait_health() {
            local ok=0 i
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done
            [ "${ok}" = "1" ] || { log "HEALTH_FAILED"; return 1; }
            curl -fsS http://127.0.0.1:8000/health >/dev/null
            curl -fsS https://api.sedi-ai.com/healthz >/dev/null
          }
          cd "${DEPLOY_PATH}"
          CURRENT_IMAGE="$(docker inspect sedi-backend --format '{{.Config.Image}}' 2>/dev/null || true)"
          CURRENT_DIGEST="$(docker inspect sedi-backend --format '{{index .RepoDigests 0}}' 2>/dev/null || true)"
          OCI_REV="$(docker inspect sedi-backend --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' 2>/dev/null || true)"
          summary "running_image" "${CURRENT_IMAGE:-none}"
          summary "running_digest" "${CURRENT_DIGEST:-none}"
          summary "oci_revision" "${OCI_REV:-none}"
          if [ "${CURRENT_IMAGE}" != "${IMAGE_TAG}" ]; then
            # Accept digest-pinned Config.Image containing the SHA tag after recreate.
            if ! echo "${CURRENT_IMAGE}" | grep -Fq "${IMAGE_SHA}"; then
              log "IMAGE_PARITY_FAIL: expected tag containing ${IMAGE_SHA}, got ${CURRENT_IMAGE}"
              exit 5
            fi
          fi
          if [ -n "${OCI_REV}" ] && [ "${OCI_REV}" != "${IMAGE_SHA}" ]; then
            log "OCI_REVISION_MISMATCH: ${OCI_REV} != ${IMAGE_SHA}"
            exit 5
          fi
          PU=$(docker exec sedi-postgres printenv POSTGRES_USER)
          PD=$(docker exec sedi-postgres printenv POSTGRES_DB)
          ALEMBIC_COUNT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM alembic_version;")"
          ALEMBIC_CURRENT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT version_num FROM alembic_version;")"
          summary "alembic_revision" "${ALEMBIC_CURRENT}"
          summary "alembic_count" "${ALEMBIC_COUNT}"
          if [ "${ALEMBIC_COUNT}" != "1" ] || [ "${ALEMBIC_CURRENT}" != "${EXPECTED_REV}" ]; then exit 5; fi
          # CRITICAL: proof must already be inside image — refuse docker cp of code.
          CTR_PROOF="/app/backend/scripts/i5_final_readiness_prod_proof.py"
          CTR_ANS="/app/backend/app/services/i5/know07/answer_path.py"
          docker exec sedi-backend test -f "${CTR_PROOF}"
          docker exec sedi-backend test -f "${CTR_ANS}"
          docker exec sedi-backend grep -Fq 'ku_freshness_state' /app/backend/app/services/scis/retrieval.py
          docker exec \
            -e PYTHONUNBUFFERED=1 \
            -e PYTHONPATH=/app \
            -e SEDI_I5_MULTISOURCE_ENABLED=1 \
            -e I5_AUTONOMOUS_GOVERNANCE_SIDE_STAGE=1 \
            -w /app sedi-backend python "${CTR_PROOF}"
          wait_health
          summary "health" "pass"
          summary "image_runtime_parity" "PASS"
          summary "docker_cp_code_patch_dependency" "NO"
          summary "ready_proof" "SUCCESS"
          REMOTE_SCRIPT
      - name: Summary
        if: always()
        run: |
          {
            echo "## I5 Final Readiness Production Proof"
            echo "**Status:** ${{ job.status }}"
            if [ -f /tmp/i5_final_readiness_prod.log ]; then
              grep '^READY_SUMMARY|' /tmp/i5_final_readiness_prod.log | while IFS='|' read -r _ k v; do echo "- **${k}:** ${v}"; done || true
              grep -E '^\{' /tmp/i5_final_readiness_prod.log | tail -n 50 || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i5-final-readiness-prod-log
          path: /tmp/i5_final_readiness_prod.log
          retention-days: 14
