# I5-KNOW-01 Trusted Source Registry + Rights + Multiformat Foundation
# PostgreSQL 16 + pgvector image (inherits SCIS-01 chain). NO Production mutation.
#
# CI integrity (FGI remediation):
# - set -o pipefail on every pytest|tee pipeline
# - activation guard is Python fail-closed (scanner error ≠ PASS)
# - W3-P02 uses canonical backend/tests/conftest.py db fixture (no --noconftest)
name: I5-KNOW-01 Source Registry Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/app/services/i5/know01/**"
      - "backend/app/services/i5/adapters/**"
      - "backend/app/services/i5/enums.py"
      - "backend/alembic/versions/062_i5_know01_source_registry_rights.py"
      - "backend/tests/test_i5_know01_source_registry.py"
      - "backend/tests/test_i5_know01_activation_guard.py"
      - "backend/tests/test_i5_know01_foundation_gate.py"
      - "backend/tests/test_i5_know01_registry_sot_closure.py"
      - "backend/tests/test_i5_catalog12_specialty_closure.py"
      - "backend/tests/test_i5_catalog12_rights_normalization.py"
      - "backend/tests/test_i5_master_log_append_only.py"
      - "backend/tests/test_i5_g305_retrieval_eval.py"
      - "backend/app/services/i5/master_log_byte_append.py"
      - "backend/app/services/i5/g305_retrieval_eval.py"
      - "backend/app/services/i5/know05/catalog12_bounded_ingest.py"
      - "backend/config/i5/coverage_manifest_v1.yaml"
      - "backend/tests/test_i5_know05_generic_adapter_bridge.py"
      - "backend/app/services/i5/know05/source_selection.py"
      - "backend/app/services/i5/know05/orchestrator.py"
      - "backend/app/services/i5/know05/generic_execution_bridge.py"
      - "backend/tests/helpers/know01_activation_guard.py"
      - "backend/tests/test_section30_i5_w3_p01_adapters_extract.py"
      - "backend/tests/test_section30_i5_w3_p02_weekly_orchestrator.py"
      - "backend/tests/conftest.py"
      - "backend/tests/test_db03_contracts.py"
      - "backend/app/models.py"
      - ".github/workflows/i5-know01-source-registry-runtime.yml"

permissions:
  contents: read

concurrency:
  group: i5-know01-source-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  i5-know01-source-registry:
    name: KNOW-01 registry + rights + adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        # Credentials must match backend/tests/helpers/w3p02_postgres_runtime.py EXPECTED_*
        # so the canonical W3-P02 plugin fixture can bind safely.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sedi_w3p02_test
          POSTGRES_PASSWORD: sedi_w3p02_test_password
          POSTGRES_DB: sedi_w3p02_orchestrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_w3p02_test -d sedi_w3p02_orchestrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg2://sedi_w3p02_test:sedi_w3p02_test_password@127.0.0.1:5432/sedi_w3p02_orchestrator
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_w3p02_test:sedi_w3p02_test_password@127.0.0.1:5432/sedi_w3p02_orchestrator
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAI_API_KEY: know01-test-placeholder-not-used
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Prepare evidence directory
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/know01_evidence"
          echo "GATE=I5-KNOW-01-CI-FALSE-GREEN-INTEGRITY-REMEDIATION" > "${{ runner.temp }}/know01_evidence/gate_id.txt"
          echo "COMMIT_SHA=${{ github.sha }}" > "${{ runner.temp }}/know01_evidence/commit.txt"

      - name: Activation guard — clean control (fail-closed Python scanner)
        run: |
          set -euo pipefail
          python -B -m backend.tests.helpers.know01_activation_guard \
            --root backend/app/services/i5/know01 \
            --label clean \
            | tee "${{ runner.temp }}/know01_evidence/activation_guard_clean.txt"
          test -f backend/alembic/versions/062_i5_know01_source_registry_rights.py
          echo "ACTIVATION_GUARD_CLEAN_CONTROL=PASS" | tee -a "${{ runner.temp }}/know01_evidence/activation_guard_clean.txt"

      - name: Activation guard — negative control (must reject forbidden fixture)
        run: |
          set -euo pipefail
          FIXTURE_DIR="${{ runner.temp }}/know01_forbidden_fixture"
          mkdir -p "${FIXTURE_DIR}"
          printf '%s\n' 'PRODUCTION_CRAWLER_ACTIVATED = True' > "${FIXTURE_DIR}/forbidden_marker.py"
          python -B -m backend.tests.helpers.know01_activation_guard \
            --root "${FIXTURE_DIR}/forbidden_marker.py" \
            --label negative \
            --expect-fail \
            | tee "${{ runner.temp }}/know01_evidence/activation_guard_negative.txt"
          rm -rf "${FIXTURE_DIR}"
          echo "ACTIVATION_GUARD_NEGATIVE_CONTROL=PASS" | tee -a "${{ runner.temp }}/know01_evidence/activation_guard_negative.txt"

      - name: Alembic head is 065 (KNOW-01 preserved under KNOW-04 head)
        run: |
          set -euo pipefail
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          cfg = Config("backend/alembic.ini")
          script = ScriptDirectory.from_config(cfg)
          heads = script.get_heads()
          assert heads == ["065_i5_know04_connectors_change_intelligence"], heads
          rev = script.get_revision("065_i5_know04_connectors_change_intelligence")
          assert rev.down_revision == "064_i5_know03_studies_effects_recs"
          print("ALEMBIC_SINGLE_HEAD=PASS")
          PY

      - name: Fresh upgrade to head (065) proving KNOW-01 tables
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from alembic.config import Config
          from alembic import command
          url = os.environ["TEST_DATABASE_URL"]
          eng = create_engine(url)
          with eng.connect() as c:
              c.execute(text("DROP SCHEMA public CASCADE"))
              c.execute(text("CREATE SCHEMA public"))
              c.commit()
          cfg = Config("backend/alembic.ini")
          cfg.set_main_option("sqlalchemy.url", url.replace("%", "%%"))
          command.upgrade(cfg, "head")
          with eng.connect() as c:
              head = c.execute(text("SELECT version_num FROM alembic_version")).scalar()
              assert head == "065_i5_know04_connectors_change_intelligence", head
              for t in (
                  "i5_source_registry_extensions",
                  "i5_source_registry_roles",
                  "i5_source_p0_tags",
                  "i5_source_coverage_gaps",
                  "i5_reference_books",
                  "i5_reference_book_editions",
              ):
                  assert c.execute(text(
                      "SELECT 1 FROM information_schema.tables WHERE table_name=:t"
                  ), {"t": t}).scalar(), t
              print("FRESH_065=PASS")
              print("FRESH_HEAD_KNOW01_TABLES=PASS")
          PY
          echo "FRESH_065=PASS" > "${{ runner.temp }}/know01_evidence/fresh_065.txt"
          echo "FRESH_HEAD_KNOW01_TABLES=PASS" >> "${{ runner.temp }}/know01_evidence/fresh_065.txt"

      - name: Upgrade path 061 → 062
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from alembic.config import Config
          from alembic import command
          url = os.environ["TEST_DATABASE_URL"]
          eng = create_engine(url)
          with eng.connect() as c:
              c.execute(text("DROP SCHEMA public CASCADE"))
              c.execute(text("CREATE SCHEMA public"))
              c.commit()
          cfg = Config("backend/alembic.ini")
          cfg.set_main_option("sqlalchemy.url", url.replace("%", "%%"))
          command.upgrade(cfg, "061_scis01_pgvector_kce_foundation")
          with eng.connect() as c:
              assert c.execute(text("SELECT version_num FROM alembic_version")).scalar() == "061_scis01_pgvector_kce_foundation"
              assert c.execute(text(
                  "SELECT 1 FROM information_schema.tables WHERE table_name='i5_source_registry_extensions'"
              )).scalar() is None
          command.upgrade(cfg, "062_i5_know01_source_registry_rights")
          with eng.connect() as c:
              assert c.execute(text("SELECT version_num FROM alembic_version")).scalar() == "062_i5_know01_source_registry_rights"
              assert c.execute(text(
                  "SELECT 1 FROM information_schema.tables WHERE table_name='i5_source_registry_extensions'"
              )).scalar() == 1
          print("UPGRADE_061_TO_062=PASS")
          PY
          echo "UPGRADE_061_TO_062=PASS" > "${{ runner.temp }}/know01_evidence/upgrade_061_062.txt"

      - name: Restore fresh Alembic 065 before pytest
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from alembic.config import Config
          from alembic import command
          url = os.environ["TEST_DATABASE_URL"]
          eng = create_engine(url)
          with eng.connect() as c:
              c.execute(text("DROP SCHEMA public CASCADE"))
              c.execute(text("CREATE SCHEMA public"))
              c.commit()
          cfg = Config("backend/alembic.ini")
          cfg.set_main_option("sqlalchemy.url", url.replace("%", "%%"))
          command.upgrade(cfg, "head")
          with eng.connect() as c:
              head = c.execute(text("SELECT version_num FROM alembic_version")).scalar()
              assert head == "065_i5_know04_connectors_change_intelligence", head
          print("RESTORE_FRESH_065_BEFORE_PYTEST=PASS")
          PY

      - name: KNOW-01 + adapter regression pytest
        run: |
          set -euo pipefail
          set -o pipefail
          python -B -m pytest \
            backend/tests/test_i5_know01_source_registry.py \
            backend/tests/test_i5_know01_activation_guard.py \
            backend/tests/test_i5_know01_foundation_gate.py \
            backend/tests/test_i5_know01_registry_sot_closure.py \
            backend/tests/test_i5_catalog12_specialty_closure.py \
            backend/tests/test_i5_catalog12_rights_normalization.py \
            backend/tests/test_i5_master_log_append_only.py \
            backend/tests/test_i5_g305_retrieval_eval.py \
            backend/tests/test_i5_know05_generic_adapter_bridge.py \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py \
            backend/tests/test_db03_contracts.py::test_alembic_single_head_chain \
            backend/tests/test_db03_contracts.py::test_alembic_versions_deny_pgvector_and_rag_embeddings \
            -q -s --tb=short --noconftest \
            | tee "${{ runner.temp }}/know01_evidence/pytest_know01_targeted.txt"
          echo "KNOW01_TARGETED_EXIT=0" > "${{ runner.temp }}/know01_evidence/pytest_know01_targeted_exit.txt"

      - name: W3-P02 full regression (canonical w3p02 postgres plugin fixture)
        run: |
          set -euo pipefail
          set -o pipefail
          # Reset to empty schema: alembic views break Base.metadata.drop_all in root conftest.
          # Canonical W3-P02 harness uses --noconftest + w3p02_postgres_runtime_plugin::db.
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          url = os.environ["TEST_DATABASE_URL"]
          eng = create_engine(url)
          with eng.connect() as c:
              c.execute(text("DROP SCHEMA public CASCADE"))
              c.execute(text("CREATE SCHEMA public"))
              c.commit()
          print("W3P02_SCHEMA_RESET=PASS")
          PY
          python -B -m pytest \
            --noconftest \
            -p backend.tests.helpers.w3p02_postgres_runtime_plugin \
            -p no:cacheprovider \
            -q --tb=short \
            backend/tests/test_section30_i5_w3_p02_weekly_orchestrator.py::test_W3P02_T1_package_identity \
            backend/tests/test_section30_i5_w3_p02_weekly_orchestrator.py::test_W3P02_T2_activation_off_and_dormant_scheduler_contract \
            backend/tests/test_section30_i5_w3_p02_weekly_orchestrator.py::test_W3P02_T3_discovery_select_eligible \
            backend/tests/test_section30_i5_w3_p02_weekly_orchestrator.py::test_W3P02_T4_governance_fail_closed \
            backend/tests/test_section30_i5_w3_p02_weekly_orchestrator.py::test_W3P02_T5_adapter_resolve_and_unknown \
            backend/tests/test_section30_i5_w3_p02_weekly_orchestrator.py::test_W3P02_T6_discovery_dedupe \
            backend/tests/test_section30_i5_w3_p02_weekly_orchestrator.py::test_W3P02_T7_create_run_idempotency \
            backend/tests/test_section30_i5_w3_p02_weekly_orchestrator.py::test_W3P02_T8_attempt_transitions_and_invalid \
            backend/tests/test_section30_i5_w3_p02_weekly_orchestrator.py::test_W3P02_T9_retry_after_failure \
            backend/tests/test_section30_i5_w3_p02_weekly_orchestrator.py::test_W3P02_T10_source_result_lifecycle \
            backend/tests/test_section30_i5_w3_p02_weekly_orchestrator.py::test_W3P02_T11_gap_result_lifecycle \
            backend/tests/test_section30_i5_w3_p02_weekly_orchestrator.py::test_W3P02_T12_partial_full_no_eligible \
            backend/tests/test_section30_i5_w3_p02_weekly_orchestrator.py::test_W3P02_T13_handoff_prepare_only \
            backend/tests/test_section30_i5_w3_p02_weekly_orchestrator.py::test_W3P02_T14_dry_run_no_activation_no_production_write \
            backend/tests/test_section30_i5_w3_p02_weekly_orchestrator.py::test_W3P02_T15_source_fk_invalid \
            | tee "${{ runner.temp }}/know01_evidence/pytest_w3p02.txt"
          echo "W3P02_EXIT=0" > "${{ runner.temp }}/know01_evidence/pytest_w3p02_exit.txt"

      - name: Write evidence summary + raw-log audit helpers
        if: always()
        run: |
          set -euo pipefail
          EVID="${{ runner.temp }}/know01_evidence"
          {
            echo "GATE=I5-KNOW-01-CI-FALSE-GREEN-INTEGRITY-REMEDIATION"
            echo "COMMIT_SHA=${{ github.sha }}"
            echo "ALEMBIC_HEAD=065_i5_know04_connectors_change_intelligence"
            echo "PRODUCTION_MIGRATION_RUN=NO"
            echo "PRODUCTION_CRAWLER_ACTIVATED=NO"
            echo "PRODUCTION_RAG_ACTIVATED=NO"
            echo "DIABETES_D20_RUNTIME_MUTATION=NO"
            echo "CAP24_STATUS=BLOCKED_WITH_EXACT_EVIDENCE"
            echo "UNKNOWN_RIGHTS_FAIL_CLOSED=YES"
            echo "PIPEFAIL_INTEGRITY=YES"
            echo "FGI_01_FIXED=YES"
            echo "FGI_02_FIXED=YES"
          } > "${EVID}/summary.txt"
          python - <<'PY'
          import os, re
          from pathlib import Path
          evid = Path(os.environ["RUNNER_TEMP"]) / "know01_evidence"
          texts = []
          for name in (
              "pytest_know01_targeted.txt",
              "pytest_w3p02.txt",
              "activation_guard_clean.txt",
              "activation_guard_negative.txt",
          ):
              p = evid / name
              if p.exists():
                  texts.append(p.read_text(encoding="utf-8", errors="replace"))
          blob = "\n".join(texts)
          # Fail audit markers (exclude activation-guard negative-control expected FAIL_FORBIDDEN line)
          bad = []
          if re.search(r"(?m)^E\s+fixture 'db' not found", blob):
              bad.append("fixture_db_not_found")
          if "rg: command not found" in blob:
              bad.append("rg_command_not_found")
          # Pytest summary lines like "1 failed" / "10 errors" (not DeprecationWarning text)
          if re.search(r"(?m)^\d+ failed(,|$)", blob):
              bad.append("pytest_failed_summary")
          if re.search(r"(?m)^\d+ errors?(,|$)", blob):
              bad.append("pytest_error_summary")
          w3 = evid / "pytest_w3p02.txt"
          if w3.exists():
              w3t = w3.read_text(encoding="utf-8", errors="replace")
              if re.search(r"(?m)^\d+ errors?(,|$)", w3t) or re.search(r"(?m)^\d+ failed(,|$)", w3t):
                  bad.append("w3p02_errors")
              if "fixture 'db' not found" in w3t:
                  bad.append("w3p02_missing_db_fixture")
          (evid / "raw_log_audit.txt").write_text(
              "RAW_LOG_AUDIT=" + ("PASS" if not bad else "FAIL") + "\n"
              + ("FINDINGS=" + ",".join(bad) if bad else "FINDINGS=NONE") + "\n",
              encoding="utf-8",
          )
          if bad:
              raise SystemExit("RAW_LOG_AUDIT_FAIL:" + ",".join(bad))
          print("RAW_LOG_AUDIT=PASS")
          PY

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i5-know01-ci-integrity-evidence
          path: ${{ runner.temp }}/know01_evidence/
          retention-days: 14
