# PD-I8-04D-PROD-ACTIVATE-01 — Governed I8 proactive schedule flag activation.
# workflow_dispatch only. Pins exact image SHA+digest. NO migration. NO image change.
name: DB-PROD I8 Flag Activate

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "PREFLIGHT | ACTIVATE | OBSERVE | KILL_SWITCH"
        required: true
      confirmation:
        description: "Phase token"
        required: true
      source_sha:
        description: "Exact 40-char commit SHA providing ops script"
        required: true
      image_tag:
        description: "Exact 40-char running backend image SHA tag"
        required: true
      image_digest:
        description: "Exact sha256:<64 hex> running image digest"
        required: true
      observe_wait_sec:
        description: "OBSERVE wait seconds (default 960 ~16m for 15m interval)"
        required: false
        default: "960"

permissions:
  contents: read

concurrency:
  group: sedi-production-backend-operation
  cancel-in-progress: false

jobs:
  preflight:
    name: I8 flag preflight (read-only)
    if: >-
      github.event.inputs.phase == 'PREFLIGHT' &&
      github.event.inputs.confirmation == 'I8_FLAG_PREFLIGHT_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate pins
        env:
          SHA: ${{ github.event.inputs.source_sha }}
          TAG: ${{ github.event.inputs.image_tag }}
          DIG: ${{ github.event.inputs.image_digest }}
        run: |
          set -Eeuo pipefail
          echo "${SHA}" | grep -Eq '^[0-9a-f]{40}$'
          echo "${TAG}" | grep -Eq '^[0-9a-f]{40}$'
          echo "${DIG}" | grep -Eq '^sha256:[0-9a-f]{64}$'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha }}
      - name: SSH preflight
        env:
          TAG: ${{ github.event.inputs.image_tag }}
          DIG: ${{ github.event.inputs.image_digest }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/db03"
          ssh -i ~/.ssh/sedi_deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/db03/db_prod_i8_flag_remote.sh \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/db_prod_i8_flag_remote.sh"
          ssh -i ~/.ssh/sedi_deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/db_prod_i8_flag_remote.sh") && \
             DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
             PHASE=PREFLIGHT \
             IMAGE_SHA=$(printf '%q' "${TAG}") \
             IMAGE_DIGEST=$(printf '%q' "${DIG}") \
             bash $(printf '%q' "${REMOTE_DIR}/db_prod_i8_flag_remote.sh")" \
            2>&1 | tee /tmp/i8flag_preflight.log
          grep -Fq 'I8FLAG|phase_preflight|PASS' /tmp/i8flag_preflight.log
          grep -Fq 'I8FLAG|alembic_head|070_i8_proactive_evaluation_ledger' /tmp/i8flag_preflight.log
          grep -Fq 'I8FLAG|i8_flag_effective|OFF' /tmp/i8flag_preflight.log
          grep -Fq 'I8FLAG|scheduler_enabled_before|False' /tmp/i8flag_preflight.log
          grep -Fq 'I8FLAG|image_digest_guard|PASS' /tmp/i8flag_preflight.log
          if grep -Eiq 'info@sedi-ai\.com|SEDI_MIGRATION_ADMIN_PASSWORD=|DATABASE_URL=postgres' /tmp/i8flag_preflight.log; then
            echo "SECRET_LEAK"; exit 2
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i8flag-preflight
          path: /tmp/i8flag_preflight.log
          retention-days: 14

  activate:
    name: I8 flag activate (ON)
    if: >-
      github.event.inputs.phase == 'ACTIVATE' &&
      github.event.inputs.confirmation == 'I8_FLAG_ACTIVATE_ON'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate pins
        env:
          SHA: ${{ github.event.inputs.source_sha }}
          TAG: ${{ github.event.inputs.image_tag }}
          DIG: ${{ github.event.inputs.image_digest }}
        run: |
          set -Eeuo pipefail
          echo "${SHA}" | grep -Eq '^[0-9a-f]{40}$'
          echo "${TAG}" | grep -Eq '^[0-9a-f]{40}$'
          echo "${DIG}" | grep -Eq '^sha256:[0-9a-f]{64}$'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha }}
      - name: Static path bounds
        run: |
          set -Eeuo pipefail
          test -f backend/ops/db03/db_prod_i8_flag_remote.sh
          ! grep -Eiq 'alembic[[:space:]]+upgrade|migration 071|SEDI_I5_|SEDI_I7_' backend/ops/db03/db_prod_i8_flag_remote.sh
          grep -Fq 'SEDI_I8_PROACTIVE_SCHEDULE_TRIGGER_ENABLED' backend/ops/db03/db_prod_i8_flag_remote.sh
      - name: SSH activate
        id: activate
        env:
          TAG: ${{ github.event.inputs.image_tag }}
          DIG: ${{ github.event.inputs.image_digest }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/db03"
          ssh -i ~/.ssh/sedi_deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/db03/db_prod_i8_flag_remote.sh \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/db_prod_i8_flag_remote.sh"
          set +e
          ssh -i ~/.ssh/sedi_deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/db_prod_i8_flag_remote.sh") && \
             DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
             PHASE=ACTIVATE \
             IMAGE_SHA=$(printf '%q' "${TAG}") \
             IMAGE_DIGEST=$(printf '%q' "${DIG}") \
             bash $(printf '%q' "${REMOTE_DIR}/db_prod_i8_flag_remote.sh")" \
            2>&1 | tee /tmp/i8flag_activate.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "${RC}" != "0" ]; then
            echo "ACTIVATE_FAILED rc=${RC}; fail-closed KILL_SWITCH"
            ssh -i ~/.ssh/sedi_deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -p "${{ secrets.SEDI_PORT }}" \
              "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
              "DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
               PHASE=KILL_SWITCH \
               IMAGE_SHA=$(printf '%q' "${TAG}") \
               IMAGE_DIGEST=$(printf '%q' "${DIG}") \
               bash $(printf '%q' "${REMOTE_DIR}/db_prod_i8_flag_remote.sh")" \
              2>&1 | tee /tmp/i8flag_failclosed.log || true
            exit "${RC}"
          fi
          grep -Fq 'I8FLAG|phase_activate|PASS' /tmp/i8flag_activate.log
          grep -Fq 'I8FLAG|i8_flag_effective|ON' /tmp/i8flag_activate.log
          grep -Fq 'I8FLAG|scheduler_enabled_after|True' /tmp/i8flag_activate.log
          grep -Fq 'I8FLAG|image_change|NO' /tmp/i8flag_activate.log
          grep -Fq 'I8FLAG|migration|NO' /tmp/i8flag_activate.log
          if grep -Eiq 'info@sedi-ai\.com|DATABASE_URL=postgres' /tmp/i8flag_activate.log; then
            echo "SECRET_LEAK"; exit 2
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i8flag-activate
          path: /tmp/i8flag_activate.log
          retention-days: 14

  observe:
    name: I8 flag bounded observe
    if: >-
      github.event.inputs.phase == 'OBSERVE' &&
      github.event.inputs.confirmation == 'I8_FLAG_OBSERVE_BOUNDED'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate pins
        env:
          SHA: ${{ github.event.inputs.source_sha }}
          TAG: ${{ github.event.inputs.image_tag }}
          DIG: ${{ github.event.inputs.image_digest }}
        run: |
          set -Eeuo pipefail
          echo "${SHA}" | grep -Eq '^[0-9a-f]{40}$'
          echo "${TAG}" | grep -Eq '^[0-9a-f]{40}$'
          echo "${DIG}" | grep -Eq '^sha256:[0-9a-f]{64}$'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha }}
      - name: SSH observe
        env:
          TAG: ${{ github.event.inputs.image_tag }}
          DIG: ${{ github.event.inputs.image_digest }}
          WAIT: ${{ github.event.inputs.observe_wait_sec }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/db03"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/db03/db_prod_i8_flag_remote.sh \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/db_prod_i8_flag_remote.sh"
          set +e
          ssh -i ~/.ssh/sedi_deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/db_prod_i8_flag_remote.sh") && \
             DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
             PHASE=OBSERVE \
             IMAGE_SHA=$(printf '%q' "${TAG}") \
             IMAGE_DIGEST=$(printf '%q' "${DIG}") \
             OBSERVE_WAIT_SEC=$(printf '%q' "${WAIT}") \
             bash $(printf '%q' "${REMOTE_DIR}/db_prod_i8_flag_remote.sh")" \
            2>&1 | tee /tmp/i8flag_observe.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "${RC}" != "0" ]; then
            echo "OBSERVE_FAILED rc=${RC}; fail-closed KILL_SWITCH"
            ssh -i ~/.ssh/sedi_deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -p "${{ secrets.SEDI_PORT }}" \
              "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
              "DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
               PHASE=KILL_SWITCH \
               IMAGE_SHA=$(printf '%q' "${TAG}") \
               IMAGE_DIGEST=$(printf '%q' "${DIG}") \
               bash $(printf '%q' "${REMOTE_DIR}/db_prod_i8_flag_remote.sh")" \
              2>&1 | tee /tmp/i8flag_failclosed.log || true
            exit "${RC}"
          fi
          grep -Fq 'I8FLAG|phase_observe|PASS' /tmp/i8flag_observe.log
          grep -Fq 'I8FLAG|scheduler_active|YES' /tmp/i8flag_observe.log
          grep -Fq 'I8FLAG|runaway_activity|NO' /tmp/i8flag_observe.log
          grep -Fq 'I8FLAG|smart_notification_bypass|NO' /tmp/i8flag_observe.log
          grep -Fq 'I8FLAG|unauthorized_notification|NO' /tmp/i8flag_observe.log
          grep -Fq 'I8FLAG|ownership_isolation|PASS' /tmp/i8flag_observe.log
          if grep -Eiq 'info@sedi-ai\.com|DATABASE_URL=postgres' /tmp/i8flag_observe.log; then
            echo "SECRET_LEAK"; exit 2
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i8flag-observe
          path: /tmp/i8flag_observe.log
          retention-days: 14

  kill_switch:
    name: I8 flag kill-switch (OFF)
    if: >-
      github.event.inputs.phase == 'KILL_SWITCH' &&
      github.event.inputs.confirmation == 'I8_FLAG_KILL_SWITCH_OFF'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate pins
        env:
          SHA: ${{ github.event.inputs.source_sha }}
          TAG: ${{ github.event.inputs.image_tag }}
          DIG: ${{ github.event.inputs.image_digest }}
        run: |
          set -Eeuo pipefail
          echo "${SHA}" | grep -Eq '^[0-9a-f]{40}$'
          echo "${TAG}" | grep -Eq '^[0-9a-f]{40}$'
          echo "${DIG}" | grep -Eq '^sha256:[0-9a-f]{64}$'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha }}
      - name: SSH kill-switch
        env:
          TAG: ${{ github.event.inputs.image_tag }}
          DIG: ${{ github.event.inputs.image_digest }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/db03"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/db03/db_prod_i8_flag_remote.sh \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/db_prod_i8_flag_remote.sh"
          ssh -i ~/.ssh/sedi_deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/db_prod_i8_flag_remote.sh") && \
             DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
             PHASE=KILL_SWITCH \
             IMAGE_SHA=$(printf '%q' "${TAG}") \
             IMAGE_DIGEST=$(printf '%q' "${DIG}") \
             bash $(printf '%q' "${REMOTE_DIR}/db_prod_i8_flag_remote.sh")" \
            2>&1 | tee /tmp/i8flag_kill.log
          grep -Fq 'I8FLAG|phase_kill_switch|PASS' /tmp/i8flag_kill.log
          grep -Fq 'I8FLAG|i8_flag_effective|OFF' /tmp/i8flag_kill.log
          grep -Fq 'I8FLAG|scheduler_enabled_after|False' /tmp/i8flag_kill.log
          grep -Fq 'I8FLAG|schema_rollback_required|NO' /tmp/i8flag_kill.log
          if grep -Eiq 'info@sedi-ai\.com|DATABASE_URL=postgres' /tmp/i8flag_kill.log; then
            echo "SECRET_LEAK"; exit 2
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i8flag-kill
          path: /tmp/i8flag_kill.log
          retention-days: 14
