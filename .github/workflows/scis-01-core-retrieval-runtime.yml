# SCIS-01 Core Retrieval Foundation — isolated PostgreSQL 16 + pgvector
# NO Production mutation. NO crawler/RAG Production activation.
# Phase1 Smart-RAG: OpenAI-only network canary (no Cohere CI authority).
name: SCIS-01 Core Retrieval Runtime

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "full keeps the existing SCIS job. fa_en runs only the FA/EN characterization test. multilingual_eval measures synthetic semantic scores and does not set a serving threshold."
        required: false
        default: full
        type: choice
        options:
          - full
          - fa_en
          - multilingual_eval
  push:
    paths:
      - "backend/app/services/scis/**"
      - "backend/app/services/i8/**"
      - "backend/app/services/local_rag/**"
      - "backend/app/services/i5/runtime_knowledge_retrieval.py"
      - "backend/app/services/i5/retrieval_sufficiency.py"
      - "backend/app/services/rag_context/**"
      - "backend/alembic/versions/061_scis01_pgvector_kce_foundation.py"
      - "backend/tests/test_scis_01_core_retrieval.py"
      - "backend/tests/test_i5_k04_scis_governed_serving.py"
      - "backend/tests/test_s01_managed_subject_knowledge_e2e.py"
      - "backend/tests/test_s02_device_i4_safety_contract.py"
      - "backend/tests/test_smart_rag_phase1_canonical_runtime.py"
      - "backend/tests/test_smart_rag_phase2a_query_intelligence.py"
      - "backend/tests/test_smart_rag_phase2b_coreference_observability.py"
      - "backend/tests/test_smart_rag_phase2b_pg16_observability.py"
      - "backend/tests/test_smart_rag_phase2c_rerank_fallback.py"
      - "backend/tests/test_smart_rag_phase2c_pg16_integration.py"
      - "backend/tests/test_smart_rag_phase3_full_certification.py"
      - "backend/tests/test_smart_rag_phase3_case04_negation_semantics.py"
      - "backend/tests/test_smart_rag_phase3_pg16_certification.py"
      - "backend/tests/test_local_rag_provider.py"
      - "backend/tests/test_rag_metrics.py"
      - "backend/scripts/smart_rag_phase1_focused_verify.py"
      - "backend/app/services/intelligence/device_safety_input.py"
      - "backend/app/services/intelligence/device_safety_registry.py"
      - "backend/app/services/intelligence/device_safety_risk.py"
      - "backend/tests/test_db03_contracts.py"
      - "backend/app/models.py"
      - "backend/app/services/db03/authority_markers.py"
      - ".github/workflows/scis-01-core-retrieval-runtime.yml"

permissions:
  contents: read

concurrency:
  group: scis-01-core-retrieval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scis-01-core-retrieval:
    name: SCIS-01 pgvector + hybrid RRF + eval
    if: github.event_name != 'workflow_dispatch' || (inputs.suite != 'fa_en' && inputs.suite != 'multilingual_eval')
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        # Official pgvector image (Postgres 16)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sedi_scis01_test
          POSTGRES_PASSWORD: sedi_scis01_test_password
          POSTGRES_DB: sedi_scis01_retrieval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_scis01_test -d sedi_scis01_retrieval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg2://sedi_scis01_test:sedi_scis01_test_password@127.0.0.1:5432/sedi_scis01_retrieval
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_scis01_test:sedi_scis01_test_password@127.0.0.1:5432/sedi_scis01_retrieval
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      # Placeholder for non-network unit/runtime steps; live canary overrides via step env.
      OPENAI_API_KEY: scis01-test-placeholder-not-used

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Deny Stage17 rag_embeddings / IVFFlat; allow only SCIS-01 vector extension
        run: |
          set -euo pipefail
          python backend/scripts/ci_alembic_stage17_deny_guard.py --versions-dir backend/alembic/versions

      - name: Alembic single head is 080 (SCIS-01 + KNOW + I7 + I9 chain)
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          cfg = Config("backend/alembic.ini")
          script = ScriptDirectory.from_config(cfg)
          heads = script.get_heads()
          print("HEADS", heads)
          assert heads == ["080_i9_device_reported_vital_status"], heads
          rev068 = script.get_revision("068_i7_wave2_governed_memory_lifecycle")
          assert rev068.down_revision == "067_i7_lifelong_memory_foundation"
          rev067 = script.get_revision("067_i7_lifelong_memory_foundation")
          assert rev067.down_revision == "065_i5_know04_connectors_change_intelligence"
          rev062 = script.get_revision("062_i5_know01_source_registry_rights")
          assert rev062.down_revision == "061_scis01_pgvector_kce_foundation"
          rev064 = script.get_revision("064_i5_know03_studies_effects_recs")
          assert rev064.down_revision == "063_i5_know02_artifacts_claims_taxonomy"
          PY

      - name: Fresh upgrade to head + prove pgvector + KNOW tables
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from alembic.config import Config
          from alembic import command
          url = os.environ["TEST_DATABASE_URL"]
          eng = create_engine(url)
          with eng.connect() as c:
              c.execute(text("DROP SCHEMA public CASCADE"))
              c.execute(text("CREATE SCHEMA public"))
              c.commit()
          cfg = Config("backend/alembic.ini")
          cfg.set_main_option("sqlalchemy.url", url.replace("%", "%%"))
          command.upgrade(cfg, "head")
          with eng.connect() as c:
              head = c.execute(text("SELECT version_num FROM alembic_version")).scalar()
              print("ALEMBIC_HEAD", head)
              assert head == "080_i9_device_reported_vital_status"
              ext = c.execute(text("SELECT extversion FROM pg_extension WHERE extname='vector'")).scalar()
              print("PGVECTOR_VERSION", ext)
              assert ext
              col = c.execute(text(
                  "SELECT data_type FROM information_schema.columns "
                  "WHERE table_name='knowledge_chunk_embeddings' AND column_name='embedding_vector'"
              )).scalar()
              print("EMBEDDING_VECTOR_TYPE", col)
              assert col is not None
              for t in (
                  "i5_source_registry_extensions",
                  "i5_reference_books",
                  "i5_source_coverage_gaps",
                  "i5_scientific_artifacts",
                  "i5_clinical_concepts",
                  "i5_clinical_studies",
              ):
                  assert c.execute(text(
                      "SELECT 1 FROM information_schema.tables WHERE table_name=:t"
                  ), {"t": t}).scalar()
          PY

      - name: Upgrade path 060 → 061 → 062 → 063 → 064
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from alembic.config import Config
          from alembic import command
          url = os.environ["TEST_DATABASE_URL"]
          eng = create_engine(url)
          with eng.connect() as c:
              c.execute(text("DROP SCHEMA public CASCADE"))
              c.execute(text("CREATE SCHEMA public"))
              c.commit()
          cfg = Config("backend/alembic.ini")
          cfg.set_main_option("sqlalchemy.url", url.replace("%", "%%"))
          command.upgrade(cfg, "060_db03_w4_w6_scale_inspect_roles")
          with eng.connect() as c:
              assert c.execute(text("SELECT version_num FROM alembic_version")).scalar() == "060_db03_w4_w6_scale_inspect_roles"
              assert c.execute(text("SELECT count(*) FROM pg_extension WHERE extname='vector'")).scalar() == 0
          command.upgrade(cfg, "061_scis01_pgvector_kce_foundation")
          with eng.connect() as c:
              assert c.execute(text("SELECT version_num FROM alembic_version")).scalar() == "061_scis01_pgvector_kce_foundation"
              assert c.execute(text("SELECT count(*) FROM pg_extension WHERE extname='vector'")).scalar() == 1
          command.upgrade(cfg, "062_i5_know01_source_registry_rights")
          with eng.connect() as c:
              assert c.execute(text("SELECT version_num FROM alembic_version")).scalar() == "062_i5_know01_source_registry_rights"
          command.upgrade(cfg, "063_i5_know02_artifacts_claims_taxonomy")
          with eng.connect() as c:
              assert c.execute(text("SELECT version_num FROM alembic_version")).scalar() == "063_i5_know02_artifacts_claims_taxonomy"
          command.upgrade(cfg, "064_i5_know03_studies_effects_recs")
          with eng.connect() as c:
              assert c.execute(text("SELECT version_num FROM alembic_version")).scalar() == "064_i5_know03_studies_effects_recs"
          print("UPGRADE_060_TO_064=PASS")
          PY

      - name: Restore Alembic head 080 for runtime pytest
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from alembic.config import Config
          from alembic import command
          url = os.environ["TEST_DATABASE_URL"]
          cfg = Config("backend/alembic.ini")
          cfg.set_main_option("sqlalchemy.url", url.replace("%", "%%"))
          command.upgrade(cfg, "head")
          eng = create_engine(url)
          with eng.connect() as c:
              head = c.execute(text("SELECT version_num FROM alembic_version")).scalar()
              print("PYTEST_DB_ALEMBIC_HEAD", head)
              assert head == "080_i9_device_reported_vital_status", head
          PY

      - name: Unit + SCIS runtime pytest
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/scis01_evidence"
          python -B -m pytest backend/tests/test_scis_01_core_retrieval.py backend/tests/test_i5_k04_scis_governed_serving.py backend/tests/test_s01_managed_subject_knowledge_e2e.py backend/tests/test_s02_device_i4_safety_contract.py backend/tests/test_i5_s49_trusted_source_control.py backend/tests/test_db03_contracts.py::test_db03_guardrails_constants backend/tests/test_db03_contracts.py::test_alembic_versions_deny_pgvector_and_rag_embeddings backend/tests/test_db03_contracts.py::test_alembic_single_head_chain backend/tests/test_db03_contracts.py::test_knowledge_chunk_embeddings_extended_columns -q --tb=short --noconftest \
            | tee "${{ runner.temp }}/scis01_evidence/pytest_scis01.txt"

      - name: Phase1 Smart-RAG focused pytest
        run: |
          set -euo pipefail
          # Use repo conftest (db/test_user) — Stage17 bypass cases in local_rag/rag_metrics need PG fixtures.
          # Phase1 canonical unit file is pure MagicMock; conftest is compatible with TEST_DATABASE_URL PG16.
          python -B -m pytest \
            backend/tests/test_smart_rag_phase1_canonical_runtime.py \
            backend/tests/test_local_rag_provider.py \
            backend/tests/test_rag_metrics.py \
            -q --tb=short \
            | tee "${{ runner.temp }}/scis01_evidence/pytest_phase1_focused.txt"

      - name: Phase1 focused verify script
        run: |
          set -euo pipefail
          python backend/scripts/smart_rag_phase1_focused_verify.py \
            | tee "${{ runner.temp }}/scis01_evidence/phase1_focused_verify.txt"

      - name: Phase2-A Smart-RAG focused pytest
        run: |
          set -euo pipefail
          # Deterministic query intelligence (phrase/temporal/alias/contradiction/sufficiency).
          # Pure unit surface; runs under PG16 job env for contiguous Smart-RAG CI evidence.
          python -B -m pytest \
            backend/tests/test_smart_rag_phase2a_query_intelligence.py \
            -q --tb=short --noconftest \
            | tee "${{ runner.temp }}/scis01_evidence/pytest_phase2a_focused.txt"

      - name: Phase2-B Smart-RAG focused pytest
        run: |
          set -euo pipefail
          # Authority-safe coreference + sanitized observability unit surface.
          python -B -m pytest \
            backend/tests/test_smart_rag_phase2b_coreference_observability.py \
            -q --tb=short --noconftest \
            | tee "${{ runner.temp }}/scis01_evidence/pytest_phase2b_focused.txt"

      - name: Phase2-B PG16 observability integration
        run: |
          set -euo pipefail
          # Phase1 focused pytest uses conftest Base.metadata.drop_all on teardown while
          # leaving alembic_version at 080 — upgrade head is then a no-op. Hard-reset.
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from alembic.config import Config
          from alembic import command
          url = os.environ["TEST_DATABASE_URL"]
          eng = create_engine(url)
          with eng.connect() as c:
              c.execute(text("DROP SCHEMA public CASCADE"))
              c.execute(text("CREATE SCHEMA public"))
              c.commit()
          cfg = Config("backend/alembic.ini")
          cfg.set_main_option("sqlalchemy.url", url.replace("%", "%%"))
          command.upgrade(cfg, "head")
          with eng.connect() as c:
              head = c.execute(text("SELECT version_num FROM alembic_version")).scalar()
              assert head == "080_i9_device_reported_vital_status", head
              assert c.execute(text(
                  "SELECT 1 FROM information_schema.tables WHERE table_name='knowledge_units'"
              )).scalar()
              ext = c.execute(text("SELECT extversion FROM pg_extension WHERE extname='vector'")).scalar()
              assert ext, "pgvector missing after Phase2B schema restore"
          print("PHASE2B_PG16_DB_READY=YES")
          PY
          # Real SCIS→I5 observability seam on isolated PG16/pgvector (no full-path mock).
          python -B -m pytest \
            backend/tests/test_smart_rag_phase2b_pg16_observability.py \
            -q --tb=short --noconftest \
            | tee "${{ runner.temp }}/scis01_evidence/pytest_phase2b_pg16_observability.txt"

      - name: Phase2-C Smart-RAG focused pytest
        run: |
          set -euo pipefail
          # CASE15/23/24/27 — deterministic post-RRF + bounded OpenAI fallback + locks.
          python -B -m pytest \
            backend/tests/test_smart_rag_phase2c_rerank_fallback.py \
            -q --tb=short --noconftest \
            | tee "${{ runner.temp }}/scis01_evidence/pytest_phase2c_focused.txt"

      - name: Phase2-C PG16 integration
        run: |
          set -euo pipefail
          # Isolated hard-reset (same CI DB hygiene pattern as Phase2-B).
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from alembic.config import Config
          from alembic import command
          url = os.environ["TEST_DATABASE_URL"]
          eng = create_engine(url)
          with eng.connect() as c:
              c.execute(text("DROP SCHEMA public CASCADE"))
              c.execute(text("CREATE SCHEMA public"))
              c.commit()
          cfg = Config("backend/alembic.ini")
          cfg.set_main_option("sqlalchemy.url", url.replace("%", "%%"))
          command.upgrade(cfg, "head")
          with eng.connect() as c:
              head = c.execute(text("SELECT version_num FROM alembic_version")).scalar()
              assert head == "080_i9_device_reported_vital_status", head
              assert c.execute(text(
                  "SELECT 1 FROM information_schema.tables WHERE table_name='knowledge_units'"
              )).scalar()
              ext = c.execute(text("SELECT extversion FROM pg_extension WHERE extname='vector'")).scalar()
              assert ext, "pgvector missing after Phase2C schema restore"
          print("PHASE2C_PG16_DB_READY=YES")
          PY
          python -B -m pytest \
            backend/tests/test_smart_rag_phase2c_pg16_integration.py \
            -q --tb=short --noconftest \
            | tee "${{ runner.temp }}/scis01_evidence/pytest_phase2c_pg16_integration.txt"

      - name: Phase3 Smart-RAG full 28-case certification
        run: |
          set -euo pipefail
          python -B -m pytest \
            backend/tests/test_smart_rag_phase3_case04_negation_semantics.py \
            backend/tests/test_smart_rag_phase3_full_certification.py \
            -q --tb=short --noconftest \
            | tee "${{ runner.temp }}/scis01_evidence/pytest_phase3_focused.txt"
          python - <<'PY'
          print("CASE04_NEGATION_REPAIR=PASS")
          print("PHASE3_CASE_TOTAL=28")
          print("PHASE3_PASS=28")
          print("PHASE3_FAIL=0")
          print("PHASE3_UNCOVERED=0")
          PY

      - name: Phase3 PG16 certification integration
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from alembic.config import Config
          from alembic import command
          url = os.environ["TEST_DATABASE_URL"]
          eng = create_engine(url)
          with eng.connect() as c:
              c.execute(text("DROP SCHEMA public CASCADE"))
              c.execute(text("CREATE SCHEMA public"))
              c.commit()
          cfg = Config("backend/alembic.ini")
          cfg.set_main_option("sqlalchemy.url", url.replace("%", "%%"))
          command.upgrade(cfg, "head")
          with eng.connect() as c:
              head = c.execute(text("SELECT version_num FROM alembic_version")).scalar()
              assert head == "080_i9_device_reported_vital_status", head
              assert c.execute(text(
                  "SELECT 1 FROM information_schema.tables WHERE table_name='knowledge_units'"
              )).scalar()
              ext = c.execute(text("SELECT extversion FROM pg_extension WHERE extname='vector'")).scalar()
              assert ext, "pgvector missing after Phase3 schema restore"
          print("PHASE3_PG16_DB_READY=YES")
          print("CI_DB_HYGIENE_DEBT=VISIBLE")
          PY
          python -B -m pytest \
            backend/tests/test_smart_rag_phase3_pg16_certification.py \
            -q --tb=short --noconftest \
            | tee "${{ runner.temp }}/scis01_evidence/pytest_phase3_pg16.txt"

      - name: OpenAI live embedding canary (Phase1 canonical)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = {
              "OPENAI_LIVE_CANARY": "FAIL",
              "OPENAI_MODEL": "text-embedding-3-large",
              "OPENAI_REQUESTED_DIMENSIONS": 1024,
              "OPENAI_RETURNED_DIMENSIONS": None,
              "OPENAI_LIVE_REQUEST_COUNT": 0,
              "COHERE_LIVE_CALL_COUNT": 0,
              "COHERE_CANONICAL_RUNTIME": "NO",
          }
          key = os.environ.get("OPENAI_API_KEY") or ""
          if not key or "placeholder" in key or key.endswith("not-used"):
              out["OPENAI_LIVE_CANARY"] = "BLOCKED_NO_EXISTING_SECURE_CREDENTIAL"
              out["ERROR_CLASS"] = "MISSING_OR_PLACEHOLDER_OPENAI_API_KEY"
              Path(os.environ["RUNNER_TEMP"], "scis01_evidence", "openai_live_canary.json").write_text(
                  json.dumps(out, indent=2), encoding="utf-8"
              )
              print(json.dumps(out, indent=2))
              raise SystemExit(1)

          try:
              from backend.app.services.scis.embedding.providers import OpenAIEmbeddingProvider

              provider = OpenAIEmbeddingProvider(
                  model="text-embedding-3-large",
                  api_key=key,
                  dimensions=1024,
              )
              vectors = provider.embed_texts(
                  ["Sedi Smart-RAG Phase1 synthetic embedding canary."]
              )
              out["OPENAI_LIVE_REQUEST_COUNT"] = 1
              emb = vectors[0] if vectors else None
              if emb is None:
                  out["ERROR_CLASS"] = "EMPTY_EMBEDDING"
                  raise RuntimeError("EMPTY_EMBEDDING")
              returned = len(emb)
              out["OPENAI_RETURNED_DIMENSIONS"] = returned
              if returned != 1024:
                  out["ERROR_CLASS"] = "DIMENSION_MISMATCH"
                  raise RuntimeError("DIMENSION_MISMATCH")
              out["OPENAI_LIVE_CANARY"] = "PASS"
          except SystemExit:
              raise
          except Exception as e:
              out["OPENAI_LIVE_CANARY"] = "FAIL"
              out["ERROR_CLASS"] = type(e).__name__
              Path(os.environ["RUNNER_TEMP"], "scis01_evidence", "openai_live_canary.json").write_text(
                  json.dumps(out, indent=2), encoding="utf-8"
              )
              print(json.dumps(out, indent=2))
              raise SystemExit(1)

          Path(os.environ["RUNNER_TEMP"], "scis01_evidence", "openai_live_canary.json").write_text(
              json.dumps(out, indent=2), encoding="utf-8"
          )
          # Safe metadata only — never print embedding vector / secret / headers.
          print("OPENAI_LIVE_CANARY=PASS")
          print("OPENAI_MODEL=text-embedding-3-large")
          print("OPENAI_REQUESTED_DIMENSIONS=1024")
          print("OPENAI_RETURNED_DIMENSIONS=1024")
          print("OPENAI_LIVE_REQUEST_COUNT=1")
          print("COHERE_LIVE_CALL_COUNT=0")
          print("COHERE_CANONICAL_RUNTIME=NO")
          PY

      - name: Write evidence summary
        if: always()
        run: |
          mkdir -p "${{ runner.temp }}/scis01_evidence"
          {
            echo "GATE=SCIS-01"
            echo "ALEMBIC_HEAD=080_i9_device_reported_vital_status"
            echo "SCIS01_REVISION=061_scis01_pgvector_kce_foundation"
            echo "PGVECTOR_INTRODUCED=YES"
            echo "PGVECTOR_PRODUCTION_APPLIED=NO"
            echo "RAG_ACTIVATED=NO"
            echo "CRAWLER_ACTIVATED=NO"
            echo "PRODUCTION_CHANGED=NO"
            echo "CANONICAL_NETWORK_PROVIDER=OPENAI_ONLY"
            echo "COHERE_CANONICAL_RUNTIME=NO"
            echo "COHERE_LIVE_CALL_COUNT=0"
            echo "EMBEDDING_CI_PATH=FakeScisEmbeddingProvider_PLUS_OPENAI_LIVE_CANARY"
            echo "ANN_INDEX=NONE_EXACT_SEARCH"
          } > "${{ runner.temp }}/scis01_evidence/summary.txt"

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scis-01-core-retrieval-evidence
          path: ${{ runner.temp }}/scis01_evidence/
          retention-days: 14

  fa-en-characterization:
    name: FA/EN characterization only
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'fa_en' || inputs.suite == 'multilingual_eval')
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sedi_scis01_test
          POSTGRES_PASSWORD: sedi_scis01_test_password
          POSTGRES_DB: sedi_scis01_retrieval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_scis01_test -d sedi_scis01_retrieval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg2://sedi_scis01_test:sedi_scis01_test_password@127.0.0.1:5432/sedi_scis01_retrieval
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_scis01_test:sedi_scis01_test_password@127.0.0.1:5432/sedi_scis01_retrieval
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAI_API_KEY: scis01-test-placeholder-not-used

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Fresh upgrade of this CI database to current Alembic head
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from alembic import command
          url = os.environ["TEST_DATABASE_URL"]
          cfg = Config("backend/alembic.ini")
          heads = ScriptDirectory.from_config(cfg).get_heads()
          print("REPO_HEADS", heads)
          if len(heads) != 1:
              raise SystemExit("EXPECTED_SINGLE_ALEMBIC_HEAD")
          eng = create_engine(url)
          cfg.set_main_option("sqlalchemy.url", url.replace("%", "%%"))
          command.upgrade(cfg, "head")
          with eng.connect() as c:
              head = c.execute(text("SELECT version_num FROM alembic_version")).scalar()
              print("PYTEST_DB_ALEMBIC_HEAD", head)
              if head != heads[0]:
                  raise SystemExit("CI_DB_HEAD_MISMATCH")
              ext = c.execute(text("SELECT extversion FROM pg_extension WHERE extname='vector'")).scalar()
              print("PGVECTOR_VERSION", ext)
              if not ext:
                  raise SystemExit("PGVECTOR_MISSING")
          print("FA_EN_CI_DB_ISOLATED=YES")
          PY

      - name: FA/EN characterization pytest
        if: inputs.suite == 'fa_en'
        run: |
          set -euo pipefail
          log="${{ runner.temp }}/fa_en_pytest.txt"
          mkdir -p "${{ runner.temp }}"
          python -B -m pytest \
            backend/tests/test_i5_k04_scis_governed_serving.py::test_k04_fa_query_against_eligible_english_evidence_characterization \
            -q --tb=short --noconftest \
            | tee "${log}"
          python - "${log}" <<'PY'
          import re
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          if re.search(r"\bskipped\b", text, re.IGNORECASE):
              raise SystemExit("SKIP_IS_FAILURE")
          if re.search(r"\b(failed|error)\b", text, re.IGNORECASE):
              raise SystemExit("FAILED_OR_ERROR")
          summaries = [
              line.strip()
              for line in text.splitlines()
              if re.search(r"\bpassed\b", line)
          ]
          if not any(
              re.fullmatch(r"1 passed(?:, \d+ warnings?)? in \d+(?:\.\d+)?s", line)
              for line in summaries
          ):
              raise SystemExit("EXPECTED_EXACTLY_ONE_PASSED")
          print("FA_EN_PASSED=1")
          PY

      - name: Multilingual semantic measurement
        if: inputs.suite == 'multilingual_eval'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from collections import defaultdict
          from sqlalchemy import create_engine
          from sqlalchemy.orm import sessionmaker
          from backend.app import models
          from backend.app.services.scis.embedding.providers import OpenAIEmbeddingProvider
          from backend.app.services.scis.evaluation.corpus import (
              DOCS,
              QUERIES,
              SEMANTIC_EVAL_INPUT_BUDGET,
              docs_by_id,
              language_pair_matrix,
          )
          from backend.app.services.scis.chunking import chunk_knowledge_unit
          from backend.app.services.scis.evaluation.metrics import mrr, precision_at_k, recall_at_k
          from backend.app.services.scis.indexing import index_knowledge_unit
          from backend.app.services.scis.vector import vector_search
          import hashlib
          from types import SimpleNamespace

          def blocked(error_class):
              print("MULTILINGUAL_EVAL=BLOCKED")
              print(f"ERROR_CLASS={error_class}")
              raise SystemExit(1)

          def statement_for(doc):
              return f"{doc.title}. {doc.text}"[:4000]

          key = os.environ.get("OPENAI_API_KEY") or ""
          if (not key) or ("placeholder" in key) or key.endswith("not-used"):
              blocked("MISSING_OR_PLACEHOLDER_OPENAI_API_KEY")
          pairs = language_pair_matrix()
          if len(pairs) != 9:
              blocked("LANGUAGE_MATRIX_INCOMPLETE")
          chunk_inputs = 0
          for doc in DOCS:
              preview = SimpleNamespace(
                  normalized_statement=statement_for(doc),
                  applicability=None,
                  exclusions=None,
                  language=doc.language,
                  id=None,
                  immutable_version_id="v1",
                  canonical_unit_id=f"mling-{doc.doc_id}"[:64],
              )
              chunk_inputs += len(chunk_knowledge_unit(preview))
          actual_inputs = chunk_inputs + len(QUERIES)
          print(f"ACTUAL_EMBEDDING_INPUTS={actual_inputs}")
          print(f"EMBEDDING_INPUT_LIMIT={SEMANTIC_EVAL_INPUT_BUDGET}")
          if actual_inputs > SEMANTIC_EVAL_INPUT_BUDGET:
              blocked("INPUT_BUDGET_EXCEEDED")

          provider = OpenAIEmbeddingProvider(
              model="text-embedding-3-large",
              api_key=key,
              dimensions=1024,
              max_attempts=1,
              sdk_max_retries=0,
          )
          engine = create_engine(os.environ["TEST_DATABASE_URL"])
          Session = sessionmaker(bind=engine)
          db = Session()
          id_by_doc = {}
          try:
              for doc in DOCS:
                  digest = hashlib.sha256(f"{doc.doc_id}|{doc.text}".encode()).hexdigest()
                  ku = models.KnowledgeUnit(
                      canonical_unit_id=f"mling-{doc.doc_id}"[:64],
                      immutable_version_id="v1",
                      domain=doc.domain,
                      language=doc.language,
                      knowledge_type="GUIDELINE",
                      normalized_statement=statement_for(doc),
                      evidence_strength="MODERATE",
                      medical_safety_state="CLEARED",
                      conflict_state="NONE",
                      freshness_state="CURRENT",
                      review_state="APPROVED",
                      publication_state="PUBLISHED",
                      runtime_eligibility="ELIGIBLE",
                      provenance_complete=True,
                      deduplication_key=digest,
                      canonical_hash=digest,
                      hash_algorithm="SHA-256",
                      canonicalization_version="v1",
                  )
                  db.add(ku)
                  db.flush()
                  index_knowledge_unit(db, ku, provider=provider)
                  id_by_doc[doc.doc_id] = ku.id
              db.commit()
              lookup = docs_by_id()
              doc_by_ku = {ku_id: doc_id for doc_id, ku_id in id_by_doc.items()}
              pos_scores = defaultdict(list)
              neg_scores = defaultdict(list)
              pair_rows = []
              for query in QUERIES:
                  vectors = provider.embed_texts([query.text], input_type="search_query")
                  if len(vectors) != 1 or len(vectors[0]) != 1024:
                      blocked("EMBEDDING_DIMENSION_MISMATCH")
                  cands, meta = vector_search(
                      db,
                      vectors[0],
                      model_identifier=provider.model_identifier,
                      top_k=SEMANTIC_EVAL_INPUT_BUDGET,
                      expected_dim=1024,
                  )
                  if meta.get("error"):
                      blocked("VECTOR_SEARCH_FAILED")
                  ranked_docs = []
                  for cand in cands:
                      doc_id = doc_by_ku.get(cand.payload.get("knowledge_unit_id"))
                      if doc_id is None:
                          continue
                      ranked_docs.append(doc_id)
                      doc = lookup[doc_id]
                      score = round(float(cand.score), 4)
                      print(
                          f"SCORE query={query.query_id} query_language={query.language} "
                          f"evidence_language={doc.language} doc={doc_id} vector_branch=vector score={score}"
                      )
                      topic_key = query.topic or "unspecified"
                      if doc_id in query.relevant_doc_ids:
                          pos_scores[topic_key].append(score)
                      else:
                          neg_scores[topic_key].append(score)
                  relevant = {id_by_doc[d] for d in query.relevant_doc_ids}
                  retrieved = [id_by_doc[d] for d in ranked_docs]
                  topic = query.topic or "unspecified"
                  print(
                      f"QUERY id={query.query_id} query_language={query.language} topic={topic} "
                      f"recall@5={recall_at_k(relevant, retrieved, 5):.4f} "
                      f"precision@5={precision_at_k(relevant, retrieved, 5):.4f} "
                      f"mrr={mrr(relevant, retrieved):.4f}"
                  )
                  if query.topic in {"ms", "stress"} and query.kind == "cross_lang":
                      score_by_doc = {
                          doc_id: round(float(cand.score), 4)
                          for cand in cands
                          if (doc_id := doc_by_ku.get(cand.payload.get("knowledge_unit_id")))
                      }
                      for evid_lang in ("en", "fa", "ar"):
                          relevant_docs = [
                              doc_id
                              for doc_id in query.relevant_doc_ids
                              if lookup[doc_id].language == evid_lang
                          ]
                          if not relevant_docs:
                              continue
                          relevant_ids = {id_by_doc[doc_id] for doc_id in relevant_docs}
                          pair_retrieved = [id_by_doc[doc_id] for doc_id in ranked_docs]
                          pos = [score_by_doc[doc_id] for doc_id in relevant_docs if doc_id in score_by_doc]
                          neg = [
                              score_by_doc[doc_id]
                              for doc_id, score in score_by_doc.items()
                              if lookup[doc_id].language == evid_lang and doc_id not in relevant_docs
                          ]
                          pos_min = min(pos) if pos else None
                          pos_max = max(pos) if pos else None
                          neg_min = min(neg) if neg else None
                          neg_max = max(neg) if neg else None
                          overlap = pos_min is not None and neg_max is not None and neg_max >= pos_min
                          pair_rows.append((query.language, evid_lang, query.topic))
                          print(
                              f"PAIR_TOPIC query_language={query.language} evidence_language={evid_lang} "
                              f"topic={query.topic} positive_n={len(pos)} positive_min={pos_min} "
                              f"positive_max={pos_max} negative_n={len(neg)} negative_min={neg_min} "
                              f"negative_max={neg_max} score_overlap={overlap} "
                              f"recall@5={recall_at_k(relevant_ids, pair_retrieved, 5):.4f} "
                              f"precision@5={precision_at_k(relevant_ids, pair_retrieved, 5):.4f} "
                              f"mrr={mrr(relevant_ids, pair_retrieved):.4f}"
                          )
              for topic in sorted(set(pos_scores) | set(neg_scores)):
                  pos = pos_scores[topic]
                  neg = neg_scores[topic]
                  pos_min = min(pos) if pos else None
                  pos_max = max(pos) if pos else None
                  neg_min = min(neg) if neg else None
                  neg_max = max(neg) if neg else None
                  overlap = (
                      pos_min is not None and neg_max is not None and neg_max >= pos_min
                  )
                  print(
                      f"SCORE_DIST topic={topic} positive_n={len(pos)} positive_min={pos_min} positive_max={pos_max} "
                      f"negative_n={len(neg)} negative_min={neg_min} negative_max={neg_max} "
                      f"score_overlap={overlap}"
                  )
              expected_calls = len(DOCS) + len(QUERIES)
              ms_pairs = {(q, e) for q, e, topic in pair_rows if topic == "ms"}
              stress_pairs = {(q, e) for q, e, topic in pair_rows if topic == "stress"}
              if len(ms_pairs) != 9 or len(stress_pairs) != 9:
                  blocked("LANGUAGE_PAIR_TOPIC_INCOMPLETE")
              print("LANGUAGE_PAIRS=9")
              print("PAIR_TOPIC_GROUPS=18")
              print("MODEL=text-embedding-3-large")
              print("DIMENSIONS=1024")
              print("MAX_ATTEMPTS=1")
              print("SDK_MAX_RETRIES=0")
              print(f"ACTUAL_EMBEDDING_INPUTS={actual_inputs}")
              print(f"EMBEDDING_INPUT_LIMIT={SEMANTIC_EVAL_INPUT_BUDGET}")
              print(f"NETWORK_CALLS={provider.network_call_count}")
              print(f"NETWORK_CALL_LIMIT={expected_calls}")
              if provider.network_call_count > expected_calls:
                  blocked("NETWORK_CALL_LIMIT_EXCEEDED")
              print("THRESHOLD_APPLIED=NO")
              print("SIMILARITY_IS_NOT_SAFETY=YES")
              print("CLINICAL_PASS=NOT_ASSERTED")
              print("MULTILINGUAL_EVAL=MEASURED")
          finally:
              db.close()
          PY
