# A4 post-promote production readonly verification (workflow_dispatch only).
# No env mutation, no FCM send, no synthetic notifications, no DB mutation.
name: A4 Post-Promote Production Readonly

on:
  workflow_dispatch:

concurrency:
  group: sedi-production-backend-operation
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPECTED_IMAGE_TAG: 49f602d0fa50f4a2b1db50dd559f3cf44fb9ac7c
  EXPECTED_REGISTRY_DIGEST: sha256:7fc38ca0e85e1b4305ffb76ec51c562a6ba983405278fedf7a3cb4f81c0e5a3c
  EXPECTED_ALEMBIC: 087_a4_notification_inbox_visibility
  EXPECTED_FA_TITLE: "پیگیری روزانه صدی"
  EXPECTED_FA_BODY: "یک لمس آرام برای امروز. هر وقت آماده بودی با صدی ادامه بده."

jobs:
  a4-readonly-verify:
    name: A4 production readonly verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts

      - name: Run A4 readonly production verify
        env:
          EXPECTED_IMAGE_TAG: ${{ env.EXPECTED_IMAGE_TAG }}
          EXPECTED_REGISTRY_DIGEST: ${{ env.EXPECTED_REGISTRY_DIGEST }}
          EXPECTED_ALEMBIC: ${{ env.EXPECTED_ALEMBIC }}
          EXPECTED_FA_TITLE: ${{ env.EXPECTED_FA_TITLE }}
          EXPECTED_FA_BODY: ${{ env.EXPECTED_FA_BODY }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH_Q="$(printf '%q' "${{ secrets.SEDI_DEPLOY_PATH }}")"
          TAG_Q="$(printf '%q' "${EXPECTED_IMAGE_TAG}")"
          DIGEST_Q="$(printf '%q' "${EXPECTED_REGISTRY_DIGEST}")"
          ALEMBIC_Q="$(printf '%q' "${EXPECTED_ALEMBIC}")"
          TITLE_Q="$(printf '%q' "${EXPECTED_FA_TITLE}")"
          BODY_Q="$(printf '%q' "${EXPECTED_FA_BODY}")"

          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "DEPLOY_PATH=${DEPLOY_PATH_Q} EXPECTED_TAG=${TAG_Q} EXPECTED_DIGEST=${DIGEST_Q} EXPECTED_ALEMBIC=${ALEMBIC_Q} EXPECTED_FA_TITLE=${TITLE_Q} EXPECTED_FA_BODY=${BODY_Q} bash -s" \
            <<'REMOTE' | tee /tmp/a4_postpromote_readonly.log
          set -Eeuo pipefail
          log() { echo "[$(date -Is)] $*"; }
          summary() { echo "A4VERIFY_SUMMARY|$1|$2"; }

          ENV_FILE="/etc/sedi/sedi-backend.env"
          cd "${DEPLOY_PATH}"

          RUNNING_IMG="$(docker inspect sedi-backend --format '{{.Config.Image}}')"
          RUNNING_ID="$(docker inspect sedi-backend --format '{{.Image}}')"
          OCI_REV="$(docker image inspect "${RUNNING_ID}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' 2>/dev/null || true)"
          summary "running_image" "${RUNNING_IMG}"
          summary "running_image_id" "${RUNNING_ID}"
          summary "oci_revision" "${OCI_REV:-none}"
          echo "${RUNNING_IMG}" | grep -Fq ":${EXPECTED_TAG}"
          [ "${OCI_REV}" = "${EXPECTED_TAG}" ] || [ -z "${OCI_REV}" ]

          PU="$(docker exec sedi-postgres printenv POSTGRES_USER)"
          PD="$(docker exec sedi-postgres printenv POSTGRES_DB)"
          docker exec sedi-postgres pg_isready -U "${PU}" -d "${PD}"
          ALEMBIC_COUNT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM alembic_version;")"
          ALEMBIC_REV="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT version_num FROM alembic_version;")"
          summary "alembic_count" "${ALEMBIC_COUNT}"
          summary "alembic_revision" "${ALEMBIC_REV}"
          [ "${ALEMBIC_COUNT}" = "1" ]
          [ "${ALEMBIC_REV}" = "${EXPECTED_ALEMBIC}" ]

          HIDDEN_COL="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='notifications' AND column_name='inbox_hidden_at') THEN 'YES' ELSE 'NO' END")"
          summary "inbox_hidden_at" "${HIDDEN_COL}"
          [ "${HIDDEN_COL}" = "YES" ]

          curl -fsS http://127.0.0.1:8000/health; echo
          curl -fsS http://127.0.0.1:8000/healthz; echo
          curl -fsS https://api.sedi-ai.com/health; echo
          curl -fsS https://api.sedi-ai.com/healthz; echo
          summary "health" "PASS"
          summary "healthz" "PASS"

          PROVIDER="$(docker exec sedi-backend printenv SEDI_NOTIFICATION_PROVIDER_DELIVERY_ENABLED 2>/dev/null || true)"
          summary "provider_delivery_enabled" "${PROVIDER}"
          [ "${PROVIDER}" = "true" ]

          # Scheduler enabled: APScheduler started in running process (log evidence; no flag flip).
          SCHED_LOG="$(docker logs --since 2h sedi-backend 2>&1 | grep -F 'Background scheduler started successfully' | tail -n1 || true)"
          summary "scheduler_started_line_present" "$([ -n "${SCHED_LOG}" ] && echo YES || echo NO)"
          [ -n "${SCHED_LOG}" ]
          summary "scheduler_enabled" "YES"

          # Job schedule authority from deployed image source (live APScheduler is in-process only).
          START_SRC="$(docker exec sedi-backend python -c "import inspect; from backend.app.core import scheduler as s; print(inspect.getsource(s.start_scheduler))")"
          MORNING_SRC="$(docker exec sedi-backend python -c "import inspect; from backend.app.core import scheduler as s; print(inspect.getsource(s.run_morning_notifications))")"
          INACT_SRC="$(docker exec sedi-backend python -c "import inspect; from backend.app.core import scheduler as s; print(inspect.getsource(s.run_inactivity_notifications))")"
          PING_SRC="$(docker exec sedi-backend python -c "import inspect; from backend.app.services.notification_engine import DecisionEngine; print(inspect.getsource(DecisionEngine.create_connection_ping))" )"
          MAX_PER_DAY="$(docker exec sedi-backend python -c "from backend.app.core import scheduler as s; print(s.REENGAGEMENT_MAX_PER_DAY)")"
          IDLE_H="$(docker exec sedi-backend python -c "from backend.app.core import scheduler as s; print(s.INACTIVE_HOURS)")"
          COOL_H="$(docker exec sedi-backend python -c "from backend.app.core import scheduler as s; print(s.REENGAGEMENT_COOLDOWN_HOURS)")"
          summary "inactive_hours" "${IDLE_H}"
          summary "reengagement_cooldown_hours" "${COOL_H}"
          summary "reengagement_max_per_day" "${MAX_PER_DAY}"
          [ "${IDLE_H}" = "4" ]
          [ "${COOL_H}" = "6" ]
          [ "${MAX_PER_DAY}" = "2" ]

          echo "${START_SRC}" | grep -Fq 'id="morning_notifications"'
          echo "${START_SRC}" | grep -Fq 'id="inactivity_notifications"'
          echo "${START_SRC}" | grep -Fq 'remove_job("engagement_nudge")'
          # Must not independently schedule engagement_nudge
          if echo "${START_SRC}" | grep -F 'add_job(' | grep -Fq 'run_engagement_nudge'; then
            log "engagement_nudge unexpectedly add_job'd"
            exit 40
          fi
          summary "legacy_engagement_nudge_scheduled" "NO"

          echo "${MORNING_SRC}" | grep -Fq 'create_daily_wellness_digest'
          if echo "${MORNING_SRC}" | grep -Fq 'create_morning_brief'; then
            log "morning_brief unexpectedly created by morning job"
            exit 41
          fi
          summary "legacy_morning_brief_scheduled" "NO"

          [ "${MAX_PER_DAY}" = "2" ]
          echo "${PING_SRC}" | grep -Fq 'presence_inactive_hours = 4'
          echo "${PING_SRC}" | grep -Fq 'reengagement_cooldown_hours = 6'
          echo "${PING_SRC}" | grep -Fq 'reengagement_max_per_local_day = 2'
          echo "${INACT_SRC}" | grep -Fq 'REENGAGEMENT_MAX_PER_DAY'
          echo "${INACT_SRC}" | grep -Fq 'REENGAGEMENT_COOLDOWN_HOURS'
          summary "reengagement_4h_2pd_6h" "YES"

          # FCM ready: project id + service account present; FCM_DISABLED not true; do not send.
          FCM_PROJECT="$(docker exec sedi-backend printenv FCM_PROJECT_ID 2>/dev/null || true)"
          FCM_SA="$(docker exec sedi-backend printenv FCM_SERVICE_ACCOUNT_JSON 2>/dev/null || true)"
          FCM_DISABLED="$(docker exec sedi-backend printenv FCM_DISABLED 2>/dev/null || true)"
          FCM_READY=NO
          case "$(printf '%s' "${FCM_DISABLED}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on) FCM_DISABLED_ON=YES ;;
            *) FCM_DISABLED_ON=NO ;;
          esac
          if [ -n "${FCM_PROJECT}" ] && [ -n "${FCM_SA}" ] && [ "${FCM_DISABLED_ON}" = "NO" ]; then
            FCM_READY=YES
          fi
          summary "fcm_project_present" "$([ -n "${FCM_PROJECT}" ] && echo YES || echo NO)"
          summary "fcm_sa_present" "$([ -n "${FCM_SA}" ] && echo YES || echo NO)"
          summary "fcm_disabled_on" "${FCM_DISABLED_ON}"
          summary "fcm_ready" "${FCM_READY}"
          [ "${FCM_READY}" = "YES" ]

          # Inbox 10d + routes from OpenAPI / live module.
          INBOX_DAYS="$(docker exec sedi-backend python -c "from backend.app.services.notifications.inbox_projection import USER_VISIBLE_HISTORY_DAYS; print(USER_VISIBLE_HISTORY_DAYS)")"
          summary "visible_days" "${INBOX_DAYS}"
          [ "${INBOX_DAYS}" = "10" ]
          summary "inbox_10d" "YES"

          OPENAPI="$(curl -fsS http://127.0.0.1:8000/openapi.json)"
          echo "${OPENAPI}" | grep -Fq '"/notifications/inbox/hide"'
          echo "${OPENAPI}" | grep -Fq '"/notifications/{notification_id}/feedback"'
          echo "${OPENAPI}" | grep -Fq '"/notifications/unread"'
          echo "${OPENAPI}" | grep -Fq '"/notifications"'
          summary "hide_route" "YES"
          summary "interaction_route" "YES"
          summary "unread_route" "YES"

          # Unread + list share same projection authority.
          NOTIF_MOD="$(docker exec sedi-backend python -c "import inspect; from backend.app.routers import notifications as n; print(inspect.getsource(n))")"
          FETCH_COUNT="$(printf '%s' "${NOTIF_MOD}" | grep -c 'fetch_sent_history_page' || true)"
          summary "fetch_sent_history_page_refs" "${FETCH_COUNT}"
          [ "${FETCH_COUNT}" -ge 2 ]
          summary "unread_same_visibility_authority" "YES"

          # Canonical FA daily copy exact in deployed image modules.
          FA_TITLE="$(docker exec sedi-backend python -c "from backend.app.services.i10.daily_wellness_digest import _GENERAL_CHECKIN_TITLES; print(_GENERAL_CHECKIN_TITLES['fa'])")"
          FA_BODY="$(docker exec sedi-backend python -c "from backend.app.services.i10.daily_wellness_digest import _GENERAL_CHECKIN_BODIES; print(_GENERAL_CHECKIN_BODIES['fa'])")"
          summary "fa_title" "${FA_TITLE}"
          summary "fa_body" "${FA_BODY}"
          [ "${FA_TITLE}" = "${EXPECTED_FA_TITLE}" ]
          [ "${FA_BODY}" = "${EXPECTED_FA_BODY}" ]
          summary "daily_fa_copy_exact" "YES"

          # No FCM send / no synthetic notification creation during this verify.
          summary "fcm_send_performed" "NO"
          summary "env_mutated" "NO"
          summary "registry_digest_expected" "${EXPECTED_DIGEST}"
          summary "deploy_path_backup_hint" "${DEPLOY_PATH}/backups/postgres"

          log "A4_POSTPROMOTE_READONLY_PASS"
          REMOTE

          grep -Fq 'A4_POSTPROMOTE_READONLY_PASS' /tmp/a4_postpromote_readonly.log
          grep -Fq 'A4VERIFY_SUMMARY|alembic_revision|087_a4_notification_inbox_visibility' /tmp/a4_postpromote_readonly.log
          grep -Fq 'A4VERIFY_SUMMARY|provider_delivery_enabled|true' /tmp/a4_postpromote_readonly.log
          grep -Fq 'A4VERIFY_SUMMARY|daily_fa_copy_exact|YES' /tmp/a4_postpromote_readonly.log
          grep -Fq 'A4VERIFY_SUMMARY|fcm_send_performed|NO' /tmp/a4_postpromote_readonly.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: a4-postpromote-readonly
          path: /tmp/a4_postpromote_readonly.log
          retention-days: 30
