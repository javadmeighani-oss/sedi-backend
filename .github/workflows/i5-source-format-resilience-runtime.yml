# I5 Source Format Resilience Runtime — fixture + adapter suite (no live network).
# Gate: PD-I5-V1-SOURCE-FORMAT-RESILIENCE-PRODUCTION-01
name: I5 Source Format Resilience Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/app/services/i5/adapters/**"
      - "backend/app/services/i5/conceptual_extraction.py"
      - "backend/app/services/i5/know01/format_capability_matrix.py"
      - "backend/tests/test_i5_source_format_resilience.py"
      - "backend/tests/test_section30_i5_w3_p01_adapters_extract.py"
      - ".github/workflows/i5-source-format-resilience-runtime.yml"

permissions:
  contents: read

concurrency:
  group: i5-source-format-resilience-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format-resilience-runtime:
    name: Format resilience adapters + security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: format-resilience-placeholder-not-used

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Targeted format resilience suite
        run: |
          python -B -m pytest \
            --noconftest \
            -p no:cacheprovider \
            -q --tb=short \
            backend/tests/test_i5_source_format_resilience.py \
            backend/tests/test_section30_i5_w3_p01_adapters_extract.py \
            backend/tests/test_i5_know01_foundation_gate.py::test_format_capability_matrix_complete_and_v1_required \
            backend/tests/test_i5_know01_foundation_gate.py::test_adaptive_routing_prefers_content_type_over_extension \
            backend/tests/test_i5_know01_source_registry.py::test_know01_pdf_and_jats_adapters_and_security

      - name: Controlled transport canary markers (fixture-proven; external LIVE pending)
        run: |
          python - <<'PY'
          from backend.app.services.i5.adapters.base import default_registry
          from backend.app.services.i5.adapters.representation_classifier import classify_representation
          from backend.app.services.i5.adapters.format_drift import classify_format_drift

          reg = default_registry()
          for mode in ("PUBLIC_WEB_FETCH","OFFICIAL_API","RSS_OR_FEED","OFFICIAL_XML","PDF_TEXT","CSV_TSV","DOCX"):
              a = reg.resolve_by_mode(mode)
              assert hasattr(a, "fetch_fixture")
              assert hasattr(a, "fetch_live"), mode
          d = classify_representation(content_type="application/json", payload=b'{"a":1}')
          assert d.representation == "JSON"
          drift = classify_format_drift(
              source_identity_key="canary",
              previous_representation="HTML",
              current_representation="PDF_IMAGE_ONLY",
          )
          assert drift.fail_closed and drift.preserve_last_known_good
          print("LIVE_TRANSPORT_METHODS=PRESENT")
          print("LIVE_EXTERNAL_SOURCE_PROOF=PENDING")
          print("FIXTURE_FORMAT_CANARY=PASS")
          print("FORMAT_DRIFT_FAIL_CLOSED=PASS")
          PY
