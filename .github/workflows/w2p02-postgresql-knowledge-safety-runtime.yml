# W2-P02 Focused PostgreSQL Knowledge Safety Runtime — GitHub workflow.
# Frozen contract: helper W2P02_RUNTIME_SELECTORS (10 → 40).
name: W2-P02 Focused PostgreSQL Knowledge Safety Runtime

on:
  workflow_dispatch:
  # Temporary registration trigger: GitHub cannot workflow_dispatch a never-run
  # workflow that exists only on a non-default branch (HTTP 404). Path-scoped so
  # only this YAML change fires registration. Removed after first registered run.
  push:
    branches:
      - feature/section15/backend-continuity-foundation
    paths:
      - .github/workflows/w2p02-postgresql-knowledge-safety-runtime.yml

permissions:
  contents: read

concurrency:
  group: w2p02-postgresql-knowledge-safety-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  w2p02-postgresql-knowledge-safety-runtime:
    name: W2-P02 PostgreSQL knowledge safety runtime (40 nodes)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sedi_w2p02_test
          POSTGRES_PASSWORD: sedi_w2p02_test_password
          POSTGRES_DB: sedi_w2p02_safety
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_w2p02_test -d sedi_w2p02_safety"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg2://sedi_w2p02_test:sedi_w2p02_test_password@127.0.0.1:5432/sedi_w2p02_safety
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_w2p02_test:sedi_w2p02_test_password@127.0.0.1:5432/sedi_w2p02_safety
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: w2p02-test-placeholder-not-used

    steps:
      - name: Configure runner temporary environment
        shell: bash
        run: |
          {
            echo "TMPDIR=$RUNNER_TEMP"
            echo "TEMP=$RUNNER_TEMP"
            echo "TMP=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Capture redacted dependency versions
        run: |
          python - <<'PY'
          import sys

          print("python", sys.version.split()[0])
          try:
              import pytest as _pytest
              print("pytest", getattr(_pytest, "__version__", "unknown"))
          except ImportError:
              print("BLOCKED_DEPENDENCY_RESOLUTION")
              raise SystemExit("BLOCKED_DEPENDENCY_RESOLUTION")
          try:
              import sqlalchemy
              sa_ver = getattr(sqlalchemy, "__version__", "0")
              print("sqlalchemy", sa_ver)
              major_text = sa_ver.split(".", 1)[0]
              try:
                  major = int(major_text)
              except ValueError:
                  major = 0
              if major < 2:
                  print("BLOCKED_DEPENDENCY_RESOLUTION")
                  raise SystemExit("BLOCKED_DEPENDENCY_RESOLUTION")
          except ImportError:
              print("BLOCKED_DEPENDENCY_RESOLUTION")
              raise SystemExit("BLOCKED_DEPENDENCY_RESOLUTION")
          try:
              import psycopg2
              print("psycopg2", getattr(psycopg2, "__version__", "unknown"))
          except ImportError:
              print("BLOCKED_DEPENDENCY_RESOLUTION")
              raise SystemExit("BLOCKED_DEPENDENCY_RESOLUTION")
          PY

      - name: Prepare runner-temp evidence directory
        run: |
          mkdir -p "${{ runner.temp }}/sedi_w2p02_postgres_runtime_evidence"

      - name: Process 1 — collect-only manifest (40 nodes)
        run: |
          python -B -m pytest \
            --collect-only \
            --noconftest \
            -p backend.tests.helpers.w2p02_postgres_runtime_plugin \
            -p no:cacheprovider \
            -q \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T5_01_metadata_contains_safety_tables \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T5_02_named_checks_present_in_pg_catalog \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T6_01_create_conflict \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T6_02_resolve_conflict \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T6_03_enqueue_safety_review \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T6_04_freshness_current \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T6_05_eligibility_eligible_path \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T7_negative_check_constraints \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T8_uq_fk_runtime_negative \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T9_fail_closed_matrix_and_guards

      - name: Process 2 — focused PostgreSQL knowledge safety runtime
        run: |
          python -B -m pytest \
            --noconftest \
            -p backend.tests.helpers.w2p02_postgres_runtime_plugin \
            -p no:cacheprovider \
            -q \
            --maxfail=1 \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T5_01_metadata_contains_safety_tables \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T5_02_named_checks_present_in_pg_catalog \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T6_01_create_conflict \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T6_02_resolve_conflict \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T6_03_enqueue_safety_review \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T6_04_freshness_current \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T6_05_eligibility_eligible_path \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T7_negative_check_constraints \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T8_uq_fk_runtime_negative \
            backend/tests/test_section30_i5_w2_p02_conflict_safety.py::test_W2P02_T9_fail_closed_matrix_and_guards

      - name: Upload redacted runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2p02-postgresql-knowledge-safety-evidence
          path: ${{ runner.temp }}/sedi_w2p02_postgres_runtime_evidence
          retention-days: 14
          if-no-files-found: error
