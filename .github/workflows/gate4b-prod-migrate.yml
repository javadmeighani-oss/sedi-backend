# Section 57 — Production Alembic 070→081 via sedi_migration_admin (workflow_dispatch only).
# Reuses Gate 4-B dispatch identity (registered on default branch). Feature-ref body applies.
# GATE=SEDI-V1-BACKEND-PROD-MIGRATE-070-TO-081-AND-RC-RUNTIME-CLOSURE-01
name: Gate 4-B Production Migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alembic-upgrade:
    name: Alembic 070→081 (migration admin)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload remote migrate script
        env:
          DEPLOY_PATH: ${{ secrets.SEDI_DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          REMOTE_DIR="${DEPLOY_PATH}/ops/db03"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/db03/db_prod_migrate_070_to_081_remote.sh \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/db_prod_migrate_070_to_081_remote.sh"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/db_prod_migrate_070_to_081_remote.sh")"

      - name: Run governed 070→081 migrate
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH_Q="$(printf '%q' "${{ secrets.SEDI_DEPLOY_PATH }}")"
          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "DEPLOY_PATH=${DEPLOY_PATH_Q} EXPECTED_BEFORE=070_i8_proactive_evaluation_ledger TARGET_REV=081_self_health_subject_1to1_hardening RC_SHA=cda11c932a3076d43633019d30c1eaaa6a183251 bash -s" \
            2>&1 | tee /tmp/mig070081_admin.log <<'REMOTE'
          set -Eeuo pipefail
          bash "${DEPLOY_PATH}/ops/db03/db_prod_migrate_070_to_081_remote.sh"
          REMOTE
          grep -Fq 'MIG070081|migration_070_to_081|PASS' /tmp/mig070081_admin.log
          grep -Fq 'MIGRATE_070_TO_081_PASS' /tmp/mig070081_admin.log

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mig070081-admin
          path: /tmp/mig070081_admin.log
          retention-days: 30
