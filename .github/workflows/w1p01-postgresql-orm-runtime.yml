# W1-P01 Focused PostgreSQL ORM Runtime — GitHub workflow (AUTHORING Gate).
# Frozen contract: v510 §62/§63/§70 + helper W1P01_RUNTIME_SELECTORS (15 → 105).
# AUTHORING-ONLY: do not dispatch from this Gate.
name: W1-P01 Focused PostgreSQL ORM Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w1p01-postgresql-orm-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  w1p01-postgresql-orm-runtime:
    name: W1-P01 PostgreSQL ORM runtime (105 nodes)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sedi_w1p01_test
          POSTGRES_PASSWORD: sedi_w1p01_test_password
          POSTGRES_DB: sedi_w1p01_orm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_w1p01_test -d sedi_w1p01_orm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PYTHONPATH: ${{ github.workspace }}
      # Identical approved test-only URLs (helper validation-only constant); never log full values.
      DATABASE_URL: postgresql+psycopg2://sedi_w1p01_test:sedi_w1p01_test_password@127.0.0.1:5432/sedi_w1p01_orm
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_w1p01_test:sedi_w1p01_test_password@127.0.0.1:5432/sedi_w1p01_orm
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: w1p01-test-placeholder-not-used
      # Force harness evidence under runner.temp (helper uses tempfile.gettempdir()).

    steps:
      - name: Configure runner temporary environment
        shell: bash
        run: |
          {
            echo "TMPDIR=$RUNNER_TEMP"
            echo "TEMP=$RUNNER_TEMP"
            echo "TMP=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Capture redacted dependency versions
        run: |
          python - <<'PY'
          import sys

          print("python", sys.version.split()[0])
          try:
              import pytest as _pytest
              print("pytest", getattr(_pytest, "__version__", "unknown"))
          except ImportError:
              print("BLOCKED_DEPENDENCY_RESOLUTION")
              raise SystemExit("BLOCKED_DEPENDENCY_RESOLUTION")
          try:
              import sqlalchemy
              sa_ver = getattr(sqlalchemy, "__version__", "0")
              print("sqlalchemy", sa_ver)
              major_text = sa_ver.split(".", 1)[0]
              try:
                  major = int(major_text)
              except ValueError:
                  major = 0
              if major < 2:
                  print("BLOCKED_DEPENDENCY_RESOLUTION")
                  raise SystemExit("BLOCKED_DEPENDENCY_RESOLUTION")
          except ImportError:
              print("BLOCKED_DEPENDENCY_RESOLUTION")
              raise SystemExit("BLOCKED_DEPENDENCY_RESOLUTION")
          try:
              import psycopg2
              print("psycopg2", getattr(psycopg2, "__version__", "unknown"))
          except ImportError:
              print("BLOCKED_DEPENDENCY_RESOLUTION")
              raise SystemExit("BLOCKED_DEPENDENCY_RESOLUTION")
          PY

      - name: Prepare runner-temp evidence directory
        run: |
          mkdir -p "${{ runner.temp }}/sedi_w1p01_postgres_runtime_evidence"

      - name: Process 1 — collect-only manifest (105 nodes)
        run: |
          python -B -m pytest \
            --collect-only \
            --noconftest \
            -p backend.tests.helpers.w1p01_postgres_runtime_plugin \
            -p no:cacheprovider \
            -q \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T5_01_metadata_contains_w1p01_tables \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T5_02_partial_unique_indexes_exist_in_pg_catalog \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T5_03_regex_check_names_present_on_i5gd \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T6_01_positive_weekly_run_insert \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T6_02_positive_attempt_and_gap \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T6_03_positive_source_and_gap_results \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T6_04_positive_governance_decision \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T6_05_positive_gsp_additive_fields \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T6_06_positive_completed_with_warnings_attempt \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T7_negative_check_constraints \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T8_01_simple_fk_runtime_negative \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T8_02_composite_fk_runtime_negative \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T8_03_ordinary_uq_runtime_negative \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T8_04_partial_uq_runtime_negative \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T9_04_same_request_key_payload_collision_is_db_enforced

      - name: Process 2 — focused PostgreSQL ORM runtime
        run: |
          python -B -m pytest \
            --noconftest \
            -p backend.tests.helpers.w1p01_postgres_runtime_plugin \
            -p no:cacheprovider \
            -q \
            --maxfail=1 \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T5_01_metadata_contains_w1p01_tables \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T5_02_partial_unique_indexes_exist_in_pg_catalog \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T5_03_regex_check_names_present_on_i5gd \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T6_01_positive_weekly_run_insert \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T6_02_positive_attempt_and_gap \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T6_03_positive_source_and_gap_results \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T6_04_positive_governance_decision \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T6_05_positive_gsp_additive_fields \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T6_06_positive_completed_with_warnings_attempt \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T7_negative_check_constraints \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T8_01_simple_fk_runtime_negative \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T8_02_composite_fk_runtime_negative \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T8_03_ordinary_uq_runtime_negative \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T8_04_partial_uq_runtime_negative \
            backend/tests/test_section15_i5_w1p01_orm_contracts.py::test_W1P01_T9_04_same_request_key_payload_collision_is_db_enforced

      - name: Upload redacted runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1p01-postgresql-orm-runtime-evidence
          path: ${{ runner.temp }}/sedi_w1p01_postgres_runtime_evidence
          retention-days: 14
          if-no-files-found: error
