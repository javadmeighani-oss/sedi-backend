# CAP-OPEN-17 Personalization Runtime — focused PostgreSQL CI
# Extends W4-P01 harness; 15 CAP17 nodes. No live network. No production write.
name: W4-P01 CAP17 Personalization Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w4p01-cap17-personalization-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  w4p01-cap17-personalization-runtime:
    name: W4-P01 CAP17 personalization runtime (15 nodes)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sedi_w4p01_test
          POSTGRES_PASSWORD: sedi_w4p01_test_password
          POSTGRES_DB: sedi_w4p01_cap17
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_w4p01_test -d sedi_w4p01_cap17"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg2://sedi_w4p01_test:sedi_w4p01_test_password@127.0.0.1:5432/sedi_w4p01_cap17
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_w4p01_test:sedi_w4p01_test_password@127.0.0.1:5432/sedi_w4p01_cap17
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: w4p01-cap17-test-placeholder-not-used

    steps:
      - name: Configure runner temporary environment
        shell: bash
        run: |
          {
            echo "TMPDIR=$RUNNER_TEMP"
            echo "TEMP=$RUNNER_TEMP"
            echo "TMP=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: PostgreSQL readiness
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U sedi_w4p01_test -d sedi_w4p01_cap17; then
              echo "postgres_ready"
              exit 0
            fi
            sleep 2
          done
          echo "postgres_not_ready"
          exit 1

      - name: Prepare runner-temp evidence directory
        run: |
          mkdir -p "${{ runner.temp }}/sedi_w4p01_postgres_runtime_evidence"
          mkdir -p "${{ runner.temp }}/sedi_w4p01_cap17_evidence_assurance_pack"

      - name: Static import hygiene
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          paths = [
              Path("backend/app/services/i5/runtime_knowledge_retrieval.py"),
              Path("backend/app/services/gate3/care_intelligence.py"),
              Path("backend/tests/test_section30_i5_w4_cap17_personalization.py"),
          ]
          for path in paths:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print("ast_ok", path)
          PY

      - name: Process 1 — collect-only manifest (15 nodes)
        run: |
          set -o pipefail
          python -B -m pytest \
            --collect-only \
            --noconftest \
            -p backend.tests.helpers.w4p01_cap17_postgres_runtime_plugin \
            -p no:cacheprovider \
            -q \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T00_malformed_personalization_degrades \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T01_baseline_empty_personalization \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T02_goal_relevance_ranking \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T03_query_relevance_precedes_personalization \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T04_safety_precedence_not_eligible \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T05_provenance_precedence \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T06_superseded_not_selected \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T07_language_personalization_soft_boost \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T08_restriction_relevance_metadata \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T09_cross_user_isolation \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T10_no_user_phi_on_shared_knowledge \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T11_no_base_model_fallback \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T12_care_context_personalization_wiring \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T13_w4p02_handoff_compatibility \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T14_determinism \
            | tee "${{ runner.temp }}/sedi_w4p01_cap17_evidence_assurance_pack/collected-nodes.txt"

      - name: Process 2 — CAP17 personalization PostgreSQL runtime
        run: |
          set -o pipefail
          python -B -m pytest \
            --noconftest \
            -p backend.tests.helpers.w4p01_cap17_postgres_runtime_plugin \
            -p no:cacheprovider \
            -q \
            --maxfail=1 \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T00_malformed_personalization_degrades \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T01_baseline_empty_personalization \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T02_goal_relevance_ranking \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T03_query_relevance_precedes_personalization \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T04_safety_precedence_not_eligible \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T05_provenance_precedence \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T06_superseded_not_selected \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T07_language_personalization_soft_boost \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T08_restriction_relevance_metadata \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T09_cross_user_isolation \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T10_no_user_phi_on_shared_knowledge \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T11_no_base_model_fallback \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T12_care_context_personalization_wiring \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T13_w4p02_handoff_compatibility \
            backend/tests/test_section30_i5_w4_cap17_personalization.py::test_P17_T14_determinism \
            | tee "${{ runner.temp }}/sedi_w4p01_cap17_evidence_assurance_pack/test-output.txt"

      - name: Build CAP17 Evidence Assurance Pack
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, sys
          from pathlib import Path
          pack = Path(os.environ["RUNNER_TEMP"]) / "sedi_w4p01_cap17_evidence_assurance_pack"
          pack.mkdir(parents=True, exist_ok=True)
          import importlib.util
          helper = Path("backend/tests/helpers/w4p01_cap17_personalization_runtime.py")
          spec = importlib.util.spec_from_file_location("cap17_rt", helper)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          expected = sorted(mod.CAP17_EXPECTED_RUNTIME_NODE_IDS)
          (pack / "expected-nodes.txt").write_text("\n".join(expected) + "\n", encoding="utf-8")
          ev_dir = Path(os.environ["RUNNER_TEMP"]) / "sedi_w4p01_postgres_runtime_evidence"
          evidence = {}
          for name in ("w4p01_cap17_runtime_evidence.json", "w4p01_cap17_collect_only_evidence.json"):
              p = ev_dir / name
              if p.exists():
                  evidence = json.loads(p.read_text(encoding="utf-8"))
                  break
          collected_ids = list(evidence.get("collected_node_ids") or [])
          (pack / "collected-nodes.txt").write_text("\n".join(sorted(set(collected_ids))) + "\n", encoding="utf-8")
          missing = sorted(set(expected) - set(collected_ids))
          unexpected = sorted(set(collected_ids) - set(expected))
          pass_count = int(evidence.get("pass_count") or 0)
          fail_count = int(evidence.get("fail_count") or 0)
          skip_count = int(evidence.get("skip_count") or 0)
          green_ok = (
              len(expected) == 15
              and len(set(collected_ids)) == 15
              and not missing
              and not unexpected
              and skip_count == 0
              and fail_count == 0
              and pass_count == 15
          )
          node_accounting = {
              "expected_count": len(expected),
              "collected_count": len(set(collected_ids)),
              "pass_count": pass_count,
              "fail_count": fail_count,
              "skip_count": skip_count,
              "missing": missing,
              "unexpected": unexpected,
              "green_contract_pass": green_ok,
          }
          (pack / "node-accounting.json").write_text(json.dumps(node_accounting, indent=2) + "\n", encoding="utf-8")
          (pack / "final_summary.md").write_text(
              f"# CAP17 personalization CI\n\nGREEN={green_ok}\npass={pass_count} fail={fail_count}\n",
              encoding="utf-8",
          )
          print("CAP17_GREEN", green_ok, node_accounting)
          if not green_ok and fail_count == 0 and pass_count == 0:
              # collect-only path may leave pass_count 0; do not fail pack build
              print("NOTE_COLLECT_OR_PARTIAL")
          PY

      - name: Upload CAP17 evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sedi-w4p01-cap17-personalization-evidence
          path: ${{ runner.temp }}/sedi_w4p01_cap17_evidence_assurance_pack
          if-no-files-found: warn
