# G2 C01+C04 scenario-first PG16 revalidation.
# GATE=SEDI-V1-BE-FINALCERT-G2-C01-C04-I5-DIRECTORY-I7-I8-SCENARIO-PG16-REVALIDATION-01
# NO production. NO Smart-RAG reopen. NO DRVS reopen. NO C03 reopen. NO Real FCM. NO frontend.
# NO schema/migration. Alembic head must remain 081.
name: G2 C01 C04 Scenario PG16

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/app/services/i5/care_navigation_directory.py"
      - "backend/app/services/i5/iran_directory_service.py"
      - "backend/app/services/intelligence/orchestrator.py"
      - "backend/app/services/rag_context/rag_context_builder.py"
      - "backend/app/services/memory_context_service.py"
      - "backend/app/services/i8/context.py"
      - "backend/app/services/i8/knowledge_bridge.py"
      - "backend/app/services/i8/unified_core.py"
      - "backend/app/services/i8/subject_context.py"
      - "backend/tests/test_i5_directory_chat_failsafe.py"
      - "backend/tests/test_i7_i8_bounded_personalization_seam.py"
      - "backend/tests/test_g2_c01_c04_scenario_integration_pg16.py"
      - "backend/tests/helpers/stage_b_family_fixture.py"
      - "backend/tests/helpers/i10_postgresql_harness.py"
      - ".github/workflows/g2-c01-c04-scenario-pg16.yml"

permissions:
  contents: read

concurrency:
  group: g2-c01-c04-scenario-${{ github.ref }}
  cancel-in-progress: false

jobs:
  g2-c01-c04:
    name: G2 C01+C04 scenario PG16
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sedi_g2
          POSTGRES_PASSWORD: sedi_g2_pass
          POSTGRES_DB: sedi_g2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_g2 -d sedi_g2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg2://sedi_g2:sedi_g2_pass@127.0.0.1:5432/sedi_g2
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_g2:sedi_g2_pass@127.0.0.1:5432/sedi_g2
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAI_API_KEY: ci-placeholder-not-used
      SEDI_DISABLE_SCHEDULER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest alembic
      - name: Prove PostgreSQL 16 + pgvector
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          eng = create_engine(os.environ["TEST_DATABASE_URL"])
          with eng.connect() as c:
              ver = c.execute(text("SHOW server_version")).scalar()
              print("POSTGRES_SERVER_VERSION", ver)
              assert str(ver).startswith("16."), ver
              c.execute(text("CREATE EXTENSION IF NOT EXISTS vector"))
              v = c.execute(text("SELECT extversion FROM pg_extension WHERE extname='vector'")).scalar()
              print("PGVECTOR_VERSION", v)
              assert v
          PY
      - name: Alembic single head 081
        run: |
          set -euo pipefail
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          cfg = Config("backend/alembic.ini")
          script = ScriptDirectory.from_config(cfg)
          heads = script.get_heads()
          assert heads == ["081_self_health_subject_1to1_hardening"], heads
          print("ALEMBIC_HEAD_OK", heads[0])
          PY
      - name: Upgrade ephemeral DB to head
        run: |
          set -euo pipefail
          python -m alembic -c backend/alembic.ini upgrade head
      - name: Stage1 C01 directory chat failsafe
        run: |
          set -euo pipefail
          mkdir -p /tmp/g2_evidence
          python -B -m pytest -v --tb=short --noconftest \
            backend/tests/test_i5_directory_chat_failsafe.py \
            | tee /tmp/g2_evidence/c01_pytest.txt
          # Exact C01-01..C01-20 CASE_* tests must all pass
          for n in $(seq 1 20); do
            grep -E "test_CASE_$(printf '%02d' "$n").*PASSED" /tmp/g2_evidence/c01_pytest.txt
          done
      - name: Stage2 C04 I7→I8 bounded personalization
        run: |
          set -euo pipefail
          python -B -m pytest -v --tb=short --noconftest \
            backend/tests/test_i7_i8_bounded_personalization_seam.py \
            | tee /tmp/g2_evidence/c04_pytest.txt
          grep -E "test_case1_son_positive_personalization PASSED" /tmp/g2_evidence/c04_pytest.txt
          grep -E "test_case3_revoked_consent_blocks_i7 PASSED" /tmp/g2_evidence/c04_pytest.txt
          grep -E "test_case8_habit_bridge_and_i5_still_work PASSED" /tmp/g2_evidence/c04_pytest.txt
          grep -E "test_case5_managed_mother_isolation PASSED" /tmp/g2_evidence/c04_pytest.txt
      - name: Stage3 G2 scenario integration
        run: |
          set -euo pipefail
          python -B -m pytest -v --tb=short --noconftest \
            backend/tests/test_g2_c01_c04_scenario_integration_pg16.py \
            | tee /tmp/g2_evidence/scenario_pytest.txt
      - name: Summarize
        run: |
          set -euo pipefail
          echo "=== C01 ===" && tail -n 5 /tmp/g2_evidence/c01_pytest.txt
          echo "=== C04 ===" && tail -n 5 /tmp/g2_evidence/c04_pytest.txt
          echo "=== SCENARIO ===" && tail -n 5 /tmp/g2_evidence/scenario_pytest.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-c01-c04-scenario-pytest
          path: /tmp/g2_evidence/
