# Qualified NIH source activation Wave01 CI
name: I5 Qualified Source Activation Wave01 CI

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/config/i5/multisource_activation_allowlist_v1.yaml"
      - "backend/config/i5/candidate_qualification_registry_v1.yaml"
      - "backend/app/services/i5/governed_specialized_entity_eligibility.py"
      - "backend/app/services/i5/candidate_qualification_registry.py"
      - "backend/tests/test_i5_qualified_source_activation_wave01.py"
      - "backend/tests/test_i5_niosh_d17_qualification_registry.py"
      - "backend/tests/test_i5_specialized_d18_d19_serving_eligibility.py"
      - "backend/tests/test_i5_source_format_resilience.py"
      - ".github/workflows/i5-qualified-source-activation-wave01-ci.yml"

permissions:
  contents: read

concurrency:
  group: i5-qualified-activation-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualified-activation-ci:
    name: Qualified activation + specialized serving offline suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: qualified-wave01-placeholder

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Run focused suite
        run: |
          python -B -m pytest \
            --noconftest \
            -p no:cacheprovider \
            -q --tb=short \
            backend/tests/test_i5_qualified_source_activation_wave01.py \
            backend/tests/test_i5_niosh_d17_qualification_registry.py \
            backend/tests/test_i5_specialized_d18_d19_serving_eligibility.py \
            backend/tests/test_section30_i5_multisource_weekly_activation.py::test_multisource_allowlist_publisher_diversity_and_exact_urls \
            backend/tests/test_i5_source_format_resilience.py
