# CAP23-25 Iran directory closure — focused PostgreSQL runtime
# Job A: frozen W5-P01 24-node contract (unchanged selectors)
# Job B: CAP23-25 closure suite
name: CAP23-25 Iran Directory Closure Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cap23-25-iran-directory-closure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  w5p01-frozen-24:
    name: W5-P01 frozen 24-node contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sedi_cap2325_test
          POSTGRES_PASSWORD: sedi_cap2325_test_password
          POSTGRES_DB: sedi_cap2325_directory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_cap2325_test -d sedi_cap2325_directory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg2://sedi_cap2325_test:sedi_cap2325_test_password@127.0.0.1:5432/sedi_cap2325_directory
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_cap2325_test:sedi_cap2325_test_password@127.0.0.1:5432/sedi_cap2325_directory
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: cap2325-test-placeholder-not-used
      ADMIN_TOKEN: cap2325-test-admin-token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: PostgreSQL readiness
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U sedi_cap2325_test -d sedi_cap2325_directory; then
              echo postgres_ready
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Collect W5-P01 24 nodes
        run: |
          set -o pipefail
          EV="${{ runner.temp }}/w5_nodes"
          mkdir -p "$EV"
          python -B -m pytest --collect-only --noconftest \
            -p backend.tests.helpers.w5p01_postgres_runtime_plugin \
            -p no:cacheprovider -q \
            backend/tests/test_section30_i5_w5_iran_directory.py \
            | tee "$EV/collected.txt"
          COLLECTED=$(grep -c '::test_W5P01_' "$EV/collected.txt")
          test "$COLLECTED" = "24"
      - name: Run W5-P01 24 nodes
        run: |
          set -o pipefail
          EV="${{ runner.temp }}/w5_nodes"
          python -B -m pytest --noconftest \
            -p backend.tests.helpers.w5p01_postgres_runtime_plugin \
            -p no:cacheprovider -q --maxfail=1 \
            backend/tests/test_section30_i5_w5_iran_directory.py \
            | tee "$EV/run.txt"
          grep -E '24 passed' "$EV/run.txt"

  cap23-25-closure:
    name: CAP23-25 closure suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sedi_cap2325_test
          POSTGRES_PASSWORD: sedi_cap2325_test_password
          POSTGRES_DB: sedi_cap2325_directory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_cap2325_test -d sedi_cap2325_directory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg2://sedi_cap2325_test:sedi_cap2325_test_password@127.0.0.1:5432/sedi_cap2325_directory
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_cap2325_test:sedi_cap2325_test_password@127.0.0.1:5432/sedi_cap2325_directory
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: cap2325-test-placeholder-not-used
      ADMIN_TOKEN: cap2325-test-admin-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: PostgreSQL readiness
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U sedi_cap2325_test -d sedi_cap2325_directory; then
              echo postgres_ready
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Collect CAP23-25 nodes
        run: |
          set -o pipefail
          EV="${{ runner.temp }}/cap2325_closure_evidence"
          mkdir -p "$EV"
          python -B -m pytest --collect-only --noconftest \
            -p backend.tests.helpers.w5p01_postgres_runtime_plugin \
            -p no:cacheprovider -q \
            backend/tests/test_section30_i5_cap23_25_iran_directory_closure.py \
            | tee "$EV/collected.txt"
          COLLECTED=$(grep -c '::test_' "$EV/collected.txt")
          echo "EXPECTED=$COLLECTED" > "$EV/node_accounting.txt"
          echo "COLLECTED=$COLLECTED" >> "$EV/node_accounting.txt"
          test "$COLLECTED" -ge 8
      - name: Run CAP23-25 suite
        run: |
          set -o pipefail
          EV="${{ runner.temp }}/cap2325_closure_evidence"
          python -B -m pytest --noconftest \
            -p backend.tests.helpers.w5p01_postgres_runtime_plugin \
            -p no:cacheprovider -q --maxfail=1 \
            backend/tests/test_section30_i5_cap23_25_iran_directory_closure.py \
            | tee "$EV/run.txt"
          PASSED=$(grep -Eo '[0-9]+ passed' "$EV/run.txt" | head -1 | awk '{print $1}')
          FAILED=$(grep -Eo '[0-9]+ failed' "$EV/run.txt" | head -1 | awk '{print $1}' || true)
          SKIPPED=$(grep -Eo '[0-9]+ skipped' "$EV/run.txt" | head -1 | awk '{print $1}' || true)
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}
          COLLECTED=$(grep '^COLLECTED=' "$EV/node_accounting.txt" | cut -d= -f2)
          {
            echo "EXECUTED=$PASSED"
            echo "PASSED=$PASSED"
            echo "FAILED=$FAILED"
            echo "SKIPPED=$SKIPPED"
          } >> "$EV/node_accounting.txt"
          test "$FAILED" = "0"
          test "$SKIPPED" = "0"
          test "$PASSED" = "$COLLECTED"
      - name: Upload CAP23-25 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cap23-25-iran-directory-closure-evidence
          path: ${{ runner.temp }}/cap2325_closure_evidence
          if-no-files-found: error
