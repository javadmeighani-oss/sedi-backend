# POST-065 operational readiness — audit / DR / isolated capacity (NO activation)
name: DB-PROD Post-065 Readiness

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "AUDIT | BACKUP_DR | CAPACITY | ALL | I5_DRIFT_AUDIT | I5_FAILCLOSE_ONESHOT | I5_ALL"
        required: true
        default: "ALL"
      confirmation:
        description: "POST065_READINESS_ONLY or I5_FAILCLOSE_NF16_ONESHOT"
        required: true
      candidate_image_digest:
        description: "sha256:... sedi-postgres digest"
        required: true
        default: "sha256:c48c0b16319b2eff51665e3435a5712e93b28b011ee1d879d14738ca4166fc31"
  push:
    paths:
      - "backend/ops/db03/db_prod_post065_*.sh"
      - "backend/ops/db03/post065_capacity_bench.py"
      - "backend/ops/db03/post065_app_capacity_bench.py"
      - "docs/architecture/db03/MIGRATION_061_VECTOR_EXTENSION_GOVERNANCE.md"

permissions:
  contents: read
  packages: read

concurrency:
  group: sedi-production-backend-operation
  cancel-in-progress: false

jobs:
  audit:
    name: Production role/ownership/NF16 audit (read-only)
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.confirmation == 'POST065_READINESS_ONLY' &&
       (github.event.inputs.phase == 'AUDIT' || github.event.inputs.phase == 'ALL'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: GitHub NCBI secret presence (no values)
        env:
          NCBI_EMAIL: ${{ secrets.SEDI_NCBI_EMAIL }}
          NCBI_TOOL: ${{ vars.SEDI_NCBI_TOOL }}
          NCBI_KEY: ${{ secrets.SEDI_NCBI_API_KEY }}
        run: |
          set -Eeuo pipefail
          {
            echo "GH_NCBI|tool_present|$([ -n "${NCBI_TOOL:-}" ] && echo YES || echo NO)"
            echo "GH_NCBI|email_present|$([ -n "${NCBI_EMAIL:-}" ] && echo YES || echo NO)"
            echo "GH_NCBI|api_key_present|$([ -n "${NCBI_KEY:-}" ] && echo YES || echo NO)"
          } | tee /tmp/gh_ncbi_presence.log
      - name: SSH audit
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/db03"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/db03/db_prod_post065_audit_remote.sh \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/db_prod_post065_audit_remote.sh"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/db_prod_post065_audit_remote.sh") && \
             DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
             bash $(printf '%q' "${REMOTE_DIR}/db_prod_post065_audit_remote.sh")" \
            2>&1 | tee /tmp/post065_audit.log
          grep -Fq 'AUDIT_SUMMARY|production_role_invariants|PASS' /tmp/post065_audit.log
          grep -Fq 'AUDIT_SUMMARY|ownership_model_final|PASS' /tmp/post065_audit.log
      - name: SSH NF16 identity probe (read-only)
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/i5"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/i5/nf16_ncbi_identity_probe_remote.sh \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/nf16_ncbi_identity_probe_remote.sh"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/nf16_ncbi_identity_probe_remote.sh") && \
             DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
             bash $(printf '%q' "${REMOTE_DIR}/nf16_ncbi_identity_probe_remote.sh")" \
            2>&1 | tee /tmp/nf16_probe.log
          grep -Fq 'NF16_PROBE|ncbi_email_redacted_in_evidence|YES' /tmp/nf16_probe.log
          grep -Fq 'NF16_PROBE|production_write|NO' /tmp/nf16_probe.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post065-audit
          path: |
            /tmp/post065_audit.log
            /tmp/nf16_probe.log
            /tmp/gh_ncbi_presence.log
          retention-days: 14
          if-no-files-found: warn

  backup_dr:
    name: Quarantine + canonical 065 backup + private restore
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirmation == 'POST065_READINESS_ONLY' &&
      (github.event.inputs.phase == 'BACKUP_DR' || github.event.inputs.phase == 'ALL')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate digest
        env:
          CAND_D: ${{ github.event.inputs.candidate_image_digest }}
        run: echo "${CAND_D}" | grep -Eq '^sha256:[0-9a-f]{64}$'
      - name: SSH backup+DR
        env:
          CAND_D: ${{ github.event.inputs.candidate_image_digest }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/db03"
          CAND_REF="ghcr.io/javadmeighani-oss/sedi-postgres@${CAND_D}"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/db03/db_prod_post065_backup_dr_remote.sh \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/db_prod_post065_backup_dr_remote.sh"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/db_prod_post065_backup_dr_remote.sh") && \
             DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
             CANDIDATE_IMAGE_REF=$(printf '%q' "${CAND_REF}") \
             bash $(printf '%q' "${REMOTE_DIR}/db_prod_post065_backup_dr_remote.sh")" \
            2>&1 | tee /tmp/post065_dr.log
          grep -Fq 'DR_SUMMARY|canonical_065_backup_created|PASS' /tmp/post065_dr.log
          grep -Fq 'DR_SUMMARY|post_065_disaster_recovery_proof|PASS' /tmp/post065_dr.log
          grep -Fq 'DR_SUMMARY|mislabeled_backup_quarantined_or_relabeled|PASS' /tmp/post065_dr.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post065-dr
          path: /tmp/post065_dr.log
          retention-days: 14

  capacity:
    name: Isolated DB microbench + app HTTP >=5000 capacity
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirmation == 'POST065_READINESS_ONLY' &&
      (github.event.inputs.phase == 'CAPACITY' || github.event.inputs.phase == 'ALL')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start isolated PG16+pgvector
        run: |
          set -Eeuo pipefail
          CAND_D="${{ github.event.inputs.candidate_image_digest }}"
          if [ -z "${CAND_D}" ]; then
            CAND_D="sha256:c48c0b16319b2eff51665e3435a5712e93b28b011ee1d879d14738ca4166fc31"
          fi
          IMG="ghcr.io/javadmeighani-oss/sedi-postgres@${CAND_D}"
          docker pull "${IMG}"
          docker rm -f sedi-cap-pg >/dev/null 2>&1 || true
          docker run -d --name sedi-cap-pg \
            -e POSTGRES_USER=cap \
            -e POSTGRES_PASSWORD=cap \
            -e POSTGRES_DB=cap_db \
            -p 55432:5432 \
            "${IMG}"
          for i in $(seq 1 90); do
            if docker exec sedi-cap-pg psql -U cap -d cap_db -c 'SELECT 1' >/dev/null 2>&1; then
              echo "postgres_ready"
              break
            fi
            sleep 2
          done
          docker exec sedi-cap-pg psql -U cap -d cap_db -c 'SELECT 1'
          docker exec sedi-cap-pg psql -U cap -d cap_db -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install 'httpx>=0.27'
      - name: DB-level microbenchmark (preserve separate evidence)
        run: |
          set -Eeuo pipefail
          export DATABASE_URL='postgresql+psycopg2://cap:cap@127.0.0.1:55432/cap_db'
          python backend/ops/db03/post065_capacity_bench.py 2>&1 | tee /tmp/post065_capacity_db.log
          grep -Fq 'CAPACITY_SUMMARY|db_level_capacity_microbenchmark|PASS' /tmp/post065_capacity_db.log
          grep -Fq 'CAPACITY_SUMMARY|pgvector_capacity_benchmark|PASS' /tmp/post065_capacity_db.log
          grep -Fq 'CAPACITY_SUMMARY|fts_gin_index_usage_proof|PASS' /tmp/post065_capacity_db.log
          grep -Fq 'CAPACITY_SUMMARY|fts_functional_query_proof|PASS' /tmp/post065_capacity_db.log
          grep -Fq 'CAPACITY_SUMMARY|db_connection_budget_proof|PASS' /tmp/post065_capacity_db.log
          grep -Fq 'CAPACITY_SUMMARY|exact_search_v1_decision|REVIEW_REQUIRED' /tmp/post065_capacity_db.log
          grep -Fq 'CAPACITY_SUMMARY|ann_required_now|NO' /tmp/post065_capacity_db.log
          grep -Fq 'CAPACITY_SUMMARY|ann_review_required_before_scaled_rag|YES' /tmp/post065_capacity_db.log
      - name: Alembic upgrade to 065 on isolated DB
        run: |
          set -Eeuo pipefail
          export DATABASE_URL='postgresql+psycopg2://cap:cap@127.0.0.1:55432/cap_db'
          export TEST_DATABASE_URL="${DATABASE_URL}"
          alembic -c backend/alembic.ini upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine, text
          e = create_engine("postgresql+psycopg2://cap:cap@127.0.0.1:55432/cap_db")
          with e.connect() as c:
              rev = c.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
              print("ALEMBIC_HEAD", rev)
              assert "065" in rev
          PY
      - name: Start uvicorn (Production-equivalent app path)
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="${GITHUB_WORKSPACE}"
          export DATABASE_URL='postgresql+psycopg2://cap:cap@127.0.0.1:55432/cap_db'
          export SECRET_KEY='cycle4-post065-capacity-secret-key-32b-min!!!!!!!!!!!!'
          export DEBUG=true
          export ENV=dev
          export SMS_DISABLED=true
          export SEDI_DISABLE_SCHEDULER=1
          # Import-time guard in prompts.py; capacity paths do not call GPT.
          export OPENAI_API_KEY='sk-capacity-harness-unused'
          nohup python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 \
            >/tmp/post065_uvicorn.log 2>&1 &
          echo $! > /tmp/post065_uvicorn.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then
              echo "uvicorn_ready"
              break
            fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:8000/healthz; then
            echo "===== uvicorn log ====="
            cat /tmp/post065_uvicorn.log || true
            exit 1
          fi
      - name: Application-level HTTP capacity (>=5000 registered, sustained)
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="${GITHUB_WORKSPACE}"
          export DATABASE_URL='postgresql+psycopg2://cap:cap@127.0.0.1:55432/cap_db'
          export SECRET_KEY='cycle4-post065-capacity-secret-key-32b-min!!!!!!!!!!!!'
          export DEBUG=true
          export SEDI_DISABLE_SCHEDULER=1
          export OPENAI_API_KEY='sk-capacity-harness-unused'
          export APP_BASE_URL='http://127.0.0.1:8000'
          export SUSTAINED_SECONDS=900
          python backend/ops/db03/post065_app_capacity_bench.py 2>&1 | tee /tmp/post065_capacity_app.log
          grep -Fq 'APP_CAPACITY_SUMMARY|application_level_5000_user_capacity_proof|PASS' /tmp/post065_capacity_app.log
          grep -Fq 'APP_CAPACITY_SUMMARY|registered_user_scale_tested|5000' /tmp/post065_capacity_app.log
          cat /tmp/post065_capacity_db.log /tmp/post065_capacity_app.log > /tmp/post065_capacity.log
      - if: always()
        run: |
          if [ -f /tmp/post065_uvicorn.pid ]; then kill "$(cat /tmp/post065_uvicorn.pid)" || true; fi
          docker rm -f sedi-cap-pg >/dev/null 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post065-capacity
          path: |
            /tmp/post065_capacity.log
            /tmp/post065_capacity_db.log
            /tmp/post065_capacity_app.log
            /tmp/post065_uvicorn.log
          retention-days: 14
          if-no-files-found: warn

  i5_drift_audit:
    name: I5 scheduler drift audit (read-only)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirmation == 'I5_FAILCLOSE_NF16_ONESHOT' &&
      (github.event.inputs.phase == 'I5_DRIFT_AUDIT' || github.event.inputs.phase == 'I5_ALL')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: SSH I5 drift audit
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/i5"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/i5/i5_scheduler_drift_audit_remote.sh \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/i5_scheduler_drift_audit_remote.sh"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/i5_scheduler_drift_audit_remote.sh") && \
             DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
             bash $(printf '%q' "${REMOTE_DIR}/i5_scheduler_drift_audit_remote.sh")" \
            2>&1 | tee /tmp/i5_drift_audit.log
          grep -Fq 'I5_DRIFT|audit_complete|YES' /tmp/i5_drift_audit.log
          if grep -Fq 'I5_DRIFT|history_classification|HARD_STOP' /tmp/i5_drift_audit.log; then
            echo "HARD_STOP classification from drift audit"
            exit 1
          fi
          grep -E 'I5_DRIFT\|history_classification\|(CONFIGURATION_DRIFT_NO_UNEXPECTED_EXECUTION|GOVERNANCE_DEVIATION_RECONCILED)' /tmp/i5_drift_audit.log
          if grep -Eiq 'info@sedi-ai\.com' /tmp/i5_drift_audit.log; then
            echo "SECRET_LEAK: NCBI email in audit log"
            exit 2
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i5-drift-audit
          path: /tmp/i5_drift_audit.log
          retention-days: 14
          if-no-files-found: warn

  i5_failclose_nf16_oneshot:
    name: I5 fail-close + NF16 + NCBI canary + one-shot E2E
    needs: [i5_drift_audit]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirmation == 'I5_FAILCLOSE_NF16_ONESHOT' &&
      (github.event.inputs.phase == 'I5_FAILCLOSE_ONESHOT' || github.event.inputs.phase == 'I5_ALL')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Require NCBI email secret (presence only)
        env:
          NCBI_EMAIL: ${{ secrets.SEDI_NCBI_EMAIL }}
          NCBI_TOOL: ${{ vars.SEDI_NCBI_TOOL }}
        run: |
          set -Eeuo pipefail
          echo "GH_NCBI|tool_present|$([ -n "${NCBI_TOOL:-}" ] && echo YES || echo NO)" | tee /tmp/gh_ncbi_presence.log
          echo "GH_NCBI|email_present|$([ -n "${NCBI_EMAIL:-}" ] && echo YES || echo NO)" | tee -a /tmp/gh_ncbi_presence.log
          test -n "${NCBI_EMAIL:-}"
          test -n "${NCBI_TOOL:-}"
      - name: SSH fail-close + NF16 + one-shot
        env:
          NCBI_EMAIL: ${{ secrets.SEDI_NCBI_EMAIL }}
          NCBI_TOOL: ${{ vars.SEDI_NCBI_TOOL }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/i5"
          TOOL_Q="$(printf '%q' "${NCBI_TOOL:-sedi}")"
          EMAIL_Q="$(printf '%q' "${NCBI_EMAIL}")"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/i5/i5_failclose_nf16_oneshot_remote.sh \
            backend/ops/i5/i5_oneshot_inproc.py \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/i5_failclose_nf16_oneshot_remote.sh") && \
             DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
             NCBI_TOOL_VALUE=${TOOL_Q} NCBI_EMAIL_VALUE=${EMAIL_Q} \
             bash $(printf '%q' "${REMOTE_DIR}/i5_failclose_nf16_oneshot_remote.sh")" \
            2>&1 | tee /tmp/i5_oneshot.log
          grep -Fq 'I5_ONESHOT|i5_scheduler_fail_closed|PASS' /tmp/i5_oneshot.log
          grep -Fq 'I5_ONESHOT|ncbi_connectivity_canary|PASS' /tmp/i5_oneshot.log
          grep -Fq 'I5_ONESHOT|first_one_shot_governed_e2e|PASS' /tmp/i5_oneshot.log
          grep -Fq 'I5_ONESHOT|idempotent_rerun|PASS' /tmp/i5_oneshot.log
          grep -Fq 'I5_ONESHOT|production_i5_weekly_unattended_scheduler|NO' /tmp/i5_oneshot.log
          if grep -Eiq 'info@sedi-ai\.com' /tmp/i5_oneshot.log; then
            echo "SECRET_LEAK: NCBI email in oneshot log"
            exit 2
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i5-failclose-nf16-oneshot
          path: |
            /tmp/i5_oneshot.log
            /tmp/gh_ncbi_presence.log
          retention-days: 14
          if-no-files-found: warn

