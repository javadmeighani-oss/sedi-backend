# Read-only Gate 4-B post-deploy safety checks (workflow_dispatch only).
name: Gate 4-B Post-Deploy Readonly Check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit (read-only) or close_backlog (provider-OFF historical closure)"
        required: false
        default: audit
        type: choice
        options:
          - audit
          - close_backlog

permissions:
  contents: read

jobs:
  readonly-check:
    name: Post-deploy read-only safety check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts

      - name: Run read-only production checks + GHCR TLS diagnosis
        env:
          SEDI_PORT: ${{ secrets.SEDI_PORT }}
          SEDI_HOST: ${{ secrets.SEDI_HOST }}
          SEDI_USER: ${{ secrets.SEDI_USER }}
          SEDI_DEPLOY_PATH: ${{ secrets.SEDI_DEPLOY_PATH }}
          MODE: ${{ github.event.inputs.mode || 'audit' }}
        run: |
          set -Eeuo pipefail
          MODE="${MODE:-audit}"
          if [ "${MODE}" != "audit" ] && [ "${MODE}" != "close_backlog" ]; then
            echo "invalid mode=${MODE}"
            exit 1
          fi
          echo "WORKFLOW_MODE=${MODE}"
          SCRIPT="$(mktemp)"
          cat > "${SCRIPT}" <<'REMOTE'
          set -Eeuo pipefail
          cd "${SEDI_DEPLOY_PATH}"
          echo "=== IMAGE ==="
          docker inspect sedi-backend --format '{{.Config.Image}}'
          docker inspect sedi-backend --format 'RepoDigests={{json .RepoDigests}}' || true
          echo "=== ALEMBIC CURRENT ==="
          docker exec sedi-backend python -m alembic -c backend/alembic.ini current
          echo "=== ALEMBIC HEADS ==="
          docker exec sedi-backend python -m alembic -c backend/alembic.ini heads
          echo "=== LOCAL HEALTH ==="
          curl -fsS http://127.0.0.1:8000/health
          echo ""
          curl -fsS http://127.0.0.1:8000/healthz
          echo ""
          echo "=== COUNTS ==="
          PU=$(docker exec sedi-postgres printenv POSTGRES_USER)
          PD=$(docker exec sedi-postgres printenv POSTGRES_DB)
          docker exec sedi-postgres psql -U "$PU" -d "$PD" -P pager=off -c "SELECT COUNT(*) AS notifications FROM notifications;"
          docker exec sedi-postgres psql -U "$PU" -d "$PD" -P pager=off -c "SELECT COUNT(*) AS interaction_events FROM interaction_events;"
          docker exec sedi-postgres psql -U "$PU" -d "$PD" -P pager=off -c "SELECT COUNT(*) AS push_devices FROM push_devices;"
          echo "=== LOG SUMMARY ==="
          docker logs --since 30m sedi-backend 2>&1 | grep -E "\[Sedi Scheduler\]|\[NOTIF\]|\[GATE4|Traceback|ERROR|Exception" | tail -80 || true

          echo "=== PROVIDER-OFF DUE AUDIT ==="
          MODE="${MODE:-audit}"
          echo "OPS_MODE=${MODE}"
          sed 's/^          //' <<'PY' | docker exec -i -e OPS_MODE="${MODE}" sedi-backend python -
          import hashlib
          import os
          import sys
          from datetime import datetime, timezone

          from sqlalchemy import or_

          from backend.app.database import SessionFactory
          from backend.app.models import Notification, PushDevice
          from backend.app.services.i10.provider_delivery_policy import (
              ProviderFreshnessOutcome,
              evaluate_notification_provider_freshness,
              persist_provider_expired,
          )
          from backend.app.services.notifications.delivery_service import provider_delivery_enabled

          CLOSABLE_BLOCK_REASONS = {
              "MISSING_I10_PROVIDER_AUTHORITY",
              "MISSING_I10_DECISION",
              "MISSING_I8_SOURCE_EXPIRY",
              "MISSING_I9_SOURCE_VALIDITY",
              "MISSING_I4_SAFETY_EXPIRY",
              "MISSING_PROVIDER_EXPIRY_AUTHORITY",
          }

          def env_label(raw):
              if raw is None:
                  return "UNSET"
              stripped = raw.strip().lower()
              if stripped in ("true", "1", "yes", "on"):
                  return "true"
              if stripped in ("false", "0", "no", "off", ""):
                  return "false"
              return "false"

          def sha_prefix(value):
              if not value:
                  return ""
              return hashlib.sha256(str(value).encode("utf-8")).hexdigest()[:12]

          def iso(value):
              if value is None:
                  return ""
              if getattr(value, "tzinfo", None) is None:
                  return value.replace(tzinfo=timezone.utc).isoformat()
              return value.astimezone(timezone.utc).isoformat()

          def load_due(db, now_naive):
              return (
                  db.query(Notification)
                  .filter(Notification.is_sent == False)  # noqa: E712
                  .filter(or_(Notification.scheduled_for.is_(None), Notification.scheduled_for <= now_naive))
                  .filter(or_(Notification.status.is_(None), Notification.status == "queued"))
                  .order_by(Notification.created_at.asc())
                  .all()
              )

          def classify(db, notification, reference_now):
              try:
                  decision = evaluate_notification_provider_freshness(
                      db, notification, now_utc=reference_now
                  )
              except Exception as exc:
                  return {
                      "bucket": "AMBIGUOUS",
                      "outcome": "EXCEPTION",
                      "reason": type(exc).__name__,
                      "expires_at": None,
                  }
              outcome = getattr(decision.outcome, "value", str(decision.outcome))
              reason = (decision.reason_code or "").strip()
              expires_at = decision.expires_at
              if outcome == ProviderFreshnessOutcome.EXPIRE.value:
                  bucket = "CLOSABLE_EXPIRE"
              elif outcome == ProviderFreshnessOutcome.BLOCK.value and reason in CLOSABLE_BLOCK_REASONS:
                  bucket = "CLOSABLE_FAILED_UNSENT"
              elif outcome == ProviderFreshnessOutcome.ALLOW.value or reason == "PROVIDER_FRESH":
                  bucket = "SEND_FRESH_RISK"
              else:
                  bucket = "AMBIGUOUS"
              return {
                  "bucket": bucket,
                  "outcome": outcome,
                  "reason": reason,
                  "expires_at": expires_at,
              }

          def print_due_row(notification, item):
              print(
                  "DUE_ROW"
                  f" notification_id={notification.id}"
                  f" user_id={notification.user_id}"
                  f" semantic_family={notification.semantic_family or ''}"
                  f" status={notification.status or ''}"
                  f" scheduled_for={iso(notification.scheduled_for)}"
                  f" i10_policy_decision_id={notification.i10_policy_decision_id or ''}"
                  f" provider_outcome={item['outcome']}"
                  f" reason_code={item['reason']}"
                  f" provider_expires_at={iso(item['expires_at'])}"
              )

          mode = os.environ.get("OPS_MODE", "audit").strip() or "audit"
          raw_env = os.getenv("SEDI_NOTIFICATION_PROVIDER_DELIVERY_ENABLED")
          resolved = bool(provider_delivery_enabled())
          print(f"SEDI_NOTIFICATION_PROVIDER_DELIVERY_ENABLED={env_label(raw_env)}")
          print(f"provider_delivery_enabled()={'true' if resolved else 'false'}")
          if resolved:
              print("HARD_STOP=PROVIDER_ON")
              sys.exit(2)

          reference_now = datetime.now(timezone.utc)
          reference_now_naive = reference_now.replace(tzinfo=None)
          print(f"REFERENCE_NOW={reference_now.isoformat()}")

          db = SessionFactory()
          try:
              due_rows = load_due(db, reference_now_naive)
              classified = []
              counts = {
                  "CLOSABLE_EXPIRE": 0,
                  "CLOSABLE_FAILED_UNSENT": 0,
                  "SEND_FRESH_RISK": 0,
                  "AMBIGUOUS": 0,
              }
              for notification in due_rows:
                  item = classify(db, notification, reference_now)
                  counts[item["bucket"]] += 1
                  classified.append((notification, item))
                  print_due_row(notification, item)

              devices = db.query(PushDevice).order_by(PushDevice.id.asc()).all()
              android_active = 0
              android_users = set()
              for device in devices:
                  active = bool(device.is_active)
                  platform = (device.platform or "").strip().lower()
                  if active and platform == "android":
                      android_active += 1
                      android_users.add(device.user_id)
                  print(
                      "PUSH_ROW"
                      f" push_device_id={device.id}"
                      f" user_id={device.user_id}"
                      f" platform={device.platform or ''}"
                      f" is_active={'true' if active else 'false'}"
                      f" device_id_present={'true' if bool(device.device_id) else 'false'}"
                      f" device_id_sha256_prefix={sha_prefix(device.device_id)}"
                      f" fcm_token_sha256_prefix={sha_prefix(device.fcm_token)}"
                      f" last_seen_at={iso(device.last_seen_at)}"
                  )

              due_before = len(due_rows)
              send_risk = counts["SEND_FRESH_RISK"]
              ambiguous = counts["AMBIGUOUS"]
              safe = send_risk == 0 and ambiguous == 0
              print(f"DUE_BEFORE={due_before}")
              print(f"CLOSABLE_EXPIRE={counts['CLOSABLE_EXPIRE']}")
              print(f"CLOSABLE_FAILED_UNSENT={counts['CLOSABLE_FAILED_UNSENT']}")
              print(f"SEND_FRESH_RISK={send_risk}")
              print(f"AMBIGUOUS={ambiguous}")
              print(f"PUSH_DEVICE_TOTAL={len(devices)}")
              print(f"ANDROID_ACTIVE_COUNT={android_active}")
              print(f"ACTIVE_ANDROID_USERS={len(android_users)}")
              print(f"AUDIT_SAFE_TO_CLOSE={'YES' if safe else 'NO'}")

              if mode == "audit":
                  print(f"GATE_RESULT={'PASS' if safe else 'BLOCKED'}")
                  print("HISTORICAL_SENT=0")
                  print(f"DUE_AFTER={due_before}")
                  db.rollback()
                  if not safe:
                      sys.exit(3)
                  sys.exit(0)

              if mode != "close_backlog":
                  print("HARD_STOP=INVALID_MODE")
                  db.rollback()
                  sys.exit(1)

              print("=== CLOSE_BACKLOG PRECHECK ===")
              due_again = load_due(db, reference_now_naive)
              re_counts = {
                  "CLOSABLE_EXPIRE": 0,
                  "CLOSABLE_FAILED_UNSENT": 0,
                  "SEND_FRESH_RISK": 0,
                  "AMBIGUOUS": 0,
              }
              reclassified = []
              for notification in due_again:
                  item = classify(db, notification, reference_now)
                  re_counts[item["bucket"]] += 1
                  reclassified.append((notification, item))
              print(f"CLOSE_PRECHECK_DUE={len(due_again)}")
              print(f"CLOSE_PRECHECK_SEND_FRESH_RISK={re_counts['SEND_FRESH_RISK']}")
              print(f"CLOSE_PRECHECK_AMBIGUOUS={re_counts['AMBIGUOUS']}")
              if re_counts["SEND_FRESH_RISK"] or re_counts["AMBIGUOUS"]:
                  print("HARD_STOP=CLOSE_PRECHECK_UNSAFE")
                  db.rollback()
                  sys.exit(4)

              expired = 0
              failed_unsent = 0
              for notification, item in reclassified:
                  if item["bucket"] == "CLOSABLE_EXPIRE":
                      persist_provider_expired(notification, reason_code=item["reason"] or "PROVIDER_LIFETIME_ELAPSED")
                      db.add(notification)
                      expired += 1
                  elif item["bucket"] == "CLOSABLE_FAILED_UNSENT":
                      notification.status = "failed"
                      notification.is_sent = False
                      notification.sent_at = None
                      notification.last_error = f"provider_policy_blocked:{item['reason']}"[:500]
                      db.add(notification)
                      failed_unsent += 1
                  else:
                      print("HARD_STOP=UNEXPECTED_BUCKET")
                      db.rollback()
                      sys.exit(4)
              db.commit()

              due_after_rows = load_due(db, reference_now_naive)
              due_after = len(due_after_rows)
              print(f"BACKLOG_EXPIRED={expired}")
              print(f"BACKLOG_FAILED_UNSENT={failed_unsent}")
              print("HISTORICAL_SENT=0")
              print(f"DUE_AFTER={due_after}")
              print("PROVIDER_GATE_AFTER=OFF")
              if due_after != 0:
                  print("HARD_STOP=DUE_AFTER_NOT_ZERO")
                  sys.exit(5)
              print("GATE_RESULT=PASS")
          except Exception:
              db.rollback()
              raise
          finally:
              db.close()
          PY

          echo "=== POST-AUDIT HEALTH ==="
          curl -fsS http://127.0.0.1:8000/health
          echo ""
          curl -fsS http://127.0.0.1:8000/healthz
          echo ""
          docker exec sedi-backend python -m alembic -c backend/alembic.ini current
          docker inspect sedi-backend --format '{{.Config.Image}}'

          echo "=== GHCR TLS PATH DIAGNOSIS (read-only; no pull/recreate) ==="
          FAIL=0
          HAS_AAAA=0
          IPV4_TLS=0
          IPV6_TLS=0
          PROXY_SET=0
          RC_GH=1

          echo "--- SYSTEM TIME ---"
          date -u
          timedatectl status 2>/dev/null | head -15 || true
          echo "SYSTEM_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "--- CA BUNDLE ---"
          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            ls -la /etc/ssl/certs/ca-certificates.crt
            echo "CA_STATUS=PRESENT"
          elif [ -f /etc/pki/tls/certs/ca-bundle.crt ]; then
            ls -la /etc/pki/tls/certs/ca-bundle.crt
            echo "CA_STATUS=PRESENT"
          else
            echo "CA_STATUS=MISSING"
            FAIL=1
          fi

          echo "--- PROXY ENV (host) ---"
          if env | grep -Eiq '^(http|https|all)_proxy=.'; then
            env | grep -Ei '^(http|https|all|no)_proxy=' || true
            PROXY_SET=1
            echo "PROXY_STATUS=SET"
          else
            echo "PROXY_STATUS=UNSET"
          fi
          echo "--- DOCKER PROXY / DAEMON (existence only) ---"
          ls -la /etc/systemd/system/docker.service.d 2>/dev/null || echo "docker.service.d=absent"
          ls -la /etc/docker/daemon.json 2>/dev/null || echo "daemon.json=absent"
          if [ -f /etc/docker/daemon.json ]; then
            grep -E 'insecure-registries|prox|registry' /etc/docker/daemon.json || true
          fi

          echo "--- DNS A/AAAA ghcr.io ---"
          getent ahosts ghcr.io 2>/tmp/ghcr_ahosts.txt || true
          cat /tmp/ghcr_ahosts.txt || true
          if getent ahostsv4 ghcr.io >/tmp/ghcr_a.txt 2>/dev/null; then echo "GHCR_A=PASS"; cat /tmp/ghcr_a.txt; fi
          if getent ahostsv6 ghcr.io >/tmp/ghcr_aaaa.txt 2>/dev/null && [ -s /tmp/ghcr_aaaa.txt ]; then
            HAS_AAAA=1
            echo "GHCR_AAAA=PRESENT"
            cat /tmp/ghcr_aaaa.txt
          else
            echo "GHCR_AAAA=NONE_OR_EMPTY"
          fi
          if getent hosts ghcr.io >/tmp/ghcr_dns.txt 2>/dev/null || host ghcr.io >/tmp/ghcr_dns.txt 2>/dev/null || nslookup ghcr.io >/tmp/ghcr_dns.txt 2>/dev/null; then
            echo "GHCR_DNS=PASS"
            cat /tmp/ghcr_dns.txt || true
          else
            echo "GHCR_DNS=FAIL"
            FAIL=1
          fi

          echo "--- TCP 443 ---"
          if (command -v nc >/dev/null && nc -z -w 8 ghcr.io 443) || (timeout 8 bash -c 'echo >/dev/tcp/ghcr.io/443'); then
            echo "GHCR_TCP443=PASS"
          else
            echo "GHCR_TCP443=FAIL"
            FAIL=1
          fi

          echo "--- curl -4 https://ghcr.io/v2/ ---"
          set +e
          CURL4="$(curl -4 -sS -o /tmp/ghcr_v2_4.body -w '%{http_code}|%{ssl_verify_result}|%{time_total}' --connect-timeout 15 --max-time 30 https://ghcr.io/v2/ 2>/tmp/ghcr_v2_4.err)"
          RC4=$?
          set -e
          echo "curl4_rc=${RC4} result=${CURL4}"
          cat /tmp/ghcr_v2_4.err 2>/dev/null || true
          CODE4="$(echo "${CURL4}" | cut -d'|' -f1)"
          if [ "${RC4}" -eq 0 ] || echo "${CODE4}" | grep -Eq '^(200|401|403)$'; then
            IPV4_TLS=1
            echo "GHCR_IPV4_TLS=PASS"
          else
            echo "GHCR_IPV4_TLS=FAIL"
            FAIL=1
          fi

          echo "--- curl -6 https://ghcr.io/v2/ ---"
          if [ "${HAS_AAAA}" = "1" ]; then
            set +e
            CURL6="$(curl -6 -sS -o /tmp/ghcr_v2_6.body -w '%{http_code}|%{ssl_verify_result}|%{time_total}' --connect-timeout 15 --max-time 30 https://ghcr.io/v2/ 2>/tmp/ghcr_v2_6.err)"
            RC6=$?
            set -e
            echo "curl6_rc=${RC6} result=${CURL6}"
            cat /tmp/ghcr_v2_6.err 2>/dev/null || true
            CODE6="$(echo "${CURL6}" | cut -d'|' -f1)"
            if [ "${RC6}" -eq 0 ] || echo "${CODE6}" | grep -Eq '^(200|401|403)$'; then
              IPV6_TLS=1
              echo "GHCR_IPV6_TLS=PASS"
            else
              echo "GHCR_IPV6_TLS=FAIL"
            fi
          else
            echo "GHCR_IPV6_TLS=SKIP_NO_AAAA"
          fi

          echo "--- openssl s_client SNI ghcr.io ---"
          set +e
          echo | timeout 25 openssl s_client -connect ghcr.io:443 -servername ghcr.io >/tmp/ghcr_tls.txt 2>&1
          OSSL_RC=$?
          set -e
          echo "openssl_rc=${OSSL_RC}"
          grep -E 'Verify return code|Protocol|Cipher|depth=|subject=|issuer=|CONNECTED|error:' /tmp/ghcr_tls.txt | head -40 || true
          if grep -q 'Verify return code: 0' /tmp/ghcr_tls.txt; then
            echo "GHCR_OPENSSL_VERIFY=PASS"
          elif grep -qiE 'SSL-Session:|Cipher is' /tmp/ghcr_tls.txt; then
            echo "GHCR_OPENSSL_HANDSHAKE=PARTIAL"
          else
            echo "GHCR_OPENSSL=FAIL"
            FAIL=1
          fi

          echo "--- CONTROL curl -4 https://github.com ---"
          set +e
          C_GH="$(curl -4 -sS -o /dev/null -w '%{http_code}|%{ssl_verify_result}|%{time_total}' --connect-timeout 15 --max-time 25 https://github.com 2>/tmp/ctrl_gh.err)"
          RC_GH=$?
          set -e
          echo "github_rc=${RC_GH} result=${C_GH}"
          cat /tmp/ctrl_gh.err 2>/dev/null || true
          if [ "${RC_GH}" -eq 0 ]; then echo "CTRL_GITHUB_TLS=PASS"; else echo "CTRL_GITHUB_TLS=FAIL"; fi

          echo "--- CONTROL curl -4 https://api.sedi-ai.com/healthz ---"
          set +e
          C_SEDI="$(curl -4 -sS -o /dev/null -w '%{http_code}|%{ssl_verify_result}|%{time_total}' --connect-timeout 10 --max-time 20 https://api.sedi-ai.com/healthz 2>/tmp/ctrl_sedi.err)"
          RC_SEDI=$?
          set -e
          echo "sedi_rc=${RC_SEDI} result=${C_SEDI}"
          if [ "${RC_SEDI}" -eq 0 ]; then echo "CTRL_SEDI_TLS=PASS"; else echo "CTRL_SEDI_TLS=FAIL"; fi

          echo "--- MANIFEST HEAD ---"
          MANIFEST_URL='https://ghcr.io/v2/javadmeighani-oss/sedi-backend/manifests/d039988844b61860caa504d275881237623352f8'
          set +e
          CURL_OUT="$(curl -4 -sS -I -o /tmp/ghcr_manifest_headers.txt -w '%{http_code}|%{ssl_verify_result}|%{time_total}' --connect-timeout 15 --max-time 30 "${MANIFEST_URL}" 2>/tmp/ghcr_manifest_err.txt)"
          CURL_RC=$?
          set -e
          echo "manifest_curl_rc=${CURL_RC} result=${CURL_OUT}"
          head -n 20 /tmp/ghcr_manifest_headers.txt 2>/dev/null || true
          cat /tmp/ghcr_manifest_err.txt 2>/dev/null || true
          MCODE="$(echo "${CURL_OUT}" | cut -d'|' -f1)"
          if [ "${CURL_RC}" -ne 0 ]; then
            echo "GHCR_MANIFEST=FAIL"
            FAIL=1
          elif echo "${MCODE}" | grep -Eq '^(200|401|403|404)$'; then
            echo "GHCR_MANIFEST=PASS"
          else
            echo "GHCR_MANIFEST=FAIL"
            FAIL=1
          fi

          echo "--- DOCKER REGISTRY PATH ---"
          docker info 2>/dev/null | grep -Ei 'Registry|Proxy|HTTP Proxy|HTTPS Proxy|No Proxy|Name:' | head -30 || true
          echo "DOCKER_REGISTRY_PATH=ghcr.io/javadmeighani-oss/sedi-backend"
          echo "NOTE=docker pull not executed"

          echo "--- ROOT CAUSE CLASSIFICATION ---"
          CLASS=UNKNOWN
          if [ "${PROXY_SET}" = "1" ]; then
            CLASS=PROXY
          elif [ "${HAS_AAAA}" = "1" ] && [ "${IPV6_TLS}" = "0" ] && [ "${IPV4_TLS}" = "1" ]; then
            CLASS=IPV6_PATH
          elif [ "${IPV4_TLS}" = "0" ] && [ "${RC_GH}" -eq 0 ]; then
            CLASS=PROVIDER_EGRESS_FILTER
          elif [ "${IPV4_TLS}" = "0" ] && [ "${RC_GH}" -ne 0 ]; then
            CLASS=TLS/CA
          elif [ "${FAIL}" -eq 0 ]; then
            CLASS=TRANSIENT_OR_CLEAR
          fi
          echo "ROOT_CAUSE_CLASS=${CLASS}"
          echo "GHCR_IPV4_TLS=$([ "${IPV4_TLS}" = "1" ] && echo PASS || echo FAIL)"
          if [ "${HAS_AAAA}" = "1" ]; then
            echo "GHCR_IPV6_TLS=$([ "${IPV6_TLS}" = "1" ] && echo PASS || echo FAIL)"
          else
            echo "GHCR_IPV6_TLS=SKIP_NO_AAAA"
          fi

          if [ "${FAIL}" -ne 0 ]; then
            echo "GHCR_CONNECTIVITY=FAIL"
            exit 20
          fi
          echo "GHCR_CONNECTIVITY=PASS"
          echo "=== CHECK DONE ==="
          REMOTE
          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${SEDI_PORT}" \
            "${SEDI_USER}@${SEDI_HOST}" \
            "SEDI_DEPLOY_PATH=$(printf '%q' "${SEDI_DEPLOY_PATH}") MODE=$(printf '%q' "${MODE}") bash -s" < "${SCRIPT}"
          rm -f "${SCRIPT}"
