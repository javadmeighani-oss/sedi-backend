# Primary User I8 Cross-I acceptance — PostgreSQL 16
# GATE=SEDI-V1-BE-PRIMARY-USER-I8-PG16-CROSS-I-ACCEPTANCE-01
name: I8 Primary User Cross-I Acceptance PG16

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/tests/test_i8_primary_user_cross_i_acceptance_pg16.py"
      - "backend/tests/helpers/stage_b_family_fixture.py"
      - "backend/app/services/i8/action_completion.py"
      - "backend/app/services/i8/unified_core.py"
      - "backend/app/services/i8/context.py"
      - "backend/app/services/i8/knowledge_bridge.py"
      - "backend/app/services/i10/coaching_done.py"
      - "backend/app/services/i10/coaching_worker.py"
      - "backend/app/routers/notifications.py"
      - ".github/workflows/i8-primary-user-cross-i-acceptance-pg16.yml"

permissions:
  contents: read

concurrency:
  group: i8-primary-cross-i-${{ github.ref }}
  cancel-in-progress: false

jobs:
  i8-primary-cross-i:
    name: I8 Primary User Cross-I PG16
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sedi_cross_i
          POSTGRES_PASSWORD: sedi_cross_i_pass
          POSTGRES_DB: sedi_cross_i
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_cross_i -d sedi_cross_i"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg2://sedi_cross_i:sedi_cross_i_pass@127.0.0.1:5432/sedi_cross_i
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_cross_i:sedi_cross_i_pass@127.0.0.1:5432/sedi_cross_i
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAI_API_KEY: ci-placeholder-not-used
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest alembic
      - name: Prove PostgreSQL 16
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          eng = create_engine(os.environ["TEST_DATABASE_URL"])
          with eng.connect() as c:
              ver = c.execute(text("SHOW server_version")).scalar()
              print("POSTGRES_SERVER_VERSION", ver)
              assert str(ver).startswith("16."), ver
          PY
      - name: Alembic single head 079
        run: |
          set -euo pipefail
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          cfg = Config("backend/alembic.ini")
          script = ScriptDirectory.from_config(cfg)
          heads = script.get_heads()
          assert heads == ["079_i10_cni_owner_provenance_nullable"], heads
          print("ALEMBIC_HEAD_OK", heads[0])
          PY
      - name: Upgrade ephemeral DB to head
        run: |
          set -euo pipefail
          python -m alembic -c backend/alembic.ini upgrade head
      - name: Focused Cross-I acceptance
        run: |
          set -euo pipefail
          mkdir -p /tmp/cross_i_evidence
          set +e
          python -B -m pytest -v --tb=short \
            backend/tests/test_i8_primary_user_cross_i_acceptance_pg16.py \
            > /tmp/cross_i_evidence/cross_i_pytest.txt 2>&1
          rc=$?
          set -e
          echo "## Cross-I (exit=$rc)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 /tmp/cross_i_evidence/cross_i_pytest.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::cross-i pytest failed"
            tail -n 120 /tmp/cross_i_evidence/cross_i_pytest.txt
            exit "$rc"
          fi
      - name: Affected seam regressions
        run: |
          set -euo pipefail
          set +e
          python -B -m pytest -v --tb=short \
            backend/tests/test_i7_i8_bounded_personalization_seam.py \
            backend/tests/test_i8_proactive_followup_loop_02.py \
            backend/tests/test_i10_b13_coaching_followup.py \
            backend/tests/test_i10_b17_interaction_vocabulary.py \
            > /tmp/cross_i_evidence/regress_pytest.txt 2>&1
          rc=$?
          set -e
          echo "## Regressions (exit=$rc)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 /tmp/cross_i_evidence/regress_pytest.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::regression pytest failed"
            tail -n 80 /tmp/cross_i_evidence/regress_pytest.txt
            exit "$rc"
          fi
      - name: Summarize
        run: |
          set -euo pipefail
          echo "=== CROSS_I ===" && tail -n 5 /tmp/cross_i_evidence/cross_i_pytest.txt
          echo "=== REGRESS ===" && tail -n 5 /tmp/cross_i_evidence/regress_pytest.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i8-primary-user-cross-i-acceptance-pytest
          path: /tmp/cross_i_evidence/
