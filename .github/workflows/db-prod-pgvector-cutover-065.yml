# Production pgvector Gate — identity / private restore+rehearsal / cutover / migrate
# Sensitive dumps NEVER uploaded. Summary markers only.
name: DB-PROD-PGVECTOR Cutover And 065 Reentry

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "IDENTITY | REHEARSE | CUTOVER | MIGRATE | VERIFY"
        required: true
      confirmation:
        description: "Phase confirmation token"
        required: true
      candidate_image_digest:
        description: "sha256:... digest of sedi-postgres image (REHEARSE/CUTOVER)"
        required: false
        default: ""
      rollback_image:
        description: "Rollback image ref (CUTOVER); default postgres:16-alpine"
        required: false
        default: "postgres:16-alpine"
      migration_image_digest:
        description: "sha256:... digest of sedi-backend migration image"
        required: false
        default: ""
  push:
    paths:
      - "backend/ops/db03/db_prod_pgvector_*.sh"
      - "backend/ops/db03/db_prod_065_migrate_remote.sh"
      - ".github/workflows/db-prod-pgvector-cutover-065.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: sedi-production-backend-operation
  cancel-in-progress: false

jobs:
  identity:
    name: Production identity (read-only)
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.phase == 'IDENTITY' && github.event.inputs.confirmation == 'IDENTITY_ONLY')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: SSH identity
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/db03"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/db03/db_prod_pgvector_identity_remote.sh \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/db_prod_pgvector_identity_remote.sh"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/db_prod_pgvector_identity_remote.sh") && \
             DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
             bash $(printf '%q' "${REMOTE_DIR}/db_prod_pgvector_identity_remote.sh")" \
            2>&1 | tee /tmp/identity.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-prod-pgvector-identity
          path: /tmp/identity.log
          retention-days: 14

  rehearse:
    name: Private restore + data-equivalent 060→065
    needs: []
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.phase == 'REHEARSE' &&
      github.event.inputs.confirmation == 'REHEARSE_PRODUCTION_BACKUP'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Validate digests
        env:
          CAND_D: ${{ github.event.inputs.candidate_image_digest }}
          MIG_D: ${{ github.event.inputs.migration_image_digest }}
        run: |
          set -Eeuo pipefail
          echo "${CAND_D}" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "${MIG_D}" | grep -Eq '^sha256:[0-9a-f]{64}$'
      - name: SSH private rehearse
        env:
          CAND_D: ${{ github.event.inputs.candidate_image_digest }}
          MIG_D: ${{ github.event.inputs.migration_image_digest }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/db03"
          CAND_REF="ghcr.io/javadmeighani-oss/sedi-postgres@${CAND_D}"
          MIG_REF="ghcr.io/javadmeighani-oss/sedi-backend@${MIG_D}"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/db03/db_prod_pgvector_rehearse_remote.sh \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/db_prod_pgvector_rehearse_remote.sh"
          # Also ensure compose supports SEDI_POSTGRES_IMAGE (scp updated compose)
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            compose.production.yml \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${DEPLOY_PATH}/compose.production.yml"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/db_prod_pgvector_rehearse_remote.sh") && \
             DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
             CANDIDATE_IMAGE_REF=$(printf '%q' "${CAND_REF}") \
             MIGRATION_IMAGE_REF=$(printf '%q' "${MIG_REF}") \
             bash $(printf '%q' "${REMOTE_DIR}/db_prod_pgvector_rehearse_remote.sh")" \
            2>&1 | tee /tmp/rehearse.log
          grep -Fq 'REHEARSE_SUMMARY|production_data_equivalent_060_to_065_rehearsal|PASS' /tmp/rehearse.log
          grep -Fq 'REHEARSE_SUMMARY|restore_capability_proof|PASS' /tmp/rehearse.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-prod-pgvector-rehearse-summaries
          path: /tmp/rehearse.log
          retention-days: 14

  cutover:
    name: Production postgres image cutover
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.phase == 'CUTOVER' &&
      github.event.inputs.confirmation == 'CUTOVER_PGVECTOR_IMAGE'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        env:
          CAND_D: ${{ github.event.inputs.candidate_image_digest }}
        run: echo "${CAND_D}" | grep -Eq '^sha256:[0-9a-f]{64}$'
      - name: SSH cutover
        env:
          CAND_D: ${{ github.event.inputs.candidate_image_digest }}
          ROLLBACK: ${{ github.event.inputs.rollback_image }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/db03"
          CAND_REF="ghcr.io/javadmeighani-oss/sedi-postgres@${CAND_D}"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/db03/db_prod_pgvector_cutover_remote.sh compose.production.yml \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/"
          # compose lives at deploy root
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            compose.production.yml \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${DEPLOY_PATH}/compose.production.yml"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/db03/db_prod_pgvector_cutover_remote.sh \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/db_prod_pgvector_cutover_remote.sh"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/db_prod_pgvector_cutover_remote.sh") && \
             DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
             CANDIDATE_IMAGE_REF=$(printf '%q' "${CAND_REF}") \
             ROLLBACK_IMAGE_REF=$(printf '%q' "${ROLLBACK}") \
             bash $(printf '%q' "${REMOTE_DIR}/db_prod_pgvector_cutover_remote.sh")" \
            2>&1 | tee /tmp/cutover.log
          grep -Fq 'CUTOVER_SUMMARY|production_image_cutover|PASS' /tmp/cutover.log
          grep -Fq 'CUTOVER_SUMMARY|alembic_still_060|YES' /tmp/cutover.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-prod-pgvector-cutover
          path: /tmp/cutover.log
          retention-days: 14

  migrate:
    name: Production migrate 060→065
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.phase == 'MIGRATE' &&
      github.event.inputs.confirmation == 'MIGRATE_060_TO_065'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        env:
          MIG_D: ${{ github.event.inputs.migration_image_digest }}
        run: echo "${MIG_D}" | grep -Eq '^sha256:[0-9a-f]{64}$'
      - name: SSH migrate
        env:
          MIG_D: ${{ github.event.inputs.migration_image_digest }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/db03"
          MIG_REF="ghcr.io/javadmeighani-oss/sedi-backend@${MIG_D}"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/db03/db_prod_065_migrate_remote.sh \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/db_prod_065_migrate_remote.sh"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/db_prod_065_migrate_remote.sh") && \
             DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
             MIGRATION_IMAGE_REF=$(printf '%q' "${MIG_REF}") \
             bash $(printf '%q' "${REMOTE_DIR}/db_prod_065_migrate_remote.sh")" \
            2>&1 | tee /tmp/migrate.log
          grep -Fq 'MIGRATE_SUMMARY|production_migration|PASS' /tmp/migrate.log
          grep -Fq 'MIGRATE_SUMMARY|production_alembic|065_i5_know04_connectors_change_intelligence' /tmp/migrate.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-prod-065-migrate
          path: /tmp/migrate.log
          retention-days: 14
