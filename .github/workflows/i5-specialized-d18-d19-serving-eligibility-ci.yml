# Specialized D18/D19 serving eligibility CI (offline).
name: I5 Specialized D18 D19 Serving Eligibility CI

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/app/services/i5/governed_specialized_entity_eligibility.py"
      - "backend/app/services/i5/governed_low_risk_eligibility.py"
      - "backend/app/services/i5/governed_ku_serving.py"
      - "backend/app/services/i5/conceptual_extraction.py"
      - "backend/config/i5/multisource_activation_allowlist_v1.yaml"
      - "backend/tests/test_i5_specialized_d18_d19_serving_eligibility.py"
      - "backend/tests/test_i5_source_format_resilience.py"
      - ".github/workflows/i5-specialized-d18-d19-serving-eligibility-ci.yml"

permissions:
  contents: read

concurrency:
  group: i5-specialized-d18-d19-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  specialized-ci:
    name: Specialized D18/D19 eligibility offline suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: specialized-placeholder-not-used
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Targeted suite
        run: |
          python -B -m pytest \
            --noconftest \
            -p no:cacheprovider \
            -q --tb=short \
            backend/tests/test_i5_specialized_d18_d19_serving_eligibility.py \
            backend/tests/test_i5_wave01_governed_knowledge_expansion.py::test_wave01_als_ms_mapped_to_medlineplus_only_among_active \
            backend/tests/test_section30_i5_multisource_weekly_activation.py::test_multisource_allowlist_publisher_diversity_and_exact_urls \
            backend/tests/test_i5_source_format_resilience.py
