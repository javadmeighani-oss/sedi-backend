# Temporary ops-only READ-ONLY audit: why are smart notifications not reaching the primary user?
# Must not be merged to main. Push trigger only on this ops branch.
# NO deploy, NO flag change, NO provider call, NO writes (SET TRANSACTION READ ONLY + rollback).
# Prints counts / codes / hashes only: no message bodies, no tokens, no secrets.
name: Notification Stall Readonly Audit

on:
  push:
    branches:
      - ops/notif-stall-readonly-audit

permissions:
  contents: read

jobs:
  audit:
    name: Production read-only notification stall audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Prepare SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts

      - name: Run read-only notification stall audit
        env:
          SEDI_PORT: ${{ secrets.SEDI_PORT }}
          SEDI_HOST: ${{ secrets.SEDI_HOST }}
          SEDI_USER: ${{ secrets.SEDI_USER }}
          SEDI_DEPLOY_PATH: ${{ secrets.SEDI_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${SEDI_PORT}" \
            "${SEDI_USER}@${SEDI_HOST}" \
            "SEDI_DEPLOY_PATH='${SEDI_DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${SEDI_DEPLOY_PATH}"

          echo "=== GATE ==="
          echo "GATE=SEDI-NOTIF-STALL-READONLY-AUDIT-01"
          echo "MODE=READ_ONLY"
          docker inspect sedi-backend --format 'RUNNING_TAG={{.Config.Image}}'

          echo "=== FLAGS (presence/value of booleans only) ==="
          docker exec -i sedi-backend python - <<'PY'
          import os
          for k in (
              "SEDI_NOTIFICATION_PROVIDER_DELIVERY_ENABLED",
              "SEDI_I10_CONTEXTUAL_FOLLOWUP_ENABLED",
              "SEDI_DAILY_INITIATIVE_ENABLED",
              "SEDI_I10_COACHING_FOLLOWUP_ENABLED",
              "FCM_DISABLED",
              "FCM_TIMEOUT_SECONDS",
          ):
              print(f"{k}={os.getenv(k, 'UNSET')}")
          PY

          echo "=== DB AUDIT (read-only) ==="
          docker exec -i sedi-backend python - <<'PY'
          from __future__ import annotations
          import json
          from datetime import datetime, timedelta
          from sqlalchemy import func, text
          from backend.app import models
          from backend.app.database import SessionFactory

          db = SessionFactory()
          try:
              db.rollback()
              db.execute(text("SET TRANSACTION READ ONLY"))
              now = datetime.utcnow()
              print(f"NOW_UTC={now.isoformat()}")
              UID = 1

              print("--- all users: notifications created last 24h by type/status/sent ---")
              rows = (
                  db.query(models.Notification.type, models.Notification.status,
                           models.Notification.is_sent, func.count())
                  .filter(models.Notification.created_at >= now - timedelta(hours=24))
                  .group_by(models.Notification.type, models.Notification.status,
                            models.Notification.is_sent)
                  .all()
              )
              for t, s, sent, c in rows:
                  print(f"ALL24|type={t}|status={s}|is_sent={sent}|count={c}")
              if not rows:
                  print("ALL24|none")

              print(f"--- user {UID}: last 20 notifications (no bodies) ---")
              last = (
                  db.query(models.Notification)
                  .filter(models.Notification.user_id == UID)
                  .order_by(models.Notification.id.desc())
                  .limit(20)
                  .all()
              )
              for n in last:
                  err = (n.last_error or "")[:90].replace("|", "/").replace("\n", " ")
                  dk = (n.dedupe_key or "")[:24]
                  print(
                      f"NOTIF|id={n.id}|created={n.created_at}|type={n.type}|channel={n.channel}"
                      f"|family={n.semantic_family}|status={n.status}|sent={n.is_sent}"
                      f"|sent_at={n.sent_at}|provider={n.provider}|dedupe={dk}|err={err}"
                  )
              if not last:
                  print("NOTIF|none")

              print(f"--- user {UID}: feedback last 7d ---")
              fb = (
                  db.query(models.NotificationFeedback)
                  .filter(models.NotificationFeedback.user_id == UID,
                          models.NotificationFeedback.created_at >= now - timedelta(days=7))
                  .order_by(models.NotificationFeedback.id.asc())
                  .all()
              )
              by = {}
              for r in fb:
                  reason = ""
                  try:
                      reason = (json.loads(r.meta_json or "{}") or {}).get("reason") or ""
                  except Exception:
                      pass
                  k = (r.action, reason)
                  by[k] = by.get(k, 0) + 1
              for (a, rs), c in sorted(by.items()):
                  print(f"FEEDBACK_7D|action={a}|reason={rs}|count={c}")
              for r in fb[-6:]:
                  print(f"FEEDBACK_LAST|id={r.id}|created={r.created_at}|action={r.action}")
              if not fb:
                  print("FEEDBACK_7D|none")

              print("--- adaptive state + send guard (read-only calls) ---")
              from backend.app.services.notifications.adaptive_policy_v1 import compute_adaptive_state
              st = compute_adaptive_state(db, UID, now, days=7)
              print(f"ADAPTIVE|paused_until={st.get('paused_until')}|cap={st.get('companion_cap_override')}"
                    f"|counts={st.get('counts')}|hints={st.get('content_hints')}")
              from backend.app.services.notifications.send_guard_v1 import can_send_v1
              for ch, tk in (("companion", "connection_ping"), ("engagement", None)):
                  try:
                      g = can_send_v1(db, UID, ch, tk, "normal", now)
                      print(f"GUARD|channel={ch}|allowed={g['allowed']}|reasons={g['reasons']}|cap={g['cap']}|paused_until={g['paused_until']}")
                  except Exception as exc:
                      print(f"GUARD|channel={ch}|error={type(exc).__name__}")

              print("--- chat activity / prefs / quiet hours ---")
              try:
                  from backend.app.services.i10.interaction_recorder import (
                      get_last_chat_activity_at, count_engagement_family_on_user_local_day)
                  lc = get_last_chat_activity_at(db, UID)
                  if lc is not None and getattr(lc, "tzinfo", None) is not None:
                      lc = lc.replace(tzinfo=None) - (lc.utcoffset() or timedelta(0))
                  print(f"LAST_CHAT_ACTIVITY_UTC={lc}")
                  print(f"HOURS_SINCE_LAST_CHAT={(now - lc).total_seconds()/3600 if lc else None}")
                  print(f"ENGAGEMENT_FAMILY_TODAY={count_engagement_family_on_user_local_day(db, user_id=UID, when=now)}")
              except Exception as exc:
                  print(f"CHAT_ACTIVITY_ERROR={type(exc).__name__}")
              p = db.query(models.NotificationPrefs).filter(models.NotificationPrefs.user_id == UID).first()
              if p is None:
                  print("PREFS|none (defaults apply)")
              else:
                  print(f"PREFS|companion_enabled={p.companion_enabled}|health_alert={p.health_alert_enabled}"
                        f"|quiet_enabled={p.quiet_hours_enabled}|quiet={p.quiet_start}-{p.quiet_end}"
                        f"|daily_time={p.daily_notification_time}|engagement_level={p.engagement_level}")
              core = db.query(models.UserProfileCore).filter(models.UserProfileCore.user_id == UID).first()
              print(f"PROFILE_CORE|timezone={getattr(core,'timezone',None)}|quiet={getattr(core,'quiet_start',None)}-{getattr(core,'quiet_end',None)}")
              try:
                  from backend.app.services.notification_runtime.quiet_hours import is_within_quiet_hours
                  print(f"IN_QUIET_NOW_ENGAGEMENT={is_within_quiet_hours(db, UID, 'engagement', 'normal')}")
                  print(f"IN_QUIET_NOW_MORNING={is_within_quiet_hours(db, UID, 'morning', 'normal')}")
              except Exception as exc:
                  print(f"QUIET_ERROR={type(exc).__name__}")

              print("--- I10 decisions for user last 48h ---")
              try:
                  ds = (
                      db.query(models.I10NotificationDecision.source_type,
                               models.I10NotificationDecision.decision,
                               models.I10NotificationDecision.reason_code, func.count())
                      .filter(models.I10NotificationDecision.recipient_user_id == UID,
                              models.I10NotificationDecision.created_at >= now - timedelta(hours=48))
                      .group_by(models.I10NotificationDecision.source_type,
                                models.I10NotificationDecision.decision,
                                models.I10NotificationDecision.reason_code)
                      .all()
                  )
                  for s, d, r, c in ds:
                      print(f"I10DEC|source={s}|decision={d}|reason={r}|count={c}")
                  if not ds:
                      print("I10DEC|none")
              except Exception as exc:
                  print(f"I10DEC_ERROR={type(exc).__name__}")

              print("--- active push devices (hash prefixes only) ---")
              for d in db.query(models.PushDevice).filter(models.PushDevice.is_active == True).all():  # noqa: E712
                  print(f"ACTIVE_DEVICE|id={d.id}|user_id={d.user_id}|last_seen={d.last_seen_at}")
          finally:
              db.rollback()
              db.close()
          print("TRANSACTION_ROLLED_BACK=YES")
          PY

          echo "=== LOG COUNTS (last 24h, counts only) ==="
          for pat in \
            "job_id=inactivity_notifications" \
            "Connection ping created" \
            "Connection ping skipped" \
            "morning_notifications" \
            "i10_contextual_followup" \
            "i10_daily_initiative" \
            "event=fcm_send" \
            "result=success" \
            "result=failure" \
            "provider_expired" \
            "provider_policy_blocked" \
            "\\[NOTIF\\] failed" \
            "deliver_pending job end sent_count=[1-9]"; do
            c="$(docker logs --since 24h sedi-backend 2>&1 | grep -Ec "${pat}" || true)"
            echo "LOGCOUNT|${pat}|${c}"
          done
          echo "--- last scheduler error-ish lines (no user content) ---"
          docker logs --since 24h --timestamps sedi-backend 2>&1 | grep -E "Traceback|isolated failure|scheduler.*(error|failed)" | tail -n 8 | cut -c1-200 || true
          echo "=== AUDIT_END ==="
          REMOTE
