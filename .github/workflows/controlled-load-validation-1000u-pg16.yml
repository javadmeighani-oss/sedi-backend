# Controlled load validation — NOT PRODUCTION LOAD
# GATE=SEDI-V1-BE-1000U-100CC-CONTROLLED-LOAD-VALIDATION-01
name: Controlled Load Validation 1000U PG16

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/ops/capacity/controlled_load_*.py"
      - "backend/ops/capacity/run_scheduler_role.py"
      - ".github/workflows/controlled-load-validation-1000u-pg16.yml"

permissions:
  contents: read

concurrency:
  group: controlled-load-1000u-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controlled-load:
    name: Controlled Load PG16 (NOT PRODUCTION)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sedi_cl
          POSTGRES_PASSWORD: sedi_cl_pass
          POSTGRES_DB: sedi_cl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_cl -d sedi_cl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg2://sedi_cl:sedi_cl_pass@127.0.0.1:5432/sedi_cl
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_cl:sedi_cl_pass@127.0.0.1:5432/sedi_cl
      SECRET_KEY: capacity-controlled-load-secret-32b!!
      JWT_SECRET: capacity-controlled-load-secret-32b!!
      OPENAI_API_KEY: capacity-stub-not-real
      SEDI_DISABLE_SCHEDULER: "1"
      SEDI_DB_POOL_SIZE: "5"
      SEDI_DB_MAX_OVERFLOW: "10"
      SEDI_CAPACITY_AI_LATENCY_MS: "50"
      REGISTERED_USERS: "1000"
      PLATEAU_SECONDS: "20"
      WORKER_MATRIX: "1,2,4"
      APP_BASE_URL: http://127.0.0.1:8000
      APP_PORT: "8000"
      PYTHONDONTWRITEBYTECODE: "1"
      RAG_LOCAL_ENABLED: "false"
      RAG_VECTOR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Notice
        run: |
          echo "THIS IS NOT PRODUCTION LOAD" >> "$GITHUB_STEP_SUMMARY"
          echo "No real OpenAI/FCM/SMS; synthetic users only; ephemeral PG16." >> "$GITHUB_STEP_SUMMARY"
      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest alembic
      - name: Prove PostgreSQL 16 + Alembic 079
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          eng = create_engine(os.environ["TEST_DATABASE_URL"])
          with eng.connect() as c:
              ver = c.execute(text("SHOW server_version")).scalar()
              maxc = c.execute(text("SHOW max_connections")).scalar()
              print("POSTGRES_SERVER_VERSION", ver)
              print("PG_MAX_CONNECTIONS", maxc)
              assert str(ver).startswith("16."), ver
          cfg = Config("backend/alembic.ini")
          heads = ScriptDirectory.from_config(cfg).get_heads()
          assert heads == ["079_i10_cni_owner_provenance_nullable"], heads
          print("ALEMBIC_HEAD_OK", heads[0])
          PY
      - name: Upgrade ephemeral DB
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Run controlled load validation
        run: |
          set -euo pipefail
          mkdir -p /tmp/controlled_load_evidence
          set +e
          python -B -m backend.ops.capacity.controlled_load_validation \
            --out-dir /tmp/controlled_load_evidence \
            --workers "$WORKER_MATRIX" \
            --users "$REGISTERED_USERS" \
            --plateau-s "$PLATEAU_SECONDS" \
            --ai-latency-ms "$SEDI_CAPACITY_AI_LATENCY_MS" \
            > /tmp/controlled_load_evidence/harness_stdout.txt 2>&1
          rc=$?
          set -e
          echo "## Controlled load (exit=$rc)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 /tmp/controlled_load_evidence/harness_stdout.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/controlled_load_evidence/controlled_load_report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          rep = json.loads(Path("/tmp/controlled_load_evidence/controlled_load_report.json").read_text())
          r = rep.get("result", {})
          print("### Result keys")
          for k in [
              "REGISTERED_1000","CONNECTED_25","CONNECTED_50","CONNECTED_75","CONNECTED_100",
              "CHAT_BURST_50","CHAT_BURST_100","RECOMMENDED_API_WORKERS",
              "CAPACITY_BLOCKER_DB_SESSION_ACROSS_AI","INFRASTRUCTURE_LIMITATION",
          ]:
              print(f"- {k}={r.get(k)}")
          print(f"- gate_result={rep.get('gate_result')}")
          PY
          fi
          exit "$rc"
      - name: Correctness regressions (smallest set)
        run: |
          set -euo pipefail
          set +e
          python -B -m pytest -v --tb=short \
            backend/tests/test_capacity_hardening_unit.py \
            backend/tests/test_capacity_hardening_pg16.py \
            backend/tests/test_i7_i8_bounded_personalization_seam.py \
            backend/tests/test_i5_final_readiness_answer_path.py \
            backend/tests/test_i5_g305_retrieval_eval.py \
            backend/tests/test_rag_context_pack_v1.py \
            backend/tests/test_i10_b13_coaching_followup.py \
            backend/tests/test_i8_proactive_schedule_trigger_pd_i8_04b.py \
            > /tmp/controlled_load_evidence/regress_pytest.txt 2>&1
          rc=$?
          set -e
          echo "## Regressions (exit=$rc)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 /tmp/controlled_load_evidence/regress_pytest.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            tail -n 120 /tmp/controlled_load_evidence/regress_pytest.txt
            exit "$rc"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-load-1000u-evidence
          path: /tmp/controlled_load_evidence/
