# Guarded production Alembic migration + Iran directory apply (workflow_dispatch only).
# Confirmation tokens:
#   MIGRATE_TO_056           → digest-pinned one-off alembic upgrade to 056 (no backend deploy)
#   MIGRATE_TO_060           → DB-PROD-01: 056→060 + role hardening + runtime cutover
#   APPLY_IRAN_DIRECTORY_V1  → bounded IRIMC acquire + guarded prod apply
name: W6-P01 Production Migration 056

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Accepted tokens: MIGRATE_TO_056 | MIGRATE_TO_060 | APPLY_IRAN_DIRECTORY_V1"
        required: true
      expected_before_revision:
        description: "For MIGRATE_TO_056/060: exact alembic_version expected before migration."
        required: false
      migration_image_sha:
        description: "For MIGRATE_TO_056/060: 40-character lowercase Git commit SHA image tag."
        required: false
      migration_image_digest:
        description: "For MIGRATE_TO_056/060: expected migration image digest sha256:<64 hex>."
        required: false
      expected_alembic_revision:
        description: "For APPLY_IRAN_DIRECTORY_V1: exact production alembic_version required before apply."
        required: false
        default: 056_i5_w2_p02_conflict_safety
      payload_artifact_name:
        description: "For APPLY_IRAN_DIRECTORY_V1: artifact name for the normalized Iran directory payload."
        required: false
        default: iran-directory-normalized-payload

concurrency:
  group: sedi-production-backend-operation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-056:
    name: Migrate / verify 056_i5_w2_p02_conflict_safety on production
    if: github.event.inputs.confirmation == 'MIGRATE_TO_056'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate migration inputs
        id: validate_inputs
        env:
          INPUT_CONFIRMATION: ${{ github.event.inputs.confirmation }}
          INPUT_EXPECTED_BEFORE: ${{ github.event.inputs.expected_before_revision }}
          INPUT_MIGRATION_SHA: ${{ github.event.inputs.migration_image_sha }}
          INPUT_MIGRATION_DIGEST: ${{ github.event.inputs.migration_image_digest }}
        run: |
          set -Eeuo pipefail
          if [ "${INPUT_CONFIRMATION}" != "MIGRATE_TO_056" ]; then
            echo "Confirmation input must be exactly MIGRATE_TO_056."
            exit 1
          fi
          case "${INPUT_EXPECTED_BEFORE}" in
            049_section10_kb_embeddings_memory_governance|\
            050_gate4_event_idem|\
            051_i5b2_governed_source_profile|\
            052_i5_w5_iran_directory|\
            053_i5_w1_p01_weekly_governance|\
            054_i5_w1_p02_ku_provenance|\
            055_i5_w2_p01_knowledge_memory|\
            056_i5_w2_p02_conflict_safety)
              ;;
            *)
              echo "expected_before_revision is not in the accepted set."
              exit 1
              ;;
          esac
          if ! echo "${INPUT_MIGRATION_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "migration_image_sha must be a 40-character lowercase hex Git commit SHA."
            exit 1
          fi
          if ! echo "${INPUT_MIGRATION_DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "migration_image_digest must match sha256:<64 hex>."
            exit 1
          fi
          echo "Migration inputs validated."

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts

      - name: Run guarded production migration / verification
        id: migrate
        env:
          INPUT_EXPECTED_BEFORE: ${{ github.event.inputs.expected_before_revision }}
          INPUT_MIGRATION_SHA: ${{ github.event.inputs.migration_image_sha }}
          INPUT_MIGRATION_DIGEST: ${{ github.event.inputs.migration_image_digest }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH_Q="$(printf '%q' "${{ secrets.SEDI_DEPLOY_PATH }}")"
          EXPECTED_BEFORE_Q="$(printf '%q' "${INPUT_EXPECTED_BEFORE}")"
          MIGRATION_SHA_Q="$(printf '%q' "${INPUT_MIGRATION_SHA}")"
          MIGRATION_DIGEST_Q="$(printf '%q' "${INPUT_MIGRATION_DIGEST}")"

          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "DEPLOY_PATH=${DEPLOY_PATH_Q} EXPECTED_BEFORE=${EXPECTED_BEFORE_Q} MIGRATION_SHA=${MIGRATION_SHA_Q} MIGRATION_DIGEST=${MIGRATION_DIGEST_Q} bash -s" \
            2>&1 <<'REMOTE_SCRIPT' | tee /tmp/w6p01_migration_056_run.log
          set -Eeuo pipefail
          log() { echo "[$(date -Is)] $*"; }
          summary() { echo "MIGRATION_SUMMARY|$1|$2"; }

          ENV_FILE="/etc/sedi/sedi-backend.env"
          TARGET_REV="056_i5_w2_p02_conflict_safety"
          MIGRATION_IMAGE_TAG="ghcr.io/javadmeighani-oss/sedi-backend:${MIGRATION_SHA}"
          MIGRATION_IMAGE_REF="ghcr.io/javadmeighani-oss/sedi-backend@${MIGRATION_DIGEST}"

          check_database_target_alignment() {
            log "=== DATABASE TARGET ALIGNMENT ==="
            POSTGRES_DB_NAME="$(docker exec sedi-postgres printenv POSTGRES_DB)"
            POSTGRES_CONTAINER_IP="$(
              docker inspect sedi-postgres \
                --format '{{with index .NetworkSettings.Networks "sedi-net"}}{{.IPAddress}}{{end}}'
            )"
            RUNNING_BACKEND_IMAGE_ID="$(
              docker inspect sedi-backend --format '{{.Image}}'
            )"

            if [ -z "${POSTGRES_DB_NAME}" ] || [ -z "${POSTGRES_CONTAINER_IP}" ] || [ -z "${RUNNING_BACKEND_IMAGE_ID}" ]; then
              log "DATABASE_TARGET_ALIGNMENT_FAILED: missing container metadata"
              exit 9
            fi

            if ! docker run --rm \
              --network sedi-net \
              --env-file "${ENV_FILE}" \
              --env TEST_DATABASE_URL= \
              --env EXPECTED_DB_IP="${POSTGRES_CONTAINER_IP}" \
              --env EXPECTED_DB_NAME="${POSTGRES_DB_NAME}" \
              --entrypoint python \
              "${RUNNING_BACKEND_IMAGE_ID}" - <<'PY'
          import os
          import socket

          from sqlalchemy.engine import make_url

          raw_url = os.environ.get("DATABASE_URL", "")
          expected_ip = os.environ.get("EXPECTED_DB_IP", "")
          expected_db = os.environ.get("EXPECTED_DB_NAME", "")

          if not raw_url or not expected_ip or not expected_db:
              raise SystemExit("DATABASE_TARGET_ALIGNMENT_FAILED: missing required value")

          url = make_url(raw_url)
          base_driver = url.drivername.split("+", 1)[0].lower()

          if base_driver not in {"postgresql", "postgres"}:
              raise SystemExit("DATABASE_TARGET_ALIGNMENT_FAILED: non-PostgreSQL driver")

          host = url.host
          port = url.port or 5432
          database = url.database or ""

          if not host:
              raise SystemExit("DATABASE_TARGET_ALIGNMENT_FAILED: missing host")

          try:
              resolved_ips = {
                  item[4][0]
                  for item in socket.getaddrinfo(
                      host,
                      port,
                      type=socket.SOCK_STREAM,
                  )
              }
          except socket.gaierror:
              raise SystemExit("DATABASE_TARGET_ALIGNMENT_FAILED: host resolution failed")

          if expected_ip not in resolved_ips:
              raise SystemExit(
                  "DATABASE_TARGET_ALIGNMENT_FAILED: host does not resolve to sedi-postgres"
              )

          if port != 5432:
              raise SystemExit("DATABASE_TARGET_ALIGNMENT_FAILED: unexpected port")

          if database != expected_db:
              raise SystemExit("DATABASE_TARGET_ALIGNMENT_FAILED: database name mismatch")

          print("database_target_alignment=pass")
          print(f"database_driver={base_driver}")
          print("database_host_resolution=matched_sedi_postgres")
          print(f"database_port={port}")
          print("database_name_match=yes")
          PY
            then
              log "DATABASE_TARGET_ALIGNMENT_FAILED: parser exit non-zero"
              exit 9
            fi
            summary "database_target_alignment" "pass"
          }

          assert_table() {
            local tbl="$1"
            local reg
            reg="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT to_regclass('public.${tbl}');")"
            if [ -z "${reg}" ] || [ "${reg}" = "" ]; then
              log "SCHEMA_ASSERT_FAILED: missing table ${tbl}"
              exit 30
            fi
            log "schema_table_ok=${tbl}"
          }

          post_schema_assertions() {
            log "=== POST-CHECK: SCHEMA ASSERTIONS ==="
            assert_table "weekly_knowledge_runs"
            assert_table "i5_raw_evidence"
            assert_table "knowledge_units"
            assert_table "knowledge_provenance"
            assert_table "knowledge_memory_items"
            assert_table "interaction_events"
            UQ_CNT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM pg_indexes WHERE schemaname='public' AND tablename='interaction_events' AND indexname='uq_interaction_events_notif_chat_once';")"
            if [ "${UQ_CNT}" != "1" ]; then
              log "SCHEMA_ASSERT_FAILED: missing partial unique index uq_interaction_events_notif_chat_once"
              exit 31
            fi
            log "interaction_events_idempotency_index=${UQ_CNT}"
            summary "schema_assertions" "pass"
          }

          post_alembic_checks() {
            local image_ref="$1"
            log "=== POST-CHECK: DIRECT ALEMBIC VERSION ==="
            ALEMBIC_AFTER_COUNT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM alembic_version;")"
            ALEMBIC_AFTER="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT version_num FROM alembic_version;")"
            log "alembic_after_count=${ALEMBIC_AFTER_COUNT}"
            log "alembic_after=${ALEMBIC_AFTER}"
            summary "post_revision" "${ALEMBIC_AFTER}"
            if [ "${ALEMBIC_AFTER_COUNT}" != "1" ] || [ "${ALEMBIC_AFTER}" != "${TARGET_REV}" ]; then
              log "MIGRATION_FAILED: alembic_version after check is invalid"
              exit 20
            fi

            log "=== POST-CHECK: ONE-OFF ALEMBIC CURRENT/HEADS ==="
            ALEMBIC_CURRENT_OUT="$(docker run --rm --network sedi-net --env-file "${ENV_FILE}" --env TEST_DATABASE_URL= "${image_ref}" python -m alembic -c backend/alembic.ini current 2>&1 || true)"
            ALEMBIC_HEADS_OUT="$(docker run --rm --network sedi-net --env-file "${ENV_FILE}" --env TEST_DATABASE_URL= "${image_ref}" python -m alembic -c backend/alembic.ini heads 2>&1 || true)"
            log "${ALEMBIC_CURRENT_OUT}"
            log "${ALEMBIC_HEADS_OUT}"
            echo "${ALEMBIC_CURRENT_OUT}" | grep -Fq "${TARGET_REV}" || { log "MIGRATION_FAILED: alembic current missing target"; exit 21; }
            echo "${ALEMBIC_HEADS_OUT}" | grep -Fq "${TARGET_REV}" || { log "MIGRATION_FAILED: alembic heads missing target"; exit 22; }
            HEADS_COUNT="$(echo "${ALEMBIC_HEADS_OUT}" | grep -c "(head)" || true)"
            if [ "${HEADS_COUNT}" != "1" ]; then
              log "MIGRATION_FAILED: expected exactly one alembic head"
              exit 23
            fi
            summary "alembic_current_heads" "pass"
          }

          cd "${DEPLOY_PATH}"

          log "=== PREFLIGHT: RUNNING IMAGE (record only; no hard fail on SHA) ==="
          CURRENT_IMAGE="$(docker inspect sedi-backend --format '{{.Config.Image}}' 2>/dev/null || true)"
          CURRENT_IMAGE_ID="$(docker inspect sedi-backend --format '{{.Image}}' 2>/dev/null || true)"
          CURRENT_DIGEST=""
          if [ -n "${CURRENT_IMAGE_ID}" ]; then
            CURRENT_DIGEST="$(
              docker image inspect "${CURRENT_IMAGE_ID}" \
                --format '{{range .RepoDigests}}{{println .}}{{end}}' 2>/dev/null \
                | head -n 1 || true
            )"
          fi
          log "running_image=${CURRENT_IMAGE:-none}"
          log "running_image_id=${CURRENT_IMAGE_ID:-none}"
          log "running_repo_digest=${CURRENT_DIGEST:-none}"
          summary "pre_running_image" "${CURRENT_IMAGE:-none}"
          summary "pre_running_digest" "${CURRENT_DIGEST:-none}"

          log "=== PREFLIGHT: POSTGRES HEALTH ==="
          PU=$(docker exec sedi-postgres printenv POSTGRES_USER)
          PD=$(docker exec sedi-postgres printenv POSTGRES_DB)
          docker exec sedi-postgres pg_isready -U "${PU}" -d "${PD}"

          log "=== PREFLIGHT: ENV FILE ==="
          if [ ! -f "${ENV_FILE}" ]; then
            log "PRECHECK_FAILED: missing ${ENV_FILE}"
            exit 3
          fi
          if ! grep -E "^DATABASE_URL=.+$" "${ENV_FILE}" >/dev/null; then
            log "PRECHECK_FAILED: DATABASE_URL missing or empty in ${ENV_FILE}"
            exit 4
          fi
          if grep -E "^TEST_DATABASE_URL=.+$" "${ENV_FILE}" >/dev/null; then
            log "PRECHECK_FAILED: TEST_DATABASE_URL must not be set in production env file"
            exit 5
          fi

          check_database_target_alignment

          log "=== PREFLIGHT: DIRECT ALEMBIC VERSION ==="
          ALEMBIC_COUNT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM alembic_version;")"
          ALEMBIC_BEFORE="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT version_num FROM alembic_version;")"
          log "alembic_count=${ALEMBIC_COUNT}"
          log "alembic_before=${ALEMBIC_BEFORE}"
          summary "pre_revision" "${ALEMBIC_BEFORE}"
          if [ "${ALEMBIC_COUNT}" != "1" ]; then
            log "PRECHECK_FAILED: alembic_version row count is not 1"
            exit 6
          fi

          VERIFY_ONLY=0
          if [ "${ALEMBIC_BEFORE}" = "${TARGET_REV}" ]; then
            VERIFY_ONLY=1
            log "Already at ${TARGET_REV}: verification-only (no re-migrate)."
            summary "mode" "verification_only"
          else
            summary "mode" "migrate"
            if [ "${ALEMBIC_BEFORE}" != "${EXPECTED_BEFORE}" ]; then
              log "PRECHECK_FAILED: alembic current is not ${EXPECTED_BEFORE} (got ${ALEMBIC_BEFORE})"
              exit 7
            fi
          fi

          log "=== PREFLIGHT: HEALTH BASELINE ==="
          curl -fsS http://127.0.0.1:8000/health >/dev/null
          curl -fsS http://127.0.0.1:8000/healthz >/dev/null
          curl -fsS https://api.sedi-ai.com/health >/dev/null
          curl -fsS https://api.sedi-ai.com/healthz >/dev/null

          BACKUP_FILE=""
          if [ "${VERIFY_ONLY}" = "0" ]; then
            log "=== PREFLIGHT: DISK CAPACITY ==="
            DB_SIZE_BYTES="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT pg_database_size(current_database());")"
            BACKUP_DIR="${DEPLOY_PATH}/backups/postgres"
            mkdir -p "${BACKUP_DIR}"
            AVAIL_BYTES="$(df -B1 "${BACKUP_DIR}" | awk "NR==2 {print \$4}")"
            TWO_GIB=$((2 * 1024 * 1024 * 1024))
            REQUIRED_BYTES=$((DB_SIZE_BYTES * 3))
            if [ "${REQUIRED_BYTES}" -lt "${TWO_GIB}" ]; then
              REQUIRED_BYTES="${TWO_GIB}"
            fi
            log "database_size_bytes=${DB_SIZE_BYTES}"
            log "available_bytes=${AVAIL_BYTES}"
            log "required_bytes=${REQUIRED_BYTES}"
            if [ "${AVAIL_BYTES}" -lt "${REQUIRED_BYTES}" ]; then
              log "PRECHECK_FAILED: insufficient disk space"
              exit 8
            fi
            log "disk_guard=pass"

            log "=== BACKUP ==="
            TS="$(date -u +%Y%m%d_%H%M%S)"
            BACKUP_FILE="${BACKUP_DIR}/sedi_db_pre_w6p01_056_${TS}.sql.gz"
            log "backup_file=${BACKUP_FILE}"
            if ! docker exec sedi-postgres \
              pg_dump \
              -U "${PU}" \
              -d "${PD}" |
              gzip > "${BACKUP_FILE}"
            then
              rm -f "${BACKUP_FILE}"
              log "BACKUP_FAILED: pg_dump or gzip pipeline failed"
              exit 10
            fi
            if [ ! -s "${BACKUP_FILE}" ]; then
              log "BACKUP_FAILED: empty backup file"
              exit 11
            fi
            if ! gzip -t "${BACKUP_FILE}"; then
              log "BACKUP_FAILED: gzip integrity check failed"
              exit 12
            fi
            BACKUP_SHA256="$(sha256sum "${BACKUP_FILE}" | awk "{print \$1}")"
            BACKUP_SIZE="$(stat -c%s "${BACKUP_FILE}" 2>/dev/null || wc -c < "${BACKUP_FILE}")"
            log "backup_size_bytes=${BACKUP_SIZE}"
            log "backup_sha256=${BACKUP_SHA256}"
            summary "backup_path" "${BACKUP_FILE}"
            summary "backup_size" "${BACKUP_SIZE}"
            summary "backup_sha256" "${BACKUP_SHA256}"

            log "=== RECOVERY PLAN (manual only; do not auto-restore) ==="
            log "recovery_command: gunzip -c ${BACKUP_FILE} | docker exec -i sedi-postgres psql -U ${PU} -d ${PD}"
            summary "recovery_auto" "NO"
            summary "recovery_plan_recorded" "YES"

            MIGRATION_START_TS="$(date -Is)"
            log "migration_start_ts=${MIGRATION_START_TS}"
            summary "migration_start_ts" "${MIGRATION_START_TS}"

            log "=== PULL MIGRATION IMAGE (DIGEST PINNED) ==="
            docker pull "${MIGRATION_IMAGE_REF}"
            PULLED_DIGEST="$(docker image inspect "${MIGRATION_IMAGE_REF}" --format '{{index .RepoDigests 0}}' 2>/dev/null || true)"
            log "pulled_repo_digest=${PULLED_DIGEST}"
            summary "migration_digest" "${MIGRATION_DIGEST}"
            summary "migration_image_tag" "${MIGRATION_IMAGE_TAG}"
            if ! echo "${PULLED_DIGEST}" | grep -Fq "${MIGRATION_DIGEST}"; then
              log "PRECHECK_FAILED: pulled image digest mismatch"
              exit 13
            fi

            check_database_target_alignment

            log "=== MIGRATE TO ${TARGET_REV} (ONE-OFF CONTAINER) ==="
            docker run --rm \
              --network sedi-net \
              --env-file "${ENV_FILE}" \
              --env TEST_DATABASE_URL= \
              "${MIGRATION_IMAGE_REF}" \
              python -m alembic -c backend/alembic.ini upgrade "${TARGET_REV}"

            check_database_target_alignment
          else
            log "=== VERIFICATION IMAGE PULL (DIGEST PINNED; no upgrade) ==="
            docker pull "${MIGRATION_IMAGE_REF}"
            PULLED_DIGEST="$(docker image inspect "${MIGRATION_IMAGE_REF}" --format '{{index .RepoDigests 0}}' 2>/dev/null || true)"
            log "pulled_repo_digest=${PULLED_DIGEST}"
            summary "migration_digest" "${MIGRATION_DIGEST}"
            summary "migration_image_tag" "${MIGRATION_IMAGE_TAG}"
            if ! echo "${PULLED_DIGEST}" | grep -Fq "${MIGRATION_DIGEST}"; then
              log "PRECHECK_FAILED: pulled image digest mismatch"
              exit 13
            fi
            summary "backup_path" "skipped_verification_only"
            summary "recovery_auto" "NO"
          fi

          post_alembic_checks "${MIGRATION_IMAGE_REF}"
          post_schema_assertions

          log "=== POST-CHECK: RUNNING IMAGE UNCHANGED (record) ==="
          POST_IMAGE="$(docker inspect sedi-backend --format '{{.Config.Image}}' 2>/dev/null || true)"
          log "post_running_image=${POST_IMAGE:-none}"
          summary "post_running_image" "${POST_IMAGE:-none}"
          if [ "${POST_IMAGE}" = "${CURRENT_IMAGE}" ]; then
            summary "backend_image_unchanged" "YES"
          else
            summary "backend_image_unchanged" "NO"
            log "NOTE: running backend image differs from preflight record (not a hard failure for one-off migrate)."
          fi

          log "=== POST-CHECK: HEALTH ==="
          curl -fsS http://127.0.0.1:8000/health >/dev/null
          curl -fsS http://127.0.0.1:8000/healthz >/dev/null
          curl -fsS https://api.sedi-ai.com/health >/dev/null
          curl -fsS https://api.sedi-ai.com/healthz >/dev/null
          summary "health" "pass"

          summary "target_revision" "${TARGET_REV}"
          summary "deployment_performed" "NO"
          log "Production backend deployment performed: NO"
          log "=== MIGRATION / VERIFY 056 DONE ==="
          REMOTE_SCRIPT

      - name: Write migration job summary
        if: always()
        env:
          SUMMARY_EXPECTED_BEFORE: ${{ github.event.inputs.expected_before_revision }}
          SUMMARY_MIGRATION_SHA: ${{ github.event.inputs.migration_image_sha }}
          SUMMARY_MIGRATION_DIGEST: ${{ github.event.inputs.migration_image_digest }}
        run: |
          {
            echo "## W6-P01 Production Migration 056"
            echo ""
            echo "**Status:** ${{ job.status }}"
            echo "**Confirmation validation:** ${{ steps.validate_inputs.outcome }}"
            echo "**Required confirmation:** MIGRATE_TO_056"
            echo "**Target revision:** 056_i5_w2_p02_conflict_safety"
            printf '%s\n' "**Expected before:** ${SUMMARY_EXPECTED_BEFORE}"
            printf '%s\n' "**Migration image SHA:** ${SUMMARY_MIGRATION_SHA}"
            printf '%s\n' "**Migration image digest:** ${SUMMARY_MIGRATION_DIGEST}"
            echo "**Production backend deployment performed:** NO"
            echo "**Recovery:** manual gunzip|psql only (never auto-restore)"
            echo ""
            if [ -f /tmp/w6p01_migration_056_run.log ]; then
              echo "### Captured summary markers"
              grep '^MIGRATION_SUMMARY|' /tmp/w6p01_migration_056_run.log | while IFS='|' read -r _ key val; do
                echo "- **${key}:** ${val}"
              done || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  acquire-payload:
    name: Bounded IRIMC acquisition → artifact
    if: github.event.inputs.confirmation == 'APPLY_IRAN_DIRECTORY_V1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate confirmation
        id: validate_inputs
        env:
          INPUT_CONFIRMATION: ${{ github.event.inputs.confirmation }}
          INPUT_EXPECTED_REV: ${{ github.event.inputs.expected_alembic_revision }}
          INPUT_ARTIFACT: ${{ github.event.inputs.payload_artifact_name }}
        run: |
          set -Eeuo pipefail
          if [ "${INPUT_CONFIRMATION}" != "APPLY_IRAN_DIRECTORY_V1" ]; then
            echo "Confirmation input must be exactly APPLY_IRAN_DIRECTORY_V1."
            exit 1
          fi
          if ! echo "${INPUT_EXPECTED_REV}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$'; then
            echo "expected_alembic_revision must be a safe Alembic identifier."
            exit 1
          fi
          if ! echo "${INPUT_ARTIFACT}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$'; then
            echo "payload_artifact_name must be a safe artifact identifier."
            exit 1
          fi
          echo "Inputs validated."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install acquisition dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          # Backend package imports from checkout (manifest/normalization) + requests transport.
          pip install -r backend/requirements.txt
          pip install "requests>=2.31.0"

      - name: Run bounded IRIMC + SBMU federation acquisition
        id: acquire
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="${GITHUB_WORKSPACE}${PYTHONPATH:+:${PYTHONPATH}}"
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/iran-directory"
          OUT_DOC="${GITHUB_WORKSPACE}/artifacts/iran-directory/iran_doctors_normalized.json"
          OUT_HOS="${GITHUB_WORKSPACE}/artifacts/iran-directory/iran_hospitals_sbmu_normalized.json"
          COMBINED="${GITHUB_WORKSPACE}/artifacts/iran-directory/iran_directory_combined_normalized.json"
          python backend/scripts/acquire_irimc_doctors_bounded.py "${OUT_DOC}"
          python backend/scripts/acquire_sbmu_federated_hospitals.py --out "${OUT_HOS}"
          python -c "
          import json
          from pathlib import Path
          out_doc = Path('${OUT_DOC}')
          out_hos = Path('${OUT_HOS}')
          combined = Path('${COMBINED}')
          doc = json.loads(out_doc.read_text(encoding='utf-8'))
          hos = json.loads(out_hos.read_text(encoding='utf-8'))
          doc_records = doc['records'] if isinstance(doc, dict) else doc
          hos_records = hos['records'] if isinstance(hos, dict) else hos
          payload = {
            'records': list(doc_records) + list(hos_records),
            'meta': {
              'doctor_count': len(doc_records),
              'hospital_count': len(hos_records),
              'cap24_laboratories': 0,
              'coverage_hospitals': hos.get('coverage_class') if isinstance(hos, dict) else None,
              'nationwide_complete': False,
            },
          }
          combined.write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(payload['meta'], ensure_ascii=False))
          "
          cp -a "${COMBINED}" /tmp/iran_doctors_normalized.json
          test -s /tmp/iran_doctors_normalized.json
          BYTES="$(wc -c < /tmp/iran_doctors_normalized.json | tr -d ' ')"
          SHA="$(sha256sum /tmp/iran_doctors_normalized.json | awk '{print $1}')"
          echo "payload_bytes=${BYTES}"
          echo "payload_sha256=${SHA}"
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/iran_doctors_normalized.json").read_text(encoding="utf-8"))
          assert isinstance(data, dict) and "records" in data and "meta" in data
          meta = data["meta"]
          assert int(meta.get("hospital_count") or 0) > 0
          print(json.dumps({
              "schema_ok": True,
              "record_count": len(data["records"]),
              "doctor_count": meta.get("doctor_count"),
              "hospital_count": meta.get("hospital_count"),
              "cap24_laboratories": meta.get("cap24_laboratories"),
          }, ensure_ascii=False))
          PY

      - name: Upload normalized payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.payload_artifact_name }}
          path: /tmp/iran_doctors_normalized.json
          if-no-files-found: error
          retention-days: 14

  iran-directory-apply:
    name: Production apply (SSH guarded)
    if: github.event.inputs.confirmation == 'APPLY_IRAN_DIRECTORY_V1'
    needs: acquire-payload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate confirmation
        id: validate_inputs
        env:
          INPUT_CONFIRMATION: ${{ github.event.inputs.confirmation }}
          INPUT_EXPECTED_REV: ${{ github.event.inputs.expected_alembic_revision }}
        run: |
          set -Eeuo pipefail
          if [ "${INPUT_CONFIRMATION}" != "APPLY_IRAN_DIRECTORY_V1" ]; then
            echo "Confirmation input must be exactly APPLY_IRAN_DIRECTORY_V1."
            exit 1
          fi
          if ! echo "${INPUT_EXPECTED_REV}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$'; then
            echo "expected_alembic_revision must be a safe Alembic identifier."
            exit 1
          fi
          echo "Apply inputs validated."

      - name: Download normalized payload artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.payload_artifact_name }}
          path: /tmp/iran-directory-payload

      - name: Stage payload path
        run: |
          set -Eeuo pipefail
          SRC="$(find /tmp/iran-directory-payload -type f -name 'iran_doctors_normalized.json' | head -n 1)"
          if [ -z "${SRC}" ]; then
            SRC="$(find /tmp/iran-directory-payload -type f | head -n 1)"
          fi
          if [ -z "${SRC}" ] || [ ! -s "${SRC}" ]; then
            echo "ARTIFACT_MISSING: normalized payload not found"
            exit 1
          fi
          cp -a "${SRC}" /tmp/iran_doctors_normalized.json
          BYTES="$(wc -c < /tmp/iran_doctors_normalized.json | tr -d ' ')"
          SHA="$(sha256sum /tmp/iran_doctors_normalized.json | awk '{print $1}')"
          echo "local_payload_bytes=${BYTES}"
          echo "local_payload_sha256=${SHA}"

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts

      - name: SCP payload to production host
        env:
          DEPLOY_PATH: ${{ secrets.SEDI_DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "mkdir -p $(printf '%q' "${DEPLOY_PATH}/tmp")"
          scp -i ~/.ssh/sedi_deploy_key \
            -P "${{ secrets.SEDI_PORT }}" \
            /tmp/iran_doctors_normalized.json \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${DEPLOY_PATH}/tmp/iran_doctors_normalized.json"

      - name: Production apply (guarded remote)
        id: apply
        env:
          INPUT_EXPECTED_REV: ${{ github.event.inputs.expected_alembic_revision }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH_Q="$(printf '%q' "${{ secrets.SEDI_DEPLOY_PATH }}")"
          EXPECTED_REV_Q="$(printf '%q' "${INPUT_EXPECTED_REV}")"

          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "DEPLOY_PATH=${DEPLOY_PATH_Q} EXPECTED_REV=${EXPECTED_REV_Q} bash -s" \
            2>&1 <<'REMOTE_SCRIPT' | tee /tmp/i5_iran_directory_apply_run.log
          set -Eeuo pipefail
          log() { echo "[$(date -Is)] $*"; }
          summary() { echo "IRAN_DIR_SUMMARY|$1|$2"; }

          cd "${DEPLOY_PATH}"
          PAYLOAD_HOST="${DEPLOY_PATH}/tmp/iran_doctors_normalized.json"
          PAYLOAD_CTR="/tmp/iran_doctors_normalized.json"

          log "=== PREFLIGHT: POSTGRES HEALTH ==="
          PU=$(docker exec sedi-postgres printenv POSTGRES_USER)
          PD=$(docker exec sedi-postgres printenv POSTGRES_DB)
          docker exec sedi-postgres pg_isready -U "${PU}" -d "${PD}"

          log "=== PREFLIGHT: ALEMBIC REVISION ==="
          ALEMBIC_COUNT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM alembic_version;")"
          ALEMBIC_CURRENT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT version_num FROM alembic_version;")"
          log "alembic_count=${ALEMBIC_COUNT}"
          log "alembic_current=${ALEMBIC_CURRENT}"
          summary "alembic_revision" "${ALEMBIC_CURRENT}"
          if [ "${ALEMBIC_COUNT}" != "1" ] || [ "${ALEMBIC_CURRENT}" != "${EXPECTED_REV}" ]; then
            log "PRECHECK_FAILED: alembic revision mismatch (expected ${EXPECTED_REV})"
            exit 5
          fi

          if [ ! -s "${PAYLOAD_HOST}" ]; then
            log "PRECHECK_FAILED: missing payload at ${PAYLOAD_HOST}"
            exit 6
          fi
          PAYLOAD_SHA="$(sha256sum "${PAYLOAD_HOST}" | awk '{print $1}')"
          PAYLOAD_SIZE="$(stat -c%s "${PAYLOAD_HOST}" 2>/dev/null || wc -c < "${PAYLOAD_HOST}")"
          log "payload_size_bytes=${PAYLOAD_SIZE}"
          log "payload_sha256=${PAYLOAD_SHA}"
          summary "payload_size" "${PAYLOAD_SIZE}"
          summary "payload_sha256" "${PAYLOAD_SHA}"

          log "=== BACKUP (iran directory tables only) ==="
          BACKUP_DIR="${DEPLOY_PATH}/backups/iran_directory"
          mkdir -p "${BACKUP_DIR}"
          TS="$(date -u +%Y%m%d_%H%M%S)"
          BACKUP_FILE="${BACKUP_DIR}/iran_directory_pre_apply_${TS}.sql.gz"
          log "backup_file=${BACKUP_FILE}"
          if ! docker exec sedi-postgres \
            pg_dump \
            -U "${PU}" \
            -d "${PD}" \
            -t iran_doctors \
            -t iran_laboratories \
            -t iran_hospitals |
            gzip > "${BACKUP_FILE}"
          then
            rm -f "${BACKUP_FILE}"
            log "BACKUP_FAILED: pg_dump or gzip pipeline failed"
            exit 10
          fi
          if [ ! -s "${BACKUP_FILE}" ]; then
            rm -f "${BACKUP_FILE}"
            log "BACKUP_FAILED: empty backup file"
            exit 11
          fi
          if ! gzip -t "${BACKUP_FILE}"; then
            rm -f "${BACKUP_FILE}"
            log "BACKUP_FAILED: gzip integrity check failed"
            exit 12
          fi
          BACKUP_SHA256="$(sha256sum "${BACKUP_FILE}" | awk '{print $1}')"
          BACKUP_SIZE="$(stat -c%s "${BACKUP_FILE}" 2>/dev/null || wc -c < "${BACKUP_FILE}")"
          log "backup_size_bytes=${BACKUP_SIZE}"
          log "backup_sha256=${BACKUP_SHA256}"
          summary "backup_path" "${BACKUP_FILE}"
          summary "backup_size" "${BACKUP_SIZE}"
          summary "backup_sha256" "${BACKUP_SHA256}"
          log "recovery_command: gunzip -c ${BACKUP_FILE} | docker exec -i sedi-postgres psql -U ${PU} -d ${PD}"
          summary "recovery_auto" "NO"

          log "=== DOCKER CP PAYLOAD INTO sedi-backend ==="
          docker cp "${PAYLOAD_HOST}" "sedi-backend:${PAYLOAD_CTR}"

          log "=== DRY-RUN ==="
          DRY_JSON="$(docker exec sedi-backend python -m backend.scripts.iran_directory_prod_apply dry-run --payload "${PAYLOAD_CTR}")"
          echo "${DRY_JSON}"
          summary "dry_run" "ok"

          log "=== APPLY ==="
          APPLY_JSON="$(docker exec sedi-backend python -m backend.scripts.iran_directory_prod_apply apply --payload "${PAYLOAD_CTR}")"
          echo "${APPLY_JSON}"
          summary "apply" "ok"

          log "=== REPLAY (idempotency) ==="
          REPLAY_JSON="$(docker exec sedi-backend python -m backend.scripts.iran_directory_prod_apply replay --payload "${PAYLOAD_CTR}")"
          echo "${REPLAY_JSON}"
          summary "replay" "ok"

          log "=== SEARCH-PROOF (DOCTOR) ==="
          PROOF_JSON="$(docker exec sedi-backend python -m backend.scripts.iran_directory_prod_apply search-proof --family DOCTOR)"
          echo "${PROOF_JSON}"
          summary "search_proof_doctor" "ok"

          log "=== SEARCH-PROOF (HOSPITAL) ==="
          PROOF_H_JSON="$(docker exec sedi-backend python -m backend.scripts.iran_directory_prod_apply search-proof --family HOSPITAL)"
          echo "${PROOF_H_JSON}"
          summary "search_proof_hospital" "ok"

          log "=== POST TABLE COUNTS (no PII) ==="
          DOC_N="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM iran_doctors;")"
          LAB_N="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM iran_laboratories;")"
          HOS_N="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM iran_hospitals;")"
          echo "{\"iran_doctors\":${DOC_N},\"iran_laboratories\":${LAB_N},\"iran_hospitals\":${HOS_N}}"
          summary "count_doctors" "${DOC_N}"
          summary "count_laboratories" "${LAB_N}"
          summary "count_hospitals" "${HOS_N}"
          summary "apply_status" "SUCCESS"
          log "=== IRAN DIRECTORY APPLY DONE ==="
          REMOTE_SCRIPT

      - name: Write apply job summary
        if: always()
        env:
          SUMMARY_EXPECTED_REV: ${{ github.event.inputs.expected_alembic_revision }}
          SUMMARY_ARTIFACT: ${{ github.event.inputs.payload_artifact_name }}
        run: |
          {
            echo "## I5 Production Iran Directory Apply"
            echo ""
            echo "**Status:** ${{ job.status }}"
            echo "**Confirmation validation:** ${{ steps.validate_inputs.outcome }}"
            echo "**Required confirmation:** APPLY_IRAN_DIRECTORY_V1"
            printf '%s\n' "**Expected alembic revision:** ${SUMMARY_EXPECTED_REV}"
            printf '%s\n' "**Payload artifact:** ${SUMMARY_ARTIFACT}"
            echo "**Backup scope:** iran_doctors, iran_laboratories, iran_hospitals only"
            echo "**Fail-closed on backup failure:** YES"
            echo ""
            if [ -f /tmp/i5_iran_directory_apply_run.log ]; then
              echo "### Captured summary markers"
              grep '^IRAN_DIR_SUMMARY|' /tmp/i5_iran_directory_apply_run.log | while IFS='|' read -r _ key val; do
                echo "- **${key}:** ${val}"
              done || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  migrate-060:
    name: Production migrate 060 + role cutover
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event.inputs.confirmation == 'MIGRATE_TO_060'

    steps:
      - name: Validate inputs
        env:
          INPUT_CONFIRMATION: ${{ github.event.inputs.confirmation }}
          INPUT_EXPECTED_BEFORE: ${{ github.event.inputs.expected_before_revision }}
          INPUT_MIGRATION_SHA: ${{ github.event.inputs.migration_image_sha }}
          INPUT_MIGRATION_DIGEST: ${{ github.event.inputs.migration_image_digest }}
        run: |
          set -Eeuo pipefail
          [ "${INPUT_CONFIRMATION}" = "MIGRATE_TO_060" ] || { echo "bad confirmation"; exit 1; }
          [ "${INPUT_EXPECTED_BEFORE}" = "056_i5_w2_p02_conflict_safety" ] || {
            echo "expected_before must be 056_i5_w2_p02_conflict_safety"
            exit 1
          }
          echo "${INPUT_MIGRATION_SHA}" | grep -Eq '^[0-9a-f]{40}$' || { echo "bad sha"; exit 1; }
          echo "${INPUT_MIGRATION_DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "bad digest"; exit 1; }
          echo "inputs_ok"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload and execute DB-PROD-01 remote procedure
        env:
          INPUT_EXPECTED_BEFORE: ${{ github.event.inputs.expected_before_revision }}
          INPUT_MIGRATION_SHA: ${{ github.event.inputs.migration_image_sha }}
          INPUT_MIGRATION_DIGEST: ${{ github.event.inputs.migration_image_digest }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/db03"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/db03/db_prod_01_remote.sh \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/db_prod_01_remote.sh"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/db_prod_01_remote.sh") && \
             DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
             EXPECTED_BEFORE=$(printf '%q' "${INPUT_EXPECTED_BEFORE}") \
             MIGRATION_SHA=$(printf '%q' "${INPUT_MIGRATION_SHA}") \
             MIGRATION_DIGEST=$(printf '%q' "${INPUT_MIGRATION_DIGEST}") \
             bash $(printf '%q' "${REMOTE_DIR}/db_prod_01_remote.sh")" \
            2>&1 | tee /tmp/db_prod_01_run.log

      - name: Upload run log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-prod-01-migration-evidence
          path: /tmp/db_prod_01_run.log
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "## DB-PROD-01 Production Migration 060"
            echo "Status: ${{ job.status }}"
            echo "Target: 060_db03_w4_w6_scale_inspect_roles"
            if [ -f /tmp/db_prod_01_run.log ]; then
              grep '^MIGRATION_SUMMARY|' /tmp/db_prod_01_run.log | while IFS='|' read -r _ k v; do
                echo "- **${k}:** ${v}"
              done || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
