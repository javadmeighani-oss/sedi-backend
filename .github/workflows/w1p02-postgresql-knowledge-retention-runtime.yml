# W1-P02 Focused PostgreSQL Knowledge Retention Runtime — GitHub workflow.
# Frozen contract: helper W1P02_RUNTIME_SELECTORS (10 → 40).
name: W1-P02 Focused PostgreSQL Knowledge Retention Runtime

on:
  workflow_dispatch:
  # Temporary registration trigger: GitHub cannot workflow_dispatch a never-run
  # workflow that exists only on a non-default branch (HTTP 404). Path-scoped so
  # only this YAML change fires registration. Removed after first registered run.
  push:
    branches:
      - feature/section15/backend-continuity-foundation
    paths:
      - .github/workflows/w1p02-postgresql-knowledge-retention-runtime.yml

permissions:
  contents: read

concurrency:
  group: w1p02-postgresql-knowledge-retention-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  w1p02-postgresql-knowledge-retention-runtime:
    name: W1-P02 PostgreSQL knowledge retention runtime (40 nodes)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sedi_w1p02_test
          POSTGRES_PASSWORD: sedi_w1p02_test_password
          POSTGRES_DB: sedi_w1p02_knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_w1p02_test -d sedi_w1p02_knowledge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg2://sedi_w1p02_test:sedi_w1p02_test_password@127.0.0.1:5432/sedi_w1p02_knowledge
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_w1p02_test:sedi_w1p02_test_password@127.0.0.1:5432/sedi_w1p02_knowledge
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: w1p02-test-placeholder-not-used

    steps:
      - name: Configure runner temporary environment
        shell: bash
        run: |
          {
            echo "TMPDIR=$RUNNER_TEMP"
            echo "TEMP=$RUNNER_TEMP"
            echo "TMP=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Capture redacted dependency versions
        run: |
          python - <<'PY'
          import sys

          print("python", sys.version.split()[0])
          try:
              import pytest as _pytest
              print("pytest", getattr(_pytest, "__version__", "unknown"))
          except ImportError:
              print("BLOCKED_DEPENDENCY_RESOLUTION")
              raise SystemExit("BLOCKED_DEPENDENCY_RESOLUTION")
          try:
              import sqlalchemy
              sa_ver = getattr(sqlalchemy, "__version__", "0")
              print("sqlalchemy", sa_ver)
              major_text = sa_ver.split(".", 1)[0]
              try:
                  major = int(major_text)
              except ValueError:
                  major = 0
              if major < 2:
                  print("BLOCKED_DEPENDENCY_RESOLUTION")
                  raise SystemExit("BLOCKED_DEPENDENCY_RESOLUTION")
          except ImportError:
              print("BLOCKED_DEPENDENCY_RESOLUTION")
              raise SystemExit("BLOCKED_DEPENDENCY_RESOLUTION")
          try:
              import psycopg2
              print("psycopg2", getattr(psycopg2, "__version__", "unknown"))
          except ImportError:
              print("BLOCKED_DEPENDENCY_RESOLUTION")
              raise SystemExit("BLOCKED_DEPENDENCY_RESOLUTION")
          PY

      - name: Prepare runner-temp evidence directory
        run: |
          mkdir -p "${{ runner.temp }}/sedi_w1p02_postgres_runtime_evidence"

      - name: Process 1 — collect-only manifest (40 nodes)
        run: |
          python -B -m pytest \
            --collect-only \
            --noconftest \
            -p backend.tests.helpers.w1p02_postgres_runtime_plugin \
            -p no:cacheprovider \
            -q \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T5_01_metadata_contains_ku_tables \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T5_02_named_checks_present_in_pg_catalog \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T6_01_positive_raw_evidence_insert \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T6_02_positive_ku_insert_not_eligible \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T6_03_positive_provenance_attach_eligible \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T6_04_positive_gap_target_ku_fk \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T7_negative_check_constraints \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T8_uq_fk_runtime_negative \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T9_01_service_eligibility_evaluation \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T9_02_raw_retention_mode_insertable

      - name: Process 2 — focused PostgreSQL knowledge retention runtime
        run: |
          python -B -m pytest \
            --noconftest \
            -p backend.tests.helpers.w1p02_postgres_runtime_plugin \
            -p no:cacheprovider \
            -q \
            --maxfail=1 \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T5_01_metadata_contains_ku_tables \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T5_02_named_checks_present_in_pg_catalog \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T6_01_positive_raw_evidence_insert \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T6_02_positive_ku_insert_not_eligible \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T6_03_positive_provenance_attach_eligible \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T6_04_positive_gap_target_ku_fk \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T7_negative_check_constraints \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T8_uq_fk_runtime_negative \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T9_01_service_eligibility_evaluation \
            backend/tests/test_section30_i5_w1_p02_ku_provenance.py::test_W1P02_T9_02_raw_retention_mode_insertable

      - name: Upload redacted runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1p02-postgresql-knowledge-retention-evidence
          path: ${{ runner.temp }}/sedi_w1p02_postgres_runtime_evidence
          retention-days: 14
          if-no-files-found: error
