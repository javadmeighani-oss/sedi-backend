# DEBT-021 — Read-only production probe for I5 / structured chat, kept on main. workflow_dispatch only.
# Reads the pinned image, Alembic revision, feature-flag state, knowledge counts and error counters from
# the running container. It writes nothing (no env, flag, DB or container change). No secrets printed.
name: I5 Production Read-only Probe

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "PROBE_READONLY"
        required: true
      deployed_image_sha:
        description: "40-char SHA of the deployed backend image"
        required: true
      expected_alembic_revision:
        description: "Exact production alembic_version"
        required: true

permissions:
  contents: read

concurrency:
  group: sedi-production-backend-operation
  cancel-in-progress: false

jobs:
  probe:
    name: I5 read-only probe
    if: github.event.inputs.confirmation == 'PROBE_READONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate inputs
        env:
          SHA: ${{ github.event.inputs.deployed_image_sha }}
          REV: ${{ github.event.inputs.expected_alembic_revision }}
        run: |
          set -Eeuo pipefail
          echo "${SHA}" | grep -Eq '^[0-9a-f]{40}$'
          echo "${REV}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$'
      - name: SSH read-only probe
        env:
          SHA: ${{ github.event.inputs.deployed_image_sha }}
          REV: ${{ github.event.inputs.expected_alembic_revision }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
          DP="$(printf '%q' "${{ secrets.SEDI_DEPLOY_PATH }}")"
          ssh -i ~/.ssh/sedi_deploy_key -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "DEPLOY_PATH=${DP} IMAGE_SHA=$(printf '%q' "${SHA}") EXPECTED_REV=$(printf '%q' "${REV}") bash -s" \
            2>&1 <<'REMOTE' | tee /tmp/probe.log
          set -Eeuo pipefail
          s() { echo "PROBE|$1|$2"; }
          psql_prod() { docker exec sedi-postgres psql -U "$(docker exec sedi-postgres printenv POSTGRES_USER)" -d "$(docker exec sedi-postgres printenv POSTGRES_DB)" -tA -c "$1" | tr -d '\r'; }
          cd "${DEPLOY_PATH}"
          IMG="$(docker inspect sedi-backend --format '{{.Config.Image}}')"
          echo "${IMG}" | grep -Fq "${IMAGE_SHA}" || { s image_tag_guard FAIL; exit 10; }
          REVL="$(docker image inspect "$(docker inspect sedi-backend --format '{{.Image}}')" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [ "${REVL}" = "${IMAGE_SHA}" ] || { s oci_revision_guard FAIL; exit 11; }
          s image_guard PASS
          [ "$(psql_prod 'SELECT version_num FROM alembic_version;')" = "${EXPECTED_REV}" ] || { s alembic_guard FAIL; exit 12; }
          s alembic_guard PASS
          curl -fsS http://127.0.0.1:8000/healthz >/dev/null && s health PASS
          s running_image "$(echo "${IMG}" | sed 's/.*://')"
          s container_started "$(docker inspect sedi-backend --format '{{.State.StartedAt}}')"
          s now_utc "$(date -u +%FT%TZ)"
          s ku_total "$(psql_prod 'SELECT COUNT(*) FROM knowledge_units;')"
          s ku_eligible "$(psql_prod "SELECT COUNT(*) FROM knowledge_units WHERE runtime_eligibility='ELIGIBLE';")"
          s vectors "$(psql_prod 'SELECT COUNT(*) FROM knowledge_chunk_embeddings WHERE embedding_vector IS NOT NULL;')"
          s sources_eligible "$(psql_prod "SELECT COUNT(*) FROM governed_source_profiles WHERE runtime_eligibility='ELIGIBLE';")"
          s log_errors_since_start "$(docker logs sedi-backend 2>&1 | grep -cE 'Traceback|orchestration_error|context_assembly_failed' || true)"
          s log_http_5xx "$(docker logs sedi-backend 2>&1 | grep -cE '" 5[0-9][0-9] ' || true)"
          s scheduler_line "$(docker logs sedi-backend 2>&1 | grep -E 'weekly_international_knowledge_crawler registered' | tail -n1 | cut -c1-260)"
          docker exec -i sedi-backend python - <<'PY'
          from backend.app.database import get_db
          from backend.app.services.intelligence.feature_flags import intelligence_orchestrator_v1_enabled
          from backend.app.services.intelligence.orchestrator import IntelligenceOrchestrator
          db = next(get_db())
          try:
              print("PROBE|mode|structured_flag=%s rollout=%s" % (intelligence_orchestrator_v1_enabled(), IntelligenceOrchestrator(db=db)._rollout_mode()))
              db.rollback()
          finally:
              db.close()
          PY
          s phase_probe PASS
          REMOTE
          grep -Eq 'PROBE\|phase_probe\|PASS' /tmp/probe.log
          if grep -Eiq 'SEDI_MIGRATION_ADMIN_PASSWORD=|DATABASE_URL=postgres|OPENAI_API_KEY=' /tmp/probe.log; then echo SECRET_LEAK; exit 2; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i5-readonly-probe
          path: /tmp/probe.log
          retention-days: 30
