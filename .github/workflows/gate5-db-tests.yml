# Ephemeral Postgres only — Gate 5 DB-backed tests (no deploy, no production).
name: Gate 5 DB tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/app/core/scheduler.py"
      - "backend/app/routers/ops.py"
      - "backend/app/schemas/raw_signal_ops.py"
      - "backend/app/services/gate5/**"
      - "backend/tests/test_gate5d_raw_signal_processing_ops.py"
      - "backend/tests/test_gate5c_raw_signal_feature_extraction.py"
      - "backend/tests/contracts/test_v1_openapi_snapshot.py"
      - "backend/tests/contracts/snapshots/openapi_v1_snapshot.json"
      - "backend/alembic/**"
      - ".github/workflows/gate5-db-tests.yml"

permissions:
  contents: read

jobs:
  gate5-db-tests:
    name: Gate 5 DB-backed tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sedi_test_user
          POSTGRES_PASSWORD: StrongTestPass123
          POSTGRES_DB: sedi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_test_user -d sedi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PYTHONPATH: .
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_test_user:StrongTestPass123@127.0.0.1:5432/sedi_test
      DATABASE_URL: postgresql+psycopg2://sedi_test_user:StrongTestPass123@127.0.0.1:5432/sedi_test
      OPENAI_API_KEY: test-key
      ADMIN_TOKEN: test-admin-token
      SEDI_DISABLE_SCHEDULER: "true"
      SEDI_RAW_SIGNAL_PROCESSING_ENABLED: "false"
      DEVICE_AUTH_MODE: db_only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest alembic

      - name: Wait for Postgres
        run: |
          python - <<'PY'
          import os
          import time
          import psycopg2

          url = os.environ["TEST_DATABASE_URL"].replace(
              "postgresql+psycopg2://", "postgresql://", 1
          )
          last = None
          for _ in range(60):
              try:
                  conn = psycopg2.connect(url)
                  conn.close()
                  print("postgres ready")
                  break
              except Exception as exc:
                  last = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"postgres not ready: {last}")
          PY

      - name: Alembic upgrade head
        run: |
          python -m alembic -c backend/alembic.ini upgrade head

      - name: Compile
        run: |
          python -m compileall -q backend/app backend/tests

      - name: Run Gate 5.4 DB tests
        run: |
          pytest backend/tests/test_gate5d_raw_signal_processing_ops.py -q

      - name: Run Gate 5.3 regression tests
        run: |
          pytest backend/tests/test_gate5c_raw_signal_feature_extraction.py -q

      - name: Run OpenAPI contract test
        run: |
          pytest backend/tests/contracts/test_v1_openapi_snapshot.py -q
