# W4-P01 Focused PostgreSQL Knowledge Retrieval Runtime — GitHub workflow.
# Frozen contract: helper W4P01_RUNTIME_SELECTORS (16 -> 19).
# Controlled real-source validation: NOT OWNED (W6-P01). No live network.
# Source activation / weekly scheduler activation: OFF. No production write.
name: W4-P01 Focused PostgreSQL Knowledge Retrieval Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w4p01-postgresql-knowledge-retrieval-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  w4p01-postgresql-knowledge-retrieval-runtime:
    name: W4-P01 PostgreSQL knowledge retrieval runtime (19 nodes)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sedi_w4p01_test
          POSTGRES_PASSWORD: sedi_w4p01_test_password
          POSTGRES_DB: sedi_w4p01_retrieval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_w4p01_test -d sedi_w4p01_retrieval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg2://sedi_w4p01_test:sedi_w4p01_test_password@127.0.0.1:5432/sedi_w4p01_retrieval
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_w4p01_test:sedi_w4p01_test_password@127.0.0.1:5432/sedi_w4p01_retrieval
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: w4p01-test-placeholder-not-used

    steps:
      - name: Configure runner temporary environment
        shell: bash
        run: |
          {
            echo "TMPDIR=$RUNNER_TEMP"
            echo "TEMP=$RUNNER_TEMP"
            echo "TMP=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Capture redacted dependency versions
        run: |
          python - <<'PY'
          import sys
          print("python", sys.version.split()[0])
          try:
              import pytest as _pytest
              print("pytest", getattr(_pytest, "__version__", "unknown"))
          except ImportError:
              print("BLOCKED_DEPENDENCY_RESOLUTION")
              raise SystemExit("BLOCKED_DEPENDENCY_RESOLUTION")
          try:
              import sqlalchemy
              sa_ver = getattr(sqlalchemy, "__version__", "0")
              print("sqlalchemy", sa_ver)
              major = int(sa_ver.split(".", 1)[0])
              if major < 2:
                  print("BLOCKED_DEPENDENCY_RESOLUTION")
                  raise SystemExit("BLOCKED_DEPENDENCY_RESOLUTION")
          except ImportError:
              print("BLOCKED_DEPENDENCY_RESOLUTION")
              raise SystemExit("BLOCKED_DEPENDENCY_RESOLUTION")
          try:
              import psycopg2
              print("psycopg2", getattr(psycopg2, "__version__", "unknown"))
          except ImportError:
              print("BLOCKED_DEPENDENCY_RESOLUTION")
              raise SystemExit("BLOCKED_DEPENDENCY_RESOLUTION")
          PY

      - name: PostgreSQL readiness
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U sedi_w4p01_test -d sedi_w4p01_retrieval; then
              echo "postgres_ready"
              exit 0
            fi
            sleep 2
          done
          echo "postgres_not_ready"
          exit 1

      - name: Prepare runner-temp evidence directory
        run: |
          mkdir -p "${{ runner.temp }}/sedi_w4p01_postgres_runtime_evidence"
          mkdir -p "${{ runner.temp }}/sedi_w4p01_evidence_assurance_pack"

      - name: Static import hygiene
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          paths = [
              Path("backend/app/services/i5/runtime_knowledge_retrieval.py"),
              Path("backend/app/services/gate3/care_intelligence.py"),
              Path("backend/app/core/conversation/brain.py"),
              Path("backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py"),
          ]
          for path in paths:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print("ast_ok", path)
          PY

      - name: Process 1 — collect-only manifest (19 nodes)
        run: |
          python -B -m pytest \
            --collect-only \
            --noconftest \
            -p backend.tests.helpers.w4p01_postgres_runtime_plugin \
            -p no:cacheprovider \
            -q \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T1_package_identity \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T2_query_normalization \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T3_eligible_current_returned \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T4_superseded_excluded \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T5_retracted_excluded \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T6_missing_provenance_excluded \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T7_stale_excluded \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T8_conflict_excluded \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T9_medical_safety_excluded \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T10_ranking_deterministic \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T11_no_safe_knowledge_gap_enqueue \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T12_language_filter_personalization \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T13_no_base_model_fallback_marker \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T14_care_context_kb_first \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T15_multiple_current_fail_closed \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T16_w4p02_handoff_fields \
            | tee "${{ runner.temp }}/sedi_w4p01_evidence_assurance_pack/collected-nodes.txt"

      - name: Process 2 — focused PostgreSQL knowledge retrieval runtime
        run: |
          python -B -m pytest \
            --noconftest \
            -p backend.tests.helpers.w4p01_postgres_runtime_plugin \
            -p no:cacheprovider \
            -q \
            --maxfail=1 \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T1_package_identity \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T2_query_normalization \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T3_eligible_current_returned \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T4_superseded_excluded \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T5_retracted_excluded \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T6_missing_provenance_excluded \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T7_stale_excluded \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T8_conflict_excluded \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T9_medical_safety_excluded \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T10_ranking_deterministic \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T11_no_safe_knowledge_gap_enqueue \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T12_language_filter_personalization \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T13_no_base_model_fallback_marker \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T14_care_context_kb_first \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T15_multiple_current_fail_closed \
            backend/tests/test_section30_i5_w4_p01_runtime_kb_first.py::test_W4P01_T16_w4p02_handoff_fields \
            | tee "${{ runner.temp }}/sedi_w4p01_evidence_assurance_pack/test-output.txt"

      - name: Build Evidence Assurance Pack
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, sys
          from pathlib import Path
          pack = Path(os.environ["RUNNER_TEMP"]) / "sedi_w4p01_evidence_assurance_pack"
          pack.mkdir(parents=True, exist_ok=True)
          helper = Path("backend/tests/helpers/w4p01_postgres_runtime.py")
          # Import expected nodes without DB bootstrap.
          import importlib.util
          import sys
          spec = importlib.util.spec_from_file_location("w4p01_rt", helper)
          mod = importlib.util.module_from_spec(spec)
          sys.modules["w4p01_rt"] = mod
          spec.loader.exec_module(mod)
          expected = sorted(mod.W4P01_EXPECTED_RUNTIME_NODE_IDS)
          (pack / "expected-nodes.txt").write_text("\n".join(expected) + "\n", encoding="utf-8")
          collected_path = pack / "collected-nodes.txt"
          collected_ids = []
          if collected_path.exists():
              for line in collected_path.read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if "::test_W4P01_" in line:
                      # pytest -q collect lines like "test_section30...::test_..."
                      if line.startswith("backend/") or "test_section30" in line:
                          collected_ids.append(line.replace("\\", "/"))
          # Prefer helper evidence JSON if present.
          ev_dir = Path(os.environ["RUNNER_TEMP"]) / "sedi_w4p01_postgres_runtime_evidence"
          runtime_ev = ev_dir / "w4p01_runtime_evidence.json"
          collect_ev = ev_dir / "w4p01_collect_only_evidence.json"
          evidence = {}
          for p in (runtime_ev, collect_ev):
              if p.exists():
                  evidence = json.loads(p.read_text(encoding="utf-8"))
                  break
          if evidence.get("collected_node_ids"):
              collected_ids = list(evidence["collected_node_ids"])
          (pack / "collected-nodes.txt").write_text("\n".join(sorted(set(collected_ids))) + "\n", encoding="utf-8")
          executed = list(collected_ids) if evidence.get("pass_count") else list(collected_ids)
          (pack / "executed-nodes.txt").write_text("\n".join(sorted(set(executed))) + "\n", encoding="utf-8")
          missing = sorted(set(expected) - set(collected_ids))
          unexpected = sorted(set(collected_ids) - set(expected))
          node_accounting = {
              "expected_count": len(expected),
              "collected_count": len(set(collected_ids)),
              "executed_count": int(evidence.get("pass_count") or 0) + int(evidence.get("fail_count") or 0),
              "missing": missing,
              "duplicated": [],
              "unexpected": unexpected,
              "skipped": int(evidence.get("skip_count") or 0),
              "pass_count": evidence.get("pass_count"),
              "fail_count": evidence.get("fail_count"),
              "manifest_equality_pass": evidence.get("manifest_equality_pass"),
          }
          (pack / "node-accounting.json").write_text(json.dumps(node_accounting, indent=2) + "\n", encoding="utf-8")
          (pack / "runtime-environment.txt").write_text(
              "\n".join([
                  f"python={sys.version.split()[0]}",
                  f"platform={platform.platform()}",
                  "postgresql_image=postgres:15",
                  f"github_run_id={os.environ.get('GITHUB_RUN_ID','')}",
                  f"github_sha={os.environ.get('GITHUB_SHA','')}",
                  "controlled_network=DEFERRED_W6_P01",
                  "activation=OFF",
              ]) + "\n",
              encoding="utf-8",
          )
          workflow_identity = {
              "workflow_path": ".github/workflows/w4p01-postgresql-knowledge-retrieval-runtime.yml",
              "workflow_name": "W4-P01 Focused PostgreSQL Knowledge Retrieval Runtime",
              "trigger": "workflow_dispatch",
              "commit_sha": os.environ.get("GITHUB_SHA", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "runner": "ubuntu-24.04",
              "python": "3.12",
              "postgresql": "postgres:15",
          }
          (pack / "workflow-identity.json").write_text(json.dumps(workflow_identity, indent=2) + "\n", encoding="utf-8")
          (pack / "controlled-network-decision.json").write_text(
              json.dumps({
                  "decision": "DEFERRED",
                  "owner_package": "I5-IMPL-W6-P01",
                  "executed": False,
                  "rationale": "§245/v536 assign controlled network/dry-run/activation to W6-P01",
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          (pack / "no-production-write-proof.md").write_text(
              "# No production write proof\n\n"
              "- APP_ENV=test_isolated\n"
              "- TEST_DATABASE_URL bound to sedi_w4p01_retrieval only\n"
              "- handoff execute=False for RAW/PROVENANCE/CANDIDATE\n"
              "- weekly orchestrator activation env unset/false\n",
              encoding="utf-8",
          )
          (pack / "no-activation-proof.md").write_text(
              "# No activation proof\n\n"
              "- SEDI_I5_WEEKLY_ORCHESTRATOR_ENABLED default false\n"
              "- SEDI_I5_SOURCE_ACTIVATION_ENABLED default false\n"
              "- run_dormant_scheduled_tick returns DORMANT_NO_OP\n"
              "- scheduler job registered dormant only\n",
              encoding="utf-8",
          )
          (pack / "authority-register.md").write_text(
              "# Authority register (W4-P01)\n\n"
              "- CANONICAL_PACKAGE_ID=I5-IMPL-W4-P01\n"
              "- MANAGEMENT_ALIAS=P07\n"
              "- MASTER_LOG_TIP=§245\n"
              "- HANDOFF=v536\n"
              "- OWN=weekly orchestrator + discovery wiring; activation off\n"
              "- DEFER_NETWORK=W6-P01\n"
              "- RAW_PROVENANCE=W1-P02\n",
              encoding="utf-8",
          )
          (pack / "authority-excerpts.md").write_text(
              "# Authority excerpts\n\n"
              "## §245 NEXT PACKAGE\n"
              "NEXT_PACKAGE=I5-IMPL-W4-P01 ALIAS=P07\n"
              "OBJECTIVE=Weekly orchestrator job + discovery wiring (implementation only; activation off)\n\n"
              "## package_sequence.json W4-P01\n"
              "OUT_OF_SCOPE=enable flag, network, dry-run live\n"
              "JOBS=weekly_international_knowledge_crawler — registered dormant\n",
              encoding="utf-8",
          )
          (pack / "scope-ownership-matrix.md").write_text(
              "| Capability | Owner |\n|---|---|\n"
              "| Discovery wiring | W4-P01 |\n"
              "| Weekly orchestration | W4-P01 |\n"
              "| Raw/provenance persistence | W1-P02 |\n"
              "| Controlled network/activation | W6-P01 |\n",
              encoding="utf-8",
          )
          (pack / "contract-coverage-matrix.md").write_text(
              "# Contract coverage\n\n"
              "- T1 identity\n- T2 activation-off / dormant scheduler\n"
              "- T3-T6 discovery\n- T7-T11 ledger\n- T12 partial failure\n"
              "- T13 handoff prepare-only\n- T14 dry unit\n- T15 FK\n",
              encoding="utf-8",
          )
          (pack / "changed-symbols.md").write_text(
              "# Changed symbols\n\n"
              "- source_discovery.plan_discovery\n"
              "- weekly_orchestrator.orchestrate_weekly_run\n"
              "- weekly_orchestrator.run_dormant_scheduled_tick\n"
              "- scheduler.start_scheduler dormant job registration\n",
              encoding="utf-8",
          )
          (pack / "findings-ledger.md").write_text(
              "# Findings ledger\n\nOPEN_IMPLEMENTATION_FINDINGS=0 (pending CI green confirmation)\n",
              encoding="utf-8",
          )
          (pack / "limitations.md").write_text(
              "# Limitations\n\n"
              "- Controlled real-source validation not executed (W6-P01)\n"
              "- Migration not authored/run\n"
              "- Source/scheduler activation remain off\n"
              "- Formal I5 percentage locked unchanged\n",
              encoding="utf-8",
          )
          (pack / "orchestration-summary.json").write_text(
              json.dumps({
                  "package_id": "I5-IMPL-W4-P01",
                  "job_id": "weekly_international_knowledge_crawler",
                  "activation": "OFF",
                  "network": "NOT_EXECUTED",
                  "expected_nodes": len(expected),
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          (pack / "database-object-summary.json").write_text(
              json.dumps({
                  "tables": list(mod.W4P01_EXPECTED_SCHEMA_TABLES),
                  "migrations_authored": False,
                  "migrations_run": False,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          (pack / "run-job-step-summary.json").write_text(
              json.dumps({
                  "run_id": os.environ.get("GITHUB_RUN_ID", ""),
                  "job": "w4p01-postgresql-knowledge-retrieval-runtime",
                  "evidence_mode": evidence.get("mode"),
                  "pass_count": evidence.get("pass_count"),
                  "fail_count": evidence.get("fail_count"),
                  "skip_count": evidence.get("skip_count"),
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          # Copy helper evidence if present.
          for p in (runtime_ev, collect_ev):
              if p.exists():
                  (pack / p.name).write_text(p.read_text(encoding="utf-8"), encoding="utf-8")
          (pack / "changed-files.txt").write_text(
              "\n".join([
                  "A backend/app/services/i5/weekly_orchestrator.py",
                  "A backend/app/services/i5/source_discovery.py",
                  "A backend/tests/helpers/w4p01_postgres_runtime.py",
                  "A backend/tests/helpers/w4p01_postgres_runtime_plugin.py",
                  "A .github/workflows/w4p01-postgresql-knowledge-retrieval-runtime.yml",
                  "M backend/app/core/scheduler.py",
              ]) + "\n",
              encoding="utf-8",
          )
          (pack / "evidence-index.json").write_text(
              json.dumps({
                  "package_id": "I5-IMPL-W4-P01",
                  "alias": "P07",
                  "artifact_name": "w4p01-postgresql-knowledge-retrieval-evidence",
                  "files": sorted([p.name for p in pack.iterdir() if p.is_file()]),
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          # checksums
          lines = []
          for path in sorted(pack.iterdir()):
              if path.is_file() and path.name != "checksums.sha256":
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  lines.append(f"{digest}  {path.name}")
          (pack / "checksums.sha256").write_text("\n".join(lines) + "\n", encoding="utf-8")
          manifest = {
              "files": {
                  path.name: {
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in sorted(pack.iterdir()) if path.is_file()
              }
          }
          
          # W3-P02 carried-forward warning baseline + W4 delta placeholders
          warning_summary = {
            "w3p02_baseline_total": 123,
            "w3p02_baseline_classification": {
              "DeprecationWarning.datetime.utcnow": {
                "count": 123,
                "material": False,
                "owner": "dependency/sqlalchemy+prior-packages",
                "action": "document; do not global-suppress",
                "status": "CLOSED_W3P02-WARNINGS-CLASSIFICATION-01"
              }
            },
            "w4p01_total": None,
            "w4p01_by_category": {},
            "new_material_warnings": 0,
            "acceptance": "NEW_MATERIAL_WARNINGS_MUST_BE_0"
          }
          test_out = pack / "test-output.txt"
          if test_out.exists():
              text = test_out.read_text(encoding="utf-8", errors="replace")
              import re
              m = re.search(r"(\d+) passed(?:, (\d+) warnings)?", text)
              if m:
                  warning_summary["w4p01_pass_count"] = int(m.group(1))
                  warning_summary["w4p01_total"] = int(m.group(2) or 0)
              cats = {}
              for line in text.splitlines():
                  if "DeprecationWarning" in line and "utcnow" in line:
                      cats["DeprecationWarning.datetime.utcnow"] = cats.get("DeprecationWarning.datetime.utcnow", 0) + 1
                  elif "SAWarning" in line:
                      cats["SQLAlchemy.SAWarning"] = cats.get("SQLAlchemy.SAWarning", 0) + 1
              warning_summary["w4p01_by_category"] = cats
              # Material if SAWarning / integrity / security appear
              material = sum(v for k,v in cats.items() if k.startswith("SQLAlchemy") or "Security" in k)
              warning_summary["new_material_warnings"] = int(material)
          (pack / "warning-summary.json").write_text(json.dumps(warning_summary, indent=2) + "\n", encoding="utf-8")
          (pack / "warning-details.txt").write_text(
              (test_out.read_text(encoding="utf-8", errors="replace") if test_out.exists() else "NO_TEST_OUTPUT\n"),
              encoding="utf-8",
          )
          (pack / "no-base-model-fallback-proof.md").write_text(
              "# No base-model medical fallback\n\n- no_base_model_fallback=True on RetrievalResult\n- care_context sets no_base_model_fallback\n- STATUS_NO_ELIGIBLE_KNOWLEDGE does not invent content\n",
              encoding="utf-8",
          )
          (pack / "no-safe-knowledge-proof.md").write_text(
              "# No-safe-knowledge fail-closed\n\n- STATUS_NO_ELIGIBLE_KNOWLEDGE\n- gap enqueue RUNTIME_RETRIEVAL_FAILURE\n- empty items list\n",
              encoding="utf-8",
          )

          whole = hashlib.sha256(json.dumps(manifest, sort_keys=True).encode("utf-8")).hexdigest()
          manifest["whole_manifest_sha256"] = whole
          (pack / "artifact-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print("evidence_pack_ready", pack)
          print("node_accounting", json.dumps(node_accounting))
          PY

      - name: Copy helper runtime evidence into pack
        if: always()
        run: |
          cp -f "${{ runner.temp }}/sedi_w4p01_postgres_runtime_evidence/"*.json \
            "${{ runner.temp }}/sedi_w4p01_evidence_assurance_pack/" 2>/dev/null || true

      - name: Upload Evidence Assurance Pack artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w4p01-postgresql-knowledge-retrieval-evidence
          path: ${{ runner.temp }}/sedi_w4p01_evidence_assurance_pack
