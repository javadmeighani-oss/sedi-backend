              if ms < int(before.get("d19_ms_eligible") or 0):
                  raise SystemExit("d19_ms_regression")
              if ku < int(before.get("ku") or 0):
                  raise SystemExit("ku_regression")

              # Retrieval: statement-derived / short occupational tokens
              d17_elig_rows = [r for r in elig_rows if str(getattr(r, "manifest_entity_id", None) or "") == "D17"
                               or "occupational" in str(r.domain or "").lower()
                               or "niosh" in str(r.normalized_statement or "").lower()]
              queries = []
