# Confirmation tokens:
#   ACTIVATE_W6P01_WEEKLY              → NHS-only historical weekly activation
#   ACTIVATE_I5_MULTISOURCE_V1         → I5 multi-source weekly activation
#   WAVE01_I5_GOVERNED_EXPANSION       → Wave01 bounded allowlist URL expansion + weekly
#   WAVE02_I5_D01_D17_EXPANSION        → Wave02 D01–D17 governed knowledge expansion + weekly
#   NIOSH_D17_QUALIFIED_ACTIVATION     → NIOSH D17 qualified activation + weekly
#   QUALIFIED_SOURCE_ACTIVATION_WAVE01 → NIH institute families + specialized serving Wave01
#   SPECIALIZED_D18_D19_ELIGIBILITY    → ALS/MS specialized serving eligibility (MedlinePlus global low-risk stays NO)
#   AUTONOMOUS_DISCOVERY_QUAL_MONITOR_FOUNDATION → discover/qualify/monitor only (NO activation)
#   COVERAGE_CLOSURE_AUTONOMOUS_GOVERNANCE → weekly side-stage ON + D08/D10/D11/D13/D14/D15 Gate activation
#   D08_NIDCD_EXTRACTION_CONTENT_QUALITY_HARDENING → D08-only NIDCD claim-window/content-quality harden
#   KNOW07_EVIDENCE_AWARE_SCIS_PUBLICATION_EVAL → evidence-aware SCIS publication/retrieval + clinical eval proof
#   I5_FINAL_READINESS_PROOF → immutable image parity + production answer path (NO docker cp code patch)
# Fail-closed paths differ per job (see job bodies).
name: W6-P01 Production Activate Weekly

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "ACTIVATE_W6P01_WEEKLY | ACTIVATE_I5_MULTISOURCE_V1 | WAVE01_I5_GOVERNED_EXPANSION | WAVE02_I5_D01_D17_EXPANSION | NIOSH_D17_QUALIFIED_ACTIVATION | QUALIFIED_SOURCE_ACTIVATION_WAVE01 | SPECIALIZED_D18_D19_ELIGIBILITY | AUTONOMOUS_DISCOVERY_QUAL_MONITOR_FOUNDATION | COVERAGE_CLOSURE_AUTONOMOUS_GOVERNANCE | D08_NIDCD_EXTRACTION_CONTENT_QUALITY_HARDENING | KNOW07_EVIDENCE_AWARE_SCIS_PUBLICATION_EVAL | I5_FINAL_READINESS_PROOF"
        required: true
      deployed_image_sha:
        description: "40-character lowercase Git commit SHA of the deployed backend image."
        required: true
      deployed_image_digest:
        description: "Expected deployed image digest in sha256:<64 hex> (required for activate tokens; optional for WAVE/NIOSH/QUALIFIED/SPECIALIZED/AUTONOMOUS)."
        required: false
        default: ""
      expected_alembic_revision:
        description: "Expected exact production alembic_version before activation."
        required: true
        default: 056_i5_w2_p02_conflict_safety

concurrency:
  # Dedicated group: avoids ghost locks on shared sedi-production-backend-operation
  # that left QUALIFIED_SOURCE_ACTIVATION_WAVE01 runs queued with nothing in_progress.
  group: sedi-w6p01-production-activate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  autonomous-discovery-qual-monitor-foundation:
    name: Autonomous discovery qualification monitoring foundation
    if: github.event.inputs.confirmation == 'AUTONOMOUS_DISCOVERY_QUAL_MONITOR_FOUNDATION'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate inputs
        env:
          SHA: ${{ github.event.inputs.deployed_image_sha }}
          REV: ${{ github.event.inputs.expected_alembic_revision }}
        run: |
          set -Eeuo pipefail
          echo "${SHA}" | grep -Eq '^[0-9a-f]{40}$'
          echo "${REV}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$'
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
      - name: Stage artifacts
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/i5/autonomous_governance"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/config/i5/candidate_qualification_registry_v1.yaml \
            backend/config/i5/autonomous_discovery_seed_catalog_v1.yaml \
            backend/app/services/i5/candidate_qualification_registry.py \
            backend/app/services/i5/autonomous_source_governance.py \
            backend/app/services/i5/weekly_orchestrator.py \
            backend/scripts/i5_autonomous_governance_prod_proof.py \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/"
      - name: Discover + qualify + monitor (NO activation)
        env:
          INPUT_SHA: ${{ github.event.inputs.deployed_image_sha }}
          INPUT_REV: ${{ github.event.inputs.expected_alembic_revision }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH_Q="$(printf '%q' "${{ secrets.SEDI_DEPLOY_PATH }}")"
          IMAGE_SHA_Q="$(printf '%q' "${INPUT_SHA}")"
          EXPECTED_REV_Q="$(printf '%q' "${INPUT_REV}")"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "DEPLOY_PATH=${DEPLOY_PATH_Q} IMAGE_SHA=${IMAGE_SHA_Q} EXPECTED_REV=${EXPECTED_REV_Q} bash -s" \
            2>&1 <<'REMOTE_SCRIPT' | tee /tmp/i5_autonomous_governance_prod.log
          set -Eeuo pipefail
          log() { echo "[$(date -Is)] $*"; }
          summary() { echo "AGOV_SUMMARY|$1|$2"; }
          HOST="${DEPLOY_PATH}/ops/i5/autonomous_governance"
          CTR_REG="/app/backend/config/i5/candidate_qualification_registry_v1.yaml"
          CTR_SEED="/app/backend/config/i5/autonomous_discovery_seed_catalog_v1.yaml"
          CTR_GOV="/app/backend/app/services/i5/autonomous_source_governance.py"
          CTR_CQR="/app/backend/app/services/i5/candidate_qualification_registry.py"
          CTR_WO="/app/backend/app/services/i5/weekly_orchestrator.py"
          CTR_PROOF="/app/backend/scripts/i5_autonomous_governance_prod_proof.py"
          IMAGE_TAG="ghcr.io/javadmeighani-oss/sedi-backend:${IMAGE_SHA}"
          wait_health() {
            local ok=0 i
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done
            [ "${ok}" = "1" ] || { log "HEALTH_FAILED"; return 1; }
            curl -fsS http://127.0.0.1:8000/health >/dev/null
            curl -fsS https://api.sedi-ai.com/healthz >/dev/null
          }
          cd "${DEPLOY_PATH}"
          CURRENT_IMAGE="$(docker inspect sedi-backend --format '{{.Config.Image}}' 2>/dev/null || true)"
          summary "pre_image" "${CURRENT_IMAGE:-none}"
          if [ "${CURRENT_IMAGE}" != "${IMAGE_TAG}" ]; then log "image mismatch"; exit 5; fi
          PU=$(docker exec sedi-postgres printenv POSTGRES_USER)
          PD=$(docker exec sedi-postgres printenv POSTGRES_DB)
          ALEMBIC_COUNT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM alembic_version;")"
          ALEMBIC_CURRENT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT version_num FROM alembic_version;")"
          summary "alembic_revision" "${ALEMBIC_CURRENT}"
          if [ "${ALEMBIC_COUNT}" != "1" ] || [ "${ALEMBIC_CURRENT}" != "${EXPECTED_REV}" ]; then exit 5; fi
          docker exec sedi-backend mkdir -p /app/backend/scripts
          docker cp "${HOST}/candidate_qualification_registry_v1.yaml" "sedi-backend:${CTR_REG}"
          docker cp "${HOST}/autonomous_discovery_seed_catalog_v1.yaml" "sedi-backend:${CTR_SEED}"
          docker cp "${HOST}/autonomous_source_governance.py" "sedi-backend:${CTR_GOV}"
          docker cp "${HOST}/candidate_qualification_registry.py" "sedi-backend:${CTR_CQR}"
          docker cp "${HOST}/weekly_orchestrator.py" "sedi-backend:${CTR_WO}"
          docker cp "${HOST}/i5_autonomous_governance_prod_proof.py" "sedi-backend:${CTR_PROOF}"
          # Do NOT use docker exec -i with nested heredoc (consumes REMOTE_SCRIPT stdin).
          docker exec -e PYTHONUNBUFFERED=1 -e PYTHONPATH=/app -w /app sedi-backend python "${CTR_PROOF}"
          docker cp sedi-backend:/tmp/i5_autonomous_governance_ledger.json "${HOST}/ledger.json"
          wait_health
          summary "health" "pass"
          summary "autonomous_governance" "SUCCESS"
          REMOTE_SCRIPT
      - name: Summary
        if: always()
        run: |
          {
            echo "## Autonomous discovery / qualification / monitoring foundation"
            echo "**Status:** ${{ job.status }}"
            if [ -f /tmp/i5_autonomous_governance_prod.log ]; then
              grep '^AGOV_SUMMARY|' /tmp/i5_autonomous_governance_prod.log | while IFS='|' read -r _ k v; do echo "- **${k}:** ${v}"; done || true
              grep -E '^\{' /tmp/i5_autonomous_governance_prod.log | tail -n 30 || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i5-autonomous-governance-prod-log
          path: /tmp/i5_autonomous_governance_prod.log

  coverage-closure-autonomous-governance:
    name: Coverage closure + continuous weekly autonomous governance
    if: github.event.inputs.confirmation == 'COVERAGE_CLOSURE_AUTONOMOUS_GOVERNANCE'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Validate inputs
        env:
          SHA: ${{ github.event.inputs.deployed_image_sha }}
          REV: ${{ github.event.inputs.expected_alembic_revision }}
        run: |
          set -Eeuo pipefail
          echo "${SHA}" | grep -Eq '^[0-9a-f]{40}$'
          echo "${REV}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$'
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts
      - name: Stage artifacts
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/i5/coverage_closure"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/config/i5/multisource_activation_allowlist_v1.yaml \
            backend/config/i5/candidate_qualification_registry_v1.yaml \
            backend/config/i5/autonomous_discovery_seed_catalog_v1.yaml \
            backend/app/services/i5/autonomous_source_governance.py \
            backend/app/services/i5/candidate_qualification_registry.py \
            backend/app/services/i5/governed_specialized_entity_eligibility.py \
            backend/app/services/i5/weekly_orchestrator.py \
            backend/scripts/i5_coverage_closure_prod_proof.py \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/"
      - name: Activate gap sources + weekly side-stage + retrieval
        env:
          INPUT_SHA: ${{ github.event.inputs.deployed_image_sha }}
          INPUT_REV: ${{ github.event.inputs.expected_alembic_revision }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH_Q="$(printf '%q' "${{ secrets.SEDI_DEPLOY_PATH }}")"
          IMAGE_SHA_Q="$(printf '%q' "${INPUT_SHA}")"
          EXPECTED_REV_Q="$(printf '%q' "${INPUT_REV}")"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "DEPLOY_PATH=${DEPLOY_PATH_Q} IMAGE_SHA=${IMAGE_SHA_Q} EXPECTED_REV=${EXPECTED_REV_Q} bash -s" \
            2>&1 <<'REMOTE_SCRIPT' | tee /tmp/i5_coverage_closure_prod.log
          set -Eeuo pipefail
          log() { echo "[$(date -Is)] $*"; }
          summary() { echo "COV_SUMMARY|$1|$2"; }
          HOST="${DEPLOY_PATH}/ops/i5/coverage_closure"
          CTR_ALLOW="/app/backend/config/i5/multisource_activation_allowlist_v1.yaml"
          CTR_REG="/app/backend/config/i5/candidate_qualification_registry_v1.yaml"
          CTR_SEED="/app/backend/config/i5/autonomous_discovery_seed_catalog_v1.yaml"
          CTR_GOV="/app/backend/app/services/i5/autonomous_source_governance.py"
          CTR_CQR="/app/backend/app/services/i5/candidate_qualification_registry.py"
          CTR_SPEC="/app/backend/app/services/i5/governed_specialized_entity_eligibility.py"
          CTR_WO="/app/backend/app/services/i5/weekly_orchestrator.py"
          CTR_PROOF="/app/backend/scripts/i5_coverage_closure_prod_proof.py"
          IMAGE_TAG="ghcr.io/javadmeighani-oss/sedi-backend:${IMAGE_SHA}"
          wait_health() {
            local ok=0 i
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done
            [ "${ok}" = "1" ] || { log "HEALTH_FAILED"; return 1; }
            curl -fsS http://127.0.0.1:8000/health >/dev/null
            curl -fsS https://api.sedi-ai.com/healthz >/dev/null
          }
          cd "${DEPLOY_PATH}"
          CURRENT_IMAGE="$(docker inspect sedi-backend --format '{{.Config.Image}}' 2>/dev/null || true)"
          summary "pre_image" "${CURRENT_IMAGE:-none}"
          if [ "${CURRENT_IMAGE}" != "${IMAGE_TAG}" ]; then log "image mismatch"; exit 5; fi
          PU=$(docker exec sedi-postgres printenv POSTGRES_USER)
          PD=$(docker exec sedi-postgres printenv POSTGRES_DB)
          ALEMBIC_COUNT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM alembic_version;")"
          ALEMBIC_CURRENT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT version_num FROM alembic_version;")"
          summary "alembic_revision" "${ALEMBIC_CURRENT}"
          if [ "${ALEMBIC_COUNT}" != "1" ] || [ "${ALEMBIC_CURRENT}" != "${EXPECTED_REV}" ]; then exit 5; fi
          docker exec sedi-backend mkdir -p /app/backend/scripts /app/backend/config/i5
          docker cp "${HOST}/multisource_activation_allowlist_v1.yaml" "sedi-backend:${CTR_ALLOW}"
          docker cp "${HOST}/candidate_qualification_registry_v1.yaml" "sedi-backend:${CTR_REG}"
          docker cp "${HOST}/autonomous_discovery_seed_catalog_v1.yaml" "sedi-backend:${CTR_SEED}"
          docker cp "${HOST}/autonomous_source_governance.py" "sedi-backend:${CTR_GOV}"
          docker cp "${HOST}/candidate_qualification_registry.py" "sedi-backend:${CTR_CQR}"
          docker cp "${HOST}/governed_specialized_entity_eligibility.py" "sedi-backend:${CTR_SPEC}"
          docker cp "${HOST}/weekly_orchestrator.py" "sedi-backend:${CTR_WO}"
          docker cp "${HOST}/i5_coverage_closure_prod_proof.py" "sedi-backend:${CTR_PROOF}"
          docker exec sedi-backend grep -Fq 'i5-multisource-v1-coverage-closure-gap01' "${CTR_ALLOW}"
          docker exec sedi-backend grep -Fq 'autonomous_governance_side_stage' "${CTR_WO}"
          docker exec sedi-backend grep -Fq 'nidcd_hearing_balance' "${CTR_ALLOW}"
          docker exec sedi-backend grep -Fq 'cdc_ncezid_infectious' "${CTR_ALLOW}"
          if docker exec sedi-backend grep -Eq '^\s*- source_key:\s*who_fact_sheets\s*$' "${CTR_ALLOW}"; then
            log "WHO activated in allowlist"; exit 6
          fi
          # Do NOT use docker exec -i with nested heredoc (consumes REMOTE_SCRIPT stdin).
          docker exec \
            -e PYTHONUNBUFFERED=1 \
            -e PYTHONPATH=/app \
            -e SEDI_I5_MULTISOURCE_ENABLED=1 \
            -e SEDI_I5_WEEKLY_ORCHESTRATOR_ENABLED=1 \
            -e SEDI_I5_SOURCE_ACTIVATION_ENABLED=1 \
            -e I5_AUTONOMOUS_GOVERNANCE_SIDE_STAGE=1 \
            -w /app sedi-backend python "${CTR_PROOF}"
          docker cp sedi-backend:/tmp/i5_coverage_closure_governance_ledger.json "${HOST}/ledger.json" || true
          docker cp sedi-backend:/tmp/i5_autonomous_governance_side_stage.json "${HOST}/side_stage.json" || true
          wait_health
          summary "health" "pass"
          summary "coverage_closure" "SUCCESS"
          REMOTE_SCRIPT
      - name: Summary
        if: always()
        run: |
          {
            echo "## Coverage closure + continuous autonomous governance"
            echo "**Status:** ${{ job.status }}"
            if [ -f /tmp/i5_coverage_closure_prod.log ]; then
              grep '^COV_SUMMARY|' /tmp/i5_coverage_closure_prod.log | while IFS='|' read -r _ k v; do echo "- **${k}:** ${v}"; done || true
              grep -E '^\{' /tmp/i5_coverage_closure_prod.log | tail -n 40 || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i5-coverage-closure-prod-log
          path: /tmp/i5_coverage_closure_prod.log
          retention-days: 14

