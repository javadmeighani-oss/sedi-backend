name: Frontend Android Debug APK

on:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Provide google-services.json for build
        run: |
          DIR="$GITHUB_WORKSPACE/android/app"
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > "$DIR/google-services.json"
            echo "Using google-services.json from repository secret."
          elif [ -f "$DIR/google-services.json.ci" ]; then
            cp "$DIR/google-services.json.ci" "$DIR/google-services.json"
            echo "Using CI placeholder google-services.json."
          else
            echo "Missing google-services.json.ci — cannot build Android."
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (fail on errors only; C1 legacy warnings non-blocking)
        run: |
          set +e
          flutter analyze > analyze_out.txt 2>&1
          status=$?
          cat analyze_out.txt
          if grep -E "error •" analyze_out.txt; then
            echo "Analyzer reported errors"
            exit 1
          fi
          echo "No analyzer errors (warnings/infos non-blocking for this Gate)"
          exit 0

      - name: Targeted A1 session tests
        run: flutter test test/session_gate_resolver_test.dart

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sedi-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
