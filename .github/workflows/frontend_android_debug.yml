name: Frontend Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Provide real google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          GS="android/app/google-services.json"
          mkdir -p "$(dirname "$GS")"
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "FAIL: GOOGLE_SERVICES_JSON repository secret is missing/empty"
            exit 1
          fi
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > "$GS"
          if grep -q "sedi-ci-placeholder" "$GS"; then
            echo "FAIL: placeholder sedi-ci-placeholder detected; real Firebase config required"
            exit 1
          fi
          if ! grep -q '"project_id"' "$GS"; then
            echo "FAIL: google-services.json missing project_id"
            exit 1
          fi
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('android/app/google-services.json')).get('project_info',{}).get('project_id',''))")
          echo "REAL_GOOGLE_SERVICES_CONFIG_USED=YES"
          echo "GOOGLE_SERVICES_PROJECT_ID=${PROJECT_ID}"
          if [ "$PROJECT_ID" = "sedi-ci-placeholder" ] || [ -z "$PROJECT_ID" ]; then
            echo "FAIL: invalid google-services project_id"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sedi-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
