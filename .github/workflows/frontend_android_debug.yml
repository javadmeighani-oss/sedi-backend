name: Frontend Android Debug APK

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Provide google-services.json for CI (stub if missing)
        run: |
          GS=android/app/google-services.json
          if [ ! -f "$GS" ]; then
            echo "Creating minimal google-services.json stub for CI"
            mkdir -p "$(dirname "$GS")"
            cp android/app/google-services.json.ci "$GS"
          fi

      - name: Dart format verification (scoped to section changes)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          BASE_SHA="452b3e4e160922468ecb843187e300fcc03f2436"
          git cat-file -e "${BASE_SHA}^{commit}"
          mapfile -t DART_FILES < <(
            git diff --name-only --diff-filter=ACMRT \
              "${BASE_SHA}...HEAD" -- \
              frontend/lib frontend/test \
            | grep -E '\.dart$' || true
          )
          if [ "${#DART_FILES[@]}" -eq 0 ]; then
            echo "No scoped Dart files changed; format check skipped."
            exit 0
          fi
          printf 'Checking Dart format for:\n'
          printf ' - %s\n' "${DART_FILES[@]}"
          dart format \
            --output=none \
            --set-exit-if-changed \
            "${DART_FILES[@]}"

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=SEDI_GATE_BUILD_LABEL=${{ github.sha }}

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sedi-android-debug-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
