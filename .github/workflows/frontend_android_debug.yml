name: Frontend Android Debug APK

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Provide google-services.json for CI (stub if missing)
        run: |
          GS=android/app/google-services.json
          if [ ! -f "$GS" ]; then
            echo "Creating minimal google-services.json stub for CI"
            mkdir -p "$(dirname "$GS")"
            cp android/app/google-services.json.ci "$GS"
          fi

      - name: Dart format verification (scoped to section changes)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          BASE_SHA="452b3e4e160922468ecb843187e300fcc03f2436"
          git cat-file -e "${BASE_SHA}^{commit}"
          mapfile -t DART_FILES < <(
            git diff --name-only --diff-filter=ACMRT \
              "${BASE_SHA}...HEAD" -- \
              frontend/lib frontend/test \
            | grep -E '\.dart$' || true
          )
          if [ "${#DART_FILES[@]}" -eq 0 ]; then
            echo "No scoped Dart files changed; format check skipped."
            exit 0
          fi
          printf 'Checking Dart format for:\n'
          printf ' - %s\n' "${DART_FILES[@]}"
          dart format \
            --output=none \
            --set-exit-if-changed \
            "${DART_FILES[@]}"

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Full Flutter test suite (observation + evidence)
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          mkdir -p ci-evidence
          set +e
          (
            cd frontend
            flutter test --machine
          ) > ci-evidence/full-test-machine.jsonl 2> ci-evidence/full-test-stderr.txt
          TEST_EXIT=$?
          set -e
          echo "flutter_test_exit_code=${TEST_EXIT}" | tee ci-evidence/full-test-runner.env
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          evidence = pathlib.Path("ci-evidence")
          machine = evidence / "full-test-machine.jsonl"
          stderr_path = evidence / "full-test-stderr.txt"
          failures_path = evidence / "full-test-failures.txt"
          summary_path = evidence / "full-test-summary.json"

          exit_env = evidence / "full-test-runner.env"
          runner_exit = None
          if exit_env.exists():
              for line in exit_env.read_text(encoding="utf-8", errors="replace").splitlines():
                  if line.startswith("flutter_test_exit_code="):
                      runner_exit = int(line.split("=", 1)[1])

          if not machine.exists() or machine.stat().st_size == 0:
              summary = {
                  "ok": False,
                  "infrastructure_failure": True,
                  "reason": "missing_or_empty_machine_output",
                  "runner_exit_code": runner_exit,
              }
              summary_path.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
              print("INFRASTRUCTURE FAILURE: missing/empty flutter --machine output", file=sys.stderr)
              sys.exit(2)

          suites = {}
          tests = {}
          results = {}
          saw_done = False
          success_flag = None
          line_no = 0

          try:
              with machine.open(encoding="utf-8", errors="replace") as fh:
                  for raw in fh:
                      line_no += 1
                      line = raw.strip()
                      if not line:
                          continue
                      try:
                          event = json.loads(line)
                      except json.JSONDecodeError as exc:
                          raise RuntimeError(f"invalid_json_at_line_{line_no}: {exc}") from exc
                      # Flutter may emit non-protocol JSON arrays/objects; only parse dict events.
                      if not isinstance(event, dict):
                          continue
                      et = event.get("type")
                      if et == "suite":
                          suite = event.get("suite")
                          if not isinstance(suite, dict):
                              continue
                          suites[suite["id"]] = suite.get("path") or ""
                      elif et == "testStart":
                          test = event.get("test")
                          if not isinstance(test, dict):
                              continue
                          tests[test["id"]] = {
                              "id": test["id"],
                              "name": test.get("name") or "",
                              "suiteID": test.get("suiteID"),
                              "url": test.get("url") or "",
                          }
                      elif et == "testDone":
                          tid = event.get("testID")
                          results[tid] = {
                              "result": event.get("result"),
                              "skipped": bool(event.get("skipped")),
                              "hidden": bool(event.get("hidden")),
                          }
                      elif et == "done":
                          saw_done = True
                          success_flag = event.get("success")
          except Exception as exc:
              summary = {
                  "ok": False,
                  "infrastructure_failure": True,
                  "reason": f"parser_error: {exc}",
                  "runner_exit_code": runner_exit,
              }
              summary_path.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
              print(f"INFRASTRUCTURE FAILURE: {exc}", file=sys.stderr)
              sys.exit(2)

          if not saw_done:
              summary = {
                  "ok": False,
                  "infrastructure_failure": True,
                  "reason": "missing_done_event",
                  "runner_exit_code": runner_exit,
              }
              summary_path.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
              print("INFRASTRUCTURE FAILURE: missing done event", file=sys.stderr)
              sys.exit(2)

          def rel_path(path: str) -> str:
              if not path:
                  return ""
              norm = path.replace("\\", "/")
              marker = "/frontend/"
              if marker in norm:
                  return "frontend/" + norm.split(marker, 1)[1]
              if norm.startswith("frontend/"):
                  return norm
              if "/test/" in norm:
                  return "frontend/test/" + norm.split("/test/", 1)[1]
              return norm

          passed = failed = skipped = 0
          failure_rows = []
          for tid, meta in tests.items():
              outcome = results.get(tid)
              if outcome is None:
                  continue
              if outcome.get("hidden"):
                  continue
              result = outcome.get("result")
              if outcome.get("skipped") or result == "skipped":
                  skipped += 1
                  continue
              suite_path = rel_path(suites.get(meta.get("suiteID"), ""))
              test_url = rel_path(meta.get("url") or "")
              file_path = suite_path or test_url or "unknown"
              name = meta.get("name") or f"test#{tid}"
              if result == "success":
                  passed += 1
              elif result in ("failure", "error"):
                  failed += 1
                  failure_rows.append((file_path, name, result))
              else:
                  # Unexpected result token => infrastructure uncertainty
                  summary = {
                      "ok": False,
                      "infrastructure_failure": True,
                      "reason": f"unexpected_result:{result}",
                      "runner_exit_code": runner_exit,
                  }
                  summary_path.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
                  print(f"INFRASTRUCTURE FAILURE: unexpected result {result}", file=sys.stderr)
                  sys.exit(2)

          # Deterministic unique sorted failure lines: path + full name
          unique = sorted({f"{path}\t{name}\t{result}" for path, name, result in failure_rows})
          failures_path.write_text("\n".join(unique) + ("\n" if unique else ""), encoding="utf-8")

          summary = {
              "ok": True,
              "infrastructure_failure": False,
              "runner_exit_code": runner_exit,
              "machine_success_flag": success_flag,
              "passed": passed,
              "failed": failed,
              "skipped": skipped,
              "unique_failures": len(unique),
          }
          summary_path.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")

          print(json.dumps(summary, indent=2))
          print(f"unique_failure_count={len(unique)}")
          for row in unique:
              print(f"FAIL\t{row}")

          # Do not fail the step for legacy test failures; only for infrastructure.
          sys.exit(0)
          PY

      - name: Upload full-suite test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section14a2-full-test-evidence
          path: |
            ci-evidence/full-test-machine.jsonl
            ci-evidence/full-test-failures.txt
            ci-evidence/full-test-summary.json
            ci-evidence/full-test-stderr.txt
            ci-evidence/full-test-runner.env
          if-no-files-found: error

      - name: Mandatory Section 14-A2 continuity tests
        run: |
          set -euo pipefail
          if [ -f test/section14a2_continuity_test.dart ]; then
            echo "Running mandatory Section 14-A2 continuity tests"
            flutter test test/section14a2_continuity_test.dart
          else
            echo "Section 14-A2 test absent on baseline — expected"
          fi

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=SEDI_GATE_BUILD_LABEL=${{ github.sha }}

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sedi-android-debug-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
