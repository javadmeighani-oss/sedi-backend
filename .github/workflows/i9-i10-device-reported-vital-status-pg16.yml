# I9→I10 DeviceReportedVitalStatus canonicalization — ephemeral PostgreSQL 16.
# NO production mutation. NO deploy. NO clinical rules. NO Smart-RAG. NO Real FCM.
# GATE=SEDI-V1-BE-I9-I10-DEVICE-REPORTED-VITAL-STATUS-CANONICALIZATION-01
name: I9-I10 Device Reported Vital Status PG16

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/app/models.py"
      - "backend/app/schemas/device_packet.py"
      - "backend/app/services/i9/device_packet_service.py"
      - "backend/app/services/i9/device_reported_vital_status.py"
      - "backend/app/services/i10/device_reported_vital_status_producer.py"
      - "backend/app/services/i10/care_subject_status_facts.py"
      - "backend/alembic/versions/080_i9_device_reported_vital_status.py"
      - "backend/tests/test_i9_i10_device_reported_vital_status.py"
      - "backend/tests/helpers/i10_postgresql_harness.py"
      - "backend/tests/helpers/stage_b_family_fixture.py"
      - ".github/workflows/i9-i10-device-reported-vital-status-pg16.yml"

permissions:
  contents: read

concurrency:
  group: i9-i10-device-reported-vital-status-${{ github.ref }}
  cancel-in-progress: false

jobs:
  device-reported-vital-status:
    name: Device-reported vital status PG16
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sedi_drvs
          POSTGRES_PASSWORD: sedi_drvs_pass
          POSTGRES_DB: sedi_drvs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_drvs -d sedi_drvs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg2://sedi_drvs:sedi_drvs_pass@127.0.0.1:5432/sedi_drvs
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_drvs:sedi_drvs_pass@127.0.0.1:5432/sedi_drvs
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAI_API_KEY: ci-placeholder-not-used
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest alembic
      - name: Prove PostgreSQL 16 + pgvector
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          eng = create_engine(os.environ["TEST_DATABASE_URL"])
          with eng.connect() as c:
              ver = c.execute(text("SHOW server_version")).scalar()
              print("POSTGRES_SERVER_VERSION", ver)
              assert str(ver).startswith("16."), ver
              c.execute(text("CREATE EXTENSION IF NOT EXISTS vector"))
              v = c.execute(text("SELECT extversion FROM pg_extension WHERE extname='vector'")).scalar()
              print("PGVECTOR_VERSION", v)
              assert v
          PY
      - name: Alembic single head 080
        run: |
          set -euo pipefail
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          cfg = Config("backend/alembic.ini")
          script = ScriptDirectory.from_config(cfg)
          heads = script.get_heads()
          assert heads == ["080_i9_device_reported_vital_status"], heads
          rev = script.get_revision("080_i9_device_reported_vital_status")
          assert rev.down_revision == "079_i10_cni_owner_provenance_nullable"
          print("ALEMBIC_HEAD_OK", heads[0])
          PY
      - name: Upgrade ephemeral DB to head
        run: |
          set -euo pipefail
          python -m alembic -c backend/alembic.ini upgrade head
      - name: Focused DeviceReportedVitalStatus suite
        run: |
          set -euo pipefail
          mkdir -p /tmp/drvs_evidence
          python -B -m pytest -v --tb=short --noconftest \
            backend/tests/test_i9_i10_device_reported_vital_status.py \
            | tee /tmp/drvs_evidence/pytest.txt
      - name: Upload pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i9-i10-device-reported-vital-status-pytest
          path: /tmp/drvs_evidence/pytest.txt
