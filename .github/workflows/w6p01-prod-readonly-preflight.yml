# Read-only W6-P01 production preflight (workflow_dispatch only).
# No env mutation, no DB mutation, no file writes on the host (except optional /tmp on the runner).
name: W6-P01 Production Readonly Preflight

on:
  workflow_dispatch:

concurrency:
  group: sedi-production-backend-operation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  readonly-preflight:
    name: W6-P01 read-only production preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts

      - name: Run read-only production preflight
        id: preflight
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH_Q="$(printf '%q' "${{ secrets.SEDI_DEPLOY_PATH }}")"

          ssh -i ~/.ssh/sedi_deploy_key \
            -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "DEPLOY_PATH=${DEPLOY_PATH_Q} bash -s" \
            2>&1 <<'REMOTE_SCRIPT' | tee /tmp/w6p01_readonly_preflight.log
          set -Eeuo pipefail
          log() { echo "[$(date -Is)] $*"; }
          summary() { echo "PREFLIGHT_SUMMARY|$1|$2"; }

          ENV_FILE="/etc/sedi/sedi-backend.env"

          cd "${DEPLOY_PATH}"

          log "=== BACKEND IMAGE (tag / id / digest) ==="
          BACKEND_IMAGE="$(docker inspect sedi-backend --format '{{.Config.Image}}' 2>/dev/null || true)"
          BACKEND_ID="$(docker inspect sedi-backend --format '{{.Id}}' 2>/dev/null || true)"
          BACKEND_IMAGE_ID="$(docker inspect sedi-backend --format '{{.Image}}' 2>/dev/null || true)"
          BACKEND_DIGEST=""
          if [ -n "${BACKEND_IMAGE_ID}" ]; then
            BACKEND_DIGEST="$(
              docker image inspect "${BACKEND_IMAGE_ID}" \
                --format '{{range .RepoDigests}}{{println .}}{{end}}' 2>/dev/null \
                | head -n 1 || true
            )"
          fi
          log "backend_image=${BACKEND_IMAGE:-none}"
          log "backend_container_id=${BACKEND_ID:-none}"
          log "backend_image_id=${BACKEND_IMAGE_ID:-none}"
          log "backend_repo_digest=${BACKEND_DIGEST:-none}"
          summary "backend_image" "${BACKEND_IMAGE:-none}"
          summary "backend_image_id" "${BACKEND_IMAGE_ID:-none}"
          summary "backend_repo_digest" "${BACKEND_DIGEST:-none}"

          log "=== HEALTH LOCAL + EXTERNAL ==="
          curl -fsS http://127.0.0.1:8000/health
          echo ""
          curl -fsS http://127.0.0.1:8000/healthz
          echo ""
          curl -fsS https://api.sedi-ai.com/health
          echo ""
          curl -fsS https://api.sedi-ai.com/healthz
          echo ""
          summary "health" "pass"

          log "=== POSTGRES HEALTH + POSTGRES_DB ==="
          PU="$(docker exec sedi-postgres printenv POSTGRES_USER)"
          PD="$(docker exec sedi-postgres printenv POSTGRES_DB)"
          docker exec sedi-postgres pg_isready -U "${PU}" -d "${PD}"
          log "POSTGRES_DB=${PD}"
          summary "postgres_db" "${PD}"
          summary "postgres_health" "pass"

          log "=== ALEMBIC VERSION (count + revision) ==="
          ALEMBIC_COUNT="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT COUNT(*) FROM alembic_version;")"
          ALEMBIC_REV="$(docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "SELECT version_num FROM alembic_version;")"
          log "alembic_count=${ALEMBIC_COUNT}"
          log "alembic_revision=${ALEMBIC_REV}"
          summary "alembic_count" "${ALEMBIC_COUNT}"
          summary "alembic_revision" "${ALEMBIC_REV}"

          log "=== I5 PREFIRE BASELINE (SELECT only) ==="
          psql_ro() { docker exec sedi-postgres psql -U "${PU}" -d "${PD}" -tA -c "$1" | tr -d '\r'; }
          KU_TOTAL="$(psql_ro 'SELECT COUNT(*) FROM knowledge_units;')"
          KU_ELIGIBLE="$(psql_ro "SELECT COUNT(*) FROM knowledge_units WHERE runtime_eligibility='ELIGIBLE';")"
          LEXICAL_KCE_TOTAL="$(psql_ro "SELECT COUNT(*) FROM knowledge_chunk_embeddings WHERE model_identifier='scis-lexical-fts-v1';")"
          LEXICAL_KCE_VEC_NULL="$(psql_ro "SELECT COUNT(*) FROM knowledge_chunk_embeddings WHERE model_identifier='scis-lexical-fts-v1' AND embedding_vector IS NULL;")"
          LEXICAL_KCE_VEC_NONNULL="$(psql_ro "SELECT COUNT(*) FROM knowledge_chunk_embeddings WHERE model_identifier='scis-lexical-fts-v1' AND embedding_vector IS NOT NULL;")"
          KU_TOTAL_B64="$(printf '%s' "${KU_TOTAL}" | base64 -w0)"
          log "knowledge_units_total_b64=${KU_TOTAL_B64}"
          log "knowledge_units_eligible=count:${KU_ELIGIBLE}"
          log "lexical_kce_total=count:${LEXICAL_KCE_TOTAL}"
          log "lexical_kce_vector_null=count:${LEXICAL_KCE_VEC_NULL}"
          log "lexical_kce_vector_nonnull=count:${LEXICAL_KCE_VEC_NONNULL}"
          summary "knowledge_units_total_b64" "${KU_TOTAL_B64}"
          summary "knowledge_units_eligible" "count:${KU_ELIGIBLE}"
          summary "lexical_kce_total" "count:${LEXICAL_KCE_TOTAL}"
          summary "lexical_kce_vector_null" "count:${LEXICAL_KCE_VEC_NULL}"
          summary "lexical_kce_vector_nonnull" "count:${LEXICAL_KCE_VEC_NONNULL}"
          for src in nhs_uk_live_well cdc_health_lifestyle; do
            KU_SRC="$(psql_ro "SELECT COUNT(*) FROM knowledge_units ku JOIN knowledge_provenance kp ON kp.knowledge_unit_id=ku.id JOIN governed_source_profiles g ON g.id=kp.source_profile_id WHERE g.canonical_key='${src}' AND ku.runtime_eligibility='ELIGIBLE';")"
            KCE_SRC="$(psql_ro "SELECT COUNT(*) FROM knowledge_chunk_embeddings kce JOIN governed_source_profiles g ON g.id=kce.source_profile_id WHERE g.canonical_key='${src}' AND kce.model_identifier='scis-lexical-fts-v1';")"
            log "low_risk_ku_eligible_${src}=${KU_SRC}"
            log "low_risk_lexical_kce_${src}=${KCE_SRC}"
            summary "low_risk_ku_eligible_${src}" "${KU_SRC}"
            summary "low_risk_lexical_kce_${src}" "${KCE_SRC}"
          done
          LATEST_RUN_ID="$(psql_ro 'SELECT id FROM weekly_knowledge_runs ORDER BY id DESC LIMIT 1;')"
          if [ -n "${LATEST_RUN_ID}" ]; then
            LATEST_RUN_STATUS="$(psql_ro "SELECT status FROM weekly_knowledge_runs WHERE id=${LATEST_RUN_ID};")"
            LATEST_RUN_STARTED="$(psql_ro "SELECT a.started_at FROM weekly_knowledge_runs r LEFT JOIN weekly_knowledge_run_attempts a ON a.id=r.latest_attempt_id WHERE r.id=${LATEST_RUN_ID};")"
            LATEST_RUN_FINISHED="$(psql_ro "SELECT a.completed_at FROM weekly_knowledge_runs r LEFT JOIN weekly_knowledge_run_attempts a ON a.id=r.latest_attempt_id WHERE r.id=${LATEST_RUN_ID};")"
          else
            LATEST_RUN_STATUS=""
            LATEST_RUN_STARTED=""
            LATEST_RUN_FINISHED=""
          fi
          log "latest_weekly_run_id=${LATEST_RUN_ID:-none}"
          log "latest_weekly_run_status=${LATEST_RUN_STATUS:-none}"
          log "latest_weekly_run_started_at=${LATEST_RUN_STARTED:-none}"
          log "latest_weekly_run_finished_at=${LATEST_RUN_FINISHED:-none}"
          summary "latest_weekly_run_id" "${LATEST_RUN_ID:-none}"
          summary "latest_weekly_run_status" "${LATEST_RUN_STATUS:-none}"
          summary "latest_weekly_run_started_at" "${LATEST_RUN_STARTED:-none}"
          summary "latest_weekly_run_finished_at" "${LATEST_RUN_FINISHED:-none}"
          docker exec -i sedi-backend python - <<'PY'
          from datetime import timezone
          from backend.app.services.i5.governed_weekly_runtime import next_weekly_calendar_fire
          nxt = next_weekly_calendar_fire()
          utc = nxt.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          print(f"PREFLIGHT_SUMMARY|next_genuine_i5_fire_utc|{utc}")
          PY

          log "=== ENV FLAG PRESENCE (boolean only; no values / no secrets) ==="
          if [ ! -f "${ENV_FILE}" ]; then
            log "PREFLIGHT_FAILED: missing ${ENV_FILE}"
            exit 1
          fi
          flag_present() {
            local key="$1"
            if grep -Eq "^${key}=" "${ENV_FILE}"; then
              echo "${key}_present=true"
              summary "${key}_present" "true"
            else
              echo "${key}_present=false"
              summary "${key}_present" "false"
            fi
          }
          flag_present "SEDI_I5_WEEKLY_ORCHESTRATOR_ENABLED"
          flag_present "SEDI_I5_SOURCE_ACTIVATION_ENABLED"
          flag_present "SEDI_I5_MULTISOURCE_ENABLED"
          flag_present "SEDI_I5_WEEKLY_ORCHESTRATOR_INTERVAL_MIN"
          flag_present "SEDI_I7_PERIOD_SUMMARY_JOBS_ENABLED"

          log "=== I5/I7 EFFECTIVE FLAG STATE (approved keys only; ON/OFF/UNSET) ==="
          normalize_on_off() {
            local v="$1"
            case "$(printf '%s' "${v}" | tr '[:upper:]' '[:lower:]')" in
              1|true|yes|on) echo "ON" ;;
              0|false|no|off) echo "OFF" ;;
              ""|unset) echo "UNSET" ;;
              *) echo "UNKNOWN" ;;
            esac
          }
          effective_flag() {
            local key="$1"
            local file_val runtime_val effective
            file_val="$(grep -E "^${key}=" "${ENV_FILE}" | tail -n1 | cut -d= -f2- || true)"
            runtime_val="$(docker exec sedi-backend printenv "${key}" 2>/dev/null || true)"
            if [ -n "${runtime_val}" ]; then
              effective="${runtime_val}"
            else
              effective="${file_val:-unset}"
            fi
            echo "${key}=$(normalize_on_off "${effective}")"
            summary "${key}_effective" "$(normalize_on_off "${effective}")"
          }
          effective_flag "SEDI_I5_WEEKLY_ORCHESTRATOR_ENABLED"
          effective_flag "SEDI_I5_SOURCE_ACTIVATION_ENABLED"
          effective_flag "SEDI_I5_MULTISOURCE_ENABLED"
          effective_flag "SEDI_I7_PERIOD_SUMMARY_JOBS_ENABLED"
          interval_val="$(grep -E '^SEDI_I5_WEEKLY_ORCHESTRATOR_INTERVAL_MIN=' "${ENV_FILE}" | tail -n1 | cut -d= -f2- || true)"
          runtime_interval="$(docker exec sedi-backend printenv SEDI_I5_WEEKLY_ORCHESTRATOR_INTERVAL_MIN 2>/dev/null || true)"
          if [ -n "${runtime_interval}" ]; then interval_val="${runtime_interval}"; fi
          if [ -n "${interval_val}" ]; then
            summary "SEDI_I5_WEEKLY_ORCHESTRATOR_INTERVAL_MIN_effective" "${interval_val}"
          else
            summary "SEDI_I5_WEEKLY_ORCHESTRATOR_INTERVAL_MIN_effective" "UNSET"
          fi
          # Never print DATABASE_URL or credentials.
          if grep -Eq "^DATABASE_URL=.+$" "${ENV_FILE}"; then
            summary "DATABASE_URL_present" "true"
          else
            summary "DATABASE_URL_present" "false"
          fi

          log "=== WORKER / PROCESS TOPOLOGY ==="
          docker inspect sedi-backend \
            --format 'status={{.State.Status}} restarting={{.State.Restarting}} pid={{.State.Pid}} cmd={{json .Config.Cmd}} entrypoint={{json .Config.Entrypoint}}' \
            || true
          docker top sedi-backend || true
          docker inspect sedi-postgres \
            --format 'postgres_status={{.State.Status}} postgres_pid={{.State.Pid}}' \
            || true

          log "=== SCHEDULER LOG GREP (weekly_international_knowledge_crawler) ==="
          docker logs --since 24h sedi-backend 2>&1 \
            | grep -F "weekly_international_knowledge_crawler" \
            | tail -40 || true

          log "=== I7 SCHEDULER STATE (read-only log grep) ==="
          I7_DAILY="$(docker logs sedi-backend 2>&1 | grep -E 'I7_JOB_REGISTERED .*job_id=i7_period_summary_daily' | tail -n1 || true)"
          I7_WEEKLY="$(docker logs sedi-backend 2>&1 | grep -E 'I7_JOB_REGISTERED .*job_id=i7_period_summary_weekly' | tail -n1 || true)"
          I7_MONTHLY="$(docker logs sedi-backend 2>&1 | grep -E 'I7_JOB_REGISTERED .*job_id=i7_period_summary_monthly' | tail -n1 || true)"
          I7_YEARLY="$(docker logs sedi-backend 2>&1 | grep -E 'I7_JOB_REGISTERED .*job_id=i7_period_summary_yearly' | tail -n1 || true)"
          I7_CADENCE="$(docker logs sedi-backend 2>&1 | grep -F 'i7 period summary jobs registered' | tail -n1 || true)"
          if [ -n "${I7_DAILY}${I7_WEEKLY}${I7_MONTHLY}${I7_YEARLY}" ]; then
            summary "i7_scheduler_job_present" "YES"
          else
            summary "i7_scheduler_job_present" "NO"
          fi
          log "i7_job_daily=${I7_DAILY:-MISSING}"
          log "i7_job_weekly=${I7_WEEKLY:-MISSING}"
          log "i7_job_monthly=${I7_MONTHLY:-MISSING}"
          log "i7_job_yearly=${I7_YEARLY:-MISSING}"
          log "i7_cadence=${I7_CADENCE:-MISSING}"
          for kind in daily weekly monthly yearly; do
            case "${kind}" in
              daily) LINE="${I7_DAILY}" ;;
              weekly) LINE="${I7_WEEKLY}" ;;
              monthly) LINE="${I7_MONTHLY}" ;;
              yearly) LINE="${I7_YEARLY}" ;;
            esac
            JOB_ID="i7_period_summary_${kind}"
            if echo "${LINE}" | grep -Fq "job_id=${JOB_ID}"; then
              summary "i7_job_id_${kind}" "${JOB_ID}"
              NXT="$(echo "${LINE}" | sed -n 's/.*next_run_time=\([^ ]*\).*/\1/p' | head -n1)"
              summary "i7_next_run_utc_${kind}" "${NXT:-unknown}"
            else
              summary "i7_job_id_${kind}" "MISSING"
              summary "i7_next_run_utc_${kind}" "unknown"
            fi
          done
          summary "i7_schedule_cadence" "daily=00:10 weekly=Mon_00:20 monthly=1st_00:30 yearly=Jan1_00:40 Asia/Tehran"

          log "=== BACKUP DIR METADATA (filenames only) ==="
          BACKUP_DIR="${DEPLOY_PATH}/backups/postgres"
          if [ -d "${BACKUP_DIR}" ]; then
            summary "backup_dir_exists" "true"
            log "backup_dir_exists=true"
            # Metadata only: name, size, mtime — no file contents.
            ls -lt --time-style=long-iso "${BACKUP_DIR}" 2>/dev/null | head -n 25 || true
            find "${BACKUP_DIR}" -maxdepth 1 -type f -printf '%f %s %TY-%Tm-%TdT%TH:%TM:%TS\n' 2>/dev/null \
              | sort -r \
              | head -n 20 || true
          else
            summary "backup_dir_exists" "false"
            log "backup_dir_exists=false"
          fi

          log "=== READONLY PREFLIGHT DONE ==="
          REMOTE_SCRIPT

      - name: Write preflight job summary
        if: always()
        run: |
          {
            echo "## W6-P01 Production Readonly Preflight"
            echo ""
            echo "**Status:** ${{ job.status }}"
            echo "**Mode:** READ ONLY (no env / DB / host file mutation)"
            echo ""
            if [ -f /tmp/w6p01_readonly_preflight.log ]; then
              echo "### Captured summary markers"
              grep '^PREFLIGHT_SUMMARY|' /tmp/w6p01_readonly_preflight.log | while IFS='|' read -r _ key val; do
                echo "- **${key}:** ${val}"
              done || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
