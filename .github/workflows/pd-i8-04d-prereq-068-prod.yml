# PD-I8-04D-PREREQ-068-PROD-01 — Controlled Production Alembic 067→068 only
name: PD-I8-04D-PREREQ-068 Production Migration 068

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Must be exactly MIGRATE_TO_068"
        required: true
      expected_before_revision:
        description: "Exact alembic_version expected before migration"
        required: true
        default: 067_i7_lifelong_memory_foundation

concurrency:
  group: sedi-production-backend-operation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-068:
    name: Production migrate 067→068 (I7 Wave-2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event.inputs.confirmation == 'MIGRATE_TO_068'

    steps:
      - name: Validate inputs
        env:
          INPUT_CONFIRMATION: ${{ github.event.inputs.confirmation }}
          INPUT_EXPECTED_BEFORE: ${{ github.event.inputs.expected_before_revision }}
        run: |
          set -Eeuo pipefail
          [ "${INPUT_CONFIRMATION}" = "MIGRATE_TO_068" ] || { echo "bad confirmation"; exit 1; }
          [ "${INPUT_EXPECTED_BEFORE}" = "067_i7_lifelong_memory_foundation" ] || {
            echo "expected_before must be 067_i7_lifelong_memory_foundation"
            exit 1
          }
          echo "inputs_ok"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SEDI_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/sedi_deploy_key
          chmod 600 ~/.ssh/sedi_deploy_key
          ssh-keyscan -p "${{ secrets.SEDI_PORT }}" "${{ secrets.SEDI_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload and execute 068 prereq remote procedure
        env:
          INPUT_EXPECTED_BEFORE: ${{ github.event.inputs.expected_before_revision }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH="${{ secrets.SEDI_DEPLOY_PATH }}"
          REMOTE_DIR="${DEPLOY_PATH}/ops/db03"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "mkdir -p $(printf '%q' "${REMOTE_DIR}")"
          scp -i ~/.ssh/sedi_deploy_key -P "${{ secrets.SEDI_PORT }}" \
            backend/ops/db03/db_prod_068_prereq_remote.sh \
            backend/alembic/versions/068_i7_wave2_governed_memory_lifecycle.py \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}:${REMOTE_DIR}/"
          ssh -i ~/.ssh/sedi_deploy_key -p "${{ secrets.SEDI_PORT }}" \
            "${{ secrets.SEDI_USER }}@${{ secrets.SEDI_HOST }}" \
            "chmod 700 $(printf '%q' "${REMOTE_DIR}/db_prod_068_prereq_remote.sh") && \
             cp $(printf '%q' "${REMOTE_DIR}/068_i7_wave2_governed_memory_lifecycle.py") \
                $(printf '%q' "${REMOTE_DIR}/_068_i7_wave2_governed_memory_lifecycle.py") && \
             DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}") \
             bash $(printf '%q' "${REMOTE_DIR}/db_prod_068_prereq_remote.sh")" \
            2>&1 | tee /tmp/i068_prereq_run.log
          grep -Fq 'I068|production_migration_068|PASS' /tmp/i068_prereq_run.log
          grep -Fq 'I068|production_alembic_after|068_i7_wave2_governed_memory_lifecycle' /tmp/i068_prereq_run.log
          grep -Fq 'I068|backup_verified|YES' /tmp/i068_prereq_run.log
          grep -Fq 'I068|migration_068_schema_verify|PASS' /tmp/i068_prereq_run.log
          grep -Fq 'I068|i8_flag_effective|OFF' /tmp/i068_prereq_run.log
          grep -Fq 'I068|i8_flag_after|OFF' /tmp/i068_prereq_run.log
          grep -Fq 'I068|migration_069|NO' /tmp/i068_prereq_run.log
          grep -Fq 'I068|migration_070|NO' /tmp/i068_prereq_run.log

      - name: Upload run log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pd-i8-04d-prereq-068-evidence
          path: /tmp/i068_prereq_run.log
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "## PD-I8-04D-PREREQ-068 Production Migration 068"
            echo "Status: ${{ job.status }}"
            echo "Target: 068_i7_wave2_governed_memory_lifecycle"
            if [ -f /tmp/i068_prereq_run.log ]; then
              grep '^I068|' /tmp/i068_prereq_run.log | while IFS='|' read -r _ k v; do
                echo "- **${k}:** ${v}"
              done || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
