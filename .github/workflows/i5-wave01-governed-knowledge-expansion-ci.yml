# Wave01 I5 governed knowledge expansion — CI (offline) + format/multisource regression.
name: I5 Wave01 Governed Knowledge Expansion CI

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/config/i5/multisource_activation_allowlist_v1.yaml"
      - "backend/config/i5/coverage_manifest_v1.yaml"
      - "backend/app/services/i5/multisource_activation.py"
      - "backend/app/services/i5/trusted_source_manifest.py"
      - "backend/app/services/i5/governed_low_risk_eligibility.py"
      - "backend/app/services/i5/governed_ku_serving.py"
      - "backend/tests/test_i5_wave01_governed_knowledge_expansion.py"
      - "backend/tests/test_section30_i5_multisource_weekly_activation.py"
      - "backend/tests/test_i5_source_format_resilience.py"
      - ".github/workflows/i5-wave01-governed-knowledge-expansion-ci.yml"

permissions:
  contents: read

concurrency:
  group: i5-wave01-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wave01-ci:
    name: Wave01 allowlist + acquisition governance tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: wave01-placeholder-not-used

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Wave01 + multisource + format resilience suite
        run: |
          python -B -m pytest \
            --noconftest \
            -p no:cacheprovider \
            -q --tb=short \
            backend/tests/test_i5_wave01_governed_knowledge_expansion.py \
            backend/tests/test_section30_i5_multisource_weekly_activation.py \
            backend/tests/test_i5_source_format_resilience.py
