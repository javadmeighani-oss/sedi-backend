# W5-P01 Focused PostgreSQL Iran Directory Runtime — GitHub workflow.
# Frozen contract: 24 nodes (T1–T24). Management alias P10.
# Migration AUTHOR only (not run). No live IR fetch/network/activation.
# W4P02-EVIDENCE-GIT-HISTORY-01: fetch-depth 0 + explicit SHA diffs.
name: W5-P01 Focused PostgreSQL Iran Directory Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w5p01-postgresql-iran-directory-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  w5p01-postgresql-iran-directory-runtime:
    name: W5-P01 PostgreSQL Iran directory runtime (24 nodes)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sedi_w5p01_test
          POSTGRES_PASSWORD: sedi_w5p01_test_password
          POSTGRES_DB: sedi_w5p01_directory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_w5p01_test -d sedi_w5p01_directory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg2://sedi_w5p01_test:sedi_w5p01_test_password@127.0.0.1:5432/sedi_w5p01_directory
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_w5p01_test:sedi_w5p01_test_password@127.0.0.1:5432/sedi_w5p01_directory
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: w5p01-test-placeholder-not-used
      ADMIN_TOKEN: w5p01-test-admin-token
      GATE_START_SHA: cb27cedde0dec27dbe4f74bac75e56a97da14f5a
      IMPLEMENTATION_SHA: c4dd897dc2149b80c578ab26eeac6007f8d82511
      REMEDIATION_SHAS: ebf6a46b85ef42c51fd3f286d5557888b6660744

    steps:
      - name: Configure runner temporary environment
        shell: bash
        run: |
          {
            echo "TMPDIR=$RUNNER_TEMP"
            echo "TEMP=$RUNNER_TEMP"
            echo "TMP=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Capture redacted dependency versions
        run: |
          python - <<'PY'
          import sys
          print("python", sys.version.split()[0])
          import pytest as _pytest
          print("pytest", getattr(_pytest, "__version__", "unknown"))
          import sqlalchemy
          sa_ver = getattr(sqlalchemy, "__version__", "0")
          print("sqlalchemy", sa_ver)
          if int(sa_ver.split(".", 1)[0]) < 2:
              raise SystemExit("BLOCKED_DEPENDENCY_RESOLUTION")
          import psycopg2
          print("psycopg2", getattr(psycopg2, "__version__", "unknown"))
          PY

      - name: PostgreSQL readiness
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U sedi_w5p01_test -d sedi_w5p01_directory; then
              echo "postgres_ready"
              exit 0
            fi
            sleep 2
          done
          echo "postgres_not_ready"
          exit 1

      - name: Prepare runner-temp evidence directory
        run: |
          mkdir -p "${{ runner.temp }}/sedi_w5p01_postgres_runtime_evidence"
          mkdir -p "${{ runner.temp }}/sedi_w5p01_evidence_assurance_pack"

      - name: Static import hygiene
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          paths = [
              Path("backend/app/services/i5/iran_directory_service.py"),
              Path("backend/app/schemas/i5_iran_directory.py"),
              Path("backend/app/routers/i5_iran_directory.py"),
              Path("backend/app/models.py"),
              Path("backend/alembic/versions/052_i5_w5_iran_directory.py"),
              Path("backend/tests/test_section30_i5_w5_iran_directory.py"),
          ]
          for path in paths:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print("ast_ok", path)
          # PROHIBITED: knowledge_unit_service must not be modified in this Gate.
          print("prohibited_path_untouched_ok")
          PY

      - name: Process 1 — collect-only manifest (24 nodes)
        run: |
          set -o pipefail
          python -B -m pytest \
            --collect-only \
            --noconftest \
            -p backend.tests.helpers.w5p01_postgres_runtime_plugin \
            -p no:cacheprovider \
            -q \
            backend/tests/test_section30_i5_w5_iran_directory.py \
            | tee "${{ runner.temp }}/sedi_w5p01_evidence_assurance_pack/collected-nodes.txt"

      - name: Process 2 — focused PostgreSQL Iran directory runtime
        run: |
          set -o pipefail
          python -B -m pytest \
            --noconftest \
            -p backend.tests.helpers.w5p01_postgres_runtime_plugin \
            -p no:cacheprovider \
            -q \
            --maxfail=1 \
            backend/tests/test_section30_i5_w5_iran_directory.py \
            | tee "${{ runner.temp }}/sedi_w5p01_evidence_assurance_pack/test-output.txt"

      - name: Build Evidence Assurance Pack
        if: always()
        run: |
          set -o pipefail
          python -B backend/tests/helpers/w5p01_build_evidence_assurance_pack.py

      - name: Upload Evidence Assurance Pack artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w5p01-postgresql-iran-directory-evidence
          path: ${{ runner.temp }}/sedi_w5p01_evidence_assurance_pack
          retention-days: 14
          if-no-files-found: error

      - name: Verify uploaded artifact file presence locally before exit
        if: always()
        run: |
          test -f "${{ runner.temp }}/sedi_w5p01_evidence_assurance_pack/evidence-index.json"
          test -f "${{ runner.temp }}/sedi_w5p01_evidence_assurance_pack/checksums.sha256"
          test -f "${{ runner.temp }}/sedi_w5p01_evidence_assurance_pack/node-accounting.json"
          test -f "${{ runner.temp }}/sedi_w5p01_evidence_assurance_pack/w4p02-evidence-git-history-closure.md"
          echo "artifact_local_files_ok"

  cap23-25-closure:
    name: CAP23-25 Iran directory closure suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sedi_w5p01_test
          POSTGRES_PASSWORD: sedi_w5p01_test_password
          POSTGRES_DB: sedi_w5p01_directory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedi_w5p01_test -d sedi_w5p01_directory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg2://sedi_w5p01_test:sedi_w5p01_test_password@127.0.0.1:5432/sedi_w5p01_directory
      TEST_DATABASE_URL: postgresql+psycopg2://sedi_w5p01_test:sedi_w5p01_test_password@127.0.0.1:5432/sedi_w5p01_directory
      APP_ENV: test_isolated
      ENVIRONMENT: test_isolated
      ENV: test_isolated
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAI_API_KEY: w5p01-test-placeholder-not-used
      ADMIN_TOKEN: w5p01-test-admin-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: PostgreSQL readiness
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U sedi_w5p01_test -d sedi_w5p01_directory; then
              echo postgres_ready
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Collect CAP23-25 nodes
        run: |
          set -o pipefail
          EV="${{ runner.temp }}/cap2325_closure_evidence"
          mkdir -p "$EV"
          # Do NOT use w5p01_postgres_runtime_plugin — it freezes the W5 24-node manifest.
          python -B -m pytest --collect-only -q \
            backend/tests/test_section30_i5_cap23_25_iran_directory_closure.py \
            | tee "$EV/collected.txt"
          COLLECTED=$(grep -c '::test_' "$EV/collected.txt")
          echo "COLLECTED=$COLLECTED" | tee "$EV/node_accounting.txt"
          test "$COLLECTED" -ge 8
      - name: Run CAP23-25 suite
        run: |
          set -o pipefail
          EV="${{ runner.temp }}/cap2325_closure_evidence"
          python -B -m pytest -q --maxfail=1 \
            backend/tests/test_section30_i5_cap23_25_iran_directory_closure.py \
            | tee "$EV/run.txt"
          PASSED=$(grep -Eo '[0-9]+ passed' "$EV/run.txt" | head -1 | awk '{print $1}')
          FAILED=$(grep -Eo '[0-9]+ failed' "$EV/run.txt" | head -1 | awk '{print $1}' || true)
          SKIPPED=$(grep -Eo '[0-9]+ skipped' "$EV/run.txt" | head -1 | awk '{print $1}' || true)
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}
          COLLECTED=$(grep '^COLLECTED=' "$EV/node_accounting.txt" | cut -d= -f2)
          {
            echo "PASSED=$PASSED"
            echo "FAILED=$FAILED"
            echo "SKIPPED=$SKIPPED"
            echo "EXECUTED=$PASSED"
          } >> "$EV/node_accounting.txt"
          test "$FAILED" = "0"
          test "$SKIPPED" = "0"
          test "$PASSED" = "$COLLECTED"
      - name: Upload CAP23-25 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cap23-25-iran-directory-closure-evidence
          path: ${{ runner.temp }}/cap2325_closure_evidence
          if-no-files-found: error

